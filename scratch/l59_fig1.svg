<svg viewBox="0 0 720 420" role="img" aria-labelledby="l59f1-t l59f1-d">
  <title id="l59f1-t">The composition rule and the ordering constraint it implies</title>
  <desc id="l59f1-d">Above, a sun, planet and moon with their local and composed world positions. Below, a component pool whose dense order puts a child before its parent, which a naive walk would compose against a stale matrix.</desc>
  <defs>
    <marker id="e-i-l59f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l59f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l59f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l59f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l59f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">One rule, and the constraint it puts on the ORDER you may compute it in.</text>
<text x="24" y="48" class="xs t-hi" text-anchor="start">THE RULE — world(child) = world(parent) x local(child)</text>
<rect x="90" y="62" width="120" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.24"/>
<text x="150" y="77" class="xs mono" text-anchor="middle">sun</text>
<rect x="300" y="62" width="120" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.24"/>
<text x="360" y="77" class="xs mono" text-anchor="middle">planet</text>
<rect x="510" y="62" width="120" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.24"/>
<text x="570" y="77" class="xs mono" text-anchor="middle">moon</text>
<line x1="212" y1="73" x2="296" y2="73" class="hi" stroke-width="1.4" marker-end="url(#e-h-l59f1)"/>
<line x1="422" y1="73" x2="506" y2="73" class="hi" stroke-width="1.4" marker-end="url(#e-h-l59f1)"/>
<text x="254" y="60" class="xs muted" text-anchor="middle">parent of</text>
<text x="464" y="60" class="xs muted" text-anchor="middle">parent of</text>
<text x="82" y="111" class="xs mono muted" text-anchor="end">local</text>
<rect x="90" y="96" width="120" height="20" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.13"/>
<text x="150" y="110" class="xs mono" text-anchor="middle">(0, 0, 0)</text>
<rect x="300" y="96" width="120" height="20" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.13"/>
<text x="360" y="110" class="xs mono" text-anchor="middle">(10, 0, 0)</text>
<rect x="510" y="96" width="120" height="20" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.13"/>
<text x="570" y="110" class="xs mono" text-anchor="middle">(0, 2, 0)</text>
<text x="82" y="137" class="xs mono muted" text-anchor="end">world</text>
<rect x="90" y="122" width="120" height="20" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.13"/>
<text x="150" y="136" class="xs mono" text-anchor="middle">(0, 0, 0)</text>
<rect x="300" y="122" width="120" height="20" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.13"/>
<text x="360" y="136" class="xs mono" text-anchor="middle">(10, 0, 0)</text>
<rect x="510" y="122" width="120" height="20" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.13"/>
<text x="570" y="136" class="xs mono" text-anchor="middle">(10, 2, 0)</text>
<text x="24" y="168" class="xs muted" text-anchor="start">The moon's (10, 2, 0) was computed by NOBODY. Move the sun and every number in the lower row</text>
<text x="24" y="182" class="xs muted" text-anchor="start">changes, with no code anywhere that says so.</text>
<line x1="24" y1="198" x2="696" y2="198" class="grid" stroke-width="1.2"/>
<text x="24" y="220" class="xs t-hi" text-anchor="start">THE CONSTRAINT — a parent must be finished before its children start.</text>
<text x="24" y="240" class="xs muted" text-anchor="start">…and a component pool's dense order is INSERTION order, disturbed by every swap-and-pop (5.7).</text>
<text x="112" y="275" class="xs mono muted" text-anchor="end">pool&lt;transform&gt;</text>
<rect x="120" y="262" width="66" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.2"/>
<text x="153" y="277" class="xs mono" text-anchor="middle">moon</text>
<text x="153" y="296" class="xs mono muted" text-anchor="middle">i=0</text>
<rect x="192" y="262" width="66" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.2"/>
<text x="225" y="277" class="xs mono" text-anchor="middle">sun</text>
<text x="225" y="296" class="xs mono muted" text-anchor="middle">i=1</text>
<rect x="264" y="262" width="66" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="297" y="277" class="xs mono" text-anchor="middle">planet</text>
<text x="297" y="296" class="xs mono muted" text-anchor="middle">i=2</text>
<rect x="336" y="262" width="66" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.2"/>
<text x="369" y="277" class="xs mono" text-anchor="middle">moon</text>
<text x="369" y="296" class="xs mono muted" text-anchor="middle">i=3</text>
<rect x="408" y="262" width="66" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="441" y="277" class="xs mono" text-anchor="middle">planet</text>
<text x="441" y="296" class="xs mono muted" text-anchor="middle">i=4</text>
<rect x="480" y="262" width="66" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.2"/>
<text x="513" y="277" class="xs mono" text-anchor="middle">sun</text>
<text x="513" y="296" class="xs mono muted" text-anchor="middle">i=5</text>
<rect x="552" y="262" width="66" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.2"/>
<text x="585" y="277" class="xs mono" text-anchor="middle">moon</text>
<text x="585" y="296" class="xs mono muted" text-anchor="middle">i=6</text>
<rect x="624" y="262" width="66" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="657" y="277" class="xs mono" text-anchor="middle">planet</text>
<text x="657" y="296" class="xs mono muted" text-anchor="middle">i=7</text>
<rect x="117" y="259" width="72" height="28" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="153" y="316" class="xs t-bad" text-anchor="middle">a child at i=0</text>
<text x="153" y="328" class="xs t-bad" text-anchor="middle">before its parent at i=1</text>
<text x="24" y="356" class="xs muted" text-anchor="start">VERIFIED, not asserted: verify_59 §C builds a 4-level tree, churns it, and finds 12 of 48 entities sitting</text>
<text x="24" y="370" class="xs muted" text-anchor="start">ahead of their own parent. A walk in dense order composes those against a matrix from LAST frame —</text>
<text x="24" y="384" class="xs muted" text-anchor="start">a picture that is wrong in a way nothing reports.</text>
<text x="24" y="406" class="xs t-hi" text-anchor="start">So the lesson is not the maths. It is what a correct order costs.</text>
</svg>
