<svg viewBox="0 0 752 412" role="img" aria-labelledby="l44f5-t l44f5-d">
  <title id="l44f5-t">Where our rasterizer and the hardware disagree</title>
  <desc id="l44f5-d">A magnified patch of the triangle's apex, one square per pixel, taken from the actual pixel-by-pixel comparison. Pale blue squares are pixels both rasterizers covered. Green squares, appearing one at a time along the right-hand edge, are pixels our software rasterizer covered and the hardware did not — 102 of them across the whole triangle. There are no squares of the third colour at all: the hardware covered nothing we missed. And the count of disagreements strictly inside the triangle is 0, so the two agree completely about the interior and differ only in where they consider a boundary pixel to belong.</desc>
  <defs>
    <marker id="e-i-l44f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l44f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l44f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
