<svg viewBox="0 0 720 330" role="img" aria-labelledby="l55f5-t l55f5-d">
  <title id="l55f5-t">The cost of a cold acquire, a cache hit, and the demo's validation</title>
  <desc id="l55f5-d">A bar showing a cold acquire of 3.693 ms in which parsing is 99.9% and resolve, read, import and store together are 0.55%; a two-pixel sliver for the 0.00025 ms cache hit; and a separate bar for the demo's 2.453 ms validation pass.</desc>
  <defs>
    <marker id="e-i-l55f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l55f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l55f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l55f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l55f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">What an acquire costs, to scale. torus.obj — 200 KB, 1,225 vertices, 2,304 triangles.</text>
<rect x="150.0" y="58" width="1.2" height="32" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.3"/>
<rect x="151.2" y="58" width="2.0839425940969405" height="32" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.3"/>
<rect x="153.28394259409694" y="58" width="519.8873544543732" height="32" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.3"/>
<text x="413.2276198212835" y="73" class="xs" text-anchor="middle">parse</text>
<text x="413.2276198212835" y="86" class="xs mono muted" text-anchor="middle">3.692 ms  ·  99.9%</text>
<rect x="673.1712970484701" y="58" width="1.2" height="32" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.3"/>
<text x="140" y="78" class="xs t-hi" text-anchor="end">COLD</text>
<text x="150" y="50" class="xs muted" text-anchor="middle">0</text>
<text x="670" y="50" class="xs muted" text-anchor="end">3.693 ms</text>
<text x="150" y="110" class="xs mono muted" text-anchor="start">resolve 0.0022 · read 200 KB 0.0148 · uv flip 0.0034 · store into the pool ~0</text>
<text x="150" y="126" class="xs" text-anchor="start">Together 0.55% — and they are the four stages people assume the cost is in.</text>
<text x="150" y="142" class="xs t-bad" text-anchor="start">THE ACQUIRE IS THE PARSE.</text>
<rect x="150" y="164" width="2.5" height="32" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.95"/>
<text x="140" y="184" class="xs t-ok" text-anchor="end">HIT</text>
<text x="162" y="178" class="xs" text-anchor="start">0.00025 ms — a hash of a short string, a map probe, one pool lookup</text>
<text x="162" y="192" class="xs muted" text-anchor="start">14,771x. The bar is two pixels wide because that is what to scale looks like.</text>
<rect x="150" y="216" width="345.32900081234766" height="26" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.24"/>
<text x="140" y="233" class="xs muted" text-anchor="end">…and</text>
<text x="322.66450040617383" y="233" class="xs" text-anchor="middle">validate  2.453 ms</text>
<text x="150" y="258" class="xs" text-anchor="start">The demo validates every mesh it loads (Lesson 3.5) — 66% of the acquire again, for a check</text>
<text x="150" y="272" class="xs" text-anchor="start">the STORE does not perform and a shipping build would not. Cost you can see is cost you can choose.</text>
<line x1="24" y1="288" x2="696" y2="288" class="grid" stroke-width="1.0"/>
<text x="24" y="306" class="xs t-hi" text-anchor="start">IT IS NOT “FAST LOADING”. It is NOT LOADING — a parser twice as fast would have moved 3.69 ms to 1.85; the cache moved it to 0.00025.</text>
<text x="24" y="324" class="xs" text-anchor="start">A SESSION — five models cycled twice, as [L] does: eight acquires, FOUR file reads. The second lap is free.</text>
</svg>
