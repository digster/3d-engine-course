<svg viewBox="0 0 680 400" role="img" aria-labelledby="f1-t f1-d">
  <title id="f1-t">A mirror direction with a glossy lobe around it</title>
  <desc id="f1-d">A horizontal surface with its normal drawn upward. An arrow l points up and to the left toward the light at 52 degrees from the normal, and an arrow R points up and to the right at the same 52 degrees. A rounded lobe surrounds R, widest along R and narrowing away from it; three dashed eye directions A, B and C are labelled with the fraction of light each receives: 1.000 along R, 0.319 at 22 degrees off, and 0.008 at 48 degrees off.</desc>
