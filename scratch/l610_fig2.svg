<svg viewBox="0 0 720 360" role="img" aria-labelledby="f610b-t f610b-d">
  <title id="f610b-t">A mip chain</title>
  <desc id="f610b-d">Six squares of halving size labelled L0 to L5, from 256x256 down to 8x8, each a quarter the area of the one before. The series 1/4 + 1/16 + 1/64 sums to one third, which is the 33 per cent memory cost.</desc>
  <defs>
    <marker id="e-i-f610b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f610b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f610b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f610b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f610b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">The image, at every size at once</text>
<rect x="80" y="60.0" width="150.0" height="150.0" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.3"/>
<text x="155.0" y="52.0" class="xs" text-anchor="middle">L0</text>
<text x="155.0" y="232" class="xs" text-anchor="middle">256x256</text>
<text x="155.0" y="248" class="xs" text-anchor="middle">1</text>
<rect x="256.0" y="97.5" width="75.0" height="75.0" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.39"/>
<text x="293.5" y="89.5" class="xs" text-anchor="middle">L1</text>
<text x="293.5" y="232" class="xs" text-anchor="middle">128x128</text>
<text x="293.5" y="248" class="xs" text-anchor="middle">1/4</text>
<rect x="357.0" y="116.25" width="37.5" height="37.5" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.48"/>
<text x="375.75" y="108.25" class="xs" text-anchor="middle">L2</text>
<text x="375.75" y="232" class="xs" text-anchor="middle">64x64</text>
<text x="375.75" y="248" class="xs" text-anchor="middle">1/16</text>
<rect x="420.5" y="125.625" width="18.75" height="18.75" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.5700000000000001"/>
<text x="429.875" y="117.625" class="xs" text-anchor="middle">L3</text>
<text x="429.875" y="232" class="xs" text-anchor="middle">32x32</text>
<text x="429.875" y="248" class="xs" text-anchor="middle">1/64</text>
<rect x="465.25" y="130.3125" width="9.375" height="9.375" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.6599999999999999"/>
<text x="469.9375" y="122.3125" class="xs" text-anchor="middle">L4</text>
<text x="469.9375" y="232" class="xs" text-anchor="middle">16x16</text>
<text x="469.9375" y="248" class="xs" text-anchor="middle">1/256</text>
<rect x="500.625" y="132.65625" width="4.6875" height="4.6875" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.75"/>
<text x="502.96875" y="124.65625" class="xs" text-anchor="middle">L5</text>
<text x="502.96875" y="232" class="xs" text-anchor="middle">8x8</text>
<text x="502.96875" y="248" class="xs" text-anchor="middle">1/1024</text>
<text x="360.0" y="276" class="xs" text-anchor="middle">each level is a quarter of the one above, so the extra is</text>
<text x="360.0" y="298" class="xs" text-anchor="middle">1/4 + 1/16 + 1/64 + ...  =  1/3</text>
<text x="360.0" y="322" class="xs" text-anchor="middle">measured on a 256x256 checker: 33.33%</text>
<text x="360.0" y="340" class="xs" text-anchor="middle">in 9 levels (1 + log2 256)</text>
</svg>
