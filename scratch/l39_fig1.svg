<svg viewBox="0 0 600 244" role="img" aria-labelledby="f391-t f391-d">
  <title id="f391-t">A texel is a sample, not a square</title>
  <desc id="f391-d">Above, four coloured squares dividing the unit interval. Below, the same four numbers drawn as samples at u = 1/8, 3/8, 5/8 and 7/8, joined by straight segments. The sample positions are the odd eighths, not the quarters, and the reconstruction is only defined between the first and last of them.</desc>
  <defs>
    <marker id="e-i-f391" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f391" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f391" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f391" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--verify-bd)"/></marker>
  </defs>
<text x="16" y="26" class="sm muted">the mental picture: four little squares</text>
<rect x="96.0" y="36.0" width="116.0" height="26" fill="#4a5570" stroke="var(--dia-ink-soft)" stroke-width="0.8"/>
<text x="154.0" y="54.0" class="xs mono t-inv" text-anchor="middle">0</text>
<rect x="212.0" y="36.0" width="116.0" height="26" fill="#e2ded2" stroke="var(--dia-ink-soft)" stroke-width="0.8"/>
<text x="270.0" y="54.0" class="xs mono t-onlight" text-anchor="middle">1</text>
<rect x="328.0" y="36.0" width="116.0" height="26" fill="#8d93a6" stroke="var(--dia-ink-soft)" stroke-width="0.8"/>
<text x="386.0" y="54.0" class="xs mono t-onlight" text-anchor="middle">2</text>
<rect x="444.0" y="36.0" width="116.0" height="26" fill="#c2bdae" stroke="var(--dia-ink-soft)" stroke-width="0.8"/>
<text x="502.0" y="54.0" class="xs mono t-onlight" text-anchor="middle">3</text>
<text x="16" y="94" class="sm muted">what the numbers actually are: four samples</text>
<line x1="88.0" y1="180.0" x2="586.0" y2="180.0" class="ink" stroke-width="1.1" marker-end="url(#e-i-f391)"/>
<line x1="96.0" y1="176.0" x2="96.0" y2="184.0" class="ink-soft" stroke-width="0.9"/>
<text x="96.0" y="198.0" class="xs mono muted" text-anchor="middle">0</text>
<line x1="212.0" y1="176.0" x2="212.0" y2="184.0" class="ink-soft" stroke-width="0.9"/>
<text x="212.0" y="198.0" class="xs mono muted" text-anchor="middle">&#188;</text>
<line x1="328.0" y1="176.0" x2="328.0" y2="184.0" class="ink-soft" stroke-width="0.9"/>
<text x="328.0" y="198.0" class="xs mono muted" text-anchor="middle">&#189;</text>
<line x1="444.0" y1="176.0" x2="444.0" y2="184.0" class="ink-soft" stroke-width="0.9"/>
<text x="444.0" y="198.0" class="xs mono muted" text-anchor="middle">&#190;</text>
<line x1="560.0" y1="176.0" x2="560.0" y2="184.0" class="ink-soft" stroke-width="0.9"/>
<text x="560.0" y="198.0" class="xs mono muted" text-anchor="middle">1</text>
<text x="592.0" y="184.0" class="sm mono">u</text>
<line x1="154.0" y1="180.0" x2="154.0" y2="167.8" class="hi" stroke-width="1.4"/>
<circle cx="154.0" cy="167.8" r="4" fill="var(--dia-hi)"/>
<text x="154.0" y="156.8" class="xs mono t-hi" text-anchor="middle">1/8</text>
<line x1="270.0" y1="180.0" x2="270.0" y2="121.5" class="hi" stroke-width="1.4"/>
<circle cx="270.0" cy="121.5" r="4" fill="var(--dia-hi)"/>
<text x="270.0" y="110.5" class="xs mono t-hi" text-anchor="middle">3/8</text>
<line x1="386.0" y1="180.0" x2="386.0" y2="151.4" class="hi" stroke-width="1.4"/>
<circle cx="386.0" cy="151.4" r="4" fill="var(--dia-hi)"/>
<text x="386.0" y="140.4" class="xs mono t-hi" text-anchor="middle">5/8</text>
<line x1="502.0" y1="180.0" x2="502.0" y2="135.1" class="hi" stroke-width="1.4"/>
<circle cx="502.0" cy="135.1" r="4" fill="var(--dia-hi)"/>
<text x="502.0" y="124.1" class="xs mono t-hi" text-anchor="middle">7/8</text>
<path d="M154.0,167.8 L270.0,121.5 L386.0,151.4 L502.0,135.1" fill="none" class="ink" stroke-width="1.6" stroke-dasharray="none"/>
<line x1="96.0" y1="204.0" x2="96.0" y2="216.0" class="ink-soft" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="560.0" y1="204.0" x2="560.0" y2="216.0" class="ink-soft" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="16" y="232.0" class="xs muted">past the first and last centre there are no samples at all &#8212; which is what an address mode decides</text>
</svg>
