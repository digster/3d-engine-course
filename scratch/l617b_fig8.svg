<svg viewBox="0 0 820 330" role="img" aria-labelledby="l617bf8-t l617bf8-d">
  <title id="l617bf8-t">Guard-band clipping</title>
  <desc id="l617bf8-d">A schematic of screen x. A triangle corner on the near plane projects to about minus 40,000 pixels; clamping it to minus 8,000 moves it and tilts the edge that crosses the 512-pixel map. Clipping at a guard plane at minus 7,936 instead makes a new corner on the true edge.</desc>
  <defs>
    <marker id="e-i-l617bf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l617bf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l617bf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l617bf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l617bf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="24" class="sm" text-anchor="start">A near-clipped corner is FINITE, not small — and a clamp that moves it changes the triangle.</text>
<line x1="40.0" y1="150.0" x2="780.0" y2="150.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="2 4"/>
<line x1="70.0" y1="145.0" x2="70.0" y2="155.0" class="ink" stroke-width="1.0"/>
<text x="70.0" y="170.0" class="xs mono" text-anchor="middle">-40,000 px</text>
<line x1="330.0" y1="145.0" x2="330.0" y2="155.0" class="ink" stroke-width="1.0"/>
<text x="326.0" y="170.0" class="xs mono" text-anchor="end">-8,000</text>
<line x1="360.0" y1="145.0" x2="360.0" y2="155.0" class="ink" stroke-width="1.0"/>
<text x="364.0" y="170.0" class="xs mono" text-anchor="start">-7,936</text>
<line x1="560.0" y1="145.0" x2="560.0" y2="155.0" class="ink" stroke-width="1.0"/>
<line x1="640.0" y1="145.0" x2="640.0" y2="155.0" class="ink" stroke-width="1.0"/>
<text x="200" y="188.0" class="xs muted" text-anchor="middle">(not to scale)</text>
<rect x="560" y="90" width="80" height="120" rx="3" fill="none" stroke="#f0961e" stroke-width="1.8"/>
<text x="600" y="84" class="xs" text-anchor="middle">the map, x = 0 to 512</text>
<line x1="70.0" y1="70.0" x2="720.0" y2="230.0" stroke="#5ac878" stroke-width="1.8" fill="none"/>
<circle cx="70.0" cy="70.0" r="4" fill="#5ac878"/>
<text x="78.0" y="62.0" class="xs t-ok" text-anchor="start">true corner, on the near plane</text>
<circle cx="330.0" cy="70.0" r="4" fill="#e05c5c"/>
<line x1="330.0" y1="70.0" x2="720.0" y2="230.0" stroke="#e05c5c" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>
<text x="338.0" y="62.0" class="xs t-bad" text-anchor="start">to_pixel's clamp moves it here</text>
<text x="700" y="270" class="xs t-bad" text-anchor="end">the edge through the map TILTS: every depth inside moves</text>
<line x1="360.0" y1="84.0" x2="360.0" y2="240.0" stroke="#5082e6" stroke-width="1.6" fill="none"/>
<text x="366" y="250" class="xs" text-anchor="start">guard plane: clip here, a new corner ON the true edge</text>
<text x="20" y="302" class="xs" text-anchor="start">measured: a spot light's map read 0.950 where the floor was at 0.987 — acne on 88% of it, which no bias could cure</text>
<text x="20" y="318" class="xs muted" text-anchor="start">after guard-band clipping: the reference render still byte-identical (E917C06C) — no frame in Modules 3–6 ever reached the band</text>
</svg>
