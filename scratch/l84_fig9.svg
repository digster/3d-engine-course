<text x="628" y="114" class="xs" text-anchor="start">error in the reported gap</text>
<line x1="600.0" y1="127.0" x2="620.0" y2="127.0" stroke="#8f918a" stroke-width="2.4" fill="none"/>
<text x="628" y="131" class="xs" text-anchor="start">ulp(d) — the spacing of floats there</text>
<line x1="600.0" y1="144.0" x2="620.0" y2="144.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="628" y="148" class="xs" text-anchor="start">the quantity being measured</text>
<text x="600" y="188" class="xs muted" text-anchor="start">The two meet at 10 km, and</text>
<text x="600" y="202" class="xs muted" text-anchor="start">that is the whole story: the</text>
<text x="600" y="216" class="xs muted" text-anchor="start">subtraction b.centre − a.centre</text>
<text x="600" y="230" class="xs muted" text-anchor="start">is performed on numbers of the</text>
<text x="600" y="244" class="xs muted" text-anchor="start">size of the WORLD to produce</text>
<text x="600" y="258" class="xs muted" text-anchor="start">one of the size of a CRATE.</text>
</svg>
