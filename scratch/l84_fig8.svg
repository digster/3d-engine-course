<text x="816" y="150.0" class="xs mono" text-anchor="end">0</text>
<text x="894" y="150.0" class="xs mono" text-anchor="end">0</text>
<text x="452" y="167.0" class="xs" text-anchor="start">1e-05</text>
<text x="658" y="167.0" class="xs mono" text-anchor="end">1.000e-05</text>
<text x="750" y="167.0" class="xs mono" text-anchor="end">0</text>
<text x="816" y="167.0" class="xs mono" text-anchor="end">0</text>
<text x="894" y="167.0" class="xs mono" text-anchor="end">0</text>
<text x="452" y="184.0" class="xs" text-anchor="start">1e-06</text>
<text x="658" y="184.0" class="xs mono" text-anchor="end">1.100e-06</text>
<text x="750" y="184.0" class="xs mono" text-anchor="end">0</text>
<text x="816" y="184.0" class="xs mono" text-anchor="end">0</text>
<text x="894" y="184.0" class="xs mono" text-anchor="end">0</text>
<text x="452" y="201.0" class="xs" text-anchor="start">1e-07</text>
<text x="658" y="201.0" class="xs mono" text-anchor="end">2.580e-07</text>
<text x="750" y="201.0" class="xs mono" text-anchor="end">0</text>
<text x="816" y="201.0" class="xs mono" text-anchor="end">188</text>
<text x="894" y="201.0" class="xs mono" text-anchor="end">0</text>
<text x="452" y="218.0" class="xs" text-anchor="start">exactly shared</text>
<text x="658" y="218.0" class="xs mono" text-anchor="end">1.220e-07</text>
<text x="750" y="218.0" class="xs mono" text-anchor="end">0</text>
<text x="816" y="218.0" class="xs mono" text-anchor="end">89</text>
<text x="894" y="218.0" class="xs mono" text-anchor="end">0</text>
<text x="452" y="248.5" class="xs muted" text-anchor="start">THE NORMALISED FORM NEVER FAILS, and that is a</text>
<text x="452" y="262.5" class="xs muted" text-anchor="start">theorem: if two convex bodies overlap then NO</text>
<text x="452" y="276.5" class="xs muted" text-anchor="start">direction separates them, so an axis made of pure</text>
<text x="452" y="290.5" class="xs muted" text-anchor="start">rounding error reports an overlap like any other.</text>
</svg>
