<svg viewBox="0 0 720 430" role="img" aria-labelledby="l63f2-t l63f2-d">
  <title id="l63f2-t">The NDF as a probability density</title>
  <desc id="l63f2-d">Three GGX distributions at roughness 0.50, 0.71 and 1.00, plotted against microfacet tilt and weighted by the cosine. The peaks differ by a factor of sixteen; the area under each is exactly 1, which is what makes it a distribution rather than a chosen curve.</desc>
  <defs>
    <marker id="e-i-l63f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l63f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l63f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l63f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l63f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">An NDF is not a curve chosen to look right. It is a distribution, so it has to add up to one — and that can be checked.</text>
