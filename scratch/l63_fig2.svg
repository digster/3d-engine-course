<text x="360.0" y="344" class="sm mono t-hi" text-anchor="middle">∫ D(h) · cos θₕ · dω  =  1</text>
<text x="360.0" y="366" class="xs muted" text-anchor="middle">Read backwards it says something better than a normalisation rule: the microfacets’ PROJECTED AREAS add up to the flat area</text>
<text x="360.0" y="382" class="xs muted" text-anchor="middle">they stand on. Nothing else could be true, which is why the cosine is in there and not a convention.</text>
<text x="360.0" y="404" class="xs t-hi" text-anchor="middle">A bare cosˢ lobe integrates to 0.1848, not 1 — which is exactly why it is a shape and not a model. The constant it lacks is 2π/(s+2).</text>
