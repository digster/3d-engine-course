<text x="146" y="300" class="xs muted" text-anchor="middle">the conserved quantity is</text>
<text x="146" y="316" class="xs muted" text-anchor="middle">positive-definite → its level</text>
<text x="146" y="332" class="xs t-ok" text-anchor="middle">sets are closed → nothing leaves</text>
<text x="376" y="300" class="xs muted" text-anchor="middle">past hω = 2 it is indefinite</text>
<text x="376" y="316" class="xs t-bad" text-anchor="middle">→ there is no closed curve</text>
<text x="376" y="332" class="xs t-bad" text-anchor="middle">left to sit on</text>
<text x="520" y="68" class="xs muted" text-anchor="start">C.4  over one minute</text>
<text x="704" y="68" class="xs muted" text-anchor="end">min</text>
<text x="782" y="68" class="xs muted" text-anchor="end">max</text>
<text x="856" y="68" class="xs muted" text-anchor="end">spread</text>
<line x1="520" y1="76.0" x2="862" y2="76.0" class="grid" stroke-width="1.0"/>
<text x="520" y="93.0" class="xs" text-anchor="start">true energy</text>
<text x="704" y="93.0" class="xs mono" text-anchor="end">18.7570</text>
<text x="782" y="93.0" class="xs mono" text-anchor="end">20.8298</text>
<text x="856" y="93.0" class="xs mono" text-anchor="end">1.047e-01</text>
<text x="520" y="110.0" class="xs" text-anchor="start">shadow energy</text>
<text x="704" y="110.0" class="xs mono" text-anchor="end">19.7391</text>
<text x="782" y="110.0" class="xs mono" text-anchor="end">19.7392</text>
<text x="856" y="110.0" class="xs mono" text-anchor="end">4.638e-06</text>
<text x="520" y="142.5" class="xs muted" text-anchor="start">The true energy is NOT conserved: it</text>
<text x="520" y="159.5" class="xs muted" text-anchor="start">wobbles by exactly hω peak to peak,</text>
<text x="520" y="176.5" class="xs mono t-hi" text-anchor="start">predicted 0.104720, measured 0.104700.</text>
<text x="520" y="210.5" class="xs muted" text-anchor="start">What IS conserved is the sheared cousin</text>
<text x="520" y="227.5" class="xs muted" text-anchor="start">drawn on the left — to five decimal places,</text>
<text x="520" y="244.5" class="xs muted" text-anchor="start">over 3,600 steps.</text>
<text x="520" y="278.5" class="xs" text-anchor="start">Stability and the existence of that</text>
<text x="520" y="295.5" class="xs t-hi" text-anchor="start">closed curve are the SAME statement.</text>
<text x="450.0" y="400" class="sm mono t-hi" text-anchor="middle">½(v² + ω²x² − hω²·xv)  —  positive-definite exactly when hω &lt; 2, which is the stability limit.</text>
</svg>
