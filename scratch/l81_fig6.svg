<svg viewBox="0 0 900 430" role="img" aria-labelledby="l81f6-t l81f6-d">
  <title id="l81f6-t">The conserved quantity of semi-implicit Euler as a tilted ellipse, and as a hyperbola past the stability limit</title>
  <desc id="l81f6-d">Below the limit the conserved quadratic form is positive-definite and its level set is a closed tilted ellipse the trajectory never leaves. Above it the form is indefinite and the level sets are hyperbolae that run away.</desc>
