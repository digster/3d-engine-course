<svg viewBox="0 0 760 298" role="img" aria-labelledby="l618f7-t l618f7-d">
  <title id="l618f7-t">The overlay declared as a frame-graph pass, and the four facts that follow</title>
  <desc id="l618f7-d">Three versions of the imported backbuffer resource in a chain, produced by the resolve pass and then the overlay pass. Below, the single keep() call the overlay makes, and the four facts the graph derives from it: the order, the load op, the previous pass's store op, and the lifetime.</desc>
  <defs>
    <marker id="e-i-l618f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l618f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l618f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l618f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l618f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">One word from the pass author; four facts deduced by the graph.</text>
<rect x="44" y="86" width="190" height="34" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="44" y="86" width="190" height="34" rx="3" fill="none" stroke="#8f918a" stroke-width="1.2"/>
<text x="139.0" y="108" class="xs mono" text-anchor="middle">backbuffer@0</text>
<text x="139.0" y="136" class="xs muted" text-anchor="middle">whatever was there</text>
<rect x="280" y="86" width="190" height="34" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="280" y="86" width="190" height="34" rx="3" fill="none" stroke="#5082e6" stroke-width="1.2"/>
<text x="375.0" y="108" class="xs mono" text-anchor="middle">backbuffer@1</text>
<text x="375.0" y="136" class="xs muted" text-anchor="middle">the resolve wrote it</text>
<rect x="516" y="86" width="190" height="34" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="516" y="86" width="190" height="34" rx="3" fill="none" stroke="#5ac878" stroke-width="1.2"/>
<text x="611.0" y="108" class="xs mono" text-anchor="middle">backbuffer@2</text>
<text x="611.0" y="136" class="xs muted" text-anchor="middle">the overlay blended onto it</text>
<line x1="238" y1="103" x2="276" y2="103" class="hi" stroke-width="1.4" marker-end="url(#e-h-l618f7)"/>
<text x="257.0" y="76" class="xs t-hi" text-anchor="middle">resolve</text>
<line x1="474" y1="103" x2="512" y2="103" class="hi" stroke-width="1.4" marker-end="url(#e-h-l618f7)"/>
<text x="493.0" y="76" class="xs t-hi" text-anchor="middle">overlay</text>
<line x1="20" y1="162" x2="740" y2="162" class="grid" stroke-width="1.2"/>
<text x="20" y="184" class="xs" text-anchor="start">WHAT THE OVERLAY SAYS</text>
<rect x="20" y="194" width="330" height="30" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.12"/>
<text x="34" y="214" class="xs mono" text-anchor="start">fg.keep(overlay_pass, back1)</text>
<text x="20" y="242" class="xs muted" text-anchor="start">"my output depends on what was already</text>
<text x="20" y="258" class="xs muted" text-anchor="start">in this target" — which for a blend is</text>
<text x="20" y="274" class="xs muted" text-anchor="start">simply true: dst is an operand of `over`.</text>
<text x="392" y="184" class="xs" text-anchor="start">WHAT THE GRAPH DEDUCES</text>
<rect x="392" y="192" width="118" height="18" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.12"/>
<text x="451" y="205" class="xs" text-anchor="middle">the ORDER</text>
<text x="522" y="205" class="xs muted" text-anchor="start">the overlay follows the resolve</text>
<rect x="392" y="216" width="118" height="18" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.12"/>
<text x="451" y="229" class="xs" text-anchor="middle">the LOAD op</text>
<text x="522" y="229" class="xs muted" text-anchor="start">LOAD, because the old contents matter</text>
<rect x="392" y="240" width="118" height="18" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.12"/>
<text x="451" y="253" class="xs" text-anchor="middle">the STORE op</text>
<text x="522" y="253" class="xs muted" text-anchor="start">the RESOLVE must STORE — a different pass</text>
<rect x="392" y="264" width="118" height="18" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.12"/>
<text x="451" y="277" class="xs" text-anchor="middle">the LIFETIME</text>
<text x="522" y="277" class="xs muted" text-anchor="start">the imported target lives to the end</text>
</svg>
