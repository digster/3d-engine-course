<svg viewBox="0 0 720 300" role="img" aria-labelledby="l55f6-t l55f6-d">
  <title id="l55f6-t">A scene rendered before and after its mesh is unloaded</title>
  <desc id="l55f6-d">Two panels of the same three-object scene. In the first all three resolve and 44 triangles are collected. In the second the icosahedron's mesh has been unloaded, so it is skipped and counted, and the other two objects draw 24 triangles between them.</desc>
  <defs>
    <marker id="e-i-l55f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l55f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l55f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l55f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l55f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Freeing a mesh a scene is still holding — and the only thing that happens.</text>
<text x="174" y="52" class="xs t-hi" text-anchor="middle">BEFORE  —  unresolved = 0</text>
<line x1="24" y1="60" x2="324" y2="60" class="grid" stroke-width="1.0"/>
<rect x="24" y="74" width="300" height="32" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="36" y="88" class="xs mono" text-anchor="start">icosahedron</text>
<text x="36" y="100" class="xs muted" text-anchor="start">20 triangles</text>
<text x="312" y="94" class="sm mono t-ok" text-anchor="end">20</text>
<rect x="24" y="114" width="300" height="32" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="36" y="128" class="xs mono" text-anchor="start">slab (cube)</text>
<text x="36" y="140" class="xs muted" text-anchor="start">12 triangles</text>
<text x="312" y="134" class="sm mono t-ok" text-anchor="end">12</text>
<rect x="24" y="154" width="300" height="32" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="36" y="168" class="xs mono" text-anchor="start">plinth (cube)</text>
<text x="36" y="180" class="xs muted" text-anchor="start">12 triangles</text>
<text x="312" y="174" class="sm mono t-ok" text-anchor="end">12</text>
<text x="24" y="206" class="xs" text-anchor="start">44 triangles collected from 3 objects.</text>
<text x="546" y="52" class="xs t-hi" text-anchor="middle">AFTER  unload_mesh(icosahedron)</text>
<line x1="396" y1="60" x2="696" y2="60" class="grid" stroke-width="1.0"/>
<rect x="396" y="74" width="300" height="32" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.14"/>
<text x="408" y="88" class="xs mono" text-anchor="start">icosahedron</text>
<text x="408" y="100" class="xs muted" text-anchor="start">handle stale → SKIPPED</text>
<text x="684" y="94" class="sm mono t-bad" text-anchor="end">—</text>
<rect x="396" y="114" width="300" height="32" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="408" y="128" class="xs mono" text-anchor="start">slab (cube)</text>
<text x="408" y="140" class="xs muted" text-anchor="start">12 triangles</text>
<text x="684" y="134" class="sm mono t-ok" text-anchor="end">12</text>
<rect x="396" y="154" width="300" height="32" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="408" y="168" class="xs mono" text-anchor="start">plinth (cube)</text>
<text x="408" y="180" class="xs muted" text-anchor="start">12 triangles</text>
<text x="684" y="174" class="sm mono t-ok" text-anchor="end">12</text>
<text x="396" y="206" class="xs" text-anchor="start">24 triangles from 2. unresolved = 1.</text>
<line x1="360" y1="44" x2="360" y2="220" class="grid" stroke-width="1.0"/>
<line x1="24" y1="232" x2="696" y2="232" class="grid" stroke-width="1.2"/>
<text x="24" y="252" class="xs t-bad" text-anchor="start">THE SCENE STILL HOLDS THE HANDLE.</text>
<text x="228" y="252" class="xs" text-anchor="start">It is rebuilt from the same array every frame and nothing nulled it.</text>
<text x="24" y="270" class="xs" text-anchor="start">Before 5.4 this was a dangling span and a picture nobody could trust; before 5.5 it could not be performed at all. Now it costs</text>
<text x="24" y="288" class="xs t-ok" text-anchor="start">one object, and the renderer says how many.</text>
</svg>
