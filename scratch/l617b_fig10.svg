<svg viewBox="0 0 780 380" role="img" aria-labelledby="l617bf10-t l617bf10-d">
  <title id="l617bf10-t">The light record layout</title>
  <desc id="l617bf10-d">Eleven rows of four floats: position and range, radiance and kind, spot axis and cone scale, cone offset and shadow slot and planes, texel and pcf and strength, the bias knobs, the normal-offset scale, and four rows of the spot shadow matrix, 176 bytes in all.</desc>
