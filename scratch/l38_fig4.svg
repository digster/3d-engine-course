<svg viewBox="0 0 660 356" role="img" aria-labelledby="g4-t g4-d">
  <title id="g4-t">Gouraud shading gives a continuous brightness but a discontinuous slope</title>
  <desc id="g4-d">Two stacked graphs sharing a horizontal axis across a curved surface split into six flat facets. The upper graph shows brightness: a smooth solid green curve and a dashed red polyline that touches it exactly at each of the seven facet boundaries, so the two are nearly indistinguishable. The lower graph shows the slope of each. The true slope is a smooth descending green curve; Gouraud's is a red staircase, constant across each facet and jumping abruptly at every join. The largest jump is circled and labelled as the place a Mach band appears.</desc>
