<svg viewBox="0 0 760 350" role="img" aria-labelledby="f73k-t f73k-d">
  <title id="f73k-t">Why three dimensions cannot carry a rotation algebra</title>
  <desc id="f73k-d">On the left, a box containing every number a three-dimensional system spanned by one, i and j could hold, with the assumptions that i and j both square to minus one and the product is associative. A red arrow leaves the box labelled i times j, which must land somewhere. On the right, the contradiction in three lines: i times i j is minus j by associativity; expanding i times a plus b i plus c j gives c squared as the j coefficient; matching them forces c squared to equal minus one, and c is real. So the product escapes the space and a fourth basis element is forced.</desc>
  <defs>
    <marker id="e-i-f73k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f73k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f73k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f73k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f73k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="48" y="74" width="250" height="150" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="173" y="96" class="sm" text-anchor="middle">everything a 3-D number could be</text>
<text x="173" y="122" class="sm mono t-hi" text-anchor="middle">a + b i + c j</text>
<text x="173" y="146" class="xs muted" text-anchor="middle">with a, b, c real</text>
<text x="173" y="178" class="xs mono muted" text-anchor="middle">i² = j² = −1</text>
<text x="173" y="196" class="xs muted" text-anchor="middle">and the product associative</text>
<defs><marker id="e-red-f73k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<line x1="310.00" y1="150.00" x2="386.00" y2="150.00" stroke="#e05c5c" stroke-width="2.0" marker-end="url(#e-red-f73k)"/>
<text x="348" y="138" class="sm mono" text-anchor="middle">i · j</text>
<text x="348" y="172" class="xs muted" text-anchor="middle">must land</text>
<text x="348" y="186" class="xs muted" text-anchor="middle">somewhere</text>
<rect x="400" y="74" width="312" height="150" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.3"/>
<text x="556" y="96" class="xs" text-anchor="middle">suppose it lands inside:  i j = a + b i + c j</text>
<text x="556" y="126" class="xs mono" text-anchor="middle">i (i j)  =  (i i) j  =  −j</text>
<text x="556" y="150" class="xs mono" text-anchor="middle">i (a + b i + c j)  =  (−b + c a) + (a + c b) i + c² j</text>
<text x="556" y="174" class="xs mono t-bad" text-anchor="middle">match the j coefficient:   c² = −1</text>
<text x="556" y="206" class="xs t-bad" text-anchor="middle">and c is REAL. There is no such c.</text>
<text x="380.0" y="262" class="xs muted" text-anchor="middle">so i j is not in the span of 1, i and j — a FOURTH basis element is forced, and Hamilton spent thirteen years</text>
<text x="380.0" y="280" class="xs muted" text-anchor="middle">finding that out. The other thing that has to go is commutativity, and Lesson 7.3 §12 shows why the plane</text>
<text x="380.0" y="298" class="xs muted" text-anchor="middle">could never have warned us: z v conj(z) = |z|² v here, exactly, measured over 4,000 cases at 9.6e−7.</text>
<text x="380.0" y="326" class="xs t-hi" text-anchor="middle">The sandwich every quaternion text uses does NOTHING in two dimensions. That is not a quirk — it is the reason.</text>
</svg>
