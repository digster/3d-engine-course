<svg viewBox="0 0 900 420.0" role="img" aria-labelledby="l77bf10-t l77bf10-d">
  <title id="l77bf10-t">The joint nobody animates</title>
  <desc id="l77bf10-d">A top view of the mannequin's head at the moment of the wave where its turned head is furthest from the rest pose. Grey-brown dots are the head's vertices, identical in both files. Twenty-five nose-tip vertices are drawn twice: green where the fixed file puts them, turned with the head, and red where the first export leaves them, because they were weighted to a joint nothing animates; the two sets are up to 16.9 mm apart.</desc>
