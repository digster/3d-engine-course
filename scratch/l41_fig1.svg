<svg viewBox="0 0 640 332" role="img" aria-labelledby="f414-t f414-d">
  <title id="f414-t">Latency hiding: the same work, with and without something else to do</title>
  <desc id="f414-d">A timeline of one dependent chain shows short bars of work separated by long dashed gaps of waiting. Beneath it, four independent chains interleaved fill those gaps completely with the same total work. A bar chart of the measured result follows: one chain runs at 3.124 nanoseconds per step and 32 chains at 0.112, a speedup of 27.88 times, with no change to the arithmetic.</desc>
  <defs>
    <marker id="e-i-f414" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f414" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f414" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
  <text x="16" y="24" class="sm muted">one dependent chain: each step needs the previous step&#8217;s result</text>
  <rect x="128.0" y="42.0" width="17.0" height="16" fill="#78b4eb"/>
  <rect x="145.0" y="42.0" width="51.0" height="16" fill="none" class="grid" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="196.0" y="42.0" width="17.0" height="16" fill="#78b4eb"/>
  <rect x="213.0" y="42.0" width="51.0" height="16" fill="none" class="grid" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="264.0" y="42.0" width="17.0" height="16" fill="#78b4eb"/>
  <rect x="281.0" y="42.0" width="51.0" height="16" fill="none" class="grid" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="332.0" y="42.0" width="17.0" height="16" fill="#78b4eb"/>
  <rect x="349.0" y="42.0" width="51.0" height="16" fill="none" class="grid" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="400.0" y="42.0" width="17.0" height="16" fill="#78b4eb"/>
  <rect x="417.0" y="42.0" width="51.0" height="16" fill="none" class="grid" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="120.0" y="54.0" class="xs mono" text-anchor="end">chain 1</text>
  <text x="478.0" y="54.0" class="xs muted">dashed = waiting</text>
