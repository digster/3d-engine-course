<text x="528" y="248" class="xs" text-anchor="start">the gap: 0.2898 of full</text>
<text x="528" y="266" class="xs" text-anchor="start">white, worst at a = 0.55</text>
<text x="360.0" y="358" class="xs" text-anchor="middle">EXACT AT BOTH ENDS, worst in the middle — which is why a fade that starts and finishes correctly still looks like a fade,</text>
<text x="360.0" y="378" class="xs" text-anchor="middle">and why this bug survives review. The gap is the whole of what compositing in the wrong space costs.</text>
