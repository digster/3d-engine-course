<svg viewBox="0 0 720 340" role="img" aria-labelledby="f613g-t f613g-d">
  <title id="f613g-t">Compositing the bloom before and after the curve</title>
  <desc id="f613g-d">Two pipelines of four stages each, the first compositing the bloom in linear light before the tonemap curve and the second after it, with the measured count of clipped pixels for each.</desc>
  <defs>
    <marker id="e-i-f613g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f613g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f613g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f613g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f613g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">Why the composite happens before the curve, and not after</text>
<text x="75.0" y="48" class="xs" text-anchor="start">CORRECT</text>
<rect x="75.0" y="62" width="132" height="56" rx="4" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="141.0" y="86" class="xs" text-anchor="middle">scene x exposure</text>
<text x="141.0" y="104" class="xs" text-anchor="middle">linear light</text>
<rect x="221.0" y="62" width="132" height="56" rx="4" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="287.0" y="86" class="xs" text-anchor="middle">+ intensity x bloom</text>
<text x="287.0" y="104" class="xs" text-anchor="middle">still linear</text>
<line x1="207.0" y1="90" x2="218.0" y2="90" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f613g)"/>
<rect x="367.0" y="62" width="132" height="56" rx="4" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="433.0" y="86" class="xs" text-anchor="middle">curve</text>
<text x="433.0" y="104" class="xs" text-anchor="middle">-&gt; [0, 1]</text>
<line x1="353.0" y1="90" x2="364.0" y2="90" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f613g)"/>
<rect x="513.0" y="62" width="132" height="56" rx="4" fill="none" stroke="#9b7ede" stroke-width="1.3"/>
<text x="579.0" y="86" class="xs" text-anchor="middle">encode</text>
<text x="579.0" y="104" class="xs" text-anchor="middle">-&gt; 8 bits</text>
<line x1="499.0" y1="90" x2="510.0" y2="90" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f613g)"/>
<text x="360.0" y="136" class="xs" text-anchor="middle">the bloom is light, so it is photographed by the same curve as the light that did not scatter — 32 pixels clip</text>
<text x="75.0" y="176" class="xs" text-anchor="start">WRONG</text>
<rect x="75.0" y="190" width="132" height="56" rx="4" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="141.0" y="214" class="xs" text-anchor="middle">scene x exposure</text>
<text x="141.0" y="232" class="xs" text-anchor="middle">linear light</text>
<rect x="221.0" y="190" width="132" height="56" rx="4" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="287.0" y="214" class="xs" text-anchor="middle">curve</text>
<text x="287.0" y="232" class="xs" text-anchor="middle">-&gt; [0, 1]</text>
<line x1="207.0" y1="218" x2="218.0" y2="218" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f613g)"/>
<rect x="367.0" y="190" width="132" height="56" rx="4" fill="none" stroke="#e05c5c" stroke-width="1.3"/>
<text x="433.0" y="214" class="xs" text-anchor="middle">+ intensity x bloom</text>
<text x="433.0" y="232" class="xs" text-anchor="middle">ABOVE 1</text>
<line x1="353.0" y1="218" x2="364.0" y2="218" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f613g)"/>
<rect x="513.0" y="190" width="132" height="56" rx="4" fill="none" stroke="#e05c5c" stroke-width="1.3"/>
<text x="579.0" y="214" class="xs" text-anchor="middle">encode</text>
<text x="579.0" y="232" class="xs" text-anchor="middle">clips</text>
<line x1="499.0" y1="218" x2="510.0" y2="218" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f613g)"/>
<text x="360.0" y="264" class="xs" text-anchor="middle">the curve's output is already in [0, 1], so anything added has nowhere to go — 324 pixels clip, ten times as many</text>
<text x="360.0" y="296" class="xs" text-anchor="middle">Every glow grows a flat white core, and the brighter the source the bigger that core: which is exactly the artefact</text>
<text x="360.0" y="314" class="xs" text-anchor="middle">bloom was introduced to remove, reintroduced one pass later. The ordering is not a policy — it is where the light</text>
<text x="360.0" y="332" class="xs" text-anchor="middle">actually scatters, which is before the sensor responds to it.</text>
</svg>
