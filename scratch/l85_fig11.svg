<svg viewBox="0 0 900 400" role="img" aria-labelledby="l85f11-t l85f11-d">
  <title id="l85f11-t">The same two boxes walked from 100 m to 1000 km from the origin: the naive formulation's error tracks ulp(position), the relative one's does not move.</title>
  <desc id="l85f11-d">A log-log chart of error in the reported distance against distance from the world origin. A dashed grey line shows one ulp of the position; a red line for the naive world-space formulation runs parallel to it, reaching 1.03e-2 m at 1000 km; a green line for the relative formulation stays flat near 1e-8 m throughout.</desc>
  <defs>
    <marker id="e-i-l85f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l85f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l85f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l85f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l85f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-green-l85f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-red-l85f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<text x="20" y="22" class="sm" text-anchor="start">One pair of boxes, one fixed gap, walked away from the world origin.</text>
