<text x="614" y="94" class="xs" text-anchor="start">ulp(position)</text>
<line x1="586.0" y1="107.0" x2="606.0" y2="107.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="614" y="111" class="xs" text-anchor="start">naive: WORLD support points</text>
<line x1="586.0" y1="124.0" x2="606.0" y2="124.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="614" y="128" class="xs" text-anchor="start">relative: support from each</text>
<text x="614" y="145" class="xs muted" text-anchor="start">shape's own centre, one delta</text>
<text x="586" y="198" class="xs muted" text-anchor="start"></text>
<text x="820" y="198" class="xs muted" text-anchor="end"></text>
<line x1="586" y1="206.0" x2="826" y2="206.0" class="grid" stroke-width="1.0"/>
<text x="586" y="222.0" class="xs" text-anchor="start">worst, relative</text>
<text x="820" y="222.0" class="xs mono" text-anchor="end">1.07e-07 m</text>
<text x="586" y="238.0" class="xs" text-anchor="start">worst, naive</text>
<text x="820" y="238.0" class="xs mono" text-anchor="end">1.03e-02 m</text>
<text x="586" y="254.0" class="xs" text-anchor="start">factor</text>
<text x="820" y="254.0" class="xs mono" text-anchor="end">96,270×</text>
<text x="20" y="330" class="xs" text-anchor="start">A box's support point is `centre + axes·s`, three additions. In WORLD space each rounds to half an ulp of the POSITION, and there are two</text>
<text x="20" y="346" class="xs" text-anchor="start">support points per iteration. Taken RELATIVE they round to half an ulp of the SHAPE, and the one world-sized subtraction</text>
<text x="20" y="362" class="xs" text-anchor="start">`b.origin − a.origin` is EXACT whenever the two are within a factor of two of each other — Sterbenz's lemma, and two things about to</text>
<text x="20" y="378" class="xs" text-anchor="start">collide always are. The red line tracks ulp; the green one tracks nothing at all.</text>
