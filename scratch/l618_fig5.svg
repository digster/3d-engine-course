<svg viewBox="0 0 760 376" role="img" aria-labelledby="l618f5-t l618f5-d">
  <title id="l618f5-t">Coverage composited in linear light and in sRGB codes</title>
  <desc id="l618f5-d">A plot of emitted light against glyph coverage with two curves: a straight line for correct linear compositing and a curve bowing far below it for blending sRGB codes, worst at low coverage. Beside it, a table of ink mass showing that encoded blending and an sRGB atlas agree on dark backgrounds and disagree on light ones.</desc>
  <defs>
    <marker id="e-i-l618f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l618f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l618f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l618f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l618f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">Compositing coverage in the wrong space, measured one pixel at a time and one string at a time.</text>
<line x1="70" y1="58" x2="70" y2="268" class="grid" stroke-width="1.1"/>
<line x1="70" y1="268" x2="400" y2="268" class="grid" stroke-width="1.1"/>
