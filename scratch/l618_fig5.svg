<text x="89.8" y="83.2" class="xs t-hi" text-anchor="start">at 10% coverage: 10.3% of the light</text>
<text x="307.6" y="87.4" class="xs t-ok" text-anchor="middle">correct (linear)</text>
<text x="327.40000000000003" y="179.8" class="xs t-bad" text-anchor="middle">sRGB codes</text>
<text x="452" y="54" class="xs" text-anchor="start">INK MASS, AS A PERCENTAGE OF CORRECT</text>
<text x="452" y="74" class="xs muted" text-anchor="start"></text>
<text x="584" y="74" class="xs muted" text-anchor="start">on dark</text>
<text x="664" y="74" class="xs muted" text-anchor="start">on light</text>
<rect x="444" y="84" width="282" height="24" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.1"/>
<text x="452" y="100" class="xs mono" text-anchor="start">encoded blending</text>
<text x="584" y="100" class="xs mono" text-anchor="start">62.2%</text>
<text x="664" y="100" class="xs mono" text-anchor="start">137.8%</text>
<rect x="444" y="114" width="282" height="24" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.1"/>
<text x="452" y="130" class="xs mono" text-anchor="start">_SRGB atlas</text>
<text x="584" y="130" class="xs mono" text-anchor="start">62.1%</text>
<text x="664" y="130" class="xs mono" text-anchor="start">62.1%</text>
<text x="444" y="176" class="xs muted" text-anchor="start">Two bugs, in two different files, agree</text>
<text x="444" y="192" class="xs muted" text-anchor="start">exactly on dark. They are the same</text>
<text x="444" y="208" class="xs muted" text-anchor="start">function applied in two places.</text>
<text x="444" y="232" class="xs t-hi" text-anchor="start">The light column tells them apart:</text>
<text x="444" y="248" class="xs t-hi" text-anchor="start">the blend FATTENS, the atlas THINS.</text>
<line x1="20" y1="316" x2="740" y2="316" class="grid" stroke-width="1.2"/>
<text x="20" y="334" class="xs" text-anchor="start">The error is worst where the coverage is LOWEST, and an antialiased glyph at 16 px is mostly low coverage.</text>
<text x="20" y="352" class="xs muted" text-anchor="start">That is why this shows up as stem weight rather than as a colour shift: it is the edges that are wrong.</text>
</svg>
