<line x1="82.0" y1="130.9" x2="466.0" y2="130.9" class="grid" stroke-width="1"/>
<text x="74.0" y="134.9" class="xs mono muted" text-anchor="end">4</text>
<line x1="82.0" y1="91.4" x2="466.0" y2="91.4" class="grid" stroke-width="1"/>
<text x="74.0" y="95.4" class="xs mono muted" text-anchor="end">16</text>
