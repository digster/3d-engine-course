<svg viewBox="0 0 600 226" role="img" aria-labelledby="f396-t f396-d">
  <title id="f396-t">The footprint outruns the sampler</title>
  <desc id="f396-d">A logarithmic plot of how many texels one screen pixel covers, traced by ray casting, from 0.60 at the bottom of the screen to 62.46 two rows below the horizon. A flat dashed line at 4 marks how many texels bilinear filtering actually reads. The two cross near screen row 101, and past that point the sampler is reading a shrinking fraction of what the pixel covers.</desc>
  <defs>
    <marker id="e-i-f396" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f396" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f396" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f396" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--verify-bd)"/></marker>
  </defs>
<text x="16" y="28" class="sm">texels covered by one pixel, down the floor</text>
<line x1="82.0" y1="190.0" x2="486.0" y2="190.0" class="ink" stroke-width="1.1" marker-end="url(#e-i-f396)"/>
