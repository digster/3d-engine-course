<svg viewBox="0 0 980 429" role="img" aria-labelledby="f6-t f6-d">
  <title id="f6-t">A ball-socket solved as three rows and as one block</title>
  <desc id="f6-d">Left: the residual after each visit on a log axis — the rows falling by 0.2323 per visit along K's Gauss-Seidel spectral radius, the block at 1.2e-07 after one visit. Right: worst residuals over a thousand random sockets, the cost of each form, and a twelve-link chain where the block barely helps.</desc>
