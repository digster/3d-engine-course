<svg viewBox="0 0 900 400" role="img" aria-labelledby="l85f6-t l85f6-d">
  <title id="l85f6-t">Four candidates cover a triangle's seven Voronoi regions, and the textbook shortcut that decides between them fails on slivers.</title>
  <desc id="l85f6-d">Left, a triangle with the origin inside it, the three clamped-edge candidates marked in amber and dashed lines drawn to them. Right, the same failure one dimension down: a segment with the origin off to one side, an amber arrow to the true closest point on the segment and a red arrow to the foot of the perpendicular on the infinite line, which is nearer and wrong. A table gives the measured failure counts on fat and sliver triangles.</desc>
  <defs>
    <marker id="e-i-l85f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l85f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l85f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l85f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l85f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-purple-l85f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7ede"/></marker></defs>
<defs><marker id="e-amber-l85f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-green-l85f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-red-l85f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<text x="20" y="22" class="sm" text-anchor="start">The simplex solver: compute every candidate, or decide which one to compute.</text>
