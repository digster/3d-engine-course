<svg viewBox="0 0 600 230" role="img" aria-labelledby="f394-t f394-d">
  <title id="f394-t">The three address modes, tabulated</title>
  <desc id="f394-d">For texel indices from -5 to 8 on a four-texel image, the index each address mode maps them to. Repeat cycles 0,1,2,3 with period four. Mirrored repeat runs 0,1,2,3,3,2,1,0 with period eight, doubling the edge texel at every fold. Clamp-to-edge holds 0 to the left and 3 to the right forever.</desc>
