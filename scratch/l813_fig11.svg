<text x="200" y="394.4" class="xs muted" text-anchor="middle">the plate (drawn to 2.8 m of its 3.5 m half-width)</text>
<text x="26" y="420.4" class="xs" text-anchor="start">Carried by the point velocity under it, the rider moves</text>
<text x="26" y="435.4" class="xs" text-anchor="start">along a TANGENT each step: |r|² grows by 1 + (ωh)².</text>
<text x="26" y="450.4" class="xs" text-anchor="start">Carried by the plate's step as a transform, it stays put.</text>
<text x="440" y="30" class="sm" text-anchor="start">One revolution, rider at 1.5 m</text>
<text x="440" y="70" class="xs muted" text-anchor="start">ω</text>
<text x="580" y="70" class="xs muted" text-anchor="end">carried</text>
<text x="656" y="70" class="xs muted" text-anchor="end">radius</text>
<text x="732" y="70" class="xs muted" text-anchor="end">growth</text>
<text x="852" y="70" class="xs muted" text-anchor="end">(1+(ωh)²)^(N/2)</text>
<text x="940" y="70" class="xs muted" text-anchor="end">left behind</text>
