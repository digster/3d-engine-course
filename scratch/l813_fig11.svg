<text x="440" y="210.5" class="xs" text-anchor="start">N is the steps in a revolution: 2π / 2·atan(ωh/2), the turn of ONE</text>
<text x="440" y="225.5" class="xs" text-anchor="start">linearised step (8.3 §7) — not ωh. The growth per revolution is ≈ e^(πωh):</text>
<text x="440" y="240.5" class="xs" text-anchor="start">5.4% at 1 rad/s, 11.1% at 2. The same drift as 8.11's velocity joint, for</text>
<text x="440" y="255.5" class="xs" text-anchor="start">the same reason: a velocity is a tangent, and a tangent leaves a circle.</text>
<text x="440" y="285.5" class="xs" text-anchor="start">A lift that only translates is carried exactly by either rule (drift</text>
<text x="440" y="300.5" class="xs" text-anchor="start">under 10 µm in 2 s); not carried, the rider is left (-4.02, -3.19) m</text>
<text x="440" y="315.5" class="xs" text-anchor="start">behind — and off it.</text>
<line x1="440.0" y1="338.5" x2="460.0" y2="338.5" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="468" y="342.5" class="xs" text-anchor="start">by transform: the plate's step, exactly</text>
<line x1="440.0" y1="355.5" x2="460.0" y2="355.5" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="468" y="359.5" class="xs" text-anchor="start">by velocity: drawn from the recurrence, 3 revolutions</text>
</svg>
