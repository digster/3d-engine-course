<svg viewBox="0 0 980 477.4" role="img" aria-labelledby="h11-t h11-d">
  <title id="h11-t">Carrying a rider on a turntable: by transform, and by velocity</title>
  <desc id="h11-d">Left: a top-down view of a turntable with a rider 1.5 m from the axis; carried by transform it stays on its circle, carried by the point velocity it spirals outward over three revolutions. Right: a table of one revolution at 1 and 2 rad/s for three carry rules — radius, growth, the predicted growth and how far behind the plate the rider is left.</desc>
