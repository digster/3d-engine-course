<svg viewBox="0 0 780 400" role="img" aria-labelledby="f71f-t f71f-d">
  <title id="f71f-t">Conditioning approaching lock</title>
  <desc id="f71f-d">A log-log plot. The horizontal axis is degrees of pitch remaining before lock, running from 90 on the left down to 0.01 on the right; the vertical axis is the weakest gain, from 1 down to 1e-5. A blue curve falls steadily and straight. Amber dots from a brute-force sweep sit on it. A dashed red line follows the blue one and then plunges to the floor at 0.01 degrees, where the naive formula returns exactly zero.</desc>
  <defs>
    <marker id="e-i-f71f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f71f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f71f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f71f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f71f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="390.0" y="24" class="sm" text-anchor="middle">How much turn a unit of knob buys, as the pose approaches lock</text>
<text x="390.0" y="42" class="xs muted" text-anchor="middle">both axes logarithmic; the curve is σ_min = |cos p| / √(1 + |sin p|)</text>
