<text x="578.0" y="158.0" class="xs t-bad" text-anchor="start">exactly 0 at 0.01°</text>
<circle cx="589.0" cy="182.0" r="3.4" fill="#f0961e"/>
<text x="578.0" y="198.0" class="xs muted" text-anchor="start">measured, by sweeping</text>
<text x="578.0" y="212.0" class="xs muted" text-anchor="start">a million unit vectors</text>
<text x="390.0" y="334.0" class="xs muted" text-anchor="middle">degrees of pitch remaining before lock</text>
<text x="390.0" y="358" class="xs" text-anchor="middle">at 0.01° from lock a knob turning at 1 rad/s moves the body at 0.00012 rad/s — you would need 8,100 rad/s</text>
<text x="390.0" y="376" class="xs muted" text-anchor="middle">which is 464,000 degrees per second, for one degree-per-second of aircraft</text>
</svg>
