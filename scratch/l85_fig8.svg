<text x="670.0" y="294" class="xs muted" text-anchor="middle">terminal simplex size</text>
<text x="20" y="336" class="xs" text-anchor="start">EVERY vertex of the difference set has y exactly 0 in the left case, because both boxes share an up axis and `support_local`</text>
<text x="20" y="352" class="xs" text-anchor="start">picks the same sign on it for both. The search is confined to a plane, so it can never build a tetrahedron: 0 of 100,000,</text>
<text x="20" y="368" class="xs" text-anchor="start">against 77,326 once one box is tilted by a single degree. Of the 65,633 pairs overlapping by more than 10 cm, 0 produce one.</text>
<text x="20" y="388" class="xs t-hi" text-anchor="start">8.6's EPA is always described as starting from the tetrahedron GJK left behind. On the commonest arrangement in a game there is none.</text>
</svg>
