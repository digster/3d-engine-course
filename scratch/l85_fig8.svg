<line x1="524" y1="260" x2="582" y2="260" class="grid" stroke-width="2.0"/>
<text x="553.0" y="276" class="xs mono muted" text-anchor="middle">1</text>
<text x="553.0" y="253.96487739369599" class="xs mono" text-anchor="middle">17</text>
<rect x="608" y="257.6" width="58" height="2.4" fill="#8f918a" fill-opacity="0.85"/>
<text x="637.0" y="276" class="xs mono muted" text-anchor="middle">2</text>
