<svg viewBox="0 0 900 400" role="img" aria-labelledby="l85f8-t l85f8-d">
  <title id="l85f8-t">With a shared up axis GJK never produces a tetrahedron; tilting one box one degree produces 77,326 of them.</title>
  <desc id="l85f8-d">Two bar charts of the terminal simplex size, one to four points. On the left, two boxes sharing an up axis: the four-point bar is empty. On the right, the same pairs with one box tilted by one degree: the four-point bar holds 77,326 of 100,000.</desc>
  <defs>
    <marker id="e-i-l85f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l85f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l85f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l85f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l85f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-amber-l85f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-grey-l85f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<text x="20" y="22" class="sm" text-anchor="start">Two boxes standing on the same floor, at any yaw.</text>
<text x="20" y="42" class="xs muted" text-anchor="start">100,000 pairs, and what GJK hands 8.6 when it stops.</text>
