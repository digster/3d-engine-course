<svg viewBox="0 0 720 492" role="img" aria-labelledby="l42f1-t l42f1-d">
  <title id="l42f1-t">The SDL_GPU object model against what you already built</title>
  <desc id="l42f1-d">Two columns. On the left, 5 things built in Modules 1 to 3; on the right, the SDL_GPU object each becomes: framebuffer to swapchain texture, texture and sampler to SDL_GPUTexture and SDL_GPUSampler, depth buffer to depth-stencil target, fill_style to graphics pipeline, the fill loop to a render pass and draw call. Below them 4 SDL_GPU objects with an empty box opposite: the device, the command buffer, the transfer buffer and the fence. Those four have no counterpart because they exist to manage a second processor, which a software rasterizer does not have.</desc>
  <defs>
    <marker id="e-i-l42f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l42f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l42f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
