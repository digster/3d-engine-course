<svg viewBox="0 0 980 560" role="img" aria-labelledby="f89e-t f89e-d">
  <title id="f89e-t">The friction cone, and the square that circumscribes it</title>
  <desc id="f89e-d">Left: the admissible set for the tangential impulse. Coulomb's condition is a disc of radius mu times the normal impulse; clipping each tangent component independently gives a square that circumscribes it, so up to the square root of two times as much friction is available along the diagonals. Right: a polar plot of measured sliding distance against sliding direction. The cone model is a perfect circle; the box model is a four-lobed figure whose shortest radius is 0.70 of its longest, matching one over root two.</desc>
  <defs>
    <marker id="e-i-f89e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f89e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f89e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f89e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f89e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
