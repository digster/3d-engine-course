<text x="540" y="518" class="xs" text-anchor="start">decides which way is slippery.</text>
<text x="66" y="546" class="xs muted" text-anchor="start">§7 and harness §F. The cone costs 8.9 ns per manifold more than the box — 6.8% — to remove a 43% anisotropy.</text>
