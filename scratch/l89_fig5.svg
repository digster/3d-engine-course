<text x="540" y="438" class="xs" text-anchor="start">Over 361 directions the box model spreads 42.68%</text>
<text x="540" y="454" class="xs" text-anchor="start">and the cone 0.00%. The extreme ratio is 0.70085</text>
<text x="540" y="470" class="xs" text-anchor="start">against a predicted 1/√2 = 0.70711. The tangent</text>
