<text x="110.0" y="418.0" class="xs" text-anchor="start">intrinsic — each turn about an axis the last one moved</text>
<rect x="92.0" y="428.0" width="10" height="5" fill="#9b7ede" rx="1"/>
<text x="110.0" y="434.0" class="xs" text-anchor="start">extrinsic — every turn about a fixed world axis</text>
