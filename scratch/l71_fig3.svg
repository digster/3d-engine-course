<svg viewBox="0 0 760 452" role="img" aria-labelledby="f71c-t f71c-d">
  <title id="f71c-t">Twenty-four readings of one triple</title>
  <desc id="f71c-d">A horizontal bar chart with twelve rows, one per axis order, each carrying two bars: intrinsic and extrinsic. Bar length is the angular distance from this engine's reading. Only the intrinsic y-x-z bar is zero; the rest run from 16 to 83 degrees, with intrinsic y-z-y worst at 83.48.</desc>
  <defs>
    <marker id="e-i-f71c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f71c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f71c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f71c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f71c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="380.0" y="24" class="sm" text-anchor="middle">The triple (30°, 40°, 50°), read under each of the 24 conventions</text>
<text x="380.0" y="42" class="xs muted" text-anchor="middle">bar length = how far that reading lands from ours, in degrees of rotation</text>
