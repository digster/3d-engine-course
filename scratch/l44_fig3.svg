<svg viewBox="0 0 720 400" role="img" aria-labelledby="l44f3-t l44f3-d">
  <title id="l44f3-t">The first GPU triangle, measured rather than admired</title>
  <desc id="l44f3-d">The triangle in clip space, with vertices at minus zero point eight, minus zero point eight in red; zero point eight, minus zero point eight in green; and zero, zero point eight in blue. Beside it the measurements: 20,808 pixels covered against 20,972 predicted by the geometry, a ratio of 0.9922; and at the centroid the three channels read 85, 86 and 85, where one third of 255 is 85 — barycentric interpolation performed by hardware, agreeing with the arithmetic Lesson 2.4 derived by hand.</desc>
  <defs>
    <marker id="e-i-l44f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l44f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l44f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
<text x="24" y="26" class="sm">what came back from the device, checked against the geometry</text>
<text x="24" y="46" class="xs muted">drawn into a 256&#215;256 offscreen target and downloaded &#8212; no screenshot, no eyes</text>
<rect x="60.0" y="84.0" width="250.0" height="250.0" class="fill-soft ink-soft" stroke-width="1.2"/>
<line x1="60.0" y1="84.0" x2="60.0" y2="334.0" class="grid" stroke-width="0.8"/>
<line x1="60.0" y1="334.0" x2="310.0" y2="334.0" class="grid" stroke-width="0.8"/>
<line x1="122.5" y1="84.0" x2="122.5" y2="334.0" class="grid" stroke-width="0.8"/>
<line x1="60.0" y1="271.5" x2="310.0" y2="271.5" class="grid" stroke-width="0.8"/>
<line x1="185.0" y1="84.0" x2="185.0" y2="334.0" class="grid" stroke-width="0.8"/>
<line x1="60.0" y1="209.0" x2="310.0" y2="209.0" class="grid" stroke-width="0.8"/>
<line x1="247.5" y1="84.0" x2="247.5" y2="334.0" class="grid" stroke-width="0.8"/>
<line x1="60.0" y1="146.5" x2="310.0" y2="146.5" class="grid" stroke-width="0.8"/>
<line x1="310.0" y1="84.0" x2="310.0" y2="334.0" class="grid" stroke-width="0.8"/>
<line x1="60.0" y1="84.0" x2="310.0" y2="84.0" class="grid" stroke-width="0.8"/>
<polygon points="85.0,309.0 285.0,309.0 185.0,109.0" fill="#5082e6" opacity="0.20" stroke="#5082e6" stroke-width="2"/>
<circle cx="85.0" cy="309.0" r="5" fill="#e63946"/>
<text x="85.0" y="325.0" class="xs mono" text-anchor="middle">(-0.8, -0.8)</text>
<circle cx="285.0" cy="309.0" r="5" fill="#2a9d5c"/>
<text x="285.0" y="325.0" class="xs mono" text-anchor="middle">(+0.8, -0.8)</text>
<circle cx="185.0" cy="109.0" r="5" fill="#3d6fe6"/>
<text x="185.0" y="99.0" class="xs mono" text-anchor="middle">(+0.0, +0.8)</text>
<circle cx="185.0" cy="242.3" r="4" class="hi" fill="none" stroke-width="2"/>
<text x="195.0" y="246.3" class="xs mono t-hi">centroid</text>
<text x="185.0" y="354.0" class="xs muted" text-anchor="middle">clip space, +Y up (conventions &#167;4)</text>
<text x="350.0" y="108.0" class="xs">pixels covered</text>
<text x="540.0" y="108.0" class="xs mono" text-anchor="end">20,808</text>
<text x="350.0" y="134.0" class="xs">area from the geometry</text>
<text x="540.0" y="134.0" class="xs mono" text-anchor="end">20,972</text>
<text x="350.0" y="160.0" class="xs">ratio</text>
<text x="540.0" y="160.0" class="xs mono t-hi" text-anchor="end">0.9922</text>
<text x="350.0" y="212.0" class="xs">at the centroid</text>
<text x="540.0" y="212.0" class="xs mono t-hi" text-anchor="end">85 86 85</text>
<text x="350.0" y="238.0" class="xs">one third of 255</text>
<text x="540.0" y="238.0" class="xs mono" text-anchor="end">85</text>
<text x="350.0" y="294.0" class="xs">The centroid is an equal mix of all</text>
<text x="350.0" y="310.0" class="xs">three corners &#8212; which is Lesson 2.4&#8217;s</text>
<text x="350.0" y="326.0" class="xs">barycentric interpolation, in silicon,</text>
<text x="350.0" y="342.0" class="xs">giving the same number you derived.</text>
</svg>
