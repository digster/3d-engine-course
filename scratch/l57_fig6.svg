<text x="24" y="176" class="xs" text-anchor="start">Every cache line the transform pool hands over contains one wanted transform and two unwanted ones. Measured:</text>
<text x="24" y="192" class="xs" style="fill:#e05c5c" text-anchor="start">1.46x on the real body at 100,000 entities, and 1.94x once the pools’ orders have diverged.</text>
