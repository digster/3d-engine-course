<text x="24" y="322" class="xs" text-anchor="start">Index i of one array and index i of the other are now the same entity — which is exactly the guarantee an archetype chunk</text>
<text x="24" y="336" class="xs t-ok" text-anchor="start">gives. No sparse read at all. Measured: 0.99x to 1.01x of the archetype, at every size.</text>
<line x1="24" y1="352" x2="696" y2="352" class="grid" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="24" y="372" class="xs t-hi" text-anchor="start">THE MIGRATION ONLY RUNS ONE WAY.</text>
<text x="232" y="372" class="xs" text-anchor="start">A sparse set can be given an archetype's query later, one group at a time.</text>
<text x="24" y="388" class="xs" text-anchor="start">An archetype cannot be given a sparse set's O(1) structural change at all. That asymmetry is the decision.</text>
</svg>
