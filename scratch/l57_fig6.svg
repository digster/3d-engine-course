<svg viewBox="0 0 720 400" role="img" aria-labelledby="l57f6-t l57f6-d">
  <title id="l57f6-t">A selective query, and the group that answers it</title>
  <desc id="l57f6-d">Top: an archetype holding the matching entities as a contiguous chunk, compared with a sparse set whose dense velocity pool reaches into a transform pool where only one element in four is wanted. Bottom: the same sparse set with both pools sorted so the members occupy the front of each in the same order, which removes the redirect entirely.</desc>
