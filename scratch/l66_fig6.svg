<svg viewBox="0 0 720 340" role="img" aria-labelledby="l66f6-t l66f6-d">
  <title id="l66f6-t">A mock of the expected result: the textured glTF cube</title>
  <desc id="l66f6-d">A dark framebuffer containing a cube drawn in three-quarter view. Its left face carries a black and white checkerboard with an arrow pointing upward, its top face is amber. Three annotations to the right note that the upward arrow proves the v coordinate was not flipped, that the external image resolved against the asset store's search path, and that the roughness came from the file.</desc>
  <defs>
    <marker id="e-i-l66f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l66f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l66f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l66f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l66f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
