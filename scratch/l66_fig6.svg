<text x="460" y="88" class="sm" text-anchor="start">the arrow points UP</text>
<text x="460" y="108" class="xs" text-anchor="start">so v was NOT flipped. OBJ needs the</text>
<text x="460" y="124" class="xs" text-anchor="start">flip; glTF must not have it.</text>
<rect x="448" y="146" width="248" height="68" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.08"/>
<rect x="448" y="146" width="248" height="68" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="460" y="168" class="sm" text-anchor="start">the image was found</text>
<text x="460" y="188" class="xs" text-anchor="start">"uv_grid.png" resolved against the</text>
<text x="460" y="204" class="xs" text-anchor="start">store's search path, not the .gltf's.</text>
<rect x="448" y="226" width="248" height="68" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.08"/>
<rect x="448" y="226" width="248" height="68" rx="3" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="460" y="248" class="sm" text-anchor="start">roughness 0.4 came</text>
<text x="460" y="268" class="xs" text-anchor="start">from the FILE. Nothing in gltf_view</text>
<text x="460" y="284" class="xs" text-anchor="start">types a colour or a shininess.</text>
<text x="360.0" y="318" class="xs" text-anchor="middle">480 x 270, one directional light, back-face culling gated on validate(). An SVG mock; the real frame is a PPM.</text>
