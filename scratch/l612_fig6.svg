<svg viewBox="0 0 720 360" role="img" aria-labelledby="f612f-t f612f-d">
  <title id="f612f-t">The scene pass, the HDR target and the resolve pass</title>
  <desc id="f612f-d">Two render passes with a float colour target between them, and the three reasons the tonemap cannot live in the scene's fragment shader.</desc>
  <defs>
    <marker id="e-i-f612f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f612f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f612f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f612f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f612f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">The first pass in this engine that draws no geometry</text>
<rect x="60" y="54" width="270" height="150" rx="6" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<rect x="60" y="54" width="270" height="30" rx="6" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.18"/>
<text x="195" y="74" class="xs" text-anchor="middle">PASS ONE — the scene</text>
<text x="195" y="104" class="xs" text-anchor="middle">nine pipelines (6.11), depth,</text>
<text x="195" y="121" class="xs" text-anchor="middle">blending, meshes, materials</text>
<text x="195" y="138" class="xs" text-anchor="middle"></text>
<text x="195" y="155" class="xs" text-anchor="middle">cost scales with GEOMETRY</text>
<text x="195" y="172" class="xs" text-anchor="middle">encode_output = 0 — a float</text>
<text x="195" y="189" class="xs" text-anchor="middle">target has no transfer function</text>
<line x1="334" y1="128" x2="374" y2="128" class="ink-soft" stroke-width="1.3" marker-end="url(#e-s-f612f)"/>
<rect x="378" y="88" width="118" height="80" rx="6" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<rect x="378" y="88" width="118" height="26" rx="6" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.18"/>
<text x="437" y="105" class="xs" text-anchor="middle">HDR target</text>
<text x="437" y="130" class="xs" text-anchor="middle">R16G16B16A16</text>
<text x="437" y="147" class="xs" text-anchor="middle">_FLOAT, 2x the</text>
<text x="437" y="161" class="xs" text-anchor="middle">bytes of LDR</text>
<line x1="500" y1="128" x2="540" y2="128" class="ink-soft" stroke-width="1.3" marker-end="url(#e-s-f612f)"/>
<rect x="544" y="54" width="130" height="150" rx="6" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<rect x="544" y="54" width="130" height="30" rx="6" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.18"/>
<text x="609" y="74" class="xs" text-anchor="middle">PASS TWO</text>
<text x="609" y="104" class="xs" text-anchor="middle">the resolve</text>
<text x="609" y="121" class="xs" text-anchor="middle"></text>
<text x="609" y="138" class="xs" text-anchor="middle">no vertex input</text>
<text x="609" y="155" class="xs" text-anchor="middle">no depth</text>
<text x="609" y="172" class="xs" text-anchor="middle">no blending</text>
<text x="609" y="189" class="xs" text-anchor="middle">one triangle</text>
<line x1="60" y1="222" x2="660" y2="222" class="grid" stroke-width="1.0"/>
<text x="360.0" y="246" class="xs" text-anchor="middle">WHY NOT JUST TONEMAP AT THE END OF THE SCENE SHADER? It costs nothing extra and it is wrong three ways,</text>
<text x="360.0" y="266" class="xs" text-anchor="middle">each of which becomes a real limitation within two lessons:</text>
<text x="360.0" y="292" class="xs" text-anchor="middle">an EXPOSURE DERIVED FROM THE FRAME cannot be known while the frame is still being drawn;</text>
<text x="360.0" y="312" class="xs" text-anchor="middle">BLOOM COMES BEFORE THE CURVE (6.13), and a per-fragment tonemap has already compressed what it needs;</text>
<text x="360.0" y="332" class="xs" text-anchor="middle">BLENDING WOULD COMPOSITE TONEMAPPED VALUES — and f(a) over f(b) is not f(a over b), because a curve is not linear.</text>
</svg>
