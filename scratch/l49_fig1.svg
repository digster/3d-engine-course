<svg viewBox="0 0 720 392" role="img" aria-labelledby="f49a-t f49a-d">
  <title id="f49a-t">Why a CPU debugger cannot debug a frame</title>
  <desc id="f49a-d">Four lanes on one timeline: your code recording calls, the command buffer holding them, the GPU executing them later, and the display showing the result. A breakpoint can only stop in the first lane, where every call has already returned success. The submit is the wall between the code and the consequence.</desc>
  <defs>
    <marker id="e-i-f49a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f49a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f49a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
  <text x="24" y="22" class="sm">the call that was wrong, and the moment the picture is wrong &#8212; <tspan class="t-hi">separated by a submit</tspan></text>
  <text x="24" y="52" class="xs muted">your code, on the CPU</text>
  <line x1="24" y1="86" x2="696" y2="86" class="grid" stroke-width="0.75"/>
  <rect x="40" y="62" width="250" height="24" fill="#5082e6" fill-opacity="0.28" stroke="#5082e6" stroke-width="1"/>
  <text x="165.0" y="78" class="xs mono" text-anchor="middle">record</text>
  <text x="696" y="102" class="xs muted" text-anchor="end">every call returns success</text>
  <text x="24" y="122" class="xs muted">the command buffer</text>
  <line x1="24" y1="156" x2="696" y2="156" class="grid" stroke-width="0.75"/>
  <rect x="40" y="132" width="250" height="24" fill="#5acdd7" fill-opacity="0.28" stroke="#5acdd7" stroke-width="1"/>
  <text x="165.0" y="148" class="xs mono" text-anchor="middle">a list of work, not work</text>
  <text x="696" y="172" class="xs muted" text-anchor="end">nothing has executed yet</text>
  <text x="24" y="192" class="xs muted">the GPU</text>
  <line x1="24" y1="226" x2="696" y2="226" class="grid" stroke-width="0.75"/>
  <rect x="330" y="202" width="210" height="24" fill="#f0961e" fill-opacity="0.28" stroke="#f0961e" stroke-width="1"/>
  <text x="435.0" y="218" class="xs mono" text-anchor="middle">execute</text>
  <text x="696" y="242" class="xs muted" text-anchor="end">…here is where it goes wrong</text>
  <text x="24" y="262" class="xs muted">the display</text>
  <line x1="24" y1="296" x2="696" y2="296" class="grid" stroke-width="0.75"/>
  <rect x="560" y="272" width="130" height="24" fill="#a97ae0" fill-opacity="0.28" stroke="#a97ae0" stroke-width="1"/>
  <text x="625.0" y="288" class="xs mono" text-anchor="middle">scan out</text>
  <text x="696" y="312" class="xs muted" text-anchor="end">and here is where you see it</text>
  <line x1="315" y1="56" x2="315" y2="308" class="hi" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="322" y="322" class="xs t-hi">SDL_SubmitGPUCommandBuffer</text>
  <text x="24" y="362" class="xs">A breakpoint lives entirely in the top lane, where every call has already returned success.</text>
  <text x="24" y="380" class="xs muted">By the time a pixel is wrong, the stack that produced it has been gone for two lanes.</text>
</svg>
