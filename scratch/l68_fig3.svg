<svg viewBox="0 0 720 340" role="img" aria-labelledby="l68f3-t l68f3-d">
  <title id="l68f3-t">Perspective versus orthographic</title>
  <desc id="l68f3-d">Left: a perspective frustum's rays converge on an eye, so w equals minus z and depth resolution crowds against the near plane. Right: an orthographic box's rays are parallel, w stays exactly 1, and depth is spread evenly.</desc>
  <defs>
    <marker id="e-i-l68f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l68f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l68f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l68f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l68f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="0" y="0" width="720" height="340" class="bg"/>
<text x="360.0" y="22" class="sm" text-anchor="middle">A directional light has no position, so its frustum is a box</text>
<text x="176" y="46" class="sm" text-anchor="middle">perspective (2.10)</text>
<circle cx="60" cy="168" r="5" fill="#e05c5c"/>
<text x="60" y="190" class="xs" text-anchor="middle">eye</text>
<line x1="60" y1="168" x2="300" y2="96" class="ink-soft" stroke-width="1.3"/>
<line x1="60" y1="168" x2="300" y2="240" class="ink-soft" stroke-width="1.3"/>
<line x1="140" y1="133" x2="140" y2="203" class="ink" stroke-width="1.6"/>
<line x1="300" y1="96" x2="300" y2="240" class="ink" stroke-width="1.6"/>
<text x="140" y="124" class="xs" text-anchor="middle">near</text>
<text x="300" y="88" class="xs" text-anchor="middle">far</text>
<text x="176" y="274" class="xs" text-anchor="middle">rays converge, so w = -z</text>
<text x="176" y="292" class="xs" text-anchor="middle">and depth is crowded near</text>
<text x="536" y="46" class="sm" text-anchor="middle">orthographic (6.8)</text>
<line x1="392" y1="106" x2="664" y2="106" class="hi" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#e-h-l68f3)"/>
<line x1="392" y1="136" x2="664" y2="136" class="hi" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#e-h-l68f3)"/>
<line x1="392" y1="166" x2="664" y2="166" class="hi" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#e-h-l68f3)"/>
<line x1="392" y1="196" x2="664" y2="196" class="hi" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#e-h-l68f3)"/>
<line x1="392" y1="226" x2="664" y2="226" class="hi" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#e-h-l68f3)"/>
<line x1="432" y1="96" x2="432" y2="246" class="ink" stroke-width="1.6"/>
<line x1="636" y1="96" x2="636" y2="246" class="ink" stroke-width="1.6"/>
<rect x="432" y="96" width="204" height="150" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="432" y="88" class="xs" text-anchor="middle">near</text>
<text x="636" y="88" class="xs" text-anchor="middle">far</text>
<text x="536" y="274" class="xs" text-anchor="middle">rays are parallel, so w = 1 EXACTLY</text>
<text x="536" y="292" class="xs" text-anchor="middle">and depth is spread evenly</text>
<text x="360.0" y="322" class="xs" text-anchor="middle">Checked: one metre of depth is worth the same device depth at both planes; under perspective the ratio is over 100x.</text>
</svg>
