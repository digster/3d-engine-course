<svg viewBox="0 0 720 372" role="img" aria-labelledby="l57f4-t l57f4-d">
  <title id="l57f4-t">Sparse-set query cost relative to the archetype, versus world size</title>
  <desc id="l57f4-d">A line chart with world size from 4 to 100,000 entities on the x axis and cost relative to an archetype on the y axis. All four series sit near 1x up to a thousand entities. Beyond that the cheap scrambled series rises to 2.40x, cheap aligned to 1.31x, real scrambled to 1.34x, and real aligned stays at 0.96x.</desc>
  <defs>
    <marker id="e-i-l57f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l57f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l57f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l57f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l57f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
