<line x1="24" y1="300" x2="696" y2="300" class="grid" stroke-width="1.2"/>
<text x="24" y="320" class="xs t-ok" text-anchor="start">THE CONTROL:</text>
<text x="104" y="320" class="xs" text-anchor="start">at K = 1 both designs perform literally the same walk, and the measured ratio is 1.00x at every</text>
<text x="24" y="336" class="xs" text-anchor="start">size — so the harness is measuring the redirect and not itself. THE SPREAD: the same redirect costs 2.4x on a body with</text>
<text x="24" y="352" class="xs t-hi" text-anchor="start">nothing to hide behind and 1.34x on one that builds a model matrix. Alignment is worth as much as the body is.</text>
</svg>
