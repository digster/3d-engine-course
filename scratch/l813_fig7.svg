<svg viewBox="0 0 980 382" role="img" aria-labelledby="h7-t h7-d">
  <title id="h7-t">A capsule's round bottom on an edge: a free curb, an overhang, and the normal</title>
  <desc id="h7-d">Left: a capsule's bottom sphere, inflated by the skin, touching the top edge of a curb; the normal from the edge to the centre is tilted, and the curb is climbed while the tilt is walkable, up to (r + skin)(1 - cos 45) = 90.8 mm. Middle: the sphere resting on an edge with its centre past it; it stands until the overhang is (r + skin) sin 45 = 219.2 mm. Right: the tilt reported against the overhang, measured points on the arcsine curve, with the 45-degree limit.</desc>
  <defs>
    <marker id="e-i-h7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-h7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-h7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-h7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-h7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-blue-h7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<defs><marker id="e-amber-h7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-grey-h7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<text x="26" y="30" class="sm" text-anchor="start">A curb meets the round bottom as a ramp</text>
<line x1="30" y1="240" x2="278.6" y2="240" class="ink-soft" stroke-width="1.4"/>
<path d="M 172.80,240.00 L 269.40,240.00 L 269.40,219.12 L 172.80,219.12 Z" fill="#8f918a" fill-opacity="0.25" stroke="#8f918a" stroke-width="1.2"/>
<circle cx="122.4" cy="168.7" r="71.3" fill="none" stroke="#f0961e" stroke-width="1.6"/>
<circle cx="122.4" cy="168.7" r="69.0" fill="none" stroke="#f0961e" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="172.80" y1="219.12" x2="122.38" y2="168.70" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-h7)"/>
<circle cx="172.8" cy="219.1" r="3.4" fill="#5082e6"/>
<line x1="122.4" y1="168.7" x2="122.4" y2="200.9" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<text x="275.4" y="233.55835674930043" class="xs mono" text-anchor="start">s = 90.8 mm</text>
<text x="26" y="270" class="xs" text-anchor="start">n runs from the edge to the centre: n.y = (r+s − s)/(r+s).</text>
<text x="26" y="285" class="xs" text-anchor="start">Walkable while n.y ≥ cos 45°, so the tallest curb climbed</text>
<text x="26" y="300" class="xs" text-anchor="start">with NO step-up is (r + skin)(1 − cos θ).</text>
<text x="26" y="315" class="xs mono" text-anchor="start">measured 91.83 mm, predicted 90.80</text>
<text x="26" y="330" class="xs muted" text-anchor="start">(dashed: the capsule; solid: plus the skin, which touches)</text>
<text x="370" y="30" class="sm" text-anchor="start">Standing past an edge</text>
<path d="M 388.00,253.80 L 480.00,253.80 L 480.00,240.00 L 388.00,240.00 Z" fill="#8f918a" fill-opacity="0.25" stroke="#8f918a" stroke-width="1.2"/>
<circle cx="530.4" cy="189.6" r="71.3" fill="none" stroke="#f0961e" stroke-width="1.6"/>
<line x1="480.00" y1="240.00" x2="530.42" y2="189.58" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-h7)"/>
<circle cx="480.0" cy="240.0" r="3.4" fill="#5082e6"/>
<line x1="480.0" y1="240.0" x2="480.0" y2="125.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<line x1="480.0" y1="109.1" x2="530.4" y2="109.1" stroke="#f0961e" stroke-width="1.2" fill="none"/>
<text x="505.20835674930044" y="103.08328650139919" class="xs" text-anchor="middle">overhang</text>
<text x="370" y="270" class="xs" text-anchor="start">tilt = asin(overhang / (r + skin)); it stands</text>
<text x="370" y="285" class="xs" text-anchor="start">while that is walkable: (r + skin)·sin θ.</text>
<text x="370" y="300" class="xs mono" text-anchor="start">placed: 219.79 mm; walking off: 215.0</text>
<text x="370" y="315" class="xs mono" text-anchor="start">predicted 219.20 mm</text>
<text x="686" y="30" class="sm" text-anchor="start">The tilt reported on an edge</text>
<rect x="706" y="58" width="244" height="190" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
