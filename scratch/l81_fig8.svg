<line x1="252.0" y1="56" x2="252.0" y2="306" class="grid" stroke-width="1.0"/>
<text x="252.0" y="322" class="xs mono" text-anchor="middle">4</text>
<line x1="347.0" y1="56" x2="347.0" y2="306" class="grid" stroke-width="1.0"/>
<text x="347.0" y="322" class="xs mono" text-anchor="middle">6</text>
<line x1="442.0" y1="56" x2="442.0" y2="306" class="grid" stroke-width="1.0"/>
<text x="442.0" y="322" class="xs mono" text-anchor="middle">8</text>
<line x1="62" y1="298.6470588235294" x2="442" y2="298.6470588235294" class="grid" stroke-width="1.0"/>
<text x="54" y="302.6470588235294" class="xs muted" text-anchor="end">-0.8</text>
<line x1="62" y1="239.8235294117647" x2="442" y2="239.8235294117647" class="grid" stroke-width="1.0"/>
<text x="54" y="243.8235294117647" class="xs muted" text-anchor="end">-0.4</text>
<line x1="62" y1="181.0" x2="442" y2="181.0" class="grid" stroke-width="1.0"/>
<text x="54" y="185.0" class="xs muted" text-anchor="end">+0.0</text>
<line x1="62" y1="122.17647058823529" x2="442" y2="122.17647058823529" class="grid" stroke-width="1.0"/>
<text x="54" y="126.17647058823529" class="xs muted" text-anchor="end">+0.4</text>
<line x1="62" y1="63.35294117647058" x2="442" y2="63.35294117647058" class="grid" stroke-width="1.0"/>
<text x="54" y="67.35294117647058" class="xs muted" text-anchor="end">+0.8</text>
<text x="252.0" y="342" class="xs muted" text-anchor="middle">simulated seconds</text>
<text x="16" y="52" class="xs muted" text-anchor="middle">m</text>
<path d="M 62.00,181.00 L 109.50,168.98 L 157.00,156.95 L 252.00,132.91 L 442.00,84.93" fill="none" stroke="#eb6060" stroke-width="2.2"/>
