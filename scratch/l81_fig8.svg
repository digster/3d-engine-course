<text x="356.5" y="99.47058823529412" class="xs mono" text-anchor="middle">+½·g·h·t</text>
<text x="356.5" y="270.52941176470586" class="xs mono" text-anchor="middle">−½·g·h·t</text>
<text x="271.0" y="167.11764705882354" class="xs mono t-ok" text-anchor="middle">velocity Verlet: exact</text>
<text x="500" y="68" class="xs muted" text-anchor="start">E.1  after 1 second</text>
<text x="730" y="68" class="xs muted" text-anchor="end">fallen (m)</text>
<text x="830" y="68" class="xs muted" text-anchor="end">error</text>
<line x1="500" y1="76.0" x2="836" y2="76.0" class="grid" stroke-width="1.0"/>
<text x="500" y="93.0" class="xs" text-anchor="start">explicit Euler</text>
<text x="730" y="93.0" class="xs mono" text-anchor="end">4.823249</text>
<text x="830" y="93.0" class="xs mono" text-anchor="end">-0.081751</text>
<text x="500" y="110.0" class="xs" text-anchor="start">semi-implicit</text>
<text x="730" y="110.0" class="xs mono" text-anchor="end">4.986749</text>
<text x="830" y="110.0" class="xs mono" text-anchor="end">+0.081749</text>
<text x="500" y="127.0" class="xs" text-anchor="start">velocity Verlet</text>
<text x="730" y="127.0" class="xs mono" text-anchor="end">4.904999</text>
<text x="830" y="127.0" class="xs mono" text-anchor="end">-0.000001</text>
<text x="500" y="157.5" class="xs muted" text-anchor="start">Exact: 4.9050 m. Predicted error</text>
<text x="500" y="173.5" class="xs muted" text-anchor="start">½·g·h·t = 0.081750 m — one rule short</text>
<text x="500" y="189.5" class="xs muted" text-anchor="start">by it, one long by it. The SPEED is the</text>
<text x="500" y="205.5" class="xs muted" text-anchor="start">same to the last bit in all three.</text>
<text x="500" y="237.5" class="sm" text-anchor="start">LINEAR in t, not exponential. Gravity is</text>
<text x="500" y="257.5" class="sm" text-anchor="start">forgiving, and that is why this bug ships:</text>
<text x="500" y="277.5" class="sm t-hi" text-anchor="start">your first falling-cube demo is FINE.</text>
<text x="500" y="301.5" class="xs muted" text-anchor="start">It stops being fine the moment a force</text>
<text x="500" y="317.5" class="xs muted" text-anchor="start">depends on WHERE the body is.</text>
</svg>
