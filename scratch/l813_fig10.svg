<svg viewBox="0 0 980 523.5" role="img" aria-labelledby="h10-t h10-d">
  <title id="h10-t">Tunnelling: a rigid capsule's odds against a controller that casts</title>
  <desc id="h10-d">Left: a capsule sampled at two step boundaries either side of a 10 cm wall, the second overlapping it; the wall's midplane is dashed. Right: pass-through percentage against speed on a log axis — the rigid capsule's measurements on the closed-form curve, zero below 21 m/s, and the controller at zero at every speed up to 10,000 m/s, with a table of how far short of the wall it stopped.</desc>
  <defs>
    <marker id="e-i-h10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-h10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-h10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-h10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-h10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-red-h10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-grey-h10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<text x="26" y="30" class="sm" text-anchor="start">Sampled at instants: where the step boundary lands</text>
<path d="M 170.00,240.00 L 190.00,240.00 L 190.00,100.00 L 170.00,100.00 Z" fill="#5082e6" fill-opacity="0.2" stroke="#5082e6" stroke-width="1.2"/>
<circle cx="102.0" cy="170.0" r="60.0" fill="none" stroke="#8f918a" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="166.0" cy="170.0" r="60.0" fill="none" stroke="#e05c5c" stroke-width="1.4"/>
<line x1="102.00" y1="254.00" x2="158.00" y2="254.00" stroke="#8f918a" stroke-width="1.2" marker-end="url(#e-grey-h10)"/>
<text x="130.0" y="248.0" class="xs" text-anchor="middle">v·h</text>
<line x1="180.0" y1="260.0" x2="180.0" y2="80.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="2 3"/>
<text x="26" y="300" class="xs" text-anchor="start">The first sampled overlap is d deep, uniform on [0, v·h]</text>
<text x="26" y="315" class="xs" text-anchor="start">(8.10 §6). EPA pushes the capsule out the NEAR side</text>
<text x="26" y="330" class="xs" text-anchor="start">only while its centre has not passed the wall's middle:</text>
<text x="26" y="345" class="xs" text-anchor="start">d &lt; w/2 + r. So it passes with probability</text>
<text x="26" y="360" class="xs mono" text-anchor="start">1 − (w/2 + r)/(v·h), and at 21 m/s it starts to.</text>
<text x="450" y="30" class="sm" text-anchor="start">Through a 10 cm wall, 200 phases per speed</text>
