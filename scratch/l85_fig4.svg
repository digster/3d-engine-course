<svg viewBox="0 0 900 400" role="img" aria-labelledby="l85f4-t l85f4-d">
  <title id="l85f4-t">Three iterations of GJK on the difference set from figure 2, with the simplex, the search direction and both bounds at each step.</title>
  <desc id="l85f4-d">Three panels, one per iteration. Each shows the grey difference set, the origin as a green cross, the current simplex in amber, the vector v drawn from the origin in purple, a dashed continuation in the search direction minus v, and the new support point w as a green dot. A small table under each panel gives the upper bound, the lower bound and how the simplex size changed.</desc>
