<svg viewBox="0 0 720 396" role="img" aria-labelledby="l59f4-t l59f4-d">
  <title id="l59f4-t">The level order and the parallelism it implies</title>
  <desc id="l59f4-d">The order array split into three levels by a start index, the flat loop that walks it, and the observation that each level can be a parallel_for that depends only on the level before it.</desc>
  <defs>
    <marker id="e-i-l59f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l59f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l59f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l59f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l59f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">What rebuild() produces, and the property that fell out of it for free.</text>
<text x="24" y="48" class="xs t-hi" text-anchor="start">order_  — every entity, parents strictly before children</text>
<rect x="96" y="62" width="44" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.26"/>
<text x="118" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="144" y="62" width="44" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.26"/>
<text x="166" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="192" y="62" width="44" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.26"/>
<text x="214" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="254" y="62" width="44" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.26"/>
<text x="276" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="302" y="62" width="44" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.26"/>
<text x="324" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="350" y="62" width="44" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.26"/>
<text x="372" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="398" y="62" width="44" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.26"/>
<text x="420" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="446" y="62" width="44" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.26"/>
<text x="468" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="508" y="62" width="44" height="22" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.26"/>
<text x="530" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="556" y="62" width="44" height="22" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.26"/>
<text x="578" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="604" y="62" width="44" height="22" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.26"/>
<text x="626" y="77" class="xs mono" text-anchor="middle">e</text>
<rect x="652" y="62" width="44" height="22" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.26"/>
<text x="674" y="77" class="xs mono" text-anchor="middle">e</text>
<line x1="93" y1="90" x2="233" y2="90" class="grid" stroke-width="1.0"/>
<text x="163.0" y="104" class="xs mono muted" text-anchor="middle">level 0</text>
<line x1="251" y1="90" x2="487" y2="90" class="grid" stroke-width="1.0"/>
<text x="369.0" y="104" class="xs mono muted" text-anchor="middle">level 1</text>
<line x1="505" y1="90" x2="693" y2="90" class="grid" stroke-width="1.0"/>
<text x="599.0" y="104" class="xs mono muted" text-anchor="middle">level 2</text>
<text x="88" y="77" class="xs mono muted" text-anchor="end">order_</text>
<text x="24" y="128" class="xs muted" text-anchor="start">level_start_ = [0, 3, 8, 12]  — four numbers, and they are the whole index.</text>
<line x1="24" y1="148" x2="696" y2="148" class="grid" stroke-width="1.2"/>
<text x="24" y="170" class="xs t-hi" text-anchor="start">THE LOOP — and note what is NOT in it</text>
<text x="60" y="192" class="xs mono" text-anchor="start">for each level:</text>
<text x="78" y="208" class="xs mono" text-anchor="start">for each entity e in that level:</text>
<text x="96" y="224" class="xs mono" text-anchor="start">out[e] = world(parent(e)) * parent_from_local(local[e])</text>
<rect x="420" y="178" width="262" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" stroke-dasharray="3 3" fill-opacity="0.1"/>
<text x="551" y="191" class="xs muted" text-anchor="middle">no recursion</text>
<rect x="420" y="198" width="262" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" stroke-dasharray="3 3" fill-opacity="0.1"/>
<text x="551" y="211" class="xs muted" text-anchor="middle">no stack</text>
<rect x="420" y="218" width="262" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" stroke-dasharray="3 3" fill-opacity="0.1"/>
<text x="551" y="231" class="xs muted" text-anchor="middle">no visited set</text>
<rect x="420" y="238" width="262" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" stroke-dasharray="3 3" fill-opacity="0.1"/>
<text x="551" y="251" class="xs muted" text-anchor="middle">no “has my parent been resolved yet?” test</text>
<text x="24" y="274" class="xs muted" text-anchor="start">The ORDER already guarantees the thing those tests would check. Everything a level reads was</text>
<text x="24" y="288" class="xs muted" text-anchor="start">written by an earlier one.</text>
<line x1="24" y1="304" x2="696" y2="304" class="grid" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="24" y="324" class="xs t-ok" text-anchor="start">AND THEREFORE: within a level, every iteration is independent of every other.</text>
<rect x="120" y="338" width="170" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.2"/>
<text x="205" y="353" class="xs mono" text-anchor="middle">level 0: parallel_for</text>
<line x1="292" y1="349" x2="316" y2="349" class="hi" stroke-width="1.2" marker-end="url(#e-h-l59f4)"/>
<rect x="320" y="338" width="170" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="405" y="353" class="xs mono" text-anchor="middle">level 1: parallel_for</text>
<line x1="492" y1="349" x2="516" y2="349" class="hi" stroke-width="1.2" marker-end="url(#e-h-l59f4)"/>
<rect x="520" y="338" width="170" height="22" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.2"/>
<text x="605" y="353" class="xs mono" text-anchor="middle">level 2: parallel_for</text>
<text x="24" y="382" class="xs muted" text-anchor="start">Module 9 does not have to design that. It arrived with the choice of visit order.</text>
</svg>
