<svg viewBox="0 0 980 412" role="img" aria-labelledby="f1-t f1-d">
  <title id="f1-t">Sequential impulses on a four-point manifold, and the measured contraction</title>
  <desc id="f1-d">Left: four contact points solved one after another, each impulse disturbing the velocity the previous one set. Right: the residual after n sweeps on a log axis, falling by a constant factor of 0.53 per iteration until it reaches the float floor.</desc>
  <defs>
    <marker id="e-i-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-blue-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<defs><marker id="e-amber-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-green-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<text x="26" y="40" class="sm" text-anchor="start">One sweep, four points, in turn</text>
<rect x="66" y="74" width="300" height="74" rx="3" fill="none" stroke="#5082e6" stroke-width="1.4"/>
<text x="216" y="116.0" class="xs muted" text-anchor="middle">one crate, one manifold</text>
<line x1="36.0" y1="148.0" x2="426.0" y2="148.0" stroke="#8f918a" stroke-width="2.0" fill="none"/>
<circle cx="86" cy="148" r="3.4" fill="#5082e6"/>
<line x1="86.00" y1="148.00" x2="86.00" y2="122.00" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-f1)"/>
<text x="86" y="166" class="xs mono" text-anchor="middle">1</text>
<circle cx="176" cy="148" r="3.4" fill="#5082e6"/>
<line x1="176.00" y1="148.00" x2="176.00" y2="122.00" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-f1)"/>
<text x="176" y="166" class="xs mono" text-anchor="middle">2</text>
<circle cx="266" cy="148" r="3.4" fill="#5082e6"/>
<line x1="266.00" y1="148.00" x2="266.00" y2="122.00" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-f1)"/>
<text x="266" y="166" class="xs mono" text-anchor="middle">3</text>
<circle cx="346" cy="148" r="3.4" fill="#5082e6"/>
<line x1="346.00" y1="148.00" x2="346.00" y2="122.00" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-f1)"/>
<text x="346" y="166" class="xs mono" text-anchor="middle">4</text>
<text x="26" y="192" class="xs muted" text-anchor="start">…and point 4's impulse moves the velocity point 1 had just</text>
<text x="26" y="208" class="xs muted" text-anchor="start">set exactly on target. That residue is not a rounding</text>
<text x="26" y="224" class="xs muted" text-anchor="start">error; it is the system disagreeing with itself.</text>
<rect x="36" y="254" width="112" height="30" rx="3" fill="none" stroke="#5082e6" stroke-width="1.2"/>
<text x="92" y="274" class="xs mono" text-anchor="middle">sweep 1</text>
<line x1="150.00" y1="269.00" x2="172.00" y2="269.00" stroke="#5ac878" stroke-width="1.4" marker-end="url(#e-green-f1)"/>
<rect x="176" y="254" width="112" height="30" rx="3" fill="none" stroke="#5082e6" stroke-width="1.2"/>
<text x="232" y="274" class="xs mono" text-anchor="middle">sweep 2</text>
<line x1="290.00" y1="269.00" x2="312.00" y2="269.00" stroke="#5ac878" stroke-width="1.4" marker-end="url(#e-green-f1)"/>
<rect x="316" y="254" width="112" height="30" rx="3" fill="none" stroke="#5ac878" stroke-width="1.2"/>
<text x="372" y="274" class="xs mono" text-anchor="middle">sweep 3</text>
<text x="36" y="306" class="xs" text-anchor="start">each sweep multiplies what is left by 0.53</text>
<text x="530" y="40" class="sm" text-anchor="start">Residual after n sweeps, one crate, cold</text>
<rect x="530" y="74" width="380" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="530" y1="324.0" x2="910" y2="324.0" class="grid" stroke-width="0.7"/>
<text x="522" y="328.0" class="xs mono" text-anchor="end">1e-9</text>
<line x1="530" y1="292.75" x2="910" y2="292.75" class="grid" stroke-width="0.7"/>
<text x="522" y="296.75" class="xs mono" text-anchor="end">1e-8</text>
<line x1="530" y1="261.5" x2="910" y2="261.5" class="grid" stroke-width="0.7"/>
<text x="522" y="265.5" class="xs mono" text-anchor="end">1e-7</text>
<line x1="530" y1="230.25" x2="910" y2="230.25" class="grid" stroke-width="0.7"/>
<text x="522" y="234.25" class="xs mono" text-anchor="end">1e-6</text>
<line x1="530" y1="199.0" x2="910" y2="199.0" class="grid" stroke-width="0.7"/>
<text x="522" y="203.0" class="xs mono" text-anchor="end">1e-5</text>
<line x1="530" y1="167.75" x2="910" y2="167.75" class="grid" stroke-width="0.7"/>
<text x="522" y="171.75" class="xs mono" text-anchor="end">1e-4</text>
<line x1="530" y1="136.5" x2="910" y2="136.5" class="grid" stroke-width="0.7"/>
<text x="522" y="140.5" class="xs mono" text-anchor="end">1e-3</text>
<line x1="530" y1="105.25" x2="910" y2="105.25" class="grid" stroke-width="0.7"/>
<text x="522" y="109.25" class="xs mono" text-anchor="end">1e-2</text>
<line x1="530" y1="74.0" x2="910" y2="74.0" class="grid" stroke-width="0.7"/>
<text x="522" y="78.0" class="xs mono" text-anchor="end">1e-1</text>
<path d="M 546.00,95.64 L 604.00,105.25 L 662.00,121.50 L 720.00,155.91 L 778.00,223.25 L 836.00,290.95 L 894.00,290.95" fill="none" stroke="#5082e6" stroke-width="2.0"/>
<circle cx="546.0" cy="95.6" r="3.2" fill="#5082e6"/>
<text x="546.0" y="340" class="xs mono" text-anchor="middle">1</text>
<circle cx="604.0" cy="105.3" r="3.2" fill="#5082e6"/>
<text x="604.0" y="340" class="xs mono" text-anchor="middle">2</text>
<circle cx="662.0" cy="121.5" r="3.2" fill="#5082e6"/>
<text x="662.0" y="340" class="xs mono" text-anchor="middle">4</text>
<circle cx="720.0" cy="155.9" r="3.2" fill="#5082e6"/>
<text x="720.0" y="340" class="xs mono" text-anchor="middle">8</text>
<circle cx="778.0" cy="223.2" r="3.2" fill="#5082e6"/>
<text x="778.0" y="340" class="xs mono" text-anchor="middle">16</text>
<circle cx="836.0" cy="291.0" r="3.2" fill="#5082e6"/>
<text x="836.0" y="340" class="xs mono" text-anchor="middle">32</text>
<circle cx="894.0" cy="290.9" r="3.2" fill="#5082e6"/>
<text x="894.0" y="340" class="xs mono" text-anchor="middle">64</text>
<text x="720.0" y="358" class="xs muted" text-anchor="middle">velocity iterations</text>
<path d="M 546.00,95.64 L 604.00,104.32 L 662.00,121.68 L 720.00,156.39 L 778.00,225.81 L 836.00,324.00" fill="none" stroke="#9b7ede" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="530.0" y1="291.0" x2="910.0" y2="291.0" stroke="#8f918a" stroke-width="1.2" fill="none" stroke-dasharray="3 4"/>
<text x="904" y="283.95031129154177" class="xs muted" text-anchor="end">float floor</text>
<line x1="530.0" y1="378.0" x2="550.0" y2="378.0" stroke="#5082e6" stroke-width="2.4" fill="none"/>
<text x="558" y="382" class="xs" text-anchor="start">measured</text>
<line x1="530.0" y1="395.0" x2="550.0" y2="395.0" stroke="#9b7ede" stroke-width="2.4" fill="none"/>
<text x="558" y="399" class="xs" text-anchor="start">geometric at 0.53 per iteration</text>
<text x="26" y="392" class="xs muted" text-anchor="start">CONTROL — a sphere on a floor is ONE point: 2.5247e-13 at one pass and the same at sixteen.</text>
</svg>
