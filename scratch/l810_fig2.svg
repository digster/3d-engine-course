<svg viewBox="0 0 980 420" role="img" aria-labelledby="f2-t f2-d">
  <title id="f2-t">Warm starting: the four-lesson loop that makes it possible, and what it is worth</title>
  <desc id="f2-d">Left: contact ids from 8.7, carry_impulses, write_back from 8.9 and prepare_contacts from 8.10 form a cycle that carries each contact's impulse into the next frame as an initial guess. Right: two tables — the cold and warm iteration counts and sinks, and a control in which the inherited impulse is deliberately scaled wrong.</desc>
  <defs>
    <marker id="e-i-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-green-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-blue-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<text x="26" y="36" class="sm" text-anchor="start">The loop, and it took four lessons to close</text>
<rect x="26" y="64" width="400" height="44" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="38" y="83" class="xs mono" text-anchor="start">8.7  contact_id</text>
<text x="38" y="99" class="xs muted" text-anchor="start">a name for a contact that survives a frame</text>
<line x1="226.00" y1="108.00" x2="226.00" y2="124.00" stroke="#5ac878" stroke-width="1.4" marker-end="url(#e-green-f2)"/>
<rect x="26" y="126" width="400" height="44" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="38" y="145" class="xs mono" text-anchor="start">8.7  carry_impulses</text>
<text x="38" y="161" class="xs muted" text-anchor="start">match this frame's points onto last frame's</text>
<line x1="226.00" y1="170.00" x2="226.00" y2="186.00" stroke="#5ac878" stroke-width="1.4" marker-end="url(#e-green-f2)"/>
<rect x="26" y="188" width="400" height="44" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="38" y="207" class="xs mono" text-anchor="start">8.9  write_back</text>
<text x="38" y="223" class="xs muted" text-anchor="start">put the accumulated impulse in the manifold</text>
<line x1="226.00" y1="232.00" x2="226.00" y2="248.00" stroke="#5ac878" stroke-width="1.4" marker-end="url(#e-green-f2)"/>
<rect x="26" y="250" width="400" height="44" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="38" y="269" class="xs mono" text-anchor="start">8.10 prepare_contacts</text>
<text x="38" y="285" class="xs muted" text-anchor="start">read it back as this frame's first guess</text>
<line x1="426.0" y1="272.0" x2="450.0" y2="272.0" stroke="#5ac878" stroke-width="1.4" fill="none"/>
<line x1="450.0" y1="272.0" x2="450.0" y2="86.0" stroke="#5ac878" stroke-width="1.4" fill="none"/>
<line x1="450.00" y1="86.00" x2="428.00" y2="86.00" stroke="#5ac878" stroke-width="1.4" marker-end="url(#e-green-f2)"/>
<text x="26" y="320" class="xs" text-anchor="start">11,708 of 11,994 points (97.62%) inherit an impulse on a settled tower.</text>
<text x="520" y="32" class="xs muted" text-anchor="start">At the eight iterations this engine ships</text>
<text x="520" y="52" class="xs muted" text-anchor="start">five-crate tower</text>
<text x="864" y="52" class="xs muted" text-anchor="end">cold</text>
<text x="946" y="52" class="xs muted" text-anchor="end">warm</text>
<line x1="520" y1="60.0" x2="952" y2="60.0" class="grid" stroke-width="1.0"/>
<text x="520" y="77.0" class="xs" text-anchor="start">iterations to a residual of 1e-04</text>
<text x="864" y="77.0" class="xs mono" text-anchor="end">&gt; 400</text>
<text x="946" y="77.0" class="xs mono" text-anchor="end">89</text>
<text x="520" y="94.0" class="xs" text-anchor="start">top crate sink after 20 s, mm</text>
<text x="864" y="94.0" class="xs mono" text-anchor="end">2,020</text>
<text x="946" y="94.0" class="xs mono" text-anchor="end">40</text>
<text x="520" y="111.0" class="xs" text-anchor="start">deepest penetration, mm</text>
<text x="864" y="111.0" class="xs mono" text-anchor="end">199.9</text>
<text x="946" y="111.0" class="xs mono" text-anchor="end">9.2</text>
<text x="520" y="144" class="xs muted" text-anchor="start">A guess that is wrong (control)</text>
<text x="520" y="164" class="xs muted" text-anchor="start">inherited impulse ×</text>
<text x="720" y="164" class="xs muted" text-anchor="end">iters</text>
<text x="820" y="164" class="xs muted" text-anchor="end">residual</text>
<text x="906" y="164" class="xs muted" text-anchor="end">top m/s</text>
<line x1="520" y1="172.0" x2="912" y2="172.0" class="grid" stroke-width="1.0"/>
<text x="520" y="189.0" class="xs" text-anchor="start">0.0</text>
<text x="720" y="189.0" class="xs mono" text-anchor="end">&gt; 400</text>
<text x="820" y="189.0" class="xs mono" text-anchor="end">2.35e-02</text>
<text x="906" y="189.0" class="xs mono" text-anchor="end">0.598</text>
<text x="520" y="206.0" class="xs" text-anchor="start">0.5</text>
<text x="720" y="206.0" class="xs mono" text-anchor="end">&gt; 400</text>
<text x="820" y="206.0" class="xs mono" text-anchor="end">1.35e-02</text>
<text x="906" y="206.0" class="xs mono" text-anchor="end">0.321</text>
<text x="520" y="223.0" class="xs" text-anchor="start">1.0</text>
<text x="720" y="223.0" class="xs mono" text-anchor="end">89</text>
<text x="820" y="223.0" class="xs mono" text-anchor="end">1.33e-04</text>
<text x="906" y="223.0" class="xs mono" text-anchor="end">0.005</text>
<text x="520" y="240.0" class="xs" text-anchor="start">2.0</text>
<text x="720" y="240.0" class="xs mono" text-anchor="end">&gt; 400</text>
<text x="820" y="240.0" class="xs mono" text-anchor="end">3.87e-02</text>
<text x="906" y="240.0" class="xs mono" text-anchor="end">0.608</text>
<text x="520" y="257.0" class="xs" text-anchor="start">5.0</text>
<text x="720" y="257.0" class="xs mono" text-anchor="end">52</text>
<text x="820" y="257.0" class="xs mono" text-anchor="end">2.77e-01</text>
<text x="906" y="257.0" class="xs mono" text-anchor="end">1.540</text>
<text x="520" y="302" class="xs muted" text-anchor="start">Read the last two columns together: the ×5 row</text>
<text x="520" y="318" class="xs muted" text-anchor="start">converges quickly onto a tower it has launched.</text>
</svg>
