<svg viewBox="0 0 980 315" role="img" aria-labelledby="f2-t f2-d">
  <title id="f2-t">The work in one normal solve, hand-written and as a Jacobian row</title>
  <desc id="f2-d">Left: the multiplications in 8.9's normal solve (54) and in the row form (26), broken down by stage. Right: measured cost per point per sweep, 11.95 ns hand-written against 8.75 ns as a row, and the bytes each stores.</desc>
  <defs>
    <marker id="e-i-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="26" y="34" class="sm" text-anchor="start">One normal solve, per point per sweep</text>
<rect x="26" y="64" width="430" height="100" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="38" y="84" class="xs" text-anchor="start">8.9, hand-written</text>
<text x="444" y="84" class="xs muted" text-anchor="end">multiplies</text>
<text x="38" y="104" class="xs" text-anchor="start">relative velocity</text>
<text x="176" y="104" class="xs mono" text-anchor="start">2 × cross, 1 × dot</text>
<text x="444" y="104" class="xs mono" text-anchor="end">15</text>
<text x="38" y="118" class="xs" text-anchor="start">impulse vector</text>
<text x="176" y="118" class="xs mono" text-anchor="start">n · δ</text>
<text x="444" y="118" class="xs mono" text-anchor="end">3</text>
<text x="38" y="132" class="xs" text-anchor="start">linear, both</text>
<text x="176" y="132" class="xs mono" text-anchor="start">2 × scaled add</text>
<text x="444" y="132" class="xs mono" text-anchor="end">6</text>
<text x="38" y="146" class="xs" text-anchor="start">angular, both</text>
<text x="176" y="146" class="xs mono" text-anchor="start">2 × cross, 2 × I⁻¹·v</text>
<text x="444" y="146" class="xs mono" text-anchor="end">30</text>
<text x="176" y="160" class="xs mono" text-anchor="start">total</text>
<text x="444" y="160" class="xs mono" text-anchor="end">54</text>
<rect x="26" y="182" width="430" height="100" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="38" y="202" class="xs" text-anchor="start">8.11, as a Jacobian row</text>
<text x="444" y="202" class="xs muted" text-anchor="end">multiplies</text>
<text x="38" y="222" class="xs" text-anchor="start">J · V</text>
<text x="176" y="222" class="xs mono" text-anchor="start">4 × dot</text>
<text x="444" y="222" class="xs mono" text-anchor="end">12</text>
<text x="38" y="236" class="xs" text-anchor="start">linear, both</text>
<text x="176" y="236" class="xs mono" text-anchor="start">2 × (m⁻¹δ) scaled add</text>
<text x="444" y="236" class="xs mono" text-anchor="end">8</text>
<text x="38" y="250" class="xs" text-anchor="start">angular, both</text>
<text x="176" y="250" class="xs mono" text-anchor="start">2 × scaled add of I⁻¹J</text>
<text x="444" y="250" class="xs mono" text-anchor="end">6</text>
<text x="176" y="278" class="xs mono" text-anchor="start">total</text>
<text x="444" y="278" class="xs mono" text-anchor="end">26</text>
<text x="520" y="34" class="sm" text-anchor="start">Measured: 200 points of a settled yard, 8 sweeps, min of 400</text>
<rect x="630" y="74" width="213.44642857142856" height="26" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.55"/>
<text x="520" y="92" class="xs" text-anchor="start">hand-written</text>
<text x="851.4464285714286" y="92" class="xs mono" text-anchor="start">11.95 ns</text>
<text x="630" y="116" class="xs muted" text-anchor="start">76 bytes per point</text>
<rect x="630" y="132" width="156.25" height="26" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.55"/>
<text x="520" y="150" class="xs" text-anchor="start">Jacobian row</text>
<text x="794.25" y="150" class="xs mono" text-anchor="start">8.75 ns</text>
<text x="630" y="174" class="xs muted" text-anchor="start">108 bytes per point</text>
<line x1="630" y1="64" x2="630" y2="186" class="grid" stroke-width="1.0"/>
<text x="630" y="200" class="xs mono" text-anchor="middle">0</text>
<text x="520" y="228" class="xs muted" text-anchor="start">The general form is 27% FASTER, which refused the prediction that it would</text>
<text x="520" y="243" class="xs muted" text-anchor="start">be slower. The saving is not generality; it is a hoist. A row stores M⁻¹Jᵀ,</text>
<text x="520" y="258" class="xs muted" text-anchor="start">so applying an impulse is four scaled adds, where 8.9 recomputes it from the</text>
<text x="520" y="273" class="xs muted" text-anchor="start">lever arms with two cross products and two matrix products on every visit.</text>
<text x="520" y="288" class="xs muted" text-anchor="start">It costs 32 more bytes a point.</text>
</svg>
