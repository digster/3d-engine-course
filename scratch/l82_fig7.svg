<text x="353.3333333333333" y="320" class="xs mono muted" text-anchor="middle">4</text>
<text x="225.0" y="340" class="xs muted" text-anchor="middle">s — how many metres one unit is DRAWN as</text>
<text x="14" y="189.0" class="xs muted" text-anchor="middle">×time</text>
