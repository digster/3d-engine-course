<text x="88" y="366" class="xs" text-anchor="start">1/√s, the law</text>
<line x1="60.0" y1="378.0" x2="80.0" y2="378.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="88" y="382" class="xs" text-anchor="start">measured, from the table</text>
<text x="470" y="92" class="xs t-hi" text-anchor="start">WHY IT IS A SQUARE ROOT</text>
<text x="470" y="114" class="xs mono" text-anchor="start">d = ½ g t²   ⟹   t = √(2d/g)</text>
<text x="470" y="134" class="xs muted" text-anchor="start">Multiply every LENGTH by s and leave g alone,</text>
<text x="470" y="152" class="xs muted" text-anchor="start">and every DURATION is multiplied by √s.</text>
<text x="470" y="186" class="xs t-hi" text-anchor="start">WHAT THAT SOUNDS LIKE IN A GAME</text>
<text x="470" y="208" class="xs" text-anchor="start">world modelled TOO BIG   →  floaty, moon-like</text>
<text x="470" y="226" class="xs" text-anchor="start">world modelled TOO SMALL →  snappy, toy-like</text>
<text x="470" y="244" class="xs muted" text-anchor="start">The symptom names the bug, if you know the law.</text>
<text x="470" y="278" class="xs t-hi" text-anchor="start">AND WHAT FILM CREWS DO ABOUT IT</text>
<text x="470" y="300" class="xs muted" text-anchor="start">A 1/8 scale model runs √8 = 2.8284× too fast,</text>
<text x="470" y="318" class="xs muted" text-anchor="start">so the camera is overcranked to 67.9 fps and</text>
<text x="470" y="336" class="xs muted" text-anchor="start">played back at 24. Same equation, other trade.</text>
<text x="470" y="364" class="xs" text-anchor="start">Rescaling g by 1/s fixes the fall exactly — and</text>
<text x="470" y="382" class="xs t-bad" text-anchor="start">carries no absolute tolerance with it (§8.4).</text>
</svg>
