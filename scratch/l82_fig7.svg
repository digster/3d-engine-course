<svg viewBox="0 0 900 400" role="img" aria-labelledby="l82f7-t l82f7-d">
  <title id="l82f7-t">The one-over-root-s law that relates a world's length scale to its clock</title>
  <desc id="l82f7-d">A dashed curve of one over the square root of s passes exactly through five measured points, crossing one when s is one. Beside it, the derivation from d equals half g t squared and the film-industry overcranking factor.</desc>
