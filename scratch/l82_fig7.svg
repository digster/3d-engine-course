<text x="206.66666666666666" y="320" class="xs mono muted" text-anchor="middle">2</text>
<line x1="280.0" y1="74" x2="280.0" y2="304" class="grid" stroke-width="0.8"/>
<text x="280.0" y="320" class="xs mono muted" text-anchor="middle">3</text>
