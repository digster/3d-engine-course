<svg viewBox="0 0 720 430" role="img" aria-labelledby="l63f4-t l63f4-d">
  <title id="l63f4-t">GGX against Beckmann: the tail</title>
  <desc id="l63f4-d">Both distributions at roughness alpha 0.3, on a log scale. They share a peak; GGX is lower near it and 456 times higher 45 degrees out, because a rational function has a power-law tail and an exponential does not.</desc>
