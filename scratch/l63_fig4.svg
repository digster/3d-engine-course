<rect x="24" y="336" width="672" height="80" rx="4" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="358" class="sm t-hi" text-anchor="middle">GGX is LOWER than Beckmann near the peak (0.71× at 20°) and 456× higher at 45°. The tail is paid for.</text>
<text x="360.0" y="380" class="xs muted" text-anchor="middle">Beckmann’s exponential is numerically zero by 60° (1.9e−13); GGX’s rational function has a power-law tail that never quite stops. Real</text>
<text x="360.0" y="396" class="xs muted" text-anchor="middle">surfaces have that glow around a highlight, which is why every engine now ships GGX.</text>
</svg>
