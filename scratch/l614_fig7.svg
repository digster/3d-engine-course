<svg viewBox="0 0 780 360" role="img" aria-labelledby="f614g-t f614g-d">
  <title id="f614g-t">The shape and cost of an MSAA frame</title>
  <desc id="f614g-d">A four-stage frame from the multisample scene pass through the resolve into the bloom and tonemap, with the matching requirements and costs listed below.</desc>
  <defs>
    <marker id="e-i-f614g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f614g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f614g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f614g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f614g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="390.0" y="22" class="sm" text-anchor="middle">What MSAA costs, and the two targets an MSAA frame needs</text>
<rect x="26.0" y="70" width="147.5" height="66" rx="4" fill="none" stroke="#e05c5c" stroke-width="1.3"/>
<text x="99.75" y="92" class="xs" text-anchor="middle">scene pass</text>
<text x="99.75" y="110" class="xs" text-anchor="middle">writes 4x target</text>
<text x="99.75" y="126" class="xs" text-anchor="middle">15.84 MB</text>
<rect x="219.5" y="70" width="147.5" height="66" rx="4" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="293.25" y="92" class="xs" text-anchor="middle">resolved target</text>
<text x="293.25" y="110" class="xs" text-anchor="middle">1x, sampleable</text>
<text x="293.25" y="126" class="xs" text-anchor="middle">3.96 MB</text>
<line x1="179.5" y1="103.0" x2="213.5" y2="103.0" class="ink" stroke-width="1.5" marker-end="url(#e-i-f614g)"/>
<rect x="413.0" y="70" width="147.5" height="66" rx="4" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="486.75" y="92" class="xs" text-anchor="middle">bloom (6.13)</text>
<text x="486.75" y="110" class="xs" text-anchor="middle">reads the RESOLVED</text>
<text x="486.75" y="126" class="xs" text-anchor="middle">one, never the 4x</text>
<line x1="373.0" y1="103.0" x2="407.0" y2="103.0" class="ink-soft" stroke-width="1.3" marker-end="url(#e-s-f614g)"/>
<rect x="606.5" y="70" width="147.5" height="66" rx="4" fill="none" stroke="#9b7ede" stroke-width="1.3"/>
<text x="680.25" y="92" class="xs" text-anchor="middle">tonemap</text>
<text x="680.25" y="110" class="xs" text-anchor="middle">to the display</text>
<line x1="566.5" y1="103.0" x2="600.5" y2="103.0" class="ink-soft" stroke-width="1.3" marker-end="url(#e-s-f614g)"/>
<text x="196.5" y="91.0" class="xs" text-anchor="middle">RESOLVE</text>
<rect x="48" y="176" width="340" height="96" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="218" y="196" class="xs" text-anchor="middle">THE THINGS THAT MUST MATCH</text>
<text x="218" y="214" class="xs" text-anchor="middle">colour target, depth target and EVERY</text>
<text x="218" y="230" class="xs" text-anchor="middle">pipeline share one sample count — a 4x</text>
<text x="218" y="246" class="xs" text-anchor="middle">colour target beside a 1x depth target</text>
<text x="218" y="262" class="xs" text-anchor="middle">is a pass that cannot be begun</text>
<rect x="400" y="176" width="330" height="96" rx="4" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="565" y="196" class="xs" text-anchor="middle">THE COSTS</text>
<text x="565" y="214" class="xs" text-anchor="middle">the 4x target is 4x the memory</text>
<text x="565" y="230" class="xs" text-anchor="middle">the pipeline count goes 13 -&gt; 22</text>
<text x="565" y="246" class="xs" text-anchor="middle">8x is UNSUPPORTED on this machine's</text>
<text x="565" y="262" class="xs" text-anchor="middle">float format — so the device is ASKED</text>
<text x="390.0" y="316" class="xs" text-anchor="middle">A multisample texture cannot be sampled AT ALL, which is why an MSAA frame needs two colour targets where a</text>
<text x="390.0" y="334" class="xs" text-anchor="middle">plain one needs one — and why 6.13's ownership rule needed no rewrite: the RESOLVED target is what crosses</text>
<text x="390.0" y="352" class="xs" text-anchor="middle">between stages, and the multisample one is an intermediate nothing downstream ever sees.</text>
</svg>
