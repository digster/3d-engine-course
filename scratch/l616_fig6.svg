<circle cx="493.2" cy="83.6" r="3.4" fill="#e05c5c"/>
<circle cx="582.0" cy="94.8" r="3.4" fill="#e05c5c"/>
<polyline points="138.0,70.6 226.8,72.5 315.6,73.0 404.4,92.4 493.2,178.5 582.0,285.3" fill="none" stroke="#5ac878" stroke-width="2.0"/>
<circle cx="138.0" cy="70.6" r="3.4" fill="#5ac878"/>
