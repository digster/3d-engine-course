<svg viewBox="0 0 720 436" role="img" aria-labelledby="f616f-t f616f-d">
  <title id="f616f-t">Frame time with and without culling, swept over cull rate</title>
  <desc id="f616f-d">Two curves against cull rate from zero to fifty per cent. Without culling the frame time barely changes; with culling it falls proportionally. At a cull rate of zero the culling curve is above the other one, by the cost of the test. The predicted break-even, the test cost divided by the work it skips, is 0.24 per cent - one object in 409 - and the empirical crossing lies between the zero and 0.4 per cent samples.</desc>
  <defs>
    <marker id="e-i-f616f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f616f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f616f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f616f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f616f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">Culling is not free, and the break-even is a cull RATE, not a scene size</text>
<line x1="96" y1="294" x2="624" y2="294" class="grid" stroke-width="1.2"/>
<line x1="96" y1="62" x2="96" y2="294" class="grid" stroke-width="1.2"/>
<line x1="96" y1="294.0" x2="624" y2="294.0" class="grid" stroke-width="0.7" stroke-dasharray="3 4"/>
<text x="86" y="298.0" class="xs" text-anchor="end">5.9</text>
<line x1="96" y1="236.0" x2="624" y2="236.0" class="grid" stroke-width="0.7" stroke-dasharray="3 4"/>
<text x="86" y="240.0" class="xs" text-anchor="end">7.5</text>
<line x1="96" y1="178.0" x2="624" y2="178.0" class="grid" stroke-width="0.7" stroke-dasharray="3 4"/>
<text x="86" y="182.0" class="xs" text-anchor="end">9.2</text>
<line x1="96" y1="120.0" x2="624" y2="120.0" class="grid" stroke-width="0.7" stroke-dasharray="3 4"/>
<text x="86" y="124.0" class="xs" text-anchor="end">10.8</text>
