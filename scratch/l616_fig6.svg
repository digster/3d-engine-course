<text x="138.0" y="312" class="xs" text-anchor="middle">0.0%</text>
<text x="226.8" y="312" class="xs" text-anchor="middle">0.4%</text>
<text x="315.6" y="312" class="xs" text-anchor="middle">1.2%</text>
