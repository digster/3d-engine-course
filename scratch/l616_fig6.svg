<text x="582.0" y="312" class="xs" text-anchor="middle">50.0%</text>
<text x="360.0" y="332" class="xs" text-anchor="middle">cull rate — what fraction of the draw list is off screen</text>
<circle cx="138.0" cy="70.6" r="8" fill="none" stroke="#f0961e" stroke-width="1.8"/>
<rect x="96" y="346" width="252" height="78" rx="3" fill="none" stroke="#f0961e" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="222" y="366" class="xs" text-anchor="middle">AT 0% CULLED, CULLING LOSES</text>
<text x="222" y="382" class="xs" text-anchor="middle">by 58 ns an object — which is</text>
<text x="222" y="398" class="xs" text-anchor="middle">exactly what the test costs. Nothing</text>
<text x="222" y="414" class="xs" text-anchor="middle">was skipped, so nothing was saved.</text>
<rect x="372" y="346" width="252" height="78" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="498" y="366" class="xs" text-anchor="middle">BREAK-EVEN = c / w</text>
<text x="498" y="382" class="xs" text-anchor="middle">58.3 ns / 23,821 ns = 0.24%</text>
<text x="498" y="398" class="xs" text-anchor="middle">one object in 409 — predicted first,</text>
<text x="498" y="414" class="xs" text-anchor="middle">then found between 0% and 0.4%.</text>
</svg>
