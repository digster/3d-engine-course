<text x="86" y="66.0" class="xs" text-anchor="end">12.5</text>
<text x="34" y="178.0" class="xs" text-anchor="middle">ms / frame</text>
<polyline points="138.0,71.6 226.8,71.6 315.6,70.8 404.4,73.8 493.2,83.6 582.0,94.8" fill="none" stroke="#e05c5c" stroke-width="2.0"/>
<circle cx="138.0" cy="71.6" r="3.4" fill="#e05c5c"/>
<circle cx="226.8" cy="71.6" r="3.4" fill="#e05c5c"/>
