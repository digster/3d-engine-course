<svg viewBox="0 0 900 400" role="img" aria-labelledby="l78f10-t l78f10-d">
  <title id="l78f10-t">Mixing cost against the audio deadline, on a logarithmic microsecond axis</title>
  <desc id="l78f10-d">Horizontal bars show 1 to 64 voices costing 1.03 to 29.76 microseconds, one log line costing 1.02 microseconds and a set_gain call 0.009, against a deadline marked at 10,666 microseconds. Tables give buffer size against latency and the counters from a run on a real device.</desc>
