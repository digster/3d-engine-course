<svg viewBox="0 0 680 360" role="img" aria-labelledby="f5-t f5-d">
  <title id="f5-t">Phong and Blinn at matched exponents, plotted against the angle from the mirror ray</title>
  <desc id="f5-d">A graph with the angle alpha from 0 to 130 degrees along the bottom and the fraction of light returned from 0 to 1 up the side. Two curves start together at 1.0 and fall away. The dashed Phong curve, cosine squared of alpha, reaches exactly zero at 90 degrees and stays there. The solid Blinn curve, cosine to the eighth of half alpha, tracks it closely near the peak, runs slightly above it through the middle, and is still at 0.063 at 90 degrees and 0.004 at 120 degrees, where Phong returns nothing at all. A dashed vertical line marks the 90-degree boundary.</desc>
