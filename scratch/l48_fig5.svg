  <text x="244" y="52" class="xs muted" text-anchor="end">exact &#215;255</text>
  <text x="314" y="52" class="xs muted" text-anchor="end">ours</text>
  <text x="398" y="52" class="xs muted" text-anchor="end">hardware</text>
