<svg viewBox="0 0 720 400" role="img" aria-labelledby="f48e-t f48e-d">
  <title id="f48e-t">Two implementations of the sRGB encode</title>
  <desc id="f48e-d">A sweep of linear values through engine::to_encoded and through the hardware's _SRGB render target. Everything above 0.006 agrees exactly; three probes in the darks differ by one code, because the sRGB curve's slope near zero is 12.92 and both sides are approximations of the same curve. This explains why every pixel of a flat untextured floor differs by one code in blue.</desc>
