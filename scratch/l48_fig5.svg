  <text x="244" y="201" class="xs mono muted" text-anchor="end">14.547</text>
  <text x="314" y="201" class="xs mono" text-anchor="end">15</text>
  <text x="398" y="201" class="xs mono" text-anchor="end">15</text>
  <rect x="34" y="207" width="378" height="19" class="fill-soft" stroke="none"/>
  <text x="148" y="220" class="xs mono muted" text-anchor="end">0.0047000</text>
  <text x="244" y="220" class="xs mono muted" text-anchor="end">14.804</text>
  <text x="314" y="220" class="xs mono" text-anchor="end">15</text>
  <text x="398" y="220" class="xs mono" text-anchor="end">15</text>
  <rect x="34" y="226" width="378" height="19" fill="#eb786e" fill-opacity="0.16" stroke="none"/>
  <text x="148" y="239" class="xs mono muted" text-anchor="end">0.0050000</text>
