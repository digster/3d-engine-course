  <rect x="34" y="283" width="378" height="19" class="fill-soft" stroke="none"/>
  <text x="148" y="296" class="xs mono muted" text-anchor="end">0.0451480</text>
  <text x="244" y="296" class="xs mono muted" text-anchor="end">59.974</text>
  <text x="314" y="296" class="xs mono" text-anchor="end">60</text>
  <text x="398" y="296" class="xs mono" text-anchor="end">60</text>
  <text x="148" y="315" class="xs mono muted" text-anchor="end">0.2000000</text>
  <text x="244" y="315" class="xs mono muted" text-anchor="end">123.555</text>
  <text x="314" y="315" class="xs mono" text-anchor="end">124</text>
  <text x="398" y="315" class="xs mono" text-anchor="end">124</text>
  <rect x="34" y="321" width="378" height="19" class="fill-soft" stroke="none"/>
  <text x="148" y="334" class="xs mono muted" text-anchor="end">0.5000000</text>
  <text x="244" y="334" class="xs mono muted" text-anchor="end">187.516</text>
  <text x="314" y="334" class="xs mono" text-anchor="end">188</text>
  <text x="398" y="334" class="xs mono" text-anchor="end">188</text>
  <text x="148" y="353" class="xs mono muted" text-anchor="end">1.0000000</text>
  <text x="244" y="353" class="xs mono muted" text-anchor="end">255.000</text>
  <text x="314" y="353" class="xs mono" text-anchor="end">255</text>
  <text x="398" y="353" class="xs mono" text-anchor="end">255</text>
  <text x="424" y="68" class="xs">Everything above linear 0.006 agrees</text>
  <text x="424" y="84" class="xs"><tspan class="t-ok">exactly</tspan>. Every disagreement is in</text>
  <text x="424" y="100" class="xs">the <tspan class="t-hi">darks</tspan>.</text>
  <text x="424" y="128" class="xs muted">The sRGB curve&#8217;s slope near zero is</text>
  <text x="424" y="144" class="xs muted">12.92, so a linear value crosses a code</text>
  <text x="424" y="160" class="xs muted">more than twelve times faster there than</text>
  <text x="424" y="176" class="xs muted">it does near white. Both sides approximate</text>
  <text x="424" y="192" class="xs muted">the same curve; neither is wrong.</text>
  <text x="424" y="224" class="xs">Which explains the untextured floor:</text>
  <text x="424" y="244" class="xs mono muted">one flat quad, one colour,</text>
  <text x="424" y="260" class="xs mono muted">blue = 0.0045186</text>
  <text x="424" y="284" class="xs">&#8212; and so <tspan class="t-bad">39,202 pixels</tspan>, 100% of</text>
  <text x="424" y="300" class="xs">them, differ by exactly one code.</text>
  <text x="424" y="328" class="xs muted">&#8220;100% of pixels differ&#8221; turns out to</text>
  <text x="424" y="344" class="xs muted">mean nothing at all.</text>
  <rect x="424" y="358" width="14" height="10" fill="#eb786e" fill-opacity="0.20"/>
  <text x="444" y="367" class="xs muted">rows where the two disagree</text>
  <text x="24" y="386" class="xs">So a per-pixel comparison across this boundary has a <tspan class="t-hi">floor of one code</tspan>, and the floor is worst in the shadows. Plan your assertions accordingly.</text>
</svg>
