  <text x="244" y="87" class="xs mono muted" text-anchor="end">3.295</text>
  <text x="314" y="87" class="xs mono" text-anchor="end">3</text>
  <text x="398" y="87" class="xs mono" text-anchor="end">3</text>
  <rect x="34" y="93" width="378" height="19" class="fill-soft" stroke="none"/>
  <text x="148" y="106" class="xs mono muted" text-anchor="end">0.0031308</text>
