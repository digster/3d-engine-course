<svg viewBox="0 0 980 420" role="img" aria-labelledby="f8-t f8-d">
  <title id="f8-t">The budget, and the honest limit of this solver</title>
  <desc id="f8-d">Left: a 2001-body scene costs 4.35 ms of a 16.67 ms frame awake and 1.32 ms asleep, with the solve 71% of the contact work. Right: the number of sweeps a tower of n crates needs in order to stand for twenty seconds, rising from two at n = 2 to more than sixty-four at n = 15, and the penetration a large mass ratio costs at the shipped eight.</desc>
  <defs>
    <marker id="e-i-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-green-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-red-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<text x="26" y="36" class="sm" text-anchor="start">A 2,001-body scene against a 16.67 ms frame</text>
<text x="30" y="70" class="xs mono" text-anchor="start">awake</text>
<rect x="30" y="78" width="420" height="26" rx="3" fill="none" stroke="#8f918a" stroke-width="1.0"/>
<rect x="30.0" y="78" width="3.4" height="26" fill="#5082e6" fill-opacity="0.75" stroke="#5082e6" stroke-width="1"/>
<rect x="33.4" y="78" width="28.2" height="26" fill="#f0961e" fill-opacity="0.75" stroke="#f0961e" stroke-width="1"/>
<rect x="61.5" y="78" width="78.2" height="26" fill="#e05c5c" fill-opacity="0.75" stroke="#e05c5c" stroke-width="1"/>
<text x="147.71860562788743" y="96" class="xs mono" text-anchor="start">4.35 ms  (26%)</text>
<text x="30" y="146" class="xs mono" text-anchor="start">settled and asleep</text>
<rect x="30" y="154" width="420" height="26" rx="3" fill="none" stroke="#8f918a" stroke-width="1.0"/>
<rect x="30.0" y="154" width="33.4" height="26" fill="#5ac878" fill-opacity="0.75" stroke="#5ac878" stroke-width="1"/>
<text x="71.36413271734565" y="172" class="xs mono" text-anchor="start">1.32 ms  (8%)</text>
<line x1="30.0" y1="234.0" x2="50.0" y2="234.0" stroke="#5082e6" stroke-width="2.4" fill="none"/>
<text x="58" y="238" class="xs" text-anchor="start">broadphase 0.134 ms</text>
<line x1="30.0" y1="251.0" x2="50.0" y2="251.0" stroke="#f0961e" stroke-width="2.4" fill="none"/>
<text x="58" y="255" class="xs" text-anchor="start">narrow phase 1.118 ms</text>
<line x1="30.0" y1="268.0" x2="50.0" y2="268.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="58" y="272" class="xs" text-anchor="start">solve 3.102 ms — 71% of the frame's contact work</text>
<line x1="30.0" y1="285.0" x2="50.0" y2="285.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="58" y="289" class="xs" text-anchor="start">the same scene asleep: 1.324 ms</text>
<text x="30" y="326" class="xs muted" text-anchor="start">Per iteration over 100 manifolds: 12.9 µs velocity, 5.9 µs position (46%),</text>
<text x="30" y="342" class="xs muted" text-anchor="start">on a fixed cost of 15.0 µs. Linear in the count to three figures.</text>
<text x="530" y="32" class="xs muted" text-anchor="start">How many sweeps a tower needs to stand for 20 s</text>
<text x="530" y="52" class="xs muted" text-anchor="start">tower of n crates</text>
<text x="834" y="52" class="xs muted" text-anchor="end">sweeps needed</text>
<text x="942" y="52" class="xs muted" text-anchor="end">drift there</text>
<line x1="530" y1="60.0" x2="948" y2="60.0" class="grid" stroke-width="1.0"/>
<text x="530" y="77.0" class="xs" text-anchor="start">2</text>
<text x="834" y="77.0" class="xs mono" text-anchor="end">2</text>
<text x="942" y="77.0" class="xs mono" text-anchor="end">3 mm</text>
<text x="530" y="94.0" class="xs" text-anchor="start">3</text>
<text x="834" y="94.0" class="xs mono" text-anchor="end">2</text>
<text x="942" y="94.0" class="xs mono" text-anchor="end">20 mm</text>
<text x="530" y="111.0" class="xs" text-anchor="start">5</text>
<text x="834" y="111.0" class="xs mono" text-anchor="end">4</text>
<text x="942" y="111.0" class="xs mono" text-anchor="end">106 mm</text>
<text x="530" y="128.0" class="xs" text-anchor="start">10</text>
<text x="834" y="128.0" class="xs mono" text-anchor="end">20</text>
<text x="942" y="128.0" class="xs mono" text-anchor="end">402 mm</text>
<text x="530" y="145.0" class="xs" text-anchor="start">15</text>
<text x="834" y="145.0" class="xs mono" text-anchor="end">more than 64</text>
<text x="942" y="145.0" class="xs mono" text-anchor="end">—</text>
<text x="530" y="162.0" class="xs" text-anchor="start">20</text>
<text x="834" y="162.0" class="xs mono" text-anchor="end">more than 64</text>
<text x="942" y="162.0" class="xs mono" text-anchor="end">—</text>
<text x="530" y="212" class="xs" text-anchor="start">The shipped default is EIGHT, which holds five and not ten.</text>
<text x="530" y="230" class="xs muted" text-anchor="start">A sweep carries information across ONE contact, so a chain</text>
<text x="530" y="246" class="xs muted" text-anchor="start">of n needs about n sweeps — and the cost is linear in the</text>
<text x="530" y="262" class="xs muted" text-anchor="start">count, so a tall stack is quadratic.</text>
<text x="530" y="308" class="xs muted" text-anchor="start">heavy on light, 8 sweeps</text>
<text x="842" y="308" class="xs muted" text-anchor="end">squashed</text>
<line x1="530" y1="316.0" x2="848" y2="316.0" class="grid" stroke-width="1.0"/>
<text x="530" y="333.0" class="xs" text-anchor="start">1:1 mass ratio</text>
<text x="842" y="333.0" class="xs mono" text-anchor="end">1.7 mm</text>
<text x="530" y="350.0" class="xs" text-anchor="start">10:1 mass ratio</text>
<text x="842" y="350.0" class="xs mono" text-anchor="end">51.3 mm</text>
<text x="530" y="367.0" class="xs" text-anchor="start">100:1 mass ratio</text>
<text x="842" y="367.0" class="xs mono" text-anchor="end">385.6 mm</text>
<text x="530" y="384.0" class="xs" text-anchor="start">1000:1 mass ratio</text>
<text x="842" y="384.0" class="xs mono" text-anchor="end">476.7 mm</text>
</svg>
