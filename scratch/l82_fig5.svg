<svg viewBox="0 0 900 480" role="img" aria-labelledby="l82f5-t l82f5-d">
  <title id="l82f5-t">Jump height at four frame rates, applied as an impulse and as a one-step force</title>
  <desc id="l82f5-d">Four bars on the left sit within six percent of each other around the one metre target. Four bars on the right, on the same logarithmic axis, run from 3.85 metres at 30 Hz down to 0.17 metres at 144 Hz.</desc>
  <defs>
    <marker id="e-i-l82f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l82f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l82f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l82f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l82f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="40" y="30" class="sm t-hi" text-anchor="start">THE SAME JUMP, FOUR MONITORS</text>
<text x="40" y="50" class="xs muted" text-anchor="start">70 kg, aiming at 1.00 m: v₀ = 4.4294 m/s, J = 310.06 N·s, and the force tuned at 60 Hz is 18,604 N for one step.</text>
<rect x="60" y="92" width="330" height="230" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="60" y="80" class="xs mono t-hi" text-anchor="start">add_impulse(J)</text>
<line x1="60" y1="322.0" x2="390" y2="322.0" class="grid" stroke-width="0.8"/>
<text x="52" y="326.0" class="xs mono muted" text-anchor="end">0.1</text>
<line x1="60" y1="268.12841794676746" x2="390" y2="268.12841794676746" class="grid" stroke-width="0.8"/>
<text x="52" y="272.12841794676746" class="xs mono muted" text-anchor="end">0.25</text>
<line x1="60" y1="227.37613931558917" x2="390" y2="227.37613931558917" class="grid" stroke-width="0.8"/>
<text x="52" y="231.37613931558917" class="xs mono muted" text-anchor="end">0.5</text>
<line x1="60" y1="186.62386068441083" x2="390" y2="186.62386068441083" class="grid" stroke-width="0.8"/>
<text x="52" y="190.62386068441083" class="xs mono muted" text-anchor="end">1</text>
<line x1="60" y1="145.87158205323252" x2="390" y2="145.87158205323252" class="grid" stroke-width="0.8"/>
<text x="52" y="149.87158205323252" class="xs mono muted" text-anchor="end">2</text>
<line x1="60" y1="105.11930342205417" x2="390" y2="105.11930342205417" class="grid" stroke-width="0.8"/>
<text x="52" y="109.11930342205417" class="xs mono muted" text-anchor="end">4</text>
<line x1="60" y1="186.62386068441083" x2="390" y2="186.62386068441083" class="ink-soft" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="83.1" y="191.0" width="36.3" height="131.0" fill="#5ac878" fill-opacity="0.45" stroke="#5ac878" stroke-width="1.2"/>
<text x="101.25" y="183.04877623605935" class="xs mono" text-anchor="middle">0.927</text>
<text x="101.25" y="338" class="xs mono muted" text-anchor="middle">30 Hz</text>
<rect x="165.6" y="188.8" width="36.3" height="133.2" fill="#5ac878" fill-opacity="0.45" stroke="#5ac878" stroke-width="1.2"/>
<text x="183.75" y="180.82826158041215" class="xs mono" text-anchor="middle">0.963</text>
<text x="183.75" y="338" class="xs mono muted" text-anchor="middle">60 Hz</text>
<rect x="248.1" y="187.7" width="36.3" height="134.3" fill="#5ac878" fill-opacity="0.45" stroke="#5ac878" stroke-width="1.2"/>
<text x="266.25" y="179.71573020530153" class="xs mono" text-anchor="middle">0.982</text>
<text x="266.25" y="338" class="xs mono muted" text-anchor="middle">120 Hz</text>
<rect x="330.6" y="187.5" width="36.3" height="134.5" fill="#5ac878" fill-opacity="0.45" stroke="#5ac878" stroke-width="1.2"/>
<text x="348.75" y="179.53631868284168" class="xs mono" text-anchor="middle">0.985</text>
<text x="348.75" y="338" class="xs mono muted" text-anchor="middle">144 Hz</text>
<text x="225.0" y="358" class="xs muted" text-anchor="middle">peak height, metres, log axis</text>
<rect x="470" y="92" width="330" height="230" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="470" y="80" class="xs mono t-hi" text-anchor="start">add_force(J/h) for one step</text>
<line x1="470" y1="322.0" x2="800" y2="322.0" class="grid" stroke-width="0.8"/>
<text x="462" y="326.0" class="xs mono muted" text-anchor="end">0.1</text>
<line x1="470" y1="268.12841794676746" x2="800" y2="268.12841794676746" class="grid" stroke-width="0.8"/>
<text x="462" y="272.12841794676746" class="xs mono muted" text-anchor="end">0.25</text>
<line x1="470" y1="227.37613931558917" x2="800" y2="227.37613931558917" class="grid" stroke-width="0.8"/>
<text x="462" y="231.37613931558917" class="xs mono muted" text-anchor="end">0.5</text>
<line x1="470" y1="186.62386068441083" x2="800" y2="186.62386068441083" class="grid" stroke-width="0.8"/>
<text x="462" y="190.62386068441083" class="xs mono muted" text-anchor="end">1</text>
<line x1="470" y1="145.87158205323252" x2="800" y2="145.87158205323252" class="grid" stroke-width="0.8"/>
<text x="462" y="149.87158205323252" class="xs mono muted" text-anchor="end">2</text>
<line x1="470" y1="105.11930342205417" x2="800" y2="105.11930342205417" class="grid" stroke-width="0.8"/>
<text x="462" y="109.11930342205417" class="xs mono muted" text-anchor="end">4</text>
<line x1="470" y1="186.62386068441083" x2="800" y2="186.62386068441083" class="ink-soft" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="493.1" y="107.3" width="36.3" height="214.7" fill="#e05c5c" fill-opacity="0.45" stroke="#e05c5c" stroke-width="1.2"/>
<text x="511.25" y="99.32370431805549" class="xs mono" text-anchor="middle">3.853</text>
<text x="511.25" y="338" class="xs mono muted" text-anchor="middle">30 Hz</text>
<rect x="575.6" y="188.8" width="36.3" height="133.2" fill="#e05c5c" fill-opacity="0.45" stroke="#e05c5c" stroke-width="1.2"/>
<text x="593.75" y="180.82826158041215" class="xs mono" text-anchor="middle">0.963</text>
<text x="593.75" y="338" class="xs mono muted" text-anchor="middle">60 Hz</text>
<rect x="658.1" y="270.3" width="36.3" height="51.7" fill="#e05c5c" fill-opacity="0.45" stroke="#e05c5c" stroke-width="1.2"/>
<text x="676.25" y="262.3328188427688" class="xs mono" text-anchor="middle">0.241</text>
<text x="676.25" y="338" class="xs mono muted" text-anchor="middle">120 Hz</text>
<rect x="740.6" y="291.8" width="36.3" height="30.2" fill="#e05c5c" fill-opacity="0.45" stroke="#e05c5c" stroke-width="1.2"/>
<text x="758.75" y="283.7791351921157" class="xs mono" text-anchor="middle">0.167</text>
<text x="758.75" y="338" class="xs mono muted" text-anchor="middle">144 Hz</text>
<text x="635.0" y="358" class="xs muted" text-anchor="middle">peak height, metres, log axis</text>
<text x="60" y="392" class="sm t-ok" text-anchor="start">spread 6.16%</text>
<text x="60" y="412" class="xs muted" text-anchor="start">…and the residue is 8.1's, not this lesson's:</text>
<text x="60" y="430" class="xs muted" text-anchor="start">semi-implicit Euler's peak is v₀²/2g − v₀h/2, predicted</text>
<text x="60" y="448" class="xs mono muted" text-anchor="start">0.926176 and measured 0.927527 at 30 Hz.</text>
<text x="470" y="392" class="sm t-bad" text-anchor="start">spread 23.0×</text>
<text x="470" y="412" class="xs muted" text-anchor="start">Δv = F·h/m, so the height goes as h². Halve the</text>
<text x="470" y="430" class="xs muted" text-anchor="start">frame time and the character jumps a quarter as</text>
<text x="470" y="448" class="xs muted" text-anchor="start">high. An impulse has no h in it at all.</text>
</svg>
