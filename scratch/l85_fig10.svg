<text x="756" y="90" class="xs t-hi" text-anchor="end">margin / (tol × side) = 2.110…2.112</text>
<text x="20" y="366" class="xs" text-anchor="start">THE PROOF goes first, at about 4.77e-03 m for these shapes: the termination threshold falls as the gap SQUARED while its</text>
<text x="20" y="384" class="xs" text-anchor="start">rounding error falls only as the gap, so below ε·|w|/tol the test is noise against noise. The ANSWER is still right; the certificate is gone.</text>
<text x="20" y="402" class="xs" text-anchor="start">THE ANSWER goes second, at tol × |w| — a contact margin, and a deliberate one. 8.4 §11 found the same wall measured from the WORLD ORIGIN.</text>
</svg>
