<svg viewBox="0 0 900 424" role="img" aria-labelledby="l85f10-t l85f10-d">
  <title id="l85f10-t">GJK's resolution floor: the certificate fails before the answer does, and the contact margin scales with the shapes.</title>
  <desc id="l85f10-d">Left, a table of two turned two-metre cubes walked from one metre apart to one micrometre, giving the reported distance, the certificate slack and the status; below three ten-thousandths of a metre the status becomes intersecting. Right, a log-log plot of the measured contact margin against cube side over four decades, a straight line whose ratio to tolerance times side is 2.11 throughout.</desc>
  <defs>
    <marker id="e-i-l85f10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l85f10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
