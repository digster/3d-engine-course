<text x="830" y="93.0" class="xs mono" text-anchor="end">0.3182939</text>
<text x="540" y="110.0" class="xs" text-anchor="start">velocity Verlet</text>
<text x="830" y="110.0" class="xs mono" text-anchor="end">0.3183099</text>
<text x="540" y="127.0" class="xs" text-anchor="start">2 / ω</text>
<text x="830" y="127.0" class="xs mono" text-anchor="end">0.3183099</text>
<text x="540" y="144.0" class="xs" text-anchor="start">explicit Euler</text>
<text x="830" y="144.0" class="xs mono" text-anchor="end">none</text>
<text x="540" y="174.5" class="xs muted" text-anchor="start">Read it the other way round, which is how</text>
<text x="540" y="190.5" class="xs muted" text-anchor="start">it is used. At 60 Hz with a safety factor</text>
<text x="540" y="206.5" class="xs muted" text-anchor="start">of five, hω ≤ 0.4 admits ω ≤ 24 rad/s:</text>
<text x="540" y="222.5" class="xs mono t-hi" text-anchor="start">a spring of about 3.8 Hz.</text>
<text x="540" y="250.5" class="xs" text-anchor="start">A real contact is hundreds of Hz. That is</text>
<text x="540" y="266.5" class="xs" text-anchor="start">why contacts are not springs in this</text>
<text x="540" y="282.5" class="xs" text-anchor="start">module — they are constraints, and 8.10</text>
<text x="540" y="298.5" class="xs" text-anchor="start">is where that bill comes due.</text>
