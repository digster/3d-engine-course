<svg viewBox="0 0 900 400" role="img" aria-labelledby="l81f7-t l81f7-d">
  <title id="l81f7-t">Worst energy excursion against h times omega, with the stability wall at 2</title>
  <desc id="l81f7-d">The measured excursions land on the predicted curve one over one minus h omega over two, which rises without bound as h omega approaches 2. Everything left of the wall is stable and only the left fifth of it is usable.</desc>
