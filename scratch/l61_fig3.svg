<polyline points="80.0,306.0 83.0,285.2 86.0,277.5 89.0,271.7 92.0,266.9 95.0,262.7 98.0,259.0 101.0,255.6 104.0,252.4 107.0,249.5 110.0,246.7 113.0,244.1 116.0,241.6 119.0,239.2 122.0,236.9 125.0,234.7 128.0,232.6 131.0,230.5 134.0,228.5 137.0,226.6 140.0,224.7 143.0,222.9 146.0,221.1 149.0,219.4 152.0,217.7 155.0,216.0 158.0,214.4 161.0,212.8 164.0,211.3 167.0,209.8 170.0,208.3 173.0,206.8 176.0,205.4 179.0,203.9 182.0,202.5 185.0,201.2 188.0,199.8 191.0,198.5 194.0,197.2 197.0,195.9 200.0,194.6 203.0,193.3 206.0,192.1 209.0,190.9 212.0,189.7 215.0,188.5 218.0,187.3 221.0,186.1 224.0,185.0 227.0,183.8 230.0,182.7 233.0,181.6 236.0,180.5 239.0,179.4 242.0,178.3 245.0,177.3 248.0,176.2 251.0,175.1 254.0,174.1 257.0,173.1 260.0,172.1 263.0,171.1 266.0,170.1 269.0,169.1 272.0,168.1 275.0,167.1 278.0,166.1 281.0,165.2 284.0,164.2 287.0,163.3 290.0,162.3 293.0,161.4 296.0,160.5 299.0,159.6 302.0,158.7 305.0,157.8 308.0,156.9 311.0,156.0 314.0,155.1 317.0,154.2 320.0,153.4 323.0,152.5 326.0,151.6 329.0,150.8 332.0,149.9 335.0,149.1 338.0,148.3 341.0,147.4 344.0,146.6 347.0,145.8 350.0,145.0 353.0,144.1 356.0,143.3 359.0,142.5 362.0,141.7 365.0,141.0 368.0,140.2 371.0,139.4 374.0,138.6 377.0,137.8 380.0,137.1" fill="none" stroke="#e05c5c" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="126.96199999999999" y1="56" x2="126.96199999999999" y2="306" class="ink-soft" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="126.96199999999999" y="48" class="xs mono" text-anchor="middle">0.0031308</text>
<text x="206.0" y="236.0" class="xs mono" text-anchor="middle">12.92 x</text>
<text x="296.0" y="131.0" class="xs mono" text-anchor="middle">1.055 x^(1/2.4) - 0.055</text>
<text x="260.0" y="71.0" class="xs t-bad" text-anchor="middle">pow(x, 1/2.2)</text>
<text x="426" y="76" class="xs t-hi" text-anchor="start">WHY A STRAIGHT PIECE AT ALL</text>
<text x="426" y="96" class="xs muted" text-anchor="start">The slope of x^(1/2.4) at zero is</text>
<text x="426" y="112" class="xs muted" text-anchor="start">INFINITE. A curve with infinite</text>
<text x="426" y="128" class="xs muted" text-anchor="start">gain at the origin turns sensor</text>
<text x="426" y="144" class="xs muted" text-anchor="start">noise into visible banding and</text>
<text x="426" y="160" class="xs muted" text-anchor="start">cannot be inverted stably.</text>
<text x="426" y="184" class="xs muted" text-anchor="start">So the definition replaces it with</text>
<text x="426" y="200" class="xs muted" text-anchor="start">a line of slope 12.92, and picks</text>
<text x="426" y="216" class="xs muted" text-anchor="start">the join so the two pieces meet.</text>
<text x="426" y="250" class="xs t-bad" text-anchor="start">AND THE COST OF SKIPPING IT</text>
<text x="426" y="270" class="xs muted" text-anchor="start">pow(x, 1/2.2) is off by up to</text>
<text x="426" y="286" class="xs muted" text-anchor="start">8 codes, worst near linear 0.0010.</text>
<text x="426" y="302" class="xs muted" text-anchor="start">Close in the midtones; wrong</text>
<text x="426" y="318" class="xs muted" text-anchor="start">exactly where the toe is.</text>
<line x1="24" y1="344" x2="696" y2="344" class="grid" stroke-width="1.2"/>
<text x="24" y="366" class="xs mono" text-anchor="start">encode(x) = 12.92 x                       for x &lt;= 0.0031308</text>
<text x="24" y="384" class="xs mono" text-anchor="start">          = 1.055 x^(1/2.4) - 0.055       otherwise</text>
<text x="24" y="408" class="xs t-hi" text-anchor="start">Four constants, and all four matter. Two implementations that disagree about any of them differ by a code somewhere.</text>
</svg>
