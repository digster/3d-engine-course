<svg viewBox="0 0 720 420" role="img" aria-labelledby="l61f3-t l61f3-d">
  <title id="l61f3-t">The sRGB encoding curve near zero, showing the linear toe</title>
  <desc id="l61f3-d">A zoomed plot over linear 0 to 0.02. The sRGB curve is a straight line of slope 12.92 below linear 0.0031308 and a shifted power above it. A pow(x, 1/2.2) approximation departs from it sharply near zero.</desc>
  <defs>
    <marker id="e-i-l61f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l61f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l61f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l61f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l61f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">The definition is piecewise, and the small straight piece is the part people leave out.</text>
<line x1="80" y1="306" x2="380" y2="306" class="grid" stroke-width="1.2"/>
<line x1="80" y1="56" x2="80" y2="306" class="grid" stroke-width="1.2"/>
<text x="230.0" y="338" class="xs muted" text-anchor="middle">linear light (0 to 0.02)</text>
<text x="24" y="48" class="xs muted" text-anchor="start">encoded</text>
