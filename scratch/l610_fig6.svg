<svg viewBox="0 0 720 310" role="img" aria-labelledby="f610f-t f610f-d">
  <title id="f610f-t">Isotropic against anisotropic filtering</title>
  <desc id="f610f-d">A long thin elliptical footprint, 32 texels by 2. On the left an isotropic square containing it selects level 5 from the long axis and blurs the short axis by 16 times. On the right, anisotropic filtering selects level 1 from the short axis and takes eight samples along the long one.</desc>
  <defs>
    <marker id="e-i-f610f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f610f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f610f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f610f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f610f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">A footprint that is not square</text>
<ellipse cx="200" cy="130" rx="96" ry="12" fill="#5082e6" stroke="#5082e6" fill-opacity="0.35" stroke-width="1.4"/>
<text x="200" y="100" class="xs" text-anchor="middle">what the pixel covers: 32 texels by 2</text>
<rect x="104" y="34" width="192" height="192" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="200" y="246" class="xs" text-anchor="middle">isotropic: level 5, from the LONG axis</text>
<text x="200" y="264" class="xs" text-anchor="middle">the short axis is blurred 16x</text>
<ellipse cx="520" cy="130" rx="96" ry="12" fill="#5082e6" stroke="#5082e6" fill-opacity="0.35" stroke-width="1.4"/>
<circle cx="436" cy="130" r="11" fill="none" stroke="#5ac878" stroke-width="1.4"/>
<circle cx="460" cy="130" r="11" fill="none" stroke="#5ac878" stroke-width="1.4"/>
<circle cx="484" cy="130" r="11" fill="none" stroke="#5ac878" stroke-width="1.4"/>
<circle cx="508" cy="130" r="11" fill="none" stroke="#5ac878" stroke-width="1.4"/>
<circle cx="532" cy="130" r="11" fill="none" stroke="#5ac878" stroke-width="1.4"/>
<circle cx="556" cy="130" r="11" fill="none" stroke="#5ac878" stroke-width="1.4"/>
<circle cx="580" cy="130" r="11" fill="none" stroke="#5ac878" stroke-width="1.4"/>
<circle cx="604" cy="130" r="11" fill="none" stroke="#5ac878" stroke-width="1.4"/>
<text x="520" y="246" class="xs" text-anchor="middle">anisotropic: level 1, from the SHORT axis</text>
<text x="520" y="264" class="xs" text-anchor="middle">several taps ALONG the long one</text>
<text x="360.0" y="282" class="xs" text-anchor="middle">isotropic must choose: the long axis blurs, the short axis aliases. Anisotropy refuses.</text>
<text x="360.0" y="302" class="xs" text-anchor="middle">and on a SQUARE footprint it costs nothing — measured identical to six decimals</text>
</svg>
