<svg viewBox="0 0 720 400" role="img" aria-labelledby="f616b-t f616b-d">
  <title id="f616b-t">Frustum planes from the rows of the view-projection matrix</title>
  <desc id="f616b-d">Left: a frustum seen from above, with the eye at the apex and the four side planes meeting there, so the eye's distance to each is zero. Right: a table of the six clip-space inequalities, the row combination each becomes, and which plane it is. The near plane is row 2 alone under SDL_GPU's zero-to-w depth range; the far plane is a difference of near-equal rows and loses precision.</desc>
  <defs>
    <marker id="e-i-f616b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f616b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f616b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f616b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f616b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">The six inequalities that define the clip volume, and the six rows that answer them</text>
<text x="128" y="48" class="xs" text-anchor="middle">SEEN FROM ABOVE</text>
<line x1="128.0" y1="300.0" x2="6.8" y2="90.0" stroke="#5082e6" stroke-width="1.6" fill="none"/>
<line x1="128.0" y1="300.0" x2="249.2" y2="90.0" stroke="#5082e6" stroke-width="1.6" fill="none"/>
<line x1="94.1" y1="241.2" x2="161.9" y2="241.2" stroke="#5ac878" stroke-width="1.6" fill="none"/>
<line x1="6.8" y1="90.0" x2="249.2" y2="90.0" stroke="#f0961e" stroke-width="1.6" fill="none"/>
<circle cx="128" cy="300" r="4" fill="#e05c5c"/>
<text x="128" y="318" class="xs" text-anchor="middle">eye</text>
<text x="68.05180417165002" y="245.2" class="xs" text-anchor="end">near</text>
<text x="0.756443470178624" y="80" class="xs" text-anchor="start">far</text>
<text x="36.756443470178624" y="229.0" class="xs" text-anchor="middle">left</text>
<text x="219.24355652982138" y="229.0" class="xs" text-anchor="middle">right</text>
<rect x="22" y="330" width="212" height="48" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="128" y="348" class="xs" text-anchor="middle">THE EYE IS THE APEX, so its</text>
<text x="128" y="364" class="xs" text-anchor="middle">distance to all four side planes is 0</text>
<text x="520" y="48" class="xs" text-anchor="middle">THE ROW COMBINATIONS</text>
<text x="340" y="72" class="xs" text-anchor="start">inside when</text>
<text x="472" y="72" class="xs" text-anchor="start">plane</text>
<text x="558" y="72" class="xs" text-anchor="start">why</text>
<line x1="334" y1="80" x2="698" y2="80" class="grid" stroke-width="1.0"/>
<text x="340" y="102" class="xs" text-anchor="start">x ≥ −w</text>
<text x="472" y="102" class="xs" text-anchor="start">row0 + row3</text>
<text x="558" y="102" class="xs" text-anchor="start">left</text>
<text x="340" y="132" class="xs" text-anchor="start">x ≤ +w</text>
<text x="472" y="132" class="xs" text-anchor="start">row3 − row0</text>
<text x="558" y="132" class="xs" text-anchor="start">right</text>
<text x="340" y="162" class="xs" text-anchor="start">y ≥ −w</text>
<text x="472" y="162" class="xs" text-anchor="start">row1 + row3</text>
<text x="558" y="162" class="xs" text-anchor="start">bottom</text>
<text x="340" y="192" class="xs" text-anchor="start">y ≤ +w</text>
<text x="472" y="192" class="xs" text-anchor="start">row3 − row1</text>
<text x="558" y="192" class="xs" text-anchor="start">top</text>
<text x="340" y="222" class="xs" text-anchor="start">z ≥ 0</text>
<text x="472" y="222" class="xs" text-anchor="start">row2</text>
<text x="558" y="222" class="xs" text-anchor="start">near — SDL_GPU, not OpenGL</text>
<line x1="334" y1="230" x2="698" y2="230" class="grid" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="340" y="252" class="xs" text-anchor="start">z ≤ +w</text>
<text x="472" y="252" class="xs" text-anchor="start">row3 − row2</text>
<text x="558" y="252" class="xs" text-anchor="start">far — and it cancels</text>
<line x1="334" y1="260" x2="698" y2="260" class="grid" stroke-width="0.8" stroke-dasharray="3 3"/>
<rect x="332" y="292" width="372" height="44" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="518" y="310" class="xs" text-anchor="middle">row2 ALONE has no subtraction, so no cancellation:</text>
<text x="518" y="326" class="xs" text-anchor="middle">the near plane is accurate to 3.0e-07</text>
<rect x="332" y="344" width="372" height="44" rx="3" fill="none" stroke="#f0961e" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="518" y="362" class="xs" text-anchor="middle">row3 − row2 subtracts near-equal rows:</text>
<text x="518" y="378" class="xs" text-anchor="middle">the far plane is off by 1.4e-03 — 4557x worse</text>
</svg>
