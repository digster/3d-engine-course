  <text x="592.0" y="250.0" class="xs mono t-hi" text-anchor="end">worst |error| = 0.0000447 = 0.0114 of an 8-bit code</text>
  <text x="76.0" y="334.0" class="xs muted">It CROSSES ZERO repeatedly &#8212; that is what a minimax fit looks like, and it is why the error is a wobble rather than a bias.</text>
  <text x="76.0" y="348.0" class="xs muted">The single tallest excursion is at the left, exactly at the toe boundary: the hardest point on the curve is the one</text>
  <text x="76.0" y="362.0" class="xs muted">where a fit made of square roots has to meet a straight line.</text>
