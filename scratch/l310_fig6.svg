<svg viewBox="0 0 640 372" role="img" aria-labelledby="f3105-t f3105-d">
  <title id="f3105-t">The sRGB curve, the four-term fit, and the gap between them</title>
  <desc id="f3105-d">The exact sRGB transfer function drawn as a thick line with the fitted approximation dashed over it; at this scale the two are indistinguishable across the whole range. A vertical marker at x = 0.0031308 shows where the exact linear toe is kept rather than fitted. Below, the difference between the two curves multiplied by two thousand: it oscillates about zero with several crossings and a worst magnitude of 0.0000451, which is 0.0115 of one 8-bit code.</desc>
