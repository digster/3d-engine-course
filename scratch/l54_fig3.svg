<svg viewBox="0 0 720 340" role="img" aria-labelledby="l54f3-t l54f3-d">
  <title id="l54f3-t">The 32-bit handle layout and the wrap-time arithmetic</title>
  <desc id="l54f3-d">A 32-bit word divided into a 12-bit generation field and a 20-bit index field, with the slot count, the usable generation count, and a table of times until one slot's generation repeats at four different recycle rates.</desc>
  <defs>
    <marker id="e-i-l54f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l54f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l54f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l54f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l54f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">One 32-bit word, split 20 / 12 — and the arithmetic that chose the split.</text>
<rect x="40" y="52" width="240.0" height="40" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="280.0" y="52" width="400.0" height="40" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.18"/>
<text x="160.0" y="77" class="sm" text-anchor="middle">generation (12 bits)</text>
<text x="480.0" y="77" class="sm" text-anchor="middle">index (20 bits)</text>
<text x="40" y="46" class="xs muted" text-anchor="start">bit 31</text>
<text x="280.0" y="46" class="xs muted" text-anchor="middle">bit 19</text>
<text x="680" y="46" class="xs muted" text-anchor="end">bit 0</text>
<text x="160.0" y="110" class="xs t-hi" text-anchor="middle">which occupant</text>
<text x="480.0" y="110" class="xs t-hi" text-anchor="middle">which slot</text>
<line x1="40" y1="128" x2="680" y2="128" class="grid" stroke-width="1.0"/>
<text x="40" y="150" class="sm mono" text-anchor="start">20 index bits</text>
<text x="200" y="150" class="sm" text-anchor="start">= 1,048,576 slots</text>
<text x="400" y="150" class="xs muted" text-anchor="start">a million meshes; something else breaks first</text>
<text x="40" y="176" class="sm mono" text-anchor="start">12 generation bits</text>
<text x="200" y="176" class="sm" text-anchor="start">= 4,095 usable</text>
<text x="400" y="176" class="xs muted" text-anchor="start">generation 0 is reserved, so the null handle is free</text>
<line x1="40" y1="194" x2="680" y2="194" class="grid" stroke-width="1.0" stroke-dasharray="2 3"/>
<text x="40" y="216" class="xs t-hi" text-anchor="start">TIME UNTIL ONE SLOT'S GENERATION REPEATS, at a given recycle rate for that slot:</text>
<text x="56" y="240" class="xs" text-anchor="start">once a frame, 60 Hz</text>
<text x="240" y="240" class="xs mono muted" text-anchor="start">4,095 / 60</text>
<rect x="340" y="229" width="92" height="16" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.18"/>
<text x="386" y="240" class="xs" text-anchor="middle">68 seconds</text>
<text x="56" y="260" class="xs" text-anchor="start">100 times a second</text>
<text x="240" y="260" class="xs mono muted" text-anchor="start">4,095 / 100</text>
<rect x="340" y="249" width="92" height="16" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.18"/>
<text x="386" y="260" class="xs" text-anchor="middle">41 seconds</text>
<text x="56" y="280" class="xs" text-anchor="start">once a second</text>
<text x="240" y="280" class="xs mono muted" text-anchor="start">4,095 / 1</text>
<rect x="340" y="269" width="92" height="16" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.18"/>
<text x="386" y="280" class="xs" text-anchor="middle">68 minutes</text>
<text x="56" y="300" class="xs" text-anchor="start">once a level load</text>
<text x="240" y="300" class="xs mono muted" text-anchor="start">4,095 / 0.01</text>
<rect x="340" y="289" width="92" height="16" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.18"/>
<text x="386" y="300" class="xs" text-anchor="middle">4.7 days</text>
<text x="452" y="240" class="xs" text-anchor="start">So for ASSETS — loaded at level</text>
<text x="452" y="256" class="xs" text-anchor="start">boundaries, counted in hundreds —</text>
<text x="452" y="272" class="xs" text-anchor="start">12 bits is enormous. For ENTITIES</text>
<text x="452" y="288" class="xs" text-anchor="start">it is worth measuring, and pool</text>
<text x="452" y="304" class="xs" text-anchor="start">counts its wraps for exactly that.</text>
<text x="40" y="326" class="xs muted" text-anchor="start">The alternative — 64 bits split 32/32 — makes wrap unreachable and doubles every handle in every component.</text>
</svg>
