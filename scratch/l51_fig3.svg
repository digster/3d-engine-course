<svg viewBox="0 0 720 348" role="img" aria-labelledby="l51f3-t l51f3-d">
  <title id="l51f3-t">Dependency direction</title>
  <desc id="l51f3-d">A four-level graph: demos above demo_common above engine above SDL3, with stb_image private to the engine and an upward arrow crossed out.</desc>
  <defs>
    <marker id="e-i-l51f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l51f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l51f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
<text x="20" y="20" class="sm">Every arrow points DOWN, and that is the whole rule</text>
<rect x="40" y="56" width="120" height="34" rx="4" fill="#5ac878" fill-opacity="0.20" stroke="#5ac878" stroke-width="1.2"/>
<text x="100.0" y="78" class="sm mono" text-anchor="middle">sandbox</text>
<rect x="180" y="56" width="150" height="34" rx="4" fill="#5ac878" fill-opacity="0.20" stroke="#5ac878" stroke-width="1.2"/>
<text x="255.0" y="78" class="sm mono" text-anchor="middle">scratch/verify_50</text>
<rect x="360" y="56" width="120" height="34" rx="4" fill="#5ac878" fill-opacity="0.20" stroke="#5ac878" stroke-width="1.2"/>
<text x="420.0" y="78" class="sm mono" text-anchor="middle">hello_cube</text>
<rect x="80" y="124" width="200" height="34" rx="4" fill="#5ac878" fill-opacity="0.20" stroke="#5ac878" stroke-width="1.2"/>
<text x="180.0" y="146" class="sm mono" text-anchor="middle">demo_common</text>
<rect x="140" y="192" width="240" height="34" rx="4" fill="#5082e6" fill-opacity="0.20" stroke="#5082e6" stroke-width="1.2"/>
<text x="260.0" y="214" class="sm mono" text-anchor="middle">engine::engine</text>
<rect x="160" y="260" width="200" height="34" rx="4" fill="#5acdd7" fill-opacity="0.20" stroke="#5acdd7" stroke-width="1.2"/>
<text x="260.0" y="282" class="sm mono" text-anchor="middle">SDL3::SDL3</text>
<line x1="100.0" y1="90.0" x2="180.0" y2="120.0" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l51f3)"/>
<line x1="255.0" y1="90.0" x2="180.0" y2="120.0" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l51f3)"/>
<line x1="420.0" y1="90.0" x2="260.0" y2="188.0" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l51f3)"/>
<line x1="180.0" y1="158.0" x2="260.0" y2="188.0" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l51f3)"/>
<line x1="260.0" y1="226.0" x2="260.0" y2="256.0" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l51f3)"/>
<rect x="520" y="192" width="140" height="34" rx="4" fill="#f0961e" fill-opacity="0.18" stroke="#f0961e" stroke-width="1" stroke-dasharray="4 3"/>
<text x="590" y="214" class="sm mono" text-anchor="middle">stb_image</text>
<line x1="518" y1="209" x2="384" y2="209" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l51f3)"/>
<text x="520" y="242" class="xs muted">PRIVATE: it stops here.</text>
<text x="520" y="256" class="xs muted">No demo can see it.</text>
<path d="M124 190 L124 162" fill="none" stroke="#eb786e" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="116" y1="168" x2="132" y2="184" stroke="#eb786e" stroke-width="2"/>
<line x1="132" y1="168" x2="116" y2="184" stroke="#eb786e" stroke-width="2"/>
<text x="20" y="172" class="xs t-bad">the engine</text>
<text x="20" y="186" class="xs t-bad">needing a demo</text>
<line x1="20" y1="300" x2="700" y2="300" class="grid" stroke-width="1"/>
<text x="20" y="318" class="xs">CMake enforces it by ORDER: <tspan class="mono">add_subdirectory(engine)</tspan> comes first, so when demos/ asks for <tspan class="mono">engine::engine</tspan> the target exists.</text>
<text x="20" y="334" class="xs muted">Swap the two lines and the configure fails. A build system enforcing an architecture rule is the cheapest enforcement there is.</text>
</svg>
