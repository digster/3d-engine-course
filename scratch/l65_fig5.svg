<svg viewBox="0 0 720 320" role="img" aria-labelledby="l65f5-t l65f5-d">
  <title id="l65f5-t">Why closed did not move onto the material</title>
  <desc id="l65f5-d">The mesh reports whether it is closed, counted from its own edges by validate. The caller supplies the intent, because a closed mesh may still be drawn two-sided deliberately. cull_of combines the two, and is the single place the rule that culling is only valid on closed geometry is written down.</desc>
  <defs>
    <marker id="e-i-l65f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l65f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l65f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l65f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l65f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="0" y="0" width="720" height="320" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="28" class="lg" text-anchor="middle">A fact about the mesh is not a decision about the draw</text>
<rect x="56" y="62" width="266" height="158" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="56" y="62" width="266" height="158" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="189" y="86" class="sm" text-anchor="middle">THE MESH</text>
<text x="189" y="104" class="xs" text-anchor="middle">mesh_report::closed()</text>
<line x1="76" y1="114" x2="302" y2="114" class="grid" stroke-width="1.0"/>
<text x="189" y="136" class="xs" text-anchor="middle">counted from edges</text>
<text x="189" y="154" class="xs" text-anchor="middle">“no rim, no non-manifold</text>
<text x="189" y="172" class="xs" text-anchor="middle">junctions”</text>
<text x="189" y="190" class="xs" text-anchor="middle">a cube: TRUE</text>
<text x="189" y="208" class="xs" text-anchor="middle">a quad: FALSE</text>
<rect x="398" y="62" width="266" height="158" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="398" y="62" width="266" height="158" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="531" y="86" class="sm" text-anchor="middle">THE CALLER</text>
<text x="531" y="104" class="xs" text-anchor="middle">scene_object::closed</text>
<line x1="418" y1="114" x2="644" y2="114" class="grid" stroke-width="1.0"/>
<text x="531" y="136" class="xs" text-anchor="middle">the INTENT</text>
<text x="531" y="154" class="xs" text-anchor="middle">a closed mesh may still</text>
<text x="531" y="172" class="xs" text-anchor="middle">be drawn two-sided —</text>
<text x="531" y="190" class="xs" text-anchor="middle">to look inside it, or</text>
<text x="531" y="208" class="xs" text-anchor="middle">to debug a winding</text>
<line x1="324" y1="141" x2="390" y2="141" class="ink-soft" stroke-width="1.4" marker-end="url(#e-s-l65f5)"/>
<text x="357" y="130" class="sm" text-anchor="middle">+</text>
<rect x="190" y="238" width="340" height="62" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.12"/>
<rect x="190" y="238" width="340" height="62" rx="3" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="360" y="262" class="sm" text-anchor="middle">cull_of(fact, intent)</text>
<text x="360" y="284" class="xs" text-anchor="middle">the one place the rule lives</text>
<line x1="189" y1="226" x2="300" y2="242" class="ink-soft" stroke-width="1.3" marker-end="url(#e-s-l65f5)"/>
<line x1="531" y1="226" x2="420" y2="242" class="ink-soft" stroke-width="1.3" marker-end="url(#e-s-l65f5)"/>
</svg>
