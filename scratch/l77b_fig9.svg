<svg viewBox="0 0 900 300" role="img" aria-labelledby="l77bf9-t l77bf9-d">
  <title id="l77bf9-t">Two exports of one motion</title>
  <desc id="l77bf9-d">A line over the one-second walk showing the largest angle by which any joint differs between the clip imported from Blender's sampled export and the clip imported from its cubic-spline export. It is near zero at the keys, rises between them to peaks of up to 0.916 degrees, and on the frames themselves never exceeds 0.218 degrees — the same amount the two files differ by when evaluated with the specification's formulas alone.</desc>
