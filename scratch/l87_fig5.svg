<svg viewBox="0 0 900 552" role="img" aria-labelledby="l87f5-t l87f5-d">
  <title id="l87f5-t">Each primitive presents a different kind of contact feature, and only the hull's needs a tolerance.</title>
  <desc id="l87f5-d">Five small diagrams in a row, each with an arrow showing the query direction and the returned feature marked in red: a sphere returns one vertex, a capsule queried end on returns one, a capsule queried side on returns a two-vertex segment, a box returns its four-vertex dominant face, and a hull returns the vertices on its supporting plane. Below, a table sweeping the hull's gather tolerance on a 24-sided prism: at 0.002 and 0.010 it recovers the true four-vertex quad with no bulge, and at 0.050 and 0.200 it merges neighbouring faces into an eight-vertex polygon bulging 33.8 and 99.0 millimetres.</desc>
