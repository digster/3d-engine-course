<line x1="20" y1="320" x2="880" y2="320" class="grid" stroke-width="1.0"/>
<text x="24" y="330" class="xs muted" text-anchor="start">§5 — a 24-sided prism, whose face has to be GATHERED</text>
<text x="24" y="350" class="xs muted" text-anchor="start">gather_sin</text>
<text x="308" y="350" class="xs muted" text-anchor="end">prism side face</text>
<text x="408" y="350" class="xs muted" text-anchor="end">bulge</text>
<text x="518" y="350" class="xs muted" text-anchor="end">end cap</text>
<line x1="24" y1="358.0" x2="524" y2="358.0" class="grid" stroke-width="1.0"/>
<text x="24" y="375.0" class="xs" text-anchor="start">0.002</text>
<text x="308" y="375.0" class="xs mono" text-anchor="end">4 vertices</text>
<text x="408" y="375.0" class="xs mono" text-anchor="end">0.0000 m</text>
<text x="518" y="375.0" class="xs mono" text-anchor="end">8 vertices</text>
<text x="24" y="392.0" class="xs" text-anchor="start">0.010</text>
<text x="308" y="392.0" class="xs mono" text-anchor="end">4 vertices</text>
<text x="408" y="392.0" class="xs mono" text-anchor="end">0.0000 m</text>
<text x="518" y="392.0" class="xs mono" text-anchor="end">8 vertices</text>
<text x="24" y="409.0" class="xs" text-anchor="start">0.050  (default)</text>
<text x="308" y="409.0" class="xs mono" text-anchor="end">8 vertices</text>
<text x="408" y="409.0" class="xs mono" text-anchor="end">0.0338 m</text>
<text x="518" y="409.0" class="xs mono" text-anchor="end">8 vertices</text>
<text x="24" y="426.0" class="xs" text-anchor="start">0.200</text>
<text x="308" y="426.0" class="xs mono" text-anchor="end">8 vertices</text>
<text x="408" y="426.0" class="xs mono" text-anchor="end">0.0990 m</text>
<text x="518" y="426.0" class="xs mono" text-anchor="end">8 vertices</text>
<text x="560" y="356" class="xs muted" text-anchor="start">A box, a sphere and a capsule answer with closed</text>
<text x="560" y="373" class="xs muted" text-anchor="start">forms, because they KNOW their own faces. A hull is</text>
<text x="560" y="390" class="xs muted" text-anchor="start">a point cloud with no face list, so its face has to</text>
<text x="560" y="407" class="xs muted" text-anchor="start">be recovered from the supporting plane — and how</text>
<text x="560" y="424" class="xs muted" text-anchor="start">wide to make that plane is a guess about geometry</text>
<text x="560" y="441" class="xs muted" text-anchor="start">that nothing in the data answers.</text>
<text x="560" y="472" class="xs" text-anchor="start">TOO TIGHT and a cylinder's side contact is a bare</text>
<text x="560" y="489" class="xs" text-anchor="start">edge. TOO LOOSE and three flat faces merge into one</text>
<text x="560" y="506" class="xs" text-anchor="start">bulged polygon. There is no value that is right,</text>
<text x="560" y="523" class="xs" text-anchor="start">because the question is topological. The fix is to</text>
<text x="560" y="540" class="xs" text-anchor="start">give hull its faces.</text>
</svg>
