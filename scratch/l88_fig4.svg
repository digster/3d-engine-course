<text x="370" y="80" class="xs" text-anchor="end">floor</text>
<text x="370" y="134" class="xs" text-anchor="end">cast</text>
<text x="620.0" y="172" class="xs" text-anchor="middle">one cell, twice as wide on every axis</text>
<text x="50" y="302" class="xs muted" text-anchor="start">§4 — measured</text>
<text x="724" y="302" class="xs muted" text-anchor="end">result</text>
<line x1="50" y1="310.0" x2="730" y2="310.0" class="grid" stroke-width="1.0"/>
<text x="50" y="327.0" class="xs" text-anchor="start">pairs lost by the cast</text>
<text x="724" y="327.0" class="xs mono" text-anchor="end">0</text>
<text x="50" y="344.0" class="xs" text-anchor="start">pairs lost by floor</text>
<text x="724" y="344.0" class="xs mono" text-anchor="end">0</text>
<text x="50" y="361.0" class="xs" text-anchor="start">comparisons near the origin, cast ÷ floor</text>
<text x="724" y="361.0" class="xs mono" text-anchor="end">4.0×</text>
<text x="50" y="378.0" class="xs" text-anchor="start">pairs lost by inserting the CENTRE cell only</text>
<text x="724" y="378.0" class="xs mono" text-anchor="end">1,892 of 2,836  (66.7%)</text>
<text x="50" y="404" class="xs muted" text-anchor="start">The cast is not a correctness bug HERE, and the reason is one line of order theory: a range-walk grid needs its cell</text>
<text x="50" y="421" class="xs muted" text-anchor="start">map to be MONOTONE and needs nothing else, because if two intervals overlap then so do their images under a</text>
<text x="50" y="438" class="xs muted" text-anchor="start">non-decreasing map. Truncation is non-decreasing. What it costs is occupancy — eight cells become one, and a cell's</text>
<text x="50" y="455" class="xs muted" text-anchor="start">pair loop is quadratic in what is inside it. The mistake that does lose pairs is the other one, and it is the natural</text>
<text x="50" y="472" class="xs muted" text-anchor="start">first draft: objects are small and cells are big, so put each proxy in the one cell containing its centre. That loses</text>
<text x="50" y="489" class="xs muted" text-anchor="start">two thirds of the pairs there are.</text>
</svg>
