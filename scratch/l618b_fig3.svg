<text x="190" y="268" class="xs mono t-bad" text-anchor="start">read the GPU's bytes through C++'s struct  -&gt;  velocity = (0, 4, 5),  age = 6</text>
<text x="190" y="284" class="xs mono muted" text-anchor="start">the shader wrote velocity = (4, 5, 6) and age = 7</text>
<text x="20" y="312" class="xs" text-anchor="start">SDL_gpu.h, on storage buffers: “vec3 and vec4 fields are 16-byte aligned.”</text>
<text x="20" y="330" class="xs muted" text-anchor="start">The same HLSL is 28 bytes a record under one compiler and 32 under another; a row of float3 + one scalar is 16 under both.</text>
</svg>
