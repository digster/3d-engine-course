<svg viewBox="0 0 880 356" role="img" aria-labelledby="l618bf3-t l618bf3-d">
  <title id="l618bf3-t">The record, laid out</title>
  <desc id="l618bf3-d">A byte ruler from 0 to 48. The engine's particle and the shader's Particle occupy identical offsets in three 16-byte rows. The tempting struct of two float3s and a float is 28 bytes with velocity at 12 in C++ and under HLSL rules, but 32 bytes with velocity at 16 under the SPIR-V rules this toolchain applies; reading the GPU's bytes through the C++ struct gives velocity (0, 4, 5) and age 6.</desc>
  <defs>
    <marker id="e-i-l618bf3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l618bf3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l618bf3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l618bf3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l618bf3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
