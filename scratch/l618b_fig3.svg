<text x="579.0" y="112" class="xs mono" text-anchor="middle">life</text>
<rect x="606.0" y="96" width="154.0" height="24" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.3"/>
<text x="683.0" y="112" class="xs mono" text-anchor="middle">previous</text>
<rect x="762.0" y="96" width="50.0" height="24" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.3"/>
<text x="787.0" y="112" class="xs mono" text-anchor="middle">serial</text>
