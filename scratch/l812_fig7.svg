<svg viewBox="0 0 980 597.5" role="img" aria-labelledby="g7-t g7-d">
  <title id="g7-t">A knee loaded into its stop, and the position pass that could not repair it</title>
  <desc id="g7-d">Left: a fixed thigh and a shin lying back, pushed by gravity into the lower stop, with the upper stop 150 degrees away; a table of the two rows inside 8.11's position pass, whose pseudo impulses are equal and cancel. Right: the knee angle over ten seconds under 8.11's and 8.12's passes, warm and cold.</desc>
