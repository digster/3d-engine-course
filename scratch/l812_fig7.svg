<text x="300" y="304.0" class="xs mono" text-anchor="end">0.00000</text>
<text x="410" y="304.0" class="xs mono" text-anchor="end">+0.006513</text>
<text x="26" y="330.5" class="xs muted" text-anchor="start">The upper stop is not violated, so its bias is zero — and 8.11 solved it</text>
<text x="26" y="345.5" class="xs muted" text-anchor="start">against that zero, as a hard 'no pseudo-velocity toward me'. It cancels</text>
<text x="26" y="360.5" class="xs muted" text-anchor="start">the lower stop's correction exactly: the knee's pseudo spin after the</text>
<text x="26" y="375.5" class="xs muted" text-anchor="start">pass is 3.6e-09 rad/s. 8.12 gives a satisfied row its speculative</text>
<text x="26" y="390.5" class="xs muted" text-anchor="start">target, −C/h.</text>
