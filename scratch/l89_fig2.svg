<line x1="390.0" y1="280.0" x2="383.0" y2="288.0" stroke="#8f918a" stroke-width="0.8" fill="none"/>
<text x="60" y="336" class="xs muted" text-anchor="start">body a — the floor, immovable</text>
<path d="M 117.95,168.40 L 297.93,130.14 L 322.05,243.60 L 142.07,281.86 Z" fill="none" stroke="#5082e6" stroke-width="1.8"/>
<circle cx="220" cy="206" r="3.5" fill="#5082e6"/>
<text x="324" y="176" class="xs" text-anchor="start">centre of mass of b</text>
<line x1="225.0" y1="203.0" x2="320.0" y2="172.0" stroke="#8f918a" stroke-width="0.9" fill="none"/>
<circle cx="118.0" cy="280.0" r="4.5" fill="#5ac878"/>
<line x1="114.0" y1="284.0" x2="84.0" y2="310.0" stroke="#8f918a" stroke-width="0.9" fill="none"/>
<text x="79.95154266505983" y="314" class="xs" text-anchor="end">contact point p</text>
<line x1="220.00" y1="206.00" x2="117.95" y2="280.00" stroke="#5082e6" stroke-width="1.5" marker-end="url(#e-blue-f89b)"/>
<text x="152.97577133252992" y="247.0" class="xs" text-anchor="end">r_b</text>
<line x1="117.95" y1="280.00" x2="117.95" y2="192.00" stroke="#5ac878" stroke-width="2.0" marker-end="url(#e-green-f89b)"/>
<text x="107.95154266505983" y="222" class="xs" text-anchor="end">n (a → b)</text>
<line x1="117.95" y1="280.00" x2="201.95" y2="280.00" stroke="#f0961e" stroke-width="2.0" marker-end="url(#e-amber-f89b)"/>
<text x="205.95154266505983" y="294" class="xs" text-anchor="start">t₁</text>
<line x1="117.95" y1="280.00" x2="73.95" y2="306.00" stroke="#f0961e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#e-amber-f89b)"/>
<text x="209.95154266505983" y="314" class="xs muted" text-anchor="start">t₂ points out of the page</text>
<line x1="117.95" y1="280.00" x2="169.95" y2="234.00" stroke="#e05c5c" stroke-width="2.0" marker-end="url(#e-red-f89b)"/>
<line x1="174.0" y1="230.0" x2="263.0" y2="113.0" stroke="#8f918a" stroke-width="0.9" fill="none"/>
<text x="267.95154266505983" y="105" class="xs" text-anchor="start">u = velocity of b's point,</text>
<text x="267.95154266505983" y="120" class="xs" text-anchor="start">relative to a's</text>
<line x1="170.0" y1="234.0" x2="170.0" y2="280.0" stroke="#e05c5c" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<line x1="118.0" y1="234.0" x2="170.0" y2="234.0" stroke="#e05c5c" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<text x="470" y="40" class="sm" text-anchor="start">Three demands on one number each</text>
<line x1="470.0" y1="62.0" x2="488.0" y2="62.0" stroke="#5ac878" stroke-width="3.0" fill="none"/>
<text x="496" y="66" class="xs" text-anchor="start">NON-PENETRATION</text>
<text x="496" y="84" class="xs muted" text-anchor="start">u·n must not be negative afterwards. The impulse that</text>
<text x="496" y="100" class="xs muted" text-anchor="start">enforces it may only PUSH: j ≥ 0. That clamp is the</text>
<text x="496" y="116" class="xs muted" text-anchor="start">only nonlinearity in the whole normal solve.</text>
<line x1="470.0" y1="150.0" x2="488.0" y2="150.0" stroke="#5082e6" stroke-width="3.0" fill="none"/>
<text x="496" y="154" class="xs" text-anchor="start">RESTITUTION</text>
<text x="496" y="172" class="xs muted" text-anchor="start">u·n must be −e times the speed it arrived with. It</text>
<text x="496" y="188" class="xs muted" text-anchor="start">rides on the SAME equation: change the target from 0</text>
<text x="496" y="204" class="xs muted" text-anchor="start">to −e·(arrival) and nothing else moves. So e never</text>
<text x="496" y="220" class="xs muted" text-anchor="start">appears in the solver at all — only in the target.</text>
<line x1="470.0" y1="254.0" x2="488.0" y2="254.0" stroke="#f0961e" stroke-width="3.0" fill="none"/>
<text x="496" y="258" class="xs" text-anchor="start">FRICTION</text>
<text x="496" y="276" class="xs muted" text-anchor="start">u·t₁ and u·t₂ both want to be zero, which is what 'not</text>
<text x="496" y="292" class="xs muted" text-anchor="start">sliding' means — but only as far as |j_t| ≤ μ·j_n</text>
<text x="496" y="308" class="xs muted" text-anchor="start">allows. The cone's RADIUS is the answer to the demand</text>
<text x="496" y="324" class="xs muted" text-anchor="start">above it, which is why the two cannot be solved</text>
<text x="496" y="340" class="xs muted" text-anchor="start">independently.</text>
<text x="470" y="384" class="xs" text-anchor="start">Each is one linear equation in one scalar unknown, because</text>
<text x="470" y="400" class="xs" text-anchor="start">the change in u along any direction is proportional to the</text>
<text x="470" y="416" class="xs" text-anchor="start">impulse along it. That constant of proportionality is the</text>
<text x="470" y="432" class="xs" text-anchor="start">effective mass — Figure 3.</text>
<text x="70" y="454" class="xs muted" text-anchor="start">§3. The sign convention is collide.hpp's, unchanged since 8.4: n points from a toward b, so u·n &lt; 0 means approaching.</text>
</svg>
