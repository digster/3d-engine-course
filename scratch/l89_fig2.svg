<svg viewBox="0 0 980 470" role="img" aria-labelledby="f89b-t f89b-d">
  <title id="f89b-t">The geometry of one contact, and the three demands on it</title>
  <desc id="f89b-d">Left: a tilted box resting on a floor, with the contact point marked, the lever arm from the box's centre of mass to it, the contact normal pointing up from the floor toward the box, the two tangent directions spanning the contact plane, and the relative velocity at the point decomposed into its normal and tangential parts. Right: the three demands a contact makes — non-penetration, restitution and friction — each one linear equation in one scalar unknown, with friction's limit set by the normal impulse.</desc>
  <defs>
    <marker id="e-i-f89b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f89b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f89b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f89b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f89b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
