<svg viewBox="0 0 900 468" role="img" aria-labelledby="l87f8-t l87f8-d">
  <title id="l87f8-t">The three kinds of contact point the clipper produces, and their measured frequencies.</title>
  <desc id="l87f8-d">Three panels. In the first, a small red dashed square sits wholly inside a blue reference rectangle and all four of its corners become contact points — the incident-vertex case, 211,615 of 481,847 points. In the second it overhangs one side, so two corners survive and two crossing points appear where its edges meet the side plane — 162,966. In the third the reference rectangle is the smaller one and its own corners fall inside the incident face — 31,661. To the right, tables: of 200,000 random box pairs, 189,282 overlap, 113,677 give face contacts and 75,604 edge contacts, the clip kept nothing exactly once, and no overlapping pair produced an empty manifold.</desc>
  <defs>
    <marker id="e-i-l87f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l87f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l87f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l87f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l87f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-amber-l87f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-green-l87f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-red-l87f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<text x="20" y="22" class="sm" text-anchor="start">Three ways a contact point is made, and every one of them is an INDEX rather than a position.</text>
<path d="M 72.30,240.90 L 227.70,240.90 L 227.70,115.10 L 72.30,115.10 Z" fill="none" stroke="#5082e6" stroke-width="1.6"/>
<path d="M 105.60,222.40 L 194.40,222.40 L 194.40,133.60 L 105.60,133.60 Z" fill="none" stroke="#e05c5c" stroke-width="1.4" stroke-dasharray="3 3"/>
<path d="M 105.60,222.40 L 194.40,222.40 L 194.40,133.60 L 105.60,133.60 Z" fill="none" stroke="#f0961e" stroke-width="2.0"/>
<circle cx="105.6" cy="222.4" r="4.0" fill="#5ac878"/>
<circle cx="194.4" cy="222.4" r="4.0" fill="#5ac878"/>
<circle cx="194.4" cy="133.6" r="4.0" fill="#5ac878"/>
<circle cx="105.6" cy="133.6" r="4.0" fill="#5ac878"/>
<text x="150" y="60" class="xs" text-anchor="middle">incident vertex</text>
<text x="150" y="284" class="xs muted" text-anchor="middle">a corner of the incident face,</text>
<text x="150" y="299" class="xs muted" text-anchor="middle">inside the reference</text>
<text x="150" y="320" class="xs mono t-hi" text-anchor="middle">211,615 of 481,847</text>
<path d="M 272.30,240.90 L 427.70,240.90 L 427.70,115.10 L 272.30,115.10 Z" fill="none" stroke="#5082e6" stroke-width="1.6"/>
<path d="M 358.88,222.40 L 447.68,222.40 L 447.68,133.60 L 358.88,133.60 Z" fill="none" stroke="#e05c5c" stroke-width="1.4" stroke-dasharray="3 3"/>
<path d="M 358.88,222.40 L 427.70,222.40 L 427.70,133.60 L 358.88,133.60 Z" fill="none" stroke="#f0961e" stroke-width="2.0"/>
<circle cx="358.9" cy="222.4" r="4.0" fill="#5ac878"/>
<circle cx="427.7" cy="222.4" r="4.0" fill="#5ac878"/>
<circle cx="427.7" cy="133.6" r="4.0" fill="#5ac878"/>
<circle cx="358.9" cy="133.6" r="4.0" fill="#5ac878"/>
<text x="350" y="60" class="xs" text-anchor="middle">crossing</text>
<text x="350" y="284" class="xs muted" text-anchor="middle">an incident EDGE cut by a</text>
<text x="350" y="299" class="xs muted" text-anchor="middle">reference side plane</text>
<text x="350" y="320" class="xs mono t-hi" text-anchor="middle">162,966 of 481,847</text>
<path d="M 509.30,218.70 L 590.70,218.70 L 590.70,137.30 L 509.30,137.30 Z" fill="none" stroke="#5082e6" stroke-width="1.6"/>
<path d="M 472.30,255.70 L 627.70,255.70 L 627.70,100.30 L 472.30,100.30 Z" fill="none" stroke="#e05c5c" stroke-width="1.4" stroke-dasharray="3 3"/>
<path d="M 509.30,218.70 L 590.70,218.70 L 590.70,137.30 L 509.30,137.30 Z" fill="none" stroke="#f0961e" stroke-width="2.0"/>
<circle cx="509.3" cy="218.7" r="4.0" fill="#5ac878"/>
<circle cx="590.7" cy="218.7" r="4.0" fill="#5ac878"/>
<circle cx="590.7" cy="137.3" r="4.0" fill="#5ac878"/>
<circle cx="509.3" cy="137.3" r="4.0" fill="#5ac878"/>
<text x="550" y="60" class="xs" text-anchor="middle">reference vertex</text>
<text x="550" y="284" class="xs muted" text-anchor="middle">a corner of the REFERENCE face,</text>
<text x="550" y="299" class="xs muted" text-anchor="middle">inside the incident</text>
<text x="550" y="320" class="xs mono t-hi" text-anchor="middle">31,661 of 481,847</text>
<line x1="620" y1="56" x2="620" y2="340" class="grid" stroke-width="1.0"/>
<text x="648" y="90" class="xs muted" text-anchor="start">200,000 random box pairs</text>
<text x="892" y="90" class="xs muted" text-anchor="end"></text>
<line x1="648" y1="98.0" x2="898" y2="98.0" class="grid" stroke-width="1.0"/>
<text x="648" y="115.0" class="xs" text-anchor="start">overlapping</text>
<text x="892" y="115.0" class="xs mono" text-anchor="end">189,282</text>
<text x="648" y="132.0" class="xs" text-anchor="start">face contacts</text>
<text x="892" y="132.0" class="xs mono" text-anchor="end">113,677</text>
<text x="648" y="149.0" class="xs" text-anchor="start">edge contacts</text>
<text x="892" y="149.0" class="xs mono" text-anchor="end">75,604</text>
<text x="648" y="166.0" class="xs" text-anchor="start">clip kept nothing</text>
<text x="892" y="166.0" class="xs mono" text-anchor="end">1</text>
<text x="648" y="183.0" class="xs" text-anchor="start">manifolds with 0 points</text>
<text x="892" y="183.0" class="xs mono" text-anchor="end">0</text>
<text x="648" y="220" class="xs muted" text-anchor="start">points per manifold</text>
<text x="892" y="220" class="xs muted" text-anchor="end"></text>
<line x1="648" y1="228.0" x2="898" y2="228.0" class="grid" stroke-width="1.0"/>
<text x="648" y="245.0" class="xs" text-anchor="start">1</text>
<text x="892" y="245.0" class="xs mono" text-anchor="end">79,200</text>
<text x="648" y="262.0" class="xs" text-anchor="start">2</text>
<text x="892" y="262.0" class="xs mono" text-anchor="end">10,718</text>
<text x="648" y="279.0" class="xs" text-anchor="start">3</text>
<text x="892" y="279.0" class="xs mono" text-anchor="end">16,245</text>
<text x="648" y="296.0" class="xs" text-anchor="start">4</text>
<text x="892" y="296.0" class="xs mono" text-anchor="end">83,119</text>
<line x1="20" y1="356" x2="880" y2="356" class="grid" stroke-width="1.0"/>
<text x="24" y="378" class="xs" text-anchor="start">AN ID IS A SET OF INDICES INTO GEOMETRY THAT DOES NOT MOVE — a face's own identity, a vertex's own index on its shape. Nothing in it is</text>
<text x="24" y="396" class="xs muted" text-anchor="start">computed from a position, so nothing in it can change because a body moved by a micron. It changes when the CONTACT changes.</text>
<text x="24" y="422" class="xs muted" text-anchor="start">Checked against both boxes with a signed distance field: the worst claimed surface point on a face contact is 2.52e−06 m off, over 410,075 points.</text>
<text x="24" y="446" class="xs" text-anchor="start">And a fixture whose answer is known on paper: two 1 m cubes crossed at 45°, lowered 5 mm — contact at (0, 0.70461, 0), depth 0.00500 m, normal +y.</text>
</svg>
