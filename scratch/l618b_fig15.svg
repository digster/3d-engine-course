<text x="658" y="120" class="xs" text-anchor="start">CPU step + upload</text>
<text x="630" y="150" class="xs" text-anchor="start">at 1,048,576:</text>
<text x="630" y="165" class="xs mono" text-anchor="start">  CPU 3.75 + upload 6.87 ms</text>
<text x="630" y="180" class="xs mono" text-anchor="start">  GPU 0.394 ms per step</text>
<text x="630" y="195" class="xs" text-anchor="start"></text>
<text x="630" y="210" class="xs" text-anchor="start">the upload outgrows the step:</text>
<text x="630" y="225" class="xs" text-anchor="start">about 0.14 ms a MB plus 0.14 ms</text>
<text x="630" y="240" class="xs" text-anchor="start">of submit, on unified memory.</text>
<text x="630" y="255" class="xs" text-anchor="start"></text>
<text x="630" y="270" class="xs" text-anchor="start">CPU: 3.3 to 3.6 ns a slot;</text>
<text x="630" y="285" class="xs" text-anchor="start">GPU: 0.31 to 0.79 ns, launch</text>
<text x="630" y="300" class="xs" text-anchor="start">included (60 steps, one buffer).</text>
