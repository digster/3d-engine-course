<svg viewBox="0 0 700 360" role="img" aria-labelledby="f4-t f4-d">
  <title id="f4-t">Phong answers only within 90 degrees of the mirror ray, which is not the visible half</title>
  <desc id="f4-d">A horizontal surface with its normal drawn upward. The light direction l points up and to the right at 62 degrees from the normal; the mirror direction R points up and to the LEFT at 62 degrees, both comfortably above the surface. A dashed line at 28 degrees right of the normal marks the edge of the hemisphere Phong can answer in, and the wedge between it and the surface on the right is shaded: any eye in that 62-degree wedge sees no Phong highlight. The eye direction v, at 46 degrees, lies inside that wedge, 108 degrees from R. The halfway vector h sits at 54 degrees, between l and v and well above the surface, so Blinn still answers.</desc>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--axis-y)"/></marker>
    <marker id="a-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn-bd)"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--note-bd)"/></marker>
    <marker id="a-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pitfall-bd)"/></marker>
    <marker id="a-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok-bd)"/></marker>
  </defs>
