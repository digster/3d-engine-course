<text x="140.0" y="127.5" class="mono xs muted" text-anchor="end">90</text>
<text x="404.0" y="330.0" class="mono xs muted" text-anchor="middle">180</text>
<text x="140.0" y="64.0" class="mono xs muted" text-anchor="end">180</text>
<text x="277.0" y="348.0" class="xs muted" text-anchor="middle">yaw (degrees)</text>
<text x="108.0" y="187.0" class="xs muted" text-anchor="middle" transform="rotate(-90 108.0 187.0)">roll (degrees)</text>
<line x1="424.0" y1="86.0" x2="440.0" y2="86.0" stroke="#e05c5c" stroke-width="2.2" fill="none"/>
<text x="446.0" y="90.0" class="xs t-hi" text-anchor="start">along the line:</text>
<text x="424.0" y="106.0" class="mono xs" text-anchor="start">yaw +47°, roll +47°</text>
<text x="424.0" y="121.0" class="mono xs t-bad" text-anchor="start">0.0000° of motion</text>
<line x1="424.0" y1="148.0" x2="440.0" y2="148.0" stroke="#5ac878" stroke-width="2.2" fill="none"/>
<text x="446.0" y="152.0" class="xs t-hi" text-anchor="start">across it:</text>
<text x="424.0" y="168.0" class="mono xs" text-anchor="start">yaw 0°, roll +70°</text>
<text x="424.0" y="183.0" class="mono xs t-ok" text-anchor="start">real rotation</text>
<text x="424.0" y="218.0" class="xs muted" text-anchor="start">at pitch 0° the</text>
<text x="424.0" y="233.0" class="xs muted" text-anchor="start">same joint move</text>
<text x="424.0" y="248.0" class="mono xs" text-anchor="start">gives 65.51°</text>
<text x="424.0" y="274.0" class="xs muted" text-anchor="start">at pitch −90° it is</text>
<text x="424.0" y="289.0" class="xs muted" text-anchor="start">the SUM that dies</text>
<text x="424.0" y="304.0" class="xs muted" text-anchor="start">(the other diagonal)</text>
</svg>
