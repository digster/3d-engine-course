<line x1="404.0" y1="271.7" x2="361.7" y2="314.0" stroke="#8f918a" stroke-width="0.8" fill="none" stroke-dasharray="2 5"/>
<line x1="188.8" y1="314.0" x2="404.0" y2="98.8" stroke="#f0961e" stroke-width="2.4" fill="none"/>
