<text x="140.0" y="318.0" class="mono xs muted" text-anchor="end">-180</text>
<text x="213.5" y="330.0" class="mono xs muted" text-anchor="middle">-90</text>
<text x="140.0" y="254.5" class="mono xs muted" text-anchor="end">-90</text>
<text x="277.0" y="330.0" class="mono xs muted" text-anchor="middle">0</text>
<text x="140.0" y="191.0" class="mono xs muted" text-anchor="end">0</text>
