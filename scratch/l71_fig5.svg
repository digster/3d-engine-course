<svg viewBox="0 0 700 380" role="img" aria-labelledby="f71e-t f71e-d">
  <title id="f71e-t">The collapse at lock</title>
  <desc id="f71e-d">A square of yaw against roll, both from minus 180 to 180 degrees, crossed by dashed diagonal lines of constant yaw minus roll. One diagonal is highlighted in amber with two points on it joined by an arrow: moving along it changes both knobs by 47 degrees and produces zero rotation. A second arrow leaves the diagonal and is labelled as real rotation.</desc>
  <defs>
    <marker id="e-i-f71e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f71e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f71e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f71e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f71e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-bad-f71e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-ok-f71e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<text x="350.0" y="24" class="sm" text-anchor="middle">At pitch = +90°, every pose on a diagonal is the SAME orientation</text>
<text x="350.0" y="42" class="xs muted" text-anchor="middle">the matrix contains yaw and roll only as (yaw − roll)</text>
<rect x="150.0" y="60.0" width="254.0" height="254.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
