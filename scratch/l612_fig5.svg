<svg viewBox="0 0 720 330" role="img" aria-labelledby="f612d-t f612d-d">
  <title id="f612d-t">The three steps of a resolve</title>
  <desc id="f612d-d">Exposure, then the tonemap curve, then the sRGB encode, with the measured consequence of each wrong ordering.</desc>
  <defs>
    <marker id="e-i-f612d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f612d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f612d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f612d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f612d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">One pass over a finished image, and the order is not negotiable</text>
<rect x="27.0" y="64" width="150" height="96" rx="5" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<rect x="27.0" y="64" width="150" height="28" rx="5" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<text x="102.0" y="83" class="xs" text-anchor="middle">the HDR buffer</text>
<text x="102.0" y="114" class="xs" text-anchor="middle">values of light,</text>
<text x="102.0" y="132" class="xs" text-anchor="middle">unbounded</text>
<line x1="180.0" y1="112" x2="196.0" y2="112" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f612d)"/>
<rect x="199.0" y="64" width="150" height="96" rx="5" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<rect x="199.0" y="64" width="150" height="28" rx="5" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.18"/>
<text x="274.0" y="83" class="xs" text-anchor="middle">x exposure</text>
<text x="274.0" y="114" class="xs" text-anchor="middle">still linear —</text>
<text x="274.0" y="132" class="xs" text-anchor="middle">light adds in time</text>
<line x1="352.0" y1="112" x2="368.0" y2="112" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f612d)"/>
<rect x="371.0" y="64" width="150" height="96" rx="5" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<rect x="371.0" y="64" width="150" height="28" rx="5" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.18"/>
<text x="446.0" y="83" class="xs" text-anchor="middle">the curve</text>
<text x="446.0" y="114" class="xs" text-anchor="middle">still linear — it is</text>
<text x="446.0" y="132" class="xs" text-anchor="middle">about light, not codes</text>
<line x1="524.0" y1="112" x2="540.0" y2="112" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f612d)"/>
<rect x="543.0" y="64" width="150" height="96" rx="5" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<rect x="543.0" y="64" width="150" height="28" rx="5" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.18"/>
<text x="618.0" y="83" class="xs" text-anchor="middle">encode</text>
<text x="618.0" y="114" class="xs" text-anchor="middle">LAST, and exactly</text>
<text x="618.0" y="132" class="xs" text-anchor="middle">once (6.1's rule)</text>
<line x1="60" y1="188" x2="660" y2="188" class="grid" stroke-width="1.0"/>
<text x="360.0" y="212" class="xs" text-anchor="middle">and each wrong order has its own signature:</text>
<text x="84" y="238" class="xs" text-anchor="start">exposure AFTER the curve</text>
<text x="274" y="238" class="xs" text-anchor="start">code 203 becomes code 128 — and worse, the bright end can no longer be told apart,</text>
<text x="274" y="258" class="xs" text-anchor="start">because everything above about 4 was squeezed into the same place before the multiply</text>
<text x="84" y="278" class="xs" text-anchor="start">the curve AFTER the encode</text>
<text x="274" y="278" class="xs" text-anchor="start">mid grey maps to 0.4244 instead of 0.3333 — a curve applied to CODES compresses what</text>
<text x="274" y="298" class="xs" text-anchor="start">the encode had carefully spread out, and it crushes the shadows first</text>
</svg>
