<svg viewBox="0 0 720 440" role="img" aria-labelledby="l62f5-t l62f5-d">
  <title id="l62f5-t">Deriving the pi in the Lambert BRDF</title>
  <desc id="l62f5-d">A hemisphere in cross-section: each patch of solid angle projects onto the base plane with area cosine theta times its own. The projections are a polar grid at radius sine theta, and they tile a unit disc exactly once — so the cosine-weighted hemisphere measures pi.</desc>
  <defs>
    <marker id="e-i-l62f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l62f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l62f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l62f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l62f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">The pi is not a convention. It is the area of a disc, and here is the disc.</text>
<line x1="40" y1="250" x2="352" y2="250" class="ink" stroke-width="1.8"/>
<path d="M 66 250 A 130 130 0 0 1 326 250" fill="none" class="grid" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M 196 250 L 272.4 144.8 A 130 130 0 0 1 301.2 173.6 Z" fill="#9b7ede" fill-opacity="0.32" stroke="#9b7ede" stroke-width="1.3"/>
<text x="303.4802307403552" y="146.51976925964476" class="xs mono t-hi" text-anchor="start">dω</text>
<line x1="196" y1="250" x2="196" y2="102" class="ink" stroke-width="1.2" marker-end="url(#e-i-l62f5)"/>
<text x="206" y="100" class="xs mono muted" text-anchor="start">n</text>
<path d="M 196 208 A 42 42 0 0 1 225.7 220.3" fill="none" class="ink-soft" stroke-width="1.1"/>
<text x="220" y="200" class="xs mono" text-anchor="middle">θ</text>
<line x1="272.4120827980215" y1="144.8277907312568" x2="272.4120827980215" y2="250" class="grid" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="301.1722092687432" y1="173.58791720197848" x2="301.1722092687432" y2="250" class="grid" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="272.4120827980215" y1="255" x2="301.1722092687432" y2="255" class="hi" stroke-width="3.4"/>
<text x="292.7921460333823" y="274" class="xs mono t-hi" text-anchor="start">cos θ · dω</text>
<text x="196" y="302" class="xs muted" text-anchor="middle">every patch of the hemisphere casts a shadow</text>
<text x="196" y="316" class="xs muted" text-anchor="middle">of its own size times cos θ</text>
<circle cx="536" cy="202" r="98" fill="#5ac878" fill-opacity="0.12" stroke="#5ac878" stroke-width="1.6"/>
<path d="M 585.9 230.8 A 57.60295472466237 57.60295472466237 0 0 1 564.8 251.9 L 575.6 270.7 A 79.28366544874486 79.28366544874486 0 0 0 604.7 241.6 Z" fill="#9b7ede" fill-opacity="0.45" stroke="#9b7ede" stroke-width="1.2"/>
<circle cx="536" cy="202" r="30.3" fill="none" class="grid" stroke-width="1.0"/>
<circle cx="536" cy="202" r="57.6" fill="none" class="grid" stroke-width="1.0"/>
<circle cx="536" cy="202" r="79.3" fill="none" class="grid" stroke-width="1.0"/>
<circle cx="536" cy="202" r="93.2" fill="none" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="634.0" y2="202.0" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="620.870489570875" y2="251.0" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="585.0" y2="286.87048957087495" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="536.0" y2="300.0" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="487.0" y2="286.870489570875" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="451.129510429125" y2="251.0" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="438.0" y2="202.0" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="451.129510429125" y2="153.00000000000003" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="486.99999999999994" y2="117.12951042912503" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="536.0" y2="104.0" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="585.0" y2="117.12951042912502" class="grid" stroke-width="1.0"/>
<line x1="536" y1="202" x2="620.870489570875" y2="152.99999999999994" class="grid" stroke-width="1.0"/>
<text x="536" y="88" class="xs t-hi" text-anchor="middle">the shadows tile this disc, exactly once</text>
<line x1="438" y1="320" x2="634" y2="320" class="grid" stroke-width="1.2"/>
<line x1="438" y1="315" x2="438" y2="325" class="grid" stroke-width="1.2"/>
<line x1="634" y1="315" x2="634" y2="325" class="grid" stroke-width="1.2"/>
<text x="536" y="338" class="xs mono muted" text-anchor="middle">radius 1</text>
<rect x="24" y="352" width="672" height="76" rx="4" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="376" class="sm mono t-hi" text-anchor="middle">∫ cos θ dω  over the hemisphere  =  area of a unit disc  =  π</text>
<text x="360.0" y="398" class="xs muted" text-anchor="middle">So a constant BRDF k sends back k·π of everything that arrives. Demanding that this equal the albedo — no more, no less — fixes</text>
<text x="360.0" y="414" class="xs muted" text-anchor="middle">k = albedo/π, and nothing else will do. Measured at 1024×2048 samples: 1.0000004.</text>
</svg>
