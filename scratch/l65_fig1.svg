<text x="590.0" y="132" class="xs" text-anchor="middle">struct material</text>
<rect x="504.0" y="139" width="172" height="16" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.42"/>
<text x="590.0" y="150" class="xs" text-anchor="middle">{</text>
<rect x="504.0" y="157" width="172" height="16" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.42"/>
<text x="590.0" y="168" class="xs" text-anchor="middle">  Uint32 tint;</text>
<rect x="504.0" y="175" width="172" height="16" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.42"/>
<text x="590.0" y="186" class="xs" text-anchor="middle">  microsurface</text>
<rect x="504.0" y="193" width="172" height="16" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.42"/>
<text x="590.0" y="204" class="xs" text-anchor="middle">  surface;</text>
<rect x="504.0" y="211" width="172" height="16" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.42"/>
<text x="590.0" y="222" class="xs" text-anchor="middle">}</text>
<text x="590.0" y="258" class="xs" text-anchor="middle">it INVENTED the type</text>
<text x="590.0" y="274" class="xs" text-anchor="middle">the engine did not have</text>
<rect x="30.0" y="296" width="660.0" height="62" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="320" class="xs" text-anchor="middle">Highlighted: the fields that describe the SURFACE rather than the object.</text>
<text x="360.0" y="342" class="sm" text-anchor="middle">And Lesson 6.4 priced the absence — 44 call sites to change one of them.</text>
