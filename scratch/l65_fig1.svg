<text x="130.0" y="222" class="xs" text-anchor="middle">surface</text>
<text x="130.0" y="258" class="xs" text-anchor="middle">“…the second kind</text>
<text x="130.0" y="274" class="xs" text-anchor="middle">has a name: a material”</text>
<rect x="260.0" y="60" width="200" height="178" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.08"/>
