<text x="130.0" y="102" class="xs" text-anchor="middle">Lessons 3.4, 3.7</text>
<line x1="46.0" y1="112" x2="214.0" y2="112" class="grid" stroke-width="1.0"/>
<text x="130.0" y="132" class="xs" text-anchor="middle">xform</text>
<text x="130.0" y="150" class="xs" text-anchor="middle">geometry</text>
<text x="130.0" y="168" class="xs" text-anchor="middle">name</text>
