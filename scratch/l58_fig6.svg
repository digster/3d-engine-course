<svg viewBox="0 0 720 340" role="img" aria-labelledby="l58f6-t l58f6-d">
  <title id="l58f6-t">Type erasure by component id</title>
  <desc id="l58f6-d">Five component types each assigned a small integer id, indexing a vector of base-class pointers; destroy walks the vector calling the one virtual function that needs no type information.</desc>
  <defs>
    <marker id="e-i-l58f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l58f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l58f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l58f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l58f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">How destroy(e) reaches every pool without knowing what any of them stores.</text>
<text x="24" y="48" class="xs t-hi" text-anchor="start">component_id_of&lt;T&gt;() — a counter behind a function-local static, assigned on first use.</text>
