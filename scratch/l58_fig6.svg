<text x="606" y="102" class="xs mono t-hi" text-anchor="start">id 4</text>
<text x="52" y="126" class="xs mono muted" text-anchor="end">pools_</text>
<rect x="60" y="110" width="108" height="30" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.14"/>
<text x="114" y="123" class="xs mono" text-anchor="middle">unique_ptr&lt;</text>
<text x="114" y="135" class="xs mono" text-anchor="middle">pool_base&gt;</text>
<rect x="184" y="110" width="108" height="30" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.14"/>
<text x="238" y="123" class="xs mono" text-anchor="middle">unique_ptr&lt;</text>
<text x="238" y="135" class="xs mono" text-anchor="middle">pool_base&gt;</text>
<rect x="308" y="110" width="108" height="30" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.14"/>
<text x="362" y="123" class="xs mono" text-anchor="middle">unique_ptr&lt;</text>
<text x="362" y="135" class="xs mono" text-anchor="middle">pool_base&gt;</text>
<rect x="432" y="110" width="108" height="30" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="486" y="123" class="xs mono" text-anchor="middle">unique_ptr&lt;</text>
<text x="486" y="135" class="xs mono" text-anchor="middle">pool_base&gt;</text>
<rect x="556" y="110" width="108" height="30" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.14"/>
<text x="610" y="123" class="xs mono" text-anchor="middle">unique_ptr&lt;</text>
<text x="610" y="135" class="xs mono" text-anchor="middle">pool_base&gt;</text>
<text x="24" y="162" class="xs muted" text-anchor="start">A vector indexed by the id. The pointer is to the BASE, so this vector has one type and holds five.</text>
<line x1="24" y1="176" x2="696" y2="176" class="grid" stroke-width="1.2"/>
<text x="24" y="198" class="xs t-hi" text-anchor="start">destroy(e): walk the vector, call the one virtual function that needs no type.</text>
<rect x="60" y="210" width="108" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.2"/>
<text x="114" y="225" class="xs mono" text-anchor="middle">erase(e)</text>
<text x="114" y="248" class="xs" text-anchor="middle">row removed</text>
<rect x="184" y="210" width="108" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="238" y="225" class="xs mono" text-anchor="middle">erase(e)</text>
<text x="238" y="248" class="xs" text-anchor="middle">row removed</text>
<rect x="308" y="210" width="108" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.08"/>
<text x="362" y="225" class="xs mono" text-anchor="middle">erase(e)</text>
<text x="362" y="248" class="xs muted" text-anchor="middle">not there</text>
<rect x="432" y="210" width="108" height="22" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.2"/>
<text x="486" y="225" class="xs mono" text-anchor="middle">erase(e)</text>
<text x="486" y="248" class="xs" text-anchor="middle">row removed</text>
<rect x="556" y="210" width="108" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.08"/>
<text x="610" y="225" class="xs mono" text-anchor="middle">erase(e)</text>
<text x="610" y="248" class="xs muted" text-anchor="middle">not there</text>
<text x="24" y="274" class="xs muted" text-anchor="start">Five virtual calls to destroy an entity that had three components. Two of them return after ONE array read — that is the price of</text>
<text x="24" y="288" class="xs muted" text-anchor="start">not keeping a per-entity component mask, and at five types it is nothing.</text>
<text x="24" y="312" class="xs t-hi" text-anchor="start">COLD BY CONSTRUCTION: this is the only place a virtual call happens. A view holds pool&lt;T&gt;* and calls nothing through the base —</text>
<text x="24" y="326" class="xs muted" text-anchor="start">which is Lesson 5.6’s 1.5–1.7× measurement being obeyed rather than quoted.</text>
</svg>
