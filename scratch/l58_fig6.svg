<text x="110" y="102" class="xs mono t-hi" text-anchor="start">id 0</text>
<rect x="184" y="62" width="108" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.22"/>
<text x="238" y="76" class="xs mono" text-anchor="middle">geometry</text>
