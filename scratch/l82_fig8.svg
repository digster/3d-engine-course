<svg viewBox="0 0 900 400" role="img" aria-labelledby="l82f8-t l82f8-d">
  <title id="l82f8-t">Gravity carried into world space through four different parent frames</title>
  <desc id="l82f8-d">Four panels each show a dashed grey reference arrow pointing straight down and a solid arrow showing where the same local gravity actually points. The second is twice as long, the third identical, and the fourth is both longer and rotated by 63 degrees.</desc>
  <defs>
    <marker id="e-i-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-c0-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<defs><marker id="e-c1-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-c2-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-c3-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7ede"/></marker></defs>
<defs><marker id="e-ref-l82f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<text x="40" y="30" class="sm t-hi" text-anchor="start">THE SAME “DOWN”, CARRIED OUT THROUGH FOUR PARENTS</text>
<rect x="50" y="70" width="183" height="220" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="141.5" y="62" class="xs mono t-hi" text-anchor="middle">rotate 45°</text>
<line x1="132.00" y1="134.00" x2="132.00" y2="185.01" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#e-ref-l82f8)"/>
<line x1="138.00" y1="134.00" x2="174.07" y2="170.07" stroke="#8f918a" stroke-width="2.4" marker-end="url(#e-c0-l82f8)"/>
<text x="141.5" y="252" class="xs mono" text-anchor="middle">gain 1.0000</text>
<text x="141.5" y="268" class="xs mono" text-anchor="middle">tilt 45.000°</text>
<text x="141.5" y="284" class="xs mono" text-anchor="middle">square 0.0000</text>
<text x="141.5" y="306" class="xs t-ok" text-anchor="middle">inertial</text>
<rect x="255" y="70" width="183" height="220" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="346.5" y="62" class="xs mono t-hi" text-anchor="middle">uniform scale 2</text>
<line x1="337.00" y1="134.00" x2="337.00" y2="185.01" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#e-ref-l82f8)"/>
<line x1="343.00" y1="134.00" x2="343.00" y2="236.02" stroke="#e05c5c" stroke-width="2.4" marker-end="url(#e-c1-l82f8)"/>
<text x="346.5" y="252" class="xs mono" text-anchor="middle">gain 2.0000</text>
<text x="346.5" y="268" class="xs mono" text-anchor="middle">tilt 0.000°</text>
<text x="346.5" y="284" class="xs mono" text-anchor="middle">square 0.0000</text>
<text x="346.5" y="306" class="xs t-bad" text-anchor="middle">NOT INERTIAL</text>
<rect x="460" y="70" width="183" height="220" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="551.5" y="62" class="xs mono t-hi" text-anchor="middle">scale (2,1,1)</text>
<line x1="542.00" y1="134.00" x2="542.00" y2="185.01" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#e-ref-l82f8)"/>
<line x1="548.00" y1="134.00" x2="548.00" y2="185.01" stroke="#f0961e" stroke-width="2.4" marker-end="url(#e-c2-l82f8)"/>
<text x="551.5" y="252" class="xs mono" text-anchor="middle">gain 1.0000</text>
<text x="551.5" y="268" class="xs mono" text-anchor="middle">tilt 0.000°</text>
<text x="551.5" y="284" class="xs mono" text-anchor="middle">square 0.0000</text>
<text x="551.5" y="306" class="xs t-bad" text-anchor="middle">NOT INERTIAL</text>
<rect x="665" y="70" width="183" height="220" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="756.5" y="62" class="xs mono t-hi" text-anchor="middle">scale (2,1,1) after 45°</text>
<line x1="747.00" y1="134.00" x2="747.00" y2="185.01" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#e-ref-l82f8)"/>
<line x1="753.00" y1="134.00" x2="825.14" y2="170.07" stroke="#9b7ede" stroke-width="2.4" marker-end="url(#e-c3-l82f8)"/>
<text x="756.5" y="252" class="xs mono" text-anchor="middle">gain 1.5811</text>
<text x="756.5" y="268" class="xs mono" text-anchor="middle">tilt 63.435°</text>
<text x="756.5" y="284" class="xs mono" text-anchor="middle">square 0.6000</text>
<text x="756.5" y="306" class="xs t-bad" text-anchor="middle">NOT INERTIAL</text>
<text x="50" y="334" class="xs muted" text-anchor="start">Column 3 is the trap: gravity points along y and the scale is on x, so gain and tilt both report 1.0000 and 0.000° —</text>
<text x="50" y="352" class="xs" text-anchor="start">and the frame is still broken. It is the `uniform` flag that catches it, because the fault is in the frame and not in this vector.</text>
<text x="50" y="376" class="xs t-bad" text-anchor="start">Column 4 is the same frame with the body merely TURNED: the fall is now 1.5811 g, 63.435° off vertical, and 0.6000 out of square is 53.13° of shear.</text>
</svg>
