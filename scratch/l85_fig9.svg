<svg viewBox="0 0 900 400" role="img" aria-labelledby="l85f9-t l85f9-d">
  <title id="l85f9-t">GJK's iteration count: a histogram over 117,417 box pairs, and how the mean moves as the tolerance tightens for four shape pairs.</title>
  <desc id="l85f9-d">Left, a horizontal bar chart of iterations from one to ten, peaking at three, with a mean of 3.52 and a maximum of 10. Right, four lines plotted against tolerance from 1e-2 to 1e-7: box, hull and sphere are flat, while capsule climbs from 2.06 to 7.43.</desc>
