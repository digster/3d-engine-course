<text x="816" y="116" class="xs" text-anchor="start">box</text>
<line x1="788.0" y1="129.0" x2="808.0" y2="129.0" stroke="#5082e6" stroke-width="2.4" fill="none"/>
<text x="816" y="133" class="xs" text-anchor="start">hull</text>
<line x1="788.0" y1="146.0" x2="808.0" y2="146.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="816" y="150" class="xs" text-anchor="start">sphere</text>
<line x1="788.0" y1="163.0" x2="808.0" y2="163.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="816" y="167" class="xs" text-anchor="start">capsule</text>
<text x="788" y="198" class="xs muted" text-anchor="start">three flat, one not —</text>
<text x="788" y="212" class="xs muted" text-anchor="start">and the odd one out is</text>
<text x="788" y="226" class="xs muted" text-anchor="start">not the one you would</text>
<text x="788" y="240" class="xs muted" text-anchor="start">guess.</text>
<text x="20" y="352" class="xs" text-anchor="start">A box and a hull are POLYTOPES: finitely many vertices, so the simplex can only improve finitely often and the tolerance is never</text>
<text x="20" y="368" class="xs" text-anchor="start">what stopped the search. The SPHERE is flat at ONE because a ball's closest point to an outside point lies on the line to its centre, so</text>
<text x="20" y="384" class="xs" text-anchor="start">the very first support call lands on the answer. Only the CAPSULE converges, at about one extra pass per decade.</text>
