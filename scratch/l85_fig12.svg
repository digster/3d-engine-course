<svg viewBox="0 0 900 380" role="img" aria-labelledby="l85f12-t l85f12-d">
  <title id="l85f12-t">GJK's cost against the SAT's on boxes, and how a hull's support scales with its vertex count.</title>
  <desc id="l85f12-d">Left, four horizontal bars: the SAT's boolean test at 8.4 ns, its full test at 49.5 ns, GJK's boolean at 73.2 ns and GJK's distance at 114.7 ns. Right, a line of support-function cost against hull vertex count from 8 to 128 vertices, straight, from 3.9 ns to 51.5 ns.</desc>
