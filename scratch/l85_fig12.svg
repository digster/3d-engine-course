<text x="20" y="326" class="xs" text-anchor="start">And the function pointer costs nothing: 1.908 ns direct against 1.906 ns through `convex::support`, with the two arms</text>
<text x="20" y="342" class="xs" text-anchor="start">agreeing bit for bit. One target per query is a branch the predictor learns immediately — 6.17's finding, at a hotter call site.</text>
<text x="20" y="362" class="xs t-hi" text-anchor="start">What GJK buys is the metres and the generality, not the speed, which is why an engine keeps both tests.</text>
</svg>
