<svg viewBox="0 0 880 340" role="img" aria-labelledby="l618bf14-t l618bf14-d">
  <title id="l618bf14-t">CPU and GPU, particle by particle</title>
  <desc id="l618bf14-d">A plot of the worst distance between a live particle and its CPU twin, rising to 1.67 micrometres by two seconds and staying there to ten. Beside it, the exact agreements (serials, alive flags, counts, hashes), the bounded ones, and the CPU reference's own disagreement between debug and Release builds.</desc>
  <defs>
    <marker id="e-i-l618bf14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l618bf14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l618bf14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l618bf14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l618bf14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">The same 600 steps on both processors: which numbers agree exactly, and how far the rest drift.</text>
<rect x="70" y="50" width="460" height="220" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="70" y1="215.0" x2="530" y2="215.0" class="grid" stroke-width="0.6" stroke-dasharray="2 3"/>
<text x="64" y="219.0" class="xs mono muted" text-anchor="end">0.5</text>
<line x1="70" y1="160.0" x2="530" y2="160.0" class="grid" stroke-width="0.6" stroke-dasharray="2 3"/>
<text x="64" y="164.0" class="xs mono muted" text-anchor="end">1.0</text>
<line x1="70" y1="105.0" x2="530" y2="105.0" class="grid" stroke-width="0.6" stroke-dasharray="2 3"/>
<text x="64" y="109.0" class="xs mono muted" text-anchor="end">1.5</text>
<line x1="70" y1="50.0" x2="530" y2="50.0" class="grid" stroke-width="0.6" stroke-dasharray="2 3"/>
<text x="64" y="54.0" class="xs mono muted" text-anchor="end">2.0</text>
<text x="70.0" y="284" class="xs mono muted" text-anchor="middle">0.1 s</text>
<text x="161.52620199456865" y="284" class="xs mono muted" text-anchor="middle">0.25 s</text>
<text x="230.7631009972843" y="284" class="xs mono muted" text-anchor="middle">0.5 s</text>
<text x="300.0" y="284" class="xs mono muted" text-anchor="middle">1 s</text>
<text x="369.2368990027157" y="284" class="xs mono muted" text-anchor="middle">2 s</text>
<text x="460.7631009972843" y="284" class="xs mono muted" text-anchor="middle">5 s</text>
<text x="530.0" y="284" class="xs mono muted" text-anchor="middle">10 s</text>
<text x="26" y="160.0" class="xs muted" text-anchor="middle">µm</text>
<path d="M 70.00,256.79 L 161.53,230.49 L 230.76,190.71 L 300.00,97.64 L 369.24,86.40 L 460.76,86.42 L 530.00,117.92" fill="none" stroke="#f0961e" stroke-width="1.6"/>
