<circle cx="460.8" cy="86.4" r="2.2" fill="#f0961e" stroke="none"/>
<circle cx="530.0" cy="117.9" r="2.2" fill="#f0961e" stroke="none"/>
<text x="300.0" y="300" class="xs muted" text-anchor="middle">simulated time (log); the worst live particle's distance from its CPU twin</text>
<text x="560" y="60" class="xs t-ok" text-anchor="start">EXACT, every step, both processors</text>
<text x="560" y="77" class="xs mono" text-anchor="start">  every serial in every slot</text>
<text x="560" y="94" class="xs mono" text-anchor="start">  which particles are alive: 0 disagree</text>
<text x="560" y="111" class="xs mono" text-anchor="start">  the count: 44,915 = 44,915</text>
<text x="560" y="128" class="xs mono" text-anchor="start">  1,048,576 hashes, bit for bit</text>
<text x="560" y="145" class="xs t-hi" text-anchor="start">WITHIN A BOUND</text>
<text x="560" y="162" class="xs mono" text-anchor="start">  worst 1.38 µm after 10 s</text>
<text x="560" y="179" class="xs mono" text-anchor="start">  44,889 of 44,915 within 1 µm</text>
<text x="560" y="196" class="xs mono" text-anchor="start">  only 5,264 bit-identical</text>
<text x="560" y="213" class="xs t-bad" text-anchor="start">AND THE CPU AGAINST ITSELF</text>
<text x="560" y="230" class="xs mono" text-anchor="start">  debug vs Release library: 897 of</text>
<text x="560" y="247" class="xs mono" text-anchor="start">  44,915 differ, worst 0.60 µm</text>
</svg>
