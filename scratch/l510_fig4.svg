<svg viewBox="0 0 720 348" role="img" aria-labelledby="l510f4-t l510f4-d">
  <title id="l510f4-t">The frame's stages and the hook added for the action map</title>
  <desc id="l510f4-d">The frame runs event drain, clock tick, input publish, the new on_input hook, zero or more fixed steps, and render. on_input is the only point at which input is fresh and no step has consumed it.</desc>
  <defs>
    <marker id="e-i-l510f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l510f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l510f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l510f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l510f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">One frame, and the gap Lesson 5.10 had to fill.</text>
<rect x="60" y="52" width="190" height="24" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.16"/>
<text x="155" y="68" class="xs mono" text-anchor="middle">drain events</text>
<text x="266" y="68" class="xs muted" text-anchor="start">on_event, per event</text>
<line x1="155" y1="78" x2="155" y2="92" class="ink-soft" stroke-width="1.0" marker-end="url(#e-s-l510f4)"/>
<rect x="60" y="94" width="190" height="24" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.16"/>
<text x="155" y="110" class="xs mono" text-anchor="middle">tick clock</text>
<line x1="155" y1="120" x2="155" y2="134" class="ink-soft" stroke-width="1.0" marker-end="url(#e-s-l510f4)"/>
<rect x="60" y="136" width="190" height="24" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.16"/>
<text x="155" y="152" class="xs mono" text-anchor="middle">publish input</text>
<text x="266" y="152" class="xs muted" text-anchor="start">input::update()</text>
<line x1="155" y1="162" x2="155" y2="176" class="ink-soft" stroke-width="1.0" marker-end="url(#e-s-l510f4)"/>
<rect x="60" y="178" width="190" height="24" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.26"/>
<text x="155" y="194" class="xs mono" text-anchor="middle">MAP ACTIONS</text>
<text x="266" y="194" class="xs muted" text-anchor="start">on_input()   &lt;- new</text>
<line x1="155" y1="204" x2="155" y2="218" class="ink-soft" stroke-width="1.0" marker-end="url(#e-s-l510f4)"/>
<rect x="60" y="220" width="190" height="24" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<text x="155" y="236" class="xs mono" text-anchor="middle">N fixed steps</text>
<text x="266" y="236" class="xs muted" text-anchor="start">on_fixed_step, 0..N times</text>
<line x1="155" y1="246" x2="155" y2="260" class="ink-soft" stroke-width="1.0" marker-end="url(#e-s-l510f4)"/>
<rect x="60" y="262" width="190" height="24" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.16"/>
<text x="155" y="278" class="xs mono" text-anchor="middle">render</text>
<text x="266" y="278" class="xs muted" text-anchor="start">on_frame(alpha)</text>
<rect x="56" y="172" width="198" height="30" rx="3" fill="none" stroke="#f0961e" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="24" y1="306" x2="696" y2="306" class="grid" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="470" y="180" class="xs t-hi" text-anchor="start">the ONLY moment at which</text>
<text x="470" y="193" class="xs muted" text-anchor="start">an action map may be updated</text>
<text x="470" y="232" class="xs t-ok" text-anchor="start">pressed() is valid HERE</text>
<text x="470" y="245" class="xs muted" text-anchor="start">(runs exactly once)</text>
<text x="470" y="268" class="xs t-bad" text-anchor="start">pressed() is NOT valid here</text>
<text x="470" y="281" class="xs muted" text-anchor="start">use consume_pressed()</text>
<line x1="462" y1="176" x2="440" y2="184" class="hi" stroke-width="1.1" marker-end="url(#e-h-l510f4)"/>
<line x1="462" y1="228" x2="440" y2="184" stroke="#5ac878" stroke-width="1.1" marker-end="url(#e-g-l510f4)"/>
<line x1="462" y1="264" x2="440" y2="226" stroke="#e05c5c" stroke-width="1.1" marker-end="url(#e-b-l510f4)"/>
<text x="24" y="322" class="xs muted" text-anchor="start">Before 5.10 nothing ran exactly once, after input was refreshed and before any step.</text>
<text x="24" y="334" class="xs muted" text-anchor="start">A map updated in on_frame would leave every step reading LAST frame's actions.</text>
</svg>
