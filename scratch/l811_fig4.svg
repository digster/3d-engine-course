<text x="818" y="353.0" class="xs mono" text-anchor="end">0.001778</text>
<text x="908" y="353.0" class="xs mono" text-anchor="end">0.001779</text>
<text x="560" y="370.0" class="xs" text-anchor="start">d = 0.50 W</text>
<text x="718" y="370.0" class="xs mono" text-anchor="end">0.7481</text>
<text x="818" y="370.0" class="xs mono" text-anchor="end">0.002986</text>
<text x="908" y="370.0" class="xs mono" text-anchor="end">0.002987</text>
