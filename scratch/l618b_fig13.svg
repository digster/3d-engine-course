<text x="499.0" y="162" class="xs mono" text-anchor="middle">write @0-&gt;1</text>
<text x="499.0" y="175" class="xs t-hi" text-anchor="middle">cycle YES</text>
<rect x="558" y="150" width="94" height="30" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.1"/>
<text x="605.0" y="162" class="xs mono" text-anchor="middle">keep  @1-&gt;2</text>
<text x="605.0" y="175" class="xs t-hi" text-anchor="middle">cycle no</text>
<rect x="770" y="150" width="94" height="30" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.1"/>
<text x="817.0" y="162" class="xs mono" text-anchor="middle">read  @2</text>
<text x="817.0" y="175" class="xs t-hi" text-anchor="middle">(indirect)</text>
