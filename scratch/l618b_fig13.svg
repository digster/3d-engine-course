<text x="393.0" y="114" class="xs mono" text-anchor="middle">keep  @2-&gt;3</text>
<text x="393.0" y="127" class="xs t-hi" text-anchor="middle">cycle no</text>
<rect x="558" y="102" width="94" height="30" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.1"/>
