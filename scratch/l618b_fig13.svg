<text x="605.0" y="210" class="xs mono" text-anchor="middle">write @0-&gt;1</text>
<text x="605.0" y="223" class="xs t-hi" text-anchor="middle">cycle YES</text>
<rect x="770" y="198" width="94" height="30" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.1"/>
<text x="817.0" y="210" class="xs mono" text-anchor="middle">read  @1</text>
<rect x="664" y="246" width="94" height="30" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.1"/>
<text x="711.0" y="258" class="xs mono" text-anchor="middle">clear @0-&gt;1</text>
<text x="711.0" y="271" class="xs t-hi" text-anchor="middle">STORE</text>
<rect x="770" y="246" width="94" height="30" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.1"/>
<text x="817.0" y="258" class="xs mono" text-anchor="middle">keep  @1-&gt;2</text>
<text x="817.0" y="271" class="xs t-hi" text-anchor="middle">LOAD</text>
<rect x="664" y="294" width="94" height="30" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.1"/>
<text x="711.0" y="306" class="xs mono" text-anchor="middle">clear @0-&gt;1</text>
<text x="711.0" y="319" class="xs t-hi" text-anchor="middle">STORE</text>
<rect x="770" y="294" width="94" height="30" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.1"/>
<text x="817.0" y="306" class="xs mono" text-anchor="middle">keep  @1-&gt;2</text>
<text x="817.0" y="319" class="xs t-hi" text-anchor="middle">LOAD, DONT_CARE</text>
<text x="20" y="338" class="xs" text-anchor="start">Schedule, from the declarations alone: step 0, step 1, step 2, clear args, compact, scene, sparks. (The harness's frame, without the scene, is the same order.)</text>
<text x="20" y="354" class="xs" text-anchor="start">hdr is imported (the post stack reads it next), so its last store is STORE; depth is the graph's own, so the sparks' pass ends DONT_CARE.</text>
<text x="20" y="370" class="xs muted" text-anchor="start">Refused at compile: a render pass that writes a buffer, a compute pass with an attachment, read-write slots with a gap or a repeat.</text>
</svg>
