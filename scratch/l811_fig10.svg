<text x="540" y="104" class="xs mono" text-anchor="start">4 sweeps × 2 steps</text>
<text x="789.949375" y="104" class="xs mono" text-anchor="start">163.1 mm</text>
<rect x="680" y="124" width="30.656875" height="20" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.55"/>
<text x="540" y="138" class="xs mono" text-anchor="start">2 sweeps × 4 steps</text>
<text x="718.656875" y="138" class="xs mono" text-anchor="start">49.1 mm</text>
<rect x="680" y="158" width="12.806875" height="20" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.55"/>
<text x="540" y="172" class="xs mono" text-anchor="start">1 sweep × 8 steps</text>
<text x="700.806875" y="172" class="xs mono" text-anchor="start">20.5 mm</text>
<line x1="680" y1="50" x2="680" y2="192" class="grid" stroke-width="1.0"/>
<text x="540" y="204" class="xs muted" text-anchor="start">Per joint, in the engine's loop, 1,000 joints</text>
<text x="540" y="224" class="xs muted" text-anchor="start">joint</text>
<text x="804" y="224" class="xs muted" text-anchor="end">prepare</text>
<text x="894" y="224" class="xs muted" text-anchor="end">per sweep</text>
<line x1="540" y1="232.0" x2="900" y2="232.0" class="grid" stroke-width="1.0"/>
<text x="540" y="249.0" class="xs" text-anchor="start">ball-socket, block</text>
<text x="804" y="249.0" class="xs mono" text-anchor="end">90.5 ns</text>
<text x="894" y="249.0" class="xs mono" text-anchor="end">13.7 ns</text>
<text x="540" y="266.0" class="xs" text-anchor="start">ball-socket, rows</text>
<text x="804" y="266.0" class="xs mono" text-anchor="end">104.2 ns</text>
<text x="894" y="266.0" class="xs mono" text-anchor="end">35.8 ns</text>
<text x="540" y="283.0" class="xs" text-anchor="start">hinge, block</text>
<text x="804" y="283.0" class="xs mono" text-anchor="end">112.5 ns</text>
<text x="894" y="283.0" class="xs mono" text-anchor="end">23.9 ns</text>
<text x="540" y="300.0" class="xs" text-anchor="start">hinge + limit + motor</text>
<text x="804" y="300.0" class="xs mono" text-anchor="end">138.8 ns</text>
<text x="894" y="300.0" class="xs mono" text-anchor="end">60.0 ns</text>
<text x="540" y="317.0" class="xs" text-anchor="start">rod</text>
<text x="804" y="317.0" class="xs mono" text-anchor="end">90.5 ns</text>
<text x="894" y="317.0" class="xs mono" text-anchor="end">12.4 ns</text>
<text x="540" y="345.5" class="xs muted" text-anchor="start">Against 129 ns per contact manifold per sweep (8.10 §13): a hinge with a</text>
<text x="540" y="360.5" class="xs muted" text-anchor="start">limit and a motor costs less than half of one crate resting on another.</text>
