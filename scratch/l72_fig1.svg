<svg viewBox="0 0 760 404" role="img" aria-labelledby="f72a-t f72a-d">
  <title id="f72a-t">A rotation fixes a line</title>
  <desc id="f72a-d">Two panels showing the same three vectors before and after a 58 degree rotation. A teal line runs through the origin in both. The teal vector lying along that line is in exactly the same place in both panels; the amber and blue vectors have swung round it, with faint dashed lines marking where they started. A dashed grey circle around the teal line shows the orbit that everything off the axis is confined to.</desc>
