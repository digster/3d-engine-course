<text x="24" y="356" class="xs t-hi" text-anchor="start">READ THE BOTTOM ROW RIGHT TO LEFT.</text>
<text x="24" y="374" class="xs muted" text-anchor="start">Near white the error is 1.1x and looks like nothing. In shadow it is 13x. That shape is why four modules of looking at</text>
<text x="24" y="390" class="xs muted" text-anchor="start">this picture did not find it: the bright half is nearly right, and the dark half reads as a deliberate mood rather than</text>
<text x="24" y="406" class="xs muted" text-anchor="start">a defect. An error that is a RATIO hides wherever there is least contrast to spare.</text>
<text x="24" y="432" class="xs t-hi" text-anchor="start">Both rows are real downloaded pixels — verify_61 §F renders each level into both target formats and prints this table. The</text>
<text x="24" y="448" class="xs muted" text-anchor="start">swatches ARE the stored codes, so the top row is literally what the engine used to display.</text>
