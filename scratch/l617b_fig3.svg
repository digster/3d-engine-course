<svg viewBox="0 0 800 360" role="img" aria-labelledby="l617bf3-t l617bf3-d">
  <title id="l617bf3-t">The spot cone and its falloff</title>
  <desc id="l617bf3-d">Left: a spot light's axis with inner and outer half-angles of 0.30 and 0.45 radians. Right: the falloff between them. Interpolating in cosine and squaring gives 0.2999 at the angular midpoint, where a ramp linear in angle would give 0.25.</desc>
