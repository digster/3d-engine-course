<text x="126.7" y="102.2" class="mono xs t-hi" text-anchor="middle">+Y</text>
<rect x="263.33333333333337" y="50" width="233.33333333333334" height="214" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="3 4"/>
<text x="380.0" y="24" class="sm" text-anchor="middle">2 · pitch</text>
<text x="380.0" y="40" class="xs muted" text-anchor="middle">about the +X the yaw carried (yaw 40°)</text>
