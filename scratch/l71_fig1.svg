    <marker id="e-i-f71a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f71a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f71a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f71a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f71a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-bl-f71a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<rect x="10.0" y="50" width="233.33333333333334" height="214" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="3 4"/>
<text x="126.66666666666667" y="24" class="sm" text-anchor="middle">1 · yaw</text>
<text x="126.66666666666667" y="40" class="xs muted" text-anchor="middle">about world +Y, which never moves</text>
<path d="M 118.34,142.28 L 194.46,168.35 L 134.99,201.72 L 58.87,175.65 Z" fill="none" stroke="#8f918a" stroke-width="0.9" stroke-dasharray="2 4"/>
