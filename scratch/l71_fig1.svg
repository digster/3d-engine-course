<svg viewBox="0 0 760 356" role="img" aria-labelledby="f71a-t f71a-d">
  <title id="f71a-t">The intrinsic chain</title>
  <desc id="f71a-d">Three panels sharing one viewpoint. In the first, the world +Y axis is solid green and the other two are dashed; there is no arc, because yaw's axis is the world's own. In the second, a 40 degree yaw has carried the +X axis away from its old position, which is shown as a grey dashed stub labelled 'was here', with a red arc joining the two. In the third, the yaw and a 55 degree pitch have together carried +Z, with a blue arc from its old position.</desc>
