<line x1="634.46" y1="225.38" x2="634.42" y2="225.60" stroke="#5082e6" stroke-width="1.8" marker-end="url(#e-bl-f71a)"/>
<line x1="633.33" y1="172.00" x2="634.58" y2="233.33" stroke="#5082e6" stroke-width="2.6" marker-end="url(#e-bl-f71a)"/>
<text x="634.9" y="253.3" class="mono xs t-hi" text-anchor="middle">+Z</text>
<text x="380.0" y="296" class="mono sm" text-anchor="middle">R = rotation_y(yaw) · rotation_x(pitch) · rotation_z(roll)</text>
<text x="380.0" y="320" class="xs muted" text-anchor="middle">read LEFT to right and it is the story above: the knobs in the order a human turns them.</text>
<text x="380.0" y="336" class="xs muted" text-anchor="middle">read RIGHT to left and it is the order the matrices act — roll first, in the object's own frame.</text>
</svg>
