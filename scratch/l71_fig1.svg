<text x="633.3333333333334" y="24" class="sm" text-anchor="middle">3 · roll</text>
<text x="633.3333333333334" y="40" class="xs muted" text-anchor="middle">about the +Z both carried (pitch 55°)</text>
<path d="M 625.01,142.28 L 701.13,168.35 L 641.66,201.72 L 565.54,175.65 Z" fill="none" stroke="#8f918a" stroke-width="0.9" stroke-dasharray="2 4"/>
