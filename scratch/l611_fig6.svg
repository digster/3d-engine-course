<svg viewBox="0 0 720 420" role="img" aria-labelledby="f611f-t f611f-d">
  <title id="f611f-t">Bucketing, sorting, and the limit of per-object order</title>
  <desc id="f611f-d">A draw list partitioned into an unsorted pass and a back-to-front pass, and two intersecting transparent quads for which no per-object order is correct.</desc>
  <defs>
    <marker id="e-i-f611f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f611f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f611f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f611f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f611f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">The sort, and where sorting runs out</text>
<text x="360.0" y="52" class="xs" text-anchor="middle">one frame's draw list, bucketed</text>
<rect x="64.0" y="64" width="92" height="30" rx="4" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="64.0" y="64" width="92" height="30" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="110.0" y="84" class="xs" text-anchor="middle">opaque 1</text>
<rect x="164.0" y="64" width="92" height="30" rx="4" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="164.0" y="64" width="92" height="30" rx="4" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="210.0" y="84" class="xs" text-anchor="middle">blend 5</text>
<rect x="264.0" y="64" width="92" height="30" rx="4" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="264.0" y="64" width="92" height="30" rx="4" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="310.0" y="84" class="xs" text-anchor="middle">mask 3</text>
<rect x="364.0" y="64" width="92" height="30" rx="4" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="364.0" y="64" width="92" height="30" rx="4" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="410.0" y="84" class="xs" text-anchor="middle">blend 12</text>
<rect x="464.0" y="64" width="92" height="30" rx="4" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="464.0" y="64" width="92" height="30" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="510.0" y="84" class="xs" text-anchor="middle">opaque 2</text>
<rect x="564.0" y="64" width="92" height="30" rx="4" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="564.0" y="64" width="92" height="30" rx="4" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="610.0" y="84" class="xs" text-anchor="middle">blend 8</text>
<line x1="360.0" y1="100" x2="360.0" y2="124" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-f611f)"/>
<rect x="64.0" y="130" width="92" height="30" rx="4" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="64.0" y="130" width="92" height="30" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="110.0" y="150" class="xs" text-anchor="middle">opaque 1</text>
<rect x="164.0" y="130" width="92" height="30" rx="4" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="164.0" y="130" width="92" height="30" rx="4" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="210.0" y="150" class="xs" text-anchor="middle">mask 3</text>
<rect x="264.0" y="130" width="92" height="30" rx="4" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="264.0" y="130" width="92" height="30" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="310.0" y="150" class="xs" text-anchor="middle">opaque 2</text>
<rect x="364.0" y="130" width="92" height="30" rx="4" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="364.0" y="130" width="92" height="30" rx="4" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="410.0" y="150" class="xs" text-anchor="middle">blend 12</text>
<rect x="464.0" y="130" width="92" height="30" rx="4" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="464.0" y="130" width="92" height="30" rx="4" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="510.0" y="150" class="xs" text-anchor="middle">blend 8</text>
<rect x="564.0" y="130" width="92" height="30" rx="4" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.28"/>
<rect x="564.0" y="130" width="92" height="30" rx="4" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="610.0" y="150" class="xs" text-anchor="middle">blend 5</text>
<line x1="360.0" y1="124.0" x2="360.0" y2="172.0" stroke="#f0961e" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
<text x="210.0" y="184" class="xs" text-anchor="middle">unsorted — the z-buffer sorts these</text>
<text x="510.0" y="184" class="xs" text-anchor="middle">sorted BACK TO FRONT</text>
<text x="360.0" y="204" class="xs" text-anchor="middle">masked geometry goes with the OPAQUE geometry: a discarded fragment writes no depth, so it occludes nothing</text>
<line x1="60" y1="226" x2="660" y2="226" class="grid" stroke-width="1.0"/>
<text x="360.0" y="250" class="xs" text-anchor="middle">and the case no per-object order can fix</text>
<polygon points="176,293.0 324,367.0 324,385.0 176,311.0" fill="#e05c5c" fill-opacity="0.45" stroke="#e05c5c" stroke-width="1.2"/>
<polygon points="176,367.0 324,293.0 324,311.0 176,385.0" fill="#5082e6" fill-opacity="0.45" stroke="#5082e6" stroke-width="1.2"/>
<text x="250" y="406" class="xs" text-anchor="middle">two blended quads, intersecting</text>
<line x1="250.0" y1="286.0" x2="250.0" y2="374.0" stroke="#f0961e" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
<text x="258" y="278" class="xs" text-anchor="start">the crossing</text>
<text x="430" y="292" class="xs" text-anchor="start">LEFT of the crossing, red is in front.</text>
<text x="430" y="312" class="xs" text-anchor="start">RIGHT of it, blue is.</text>
<text x="430" y="340" class="xs" text-anchor="start">A per-object order can draw red first or</text>
<text x="430" y="358" class="xs" text-anchor="start">blue first. The correct picture needs BOTH,</text>
<text x="430" y="376" class="xs" text-anchor="start">on opposite sides of one line — so it is not</text>
<text x="430" y="394" class="xs" text-anchor="start">a better sort that is missing. It is OIT.</text>
</svg>
