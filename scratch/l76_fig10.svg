<svg viewBox="0 0 760 378" role="img" aria-labelledby="f76i-t f76i-d">
  <title id="f76i-t">Linear blend skinning against nlerp and slerp</title>
  <desc id="f76i-d">Two curves of worst angular departure from the geodesic against the twist between two joints. Linear blend skinning is above normalised linear interpolation at every arc.</desc>
  <defs>
    <marker id="e-i-f76i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f76i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f76i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f76i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f76i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="56.0" y="62.0" width="396.0" height="214.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="254.0" y="38.0" class="sm" text-anchor="middle">worst departure from the geodesic</text>
<text x="254.0" y="52.0" class="xs muted" text-anchor="middle">degrees of pose, over the whole blend</text>
<path d="M 90.00,245.73 L 158.46,243.77 L 226.91,237.85 L 295.37,224.10 L 363.83,193.32 L 430.00,92.74" fill="none" stroke="#ec7a8c" stroke-width="1.8"/>
<circle cx="90.00" cy="245.73" r="2.6" fill="#ec7a8c"/>
<circle cx="158.46" cy="243.77" r="2.6" fill="#ec7a8c"/>
<circle cx="226.91" cy="237.85" r="2.6" fill="#ec7a8c"/>
<circle cx="295.37" cy="224.10" r="2.6" fill="#ec7a8c"/>
<circle cx="363.83" cy="193.32" r="2.6" fill="#ec7a8c"/>
<circle cx="430.00" cy="92.74" r="2.6" fill="#ec7a8c"/>
<text x="424.0" y="82.74279999999999" class="xs" text-anchor="end">LBS</text>
<path d="M 90.00,245.93 L 158.46,245.47 L 226.91,244.16 L 295.37,241.53 L 363.83,236.97 L 430.00,230.00" fill="none" stroke="#60c4ce" stroke-width="1.8"/>
<circle cx="90.00" cy="245.93" r="2.6" fill="#60c4ce"/>
<circle cx="158.46" cy="245.47" r="2.6" fill="#60c4ce"/>
<circle cx="226.91" cy="244.16" r="2.6" fill="#60c4ce"/>
<circle cx="295.37" cy="241.53" r="2.6" fill="#60c4ce"/>
<circle cx="363.83" cy="236.97" r="2.6" fill="#60c4ce"/>
<circle cx="430.00" cy="230.00" r="2.6" fill="#60c4ce"/>
<text x="424.0" y="219.9988" class="xs" text-anchor="end">nlerp</text>
<text x="90.0" y="264.0" class="xs mono" text-anchor="middle">30</text>
<text x="158.4563758389262" y="264.0" class="xs mono" text-anchor="middle">60</text>
<text x="226.91275167785236" y="264.0" class="xs mono" text-anchor="middle">90</text>
<text x="295.3691275167785" y="264.0" class="xs mono" text-anchor="middle">120</text>
<text x="363.8255033557047" y="264.0" class="xs mono" text-anchor="middle">150</text>
<text x="430.0" y="264.0" class="xs mono" text-anchor="middle">179</text>
<text x="254.0" y="298.0" class="xs muted" text-anchor="middle">twist between the two joints, degrees</text>
<line x1="90.0" y1="246.0" x2="440.0" y2="246.0" class="grid" stroke-width="1.0" stroke-dasharray="2 5"/>
<text x="86.0" y="250.0" class="xs mono" text-anchor="end">0</text>
<line x1="90.0" y1="206.0" x2="440.0" y2="206.0" class="grid" stroke-width="1.0" stroke-dasharray="2 5"/>
<text x="86.0" y="210.0" class="xs mono" text-anchor="end">20</text>
<line x1="90.0" y1="166.0" x2="440.0" y2="166.0" class="grid" stroke-width="1.0" stroke-dasharray="2 5"/>
<text x="86.0" y="170.0" class="xs mono" text-anchor="end">40</text>
<line x1="90.0" y1="126.0" x2="440.0" y2="126.0" class="grid" stroke-width="1.0" stroke-dasharray="2 5"/>
<text x="86.0" y="130.0" class="xs mono" text-anchor="end">60</text>
<line x1="90.0" y1="86.0" x2="440.0" y2="86.0" class="grid" stroke-width="1.0" stroke-dasharray="2 5"/>
<text x="86.0" y="90.0" class="xs mono" text-anchor="end">80</text>
<text x="484.0" y="58" class="sm" text-anchor="start">two errors, and one it dodges</text>
<text x="484.0" y="82" class="xs muted" text-anchor="start">LBS gets the SCHEDULE wrong too, by</text>
<text x="484.0" y="99" class="xs muted" text-anchor="start">nlerp's formula at the WHOLE angle</text>
<text x="484.0" y="116" class="xs muted" text-anchor="start">rather than the half angle — 10.95°</text>
<text x="484.0" y="133" class="xs muted" text-anchor="start">against 2.23° at a 120° twist.</text>
<text x="484.0" y="150" class="xs muted" text-anchor="start"></text>
<text x="484.0" y="167" class="xs muted" text-anchor="start">At t = 0.5 both are exact in angle and</text>
<text x="484.0" y="184" class="xs muted" text-anchor="start">only the radius is left: 0.500000.</text>
<text x="484.0" y="201" class="xs muted" text-anchor="start"></text>
<text x="484.0" y="218" class="xs muted" text-anchor="start">And the one thing matrices win. A</text>
<text x="484.0" y="235" class="xs muted" text-anchor="start">rotation matrix is UNIQUE, so there is</text>
<text x="484.0" y="252" class="xs muted" text-anchor="start">no double cover, no long way round,</text>
<text x="484.0" y="269" class="xs muted" text-anchor="start">and no `nearest` to forget. 7.5's</text>
<text x="484.0" y="286" class="xs muted" text-anchor="start">359° bug cannot be written here.</text>
<text x="380.0" y="358" class="xs muted" text-anchor="middle">so “LBS is nlerp without the normalise” is the wrong one-liner — it is worse than that, and better</text>
</svg>
