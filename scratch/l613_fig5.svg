<svg viewBox="0 0 720 360" role="img" aria-labelledby="f613e-t f613e-d">
  <title id="f613e-t">The bilinear-tap and box-convolution identities</title>
  <desc id="f613e-d">Left: a two by two block of texels with a bilinear sample at the shared corner returning their mean. Right: two unit boxes convolved into a one-two-one tent, and the resulting three by three kernel.</desc>
  <defs>
    <marker id="e-i-f613e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f613e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f613e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f613e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f613e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">Two identities, and the hardware that makes them free</text>
<text x="122" y="48" class="xs" text-anchor="middle">ONE TAP = FOUR TEXELS</text>
<rect x="70" y="62" width="52" height="52" rx="2" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="96.0" y="93.0" class="sm" text-anchor="middle">1</text>
<rect x="122" y="62" width="52" height="52" rx="2" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="148.0" y="93.0" class="sm" text-anchor="middle">2</text>
<rect x="70" y="114" width="52" height="52" rx="2" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="96.0" y="145.0" class="sm" text-anchor="middle">4</text>
<rect x="122" y="114" width="52" height="52" rx="2" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="148.0" y="145.0" class="sm" text-anchor="middle">8</text>
<circle cx="122" cy="114" r="5" fill="#f0961e"/>
<text x="122" y="186" class="xs" text-anchor="middle">sample at the shared corner</text>
<text x="122" y="202" class="xs" text-anchor="middle">all four weights are 1/2 x 1/2</text>
<text x="122" y="220" class="xs" text-anchor="middle">= 3.75, the mean</text>
<text x="122" y="238" class="xs" text-anchor="middle">(1+2+4+8)/4 = 3.75</text>
<text x="450" y="48" class="xs" text-anchor="middle">BOX CONVOLVED WITH BOX = TENT</text>
<rect x="300" y="102" width="23" height="30" rx="1" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.35"/>
<rect x="326" y="102" width="23" height="30" rx="1" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.35"/>
<text x="326" y="150" class="xs" text-anchor="middle">[1 1]</text>
<text x="359" y="120" class="sm" text-anchor="middle">*</text>
<rect x="366" y="102" width="23" height="30" rx="1" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.35"/>
<rect x="392" y="102" width="23" height="30" rx="1" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.35"/>
<text x="392" y="150" class="xs" text-anchor="middle">[1 1]</text>
<text x="440" y="120" class="sm" text-anchor="middle">=</text>
<rect x="460" y="117" width="23" height="15" rx="1" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.4"/>
<rect x="486" y="102" width="23" height="30" rx="1" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.4"/>
<rect x="512" y="117" width="23" height="15" rx="1" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.4"/>
<text x="499.0" y="150" class="xs" text-anchor="middle">[1 2 1]</text>
<text x="450" y="174" class="xs" text-anchor="middle">so a BILINEAR UPSAMPLE already IS a tent filter —</text>
<text x="450" y="190" class="xs" text-anchor="middle">the 3x3 kernel is that vector's outer product,</text>
<text x="450" y="206" class="xs" text-anchor="middle">summing to 16/16 = 1 exactly</text>
<rect x="408" y="218" width="26" height="26" rx="2" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="421.0" y="235.0" class="xs" text-anchor="middle">1</text>
<rect x="434" y="218" width="26" height="26" rx="2" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="447.0" y="235.0" class="xs" text-anchor="middle">2</text>
<rect x="460" y="218" width="26" height="26" rx="2" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="473.0" y="235.0" class="xs" text-anchor="middle">1</text>
<rect x="408" y="244" width="26" height="26" rx="2" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="421.0" y="261.0" class="xs" text-anchor="middle">2</text>
<rect x="434" y="244" width="26" height="26" rx="2" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="447.0" y="261.0" class="xs" text-anchor="middle">4</text>
<rect x="460" y="244" width="26" height="26" rx="2" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="473.0" y="261.0" class="xs" text-anchor="middle">2</text>
<rect x="408" y="270" width="26" height="26" rx="2" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="421.0" y="287.0" class="xs" text-anchor="middle">1</text>
<rect x="434" y="270" width="26" height="26" rx="2" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="447.0" y="287.0" class="xs" text-anchor="middle">2</text>
<rect x="460" y="270" width="26" height="26" rx="2" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="473.0" y="287.0" class="xs" text-anchor="middle">1</text>
<text x="532" y="261.0" class="xs" text-anchor="middle">/ 16</text>
<text x="360.0" y="316" class="xs" text-anchor="middle">Neither identity is a trick for its own sake. The first is why the downsample shader is one line and why its sampler is</text>
<text x="360.0" y="334" class="xs" text-anchor="middle">LINEAR where the 6.12 resolve's is NEAREST — here the filter mode is doing arithmetic rather than smoothing. The second</text>
<text x="360.0" y="352" class="xs" text-anchor="middle">is why the upsample's weights are 1-2-1 and not something that merely looks symmetric.</text>
</svg>
