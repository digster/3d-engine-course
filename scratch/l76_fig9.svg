<svg viewBox="0 0 760 388" role="img" aria-labelledby="f76j-t f76j-d">
  <title id="f76j-t">What skinning costs, and what it has to send</title>
  <desc id="f76j-d">Two bar panels: per-frame time split between the palette and the vertices, and per-frame bytes for the same split. Below, a table comparing an unoptimised library build against a Release one.</desc>
  <defs>
    <marker id="e-i-f76j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f76j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f76j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f76j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f76j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="194.0" y="35.0" class="sm" text-anchor="middle">where a frame's skinning time goes</text>
<text x="194.0" y="48.0" class="xs muted" text-anchor="middle">the palette is 2.34% of the two</text>
<rect x="24.0" y="62.0" width="340.0" height="118.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<rect x="32.0" y="82.0" width="5.5747572815533974" height="20.060000000000002" rx="2" fill="#60c4ce" stroke="#60c4ce" stroke-width="1.0" fill-opacity="0.85"/>
<text x="32.0" y="75.0" class="xs muted" text-anchor="start">palette, 64 joints</text>
<text x="41.574757281553396" y="99.06" class="xs mono" text-anchor="start">0.99 us</text>
<rect x="32.0" y="141.0" width="232.0" height="20.060000000000002" rx="2" fill="#ec7a8c" stroke="#ec7a8c" stroke-width="1.0" fill-opacity="0.85"/>
<text x="32.0" y="134.0" class="xs muted" text-anchor="start">skin, 4,840 vertices</text>
<text x="268.0" y="158.06" class="xs mono" text-anchor="start">41.20 us</text>
<text x="566.0" y="35.0" class="sm" text-anchor="middle">what a frame has to SEND</text>
<text x="566.0" y="48.0" class="xs muted" text-anchor="middle">28.4x, which is the whole GPU-skinning argument</text>
<rect x="396.0" y="62.0" width="340.0" height="118.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<rect x="404.0" y="82.0" width="8.180716253443526" height="20.060000000000002" rx="2" fill="#60c4ce" stroke="#60c4ce" stroke-width="1.0" fill-opacity="0.85"/>
<text x="404.0" y="75.0" class="xs muted" text-anchor="start">palette</text>
<text x="416.1807162534435" y="99.06" class="xs mono" text-anchor="start">4.0 KB</text>
<rect x="404.0" y="141.0" width="232.0" height="20.060000000000002" rx="2" fill="#ec7a8c" stroke="#ec7a8c" stroke-width="1.0" fill-opacity="0.85"/>
<text x="404.0" y="134.0" class="xs muted" text-anchor="start">deformed positions + normals</text>
<text x="640.0" y="158.06" class="xs mono" text-anchor="start">113.4 KB</text>
<line x1="24" y1="200.0" x2="736" y2="200.0" class="grid" stroke-width="1.0"/>
<text x="24" y="218.0" class="sm" text-anchor="start">and the measurement that nearly did not mean anything</text>
<text x="24.0" y="244.0" class="xs muted" text-anchor="start"></text>
<text x="448.0" y="244.0" class="xs muted" text-anchor="end">per vertex</text>
<text x="578.0" y="244.0" class="xs muted" text-anchor="end">per palette</text>
<line x1="24.0" y1="252.0" x2="584.0" y2="252.0" class="grid" stroke-width="1.0"/>
<text x="24.0" y="269.0" class="xs" text-anchor="start">libengine.a, no build type</text>
<text x="448.0" y="269.0" class="xs mono" text-anchor="end">153.90 ns</text>
<text x="578.0" y="269.0" class="xs mono" text-anchor="end">26.32 us</text>
<text x="24.0" y="286.0" class="xs" text-anchor="start">libengine.a, Release</text>
<text x="448.0" y="286.0" class="xs mono" text-anchor="end">8.51 ns</text>
<text x="578.0" y="286.0" class="xs mono" text-anchor="end">0.99 us</text>
<text x="24.0" y="303.0" class="xs" text-anchor="start">ratio</text>
<text x="448.0" y="303.0" class="xs mono" text-anchor="end">18.1×</text>
<text x="578.0" y="303.0" class="xs mono" text-anchor="end">26.6×</text>
<text x="24.0" y="334.0" class="xs muted" text-anchor="start">`cmake -S . -B build` leaves CMAKE_BUILD_TYPE EMPTY, so the library carries no -O flag at all — and</text>
<text x="24.0" y="350.0" class="xs muted" text-anchor="start">-O2 on the harness's own command line does not reach what the harness LINKS.</text>
</svg>
