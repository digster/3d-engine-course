<svg viewBox="0 0 720 430" role="img" aria-labelledby="l62f4-t l62f4-d">
  <title id="l62f4-t">A BRDF is a ratio with units of inverse steradian</title>
  <desc id="l62f4-d">Two surfaces: one scattering into the whole hemisphere with a BRDF of one over pi, one concentrating into a 20 degree cone with a BRDF of 2.72 per steradian. Both reflect all the arriving light.</desc>
  <defs>
    <marker id="e-i-l62f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l62f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l62f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l62f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l62f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">A BRDF answers one question: of the light arriving from l, how much leaves toward v — per steradian?</text>
<text x="190" y="52" class="sm t-hi" text-anchor="middle">LAMBERT — scatters into the whole hemisphere</text>
<text x="190" y="68" class="xs muted" text-anchor="middle">half-angle 90°</text>
<path d="M 124.0 250 A 66.0 66.0 0 0 1 256.0 250 Z" fill="#5082e6" fill-opacity="0.20" stroke="#5082e6" stroke-width="1.4"/>
<line x1="42" y1="250" x2="338" y2="250" class="ink" stroke-width="2.0"/>
<line x1="91.94631128077081" y1="167.72318596012298" x2="185.40373334128614" y2="246.14327434188075" class="hi" stroke-width="1.8" marker-end="url(#e-h-l62f4)"/>
<text x="79.94631128077081" y="163.72318596012298" class="sm mono t-hi" text-anchor="middle">l</text>
<line x1="190" y1="250" x2="190" y2="146" class="ink" stroke-width="1.2" marker-end="url(#e-i-l62f4)"/>
<text x="199" y="144" class="xs mono muted" text-anchor="start">n</text>
<line x1="194.23935411386563" y1="243.2156152307486" x2="264.1886969926487" y2="131.27326653810036" class="ink-soft" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#e-s-l62f4)"/>
<text x="270.5477281634471" y="125.09668938422325" class="sm mono" text-anchor="middle">v</text>
<text x="190" y="294" class="xs mono t-ok" text-anchor="middle">fᵣ = 1/π = 0.3183 sr⁻¹</text>
<text x="190" y="310" class="xs muted" text-anchor="middle">reflects 100% of what arrives</text>
<text x="530" y="52" class="sm t-hi" text-anchor="middle">GLOSSY — concentrates into a narrow cone</text>
<text x="530" y="68" class="xs muted" text-anchor="middle">half-angle 20°</text>
<path d="M 530 250 L 588.0 149.5 A 116.0 116.0 0 0 1 639.0 210.3 Z" fill="#9b7ede" fill-opacity="0.22" stroke="#9b7ede" stroke-width="1.4"/>
<line x1="382" y1="250" x2="678" y2="250" class="ink" stroke-width="2.0"/>
<line x1="431.94631128077083" y1="167.72318596012298" x2="525.4037333412862" y2="246.14327434188075" class="hi" stroke-width="1.8" marker-end="url(#e-h-l62f4)"/>
<text x="419.94631128077083" y="163.72318596012298" class="sm mono t-hi" text-anchor="middle">l</text>
<line x1="530" y1="250" x2="530" y2="146" class="ink" stroke-width="1.2" marker-end="url(#e-i-l62f4)"/>
<text x="539" y="144" class="xs mono muted" text-anchor="start">n</text>
<line x1="536.1283555449518" y1="244.85769912250768" x2="637.246222036657" y2="160.00973464388449" class="ink-soft" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#e-s-l62f4)"/>
<text x="646.4387553540846" y="156.29628332764605" class="sm mono" text-anchor="middle">v</text>
<text x="530" y="294" class="xs mono t-bad" text-anchor="middle">fᵣ = 1/(π sin²20°) = 2.7210 sr⁻¹</text>
<text x="530" y="310" class="xs muted" text-anchor="middle">reflects 100% of what arrives</text>
<rect x="24" y="336" width="672" height="78" rx="4" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="358" class="sm t-hi" text-anchor="middle">BOTH SURFACES REFLECT EVERYTHING. The right one is not brighter overall — it is brighter in one direction and darker in the rest.</text>
<text x="360.0" y="380" class="xs muted" text-anchor="middle">A BRDF is what leaves PER STERADIAN, so its value is one over the solid angle the light is spread across — and that is large exactly</text>
<text x="360.0" y="396" class="xs muted" text-anchor="middle">when the spread is small. A mirror’s BRDF is unbounded, and still reflects at most what arrived. Exceeding 1 costs nothing.</text>
</svg>
