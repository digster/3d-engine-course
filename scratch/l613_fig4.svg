<text x="554" y="74" class="xs" text-anchor="start">hard: max(x - T, 0)</text>
<text x="554" y="90" class="xs" text-anchor="start">f' jumps 0 -&gt; 1 at T</text>
<line x1="526.0" y1="118.0" x2="548.0" y2="118.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="554" y="122" class="xs" text-anchor="start">soft: (x-T+k)^2 / 4k</text>
<text x="554" y="138" class="xs" text-anchor="start">f'(T-k) = 0, f'(T+k) = 1</text>
<rect x="520" y="156" width="172" height="40" rx="4" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="606" y="174" class="xs" text-anchor="middle">at x = T exactly:</text>
<text x="606" y="188" class="xs" text-anchor="middle">f = k/4 = 0.125, f' = 0.5</text>
<line x1="291.27272727272725" y1="249.42307692307693" x2="516" y2="174" class="grid" stroke-width="0.9" stroke-dasharray="2 3"/>
<rect x="520" y="212" width="172" height="62" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="606" y="230" class="xs" text-anchor="middle">THE ARTEFACT</text>
<text x="606" y="246" class="xs" text-anchor="middle">0.999 contributes 0.000000</text>
<text x="606" y="260" class="xs" text-anchor="middle">1.001 contributes 0.001000</text>
<text x="350.0" y="338" class="xs" text-anchor="middle">The quadratic is not chosen, it is the only one that fits: three conditions (value 0 and slope 0 at T-k, slope 1 at T+k)</text>
<text x="350.0" y="356" class="xs" text-anchor="middle">and three coefficients. Matching the SLOPE is what matters — a curve that is merely continuous still has a kink, and a</text>
<text x="350.0" y="374" class="xs" text-anchor="middle">kink in the bright pass is a contour in the image that crawls as the camera moves. The symptom is a shimmering edge</text>
<text x="350.0" y="392" class="xs" text-anchor="middle">along every gradient that happens to pass through the threshold.</text>
</svg>
