  <title id="l43f3-t">The size of every file in the toolchain</title>
  <desc id="l43f3-d">A grouped bar chart, four shaders by four file types. Compiled shader code is tiny: the largest SPIR-V here is 1,100 bytes and the largest MSL is 585. The reflection JSON, at roughly 230 to 310 bytes, is the same order of size as the code it describes. The HLSL bars are the longest only because this course's shaders carry more comment than code.</desc>
