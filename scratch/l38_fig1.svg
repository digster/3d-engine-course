<svg viewBox="0 0 700 268" role="img" aria-labelledby="g1-t g1-d">
  <title id="g1-t">The 2 by 3 grid of normal source against evaluation point</title>
  <desc id="g1-d">A two-row, three-column grid. The rows are labelled FACE normal and VERTEX normal; the columns are flat (per triangle), Gouraud (per vertex) and per-pixel (per fragment). The whole FACE row is shaded to show that all three of its cells produce the identical picture, zero pixels differing. The VERTEX row does not: faceted differs from per-pixel by 5,285 pixels and Gouraud by 4,344. A note below records that the top row separates too once a view-dependent specular term is switched on, by 1,231 and 761 pixels.</desc>
  <defs>
    <marker id="d-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok-bd)"/></marker>
    <marker id="d-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--verify-bd)"/></marker>
    <marker id="d-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
  </defs>
<text x="24" y="34" class="sm" font-weight="700">Two questions, not one.</text><text x="24" y="52" class="xs muted">diffuse-only model</text><text x="242.0" y="92.0" class="xs muted" text-anchor="middle">flat</text><text x="242.0" y="105.0" class="xs muted" text-anchor="middle">(per triangle)</text><text x="390.0" y="92.0" class="xs muted" text-anchor="middle">Gouraud</text><text x="390.0" y="105.0" class="xs muted" text-anchor="middle">(per vertex)</text><text x="538.0" y="92.0" class="xs muted" text-anchor="middle">per-pixel</text><text x="538.0" y="105.0" class="xs muted" text-anchor="middle">(per fragment)</text><g class="grid"><rect x="168.0" y="118.0" width="444.0" height="74.0" rx="5" fill="var(--ok-bg)" fill-opacity="0.75"/></g><text x="152.0" y="151.0" class="xs muted" text-anchor="end">FACE</text><text x="152.0" y="164.0" class="xs muted" text-anchor="end">normal</text><rect x="168.0" y="118.0" width="148.0" height="74.0" fill="none" stroke="var(--rule-strong)" stroke-width="1"/><rect x="316.0" y="118.0" width="148.0" height="74.0" fill="none" stroke="var(--rule-strong)" stroke-width="1"/><rect x="464.0" y="118.0" width="148.0" height="74.0" fill="none" stroke="var(--rule-strong)" stroke-width="1"/><text x="152.0" y="225.0" class="xs muted" text-anchor="end">VERTEX</text><text x="152.0" y="238.0" class="xs muted" text-anchor="end">normal</text><rect x="168.0" y="192.0" width="148.0" height="74.0" fill="none" stroke="var(--rule-strong)" stroke-width="1"/><rect x="316.0" y="192.0" width="148.0" height="74.0" fill="none" stroke="var(--rule-strong)" stroke-width="1"/><rect x="464.0" y="192.0" width="148.0" height="74.0" fill="none" stroke="var(--rule-strong)" stroke-width="1"/><text x="242.0" y="148.0" class="sm" text-anchor="middle" font-weight="700">flat</text><text x="242.0" y="166.0" class="xs muted" text-anchor="middle">the classic</text><text x="390.0" y="148.0" class="sm" text-anchor="middle" font-weight="700">= flat</text><text x="390.0" y="166.0" class="xs muted" text-anchor="middle">0 px differ</text><text x="538.0" y="148.0" class="sm" text-anchor="middle" font-weight="700">= flat</text><text x="538.0" y="166.0" class="xs muted" text-anchor="middle">0 px differ</text><text x="242.0" y="222.0" class="sm" text-anchor="middle" font-weight="700">faceted</text><text x="242.0" y="240.0" class="xs muted" text-anchor="middle">5,285 px vs per-pixel</text><text x="390.0" y="222.0" class="sm" text-anchor="middle" font-weight="700">Gouraud</text><text x="390.0" y="240.0" class="xs muted" text-anchor="middle">4,344 px vs per-pixel</text><text x="538.0" y="222.0" class="sm" text-anchor="middle" font-weight="700">Phong shading</text><text x="538.0" y="240.0" class="xs muted" text-anchor="middle">the reference</text><text x="390.0" y="70.0" class="xs t-ok" text-anchor="middle">a constant normal makes all three agree — exactly</text>
</svg>
