<svg viewBox="0 0 720 330" role="img" aria-labelledby="l512f4-t l512f4-d">
  <title id="l512f4-t">The component-to-pixel chain on both renderers</title>
  <desc id="l512f4-d">The software path runs from world_transform plus renderable through scene_object and raster_triangle to pixels, with collect_renderables as the new first step. The GPU path has gpu_draw_item, an SDL_GPU draw and pixels, but no public function connects entities to gpu_draw_item.</desc>
  <defs>
    <marker id="e-i-l512f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l512f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l512f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l512f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l512f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">From components to pixels — and the arrow that does not exist.</text>
<text x="24" y="56" class="xs t-ok" text-anchor="start">THE SOFTWARE PATH — complete as of this lesson</text>
<rect x="34" y="64" width="190" height="30" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="129.0" y="83" class="xs mono" text-anchor="middle">world_transform + renderable</text>
<line x1="227" y1="79" x2="251" y2="79" stroke="#5ac878" stroke-width="1.2" marker-end="url(#e-g-l512f4)"/>
<rect x="254" y="64" width="105" height="30" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="306.5" y="83" class="xs mono" text-anchor="middle">scene_object</text>
<line x1="362" y1="79" x2="386" y2="79" stroke="#5ac878" stroke-width="1.2" marker-end="url(#e-g-l512f4)"/>
<rect x="389" y="64" width="110" height="30" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="444.0" y="83" class="xs mono" text-anchor="middle">raster_triangle</text>
<line x1="502" y1="79" x2="526" y2="79" stroke="#5ac878" stroke-width="1.2" marker-end="url(#e-g-l512f4)"/>
<rect x="529" y="64" width="70" height="30" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="564.0" y="83" class="xs mono" text-anchor="middle">pixels</text>
<text x="34" y="112" class="xs mono t-hi" text-anchor="start">collect_renderables()</text>
<text x="254" y="112" class="xs mono muted" text-anchor="start">collect_triangles()</text>
<text x="399" y="112" class="xs mono muted" text-anchor="start">draw_triangles()</text>
<text x="34" y="126" class="xs muted" text-anchor="start">NEW — engine/gfx/renderable.hpp</text>
<line x1="24" y1="146" x2="696" y2="146" class="grid" stroke-width="1.0"/>
<text x="24" y="170" class="xs t-bad" text-anchor="start">THE GPU PATH — and the gap is the first box</text>
<rect x="34" y="178" width="190" height="30" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="129" y="197" class="xs mono" text-anchor="middle">world_transform + renderable</text>
<text x="129" y="224" class="sm t-bad" text-anchor="middle">?</text>
<line x1="229" y1="193" x2="253" y2="193" class="ink-soft" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="241" y="184" class="sm t-bad" text-anchor="middle">×</text>
<rect x="258" y="178" width="110" height="30" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="313.0" y="197" class="xs mono" text-anchor="middle">gpu_draw_item</text>
<line x1="371" y1="193" x2="395" y2="193" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l512f4)"/>
<rect x="398" y="178" width="110" height="30" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="453.0" y="197" class="xs mono" text-anchor="middle">SDL_GPU draw</text>
<line x1="511" y1="193" x2="535" y2="193" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l512f4)"/>
<rect x="538" y="178" width="70" height="30" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="573.0" y="197" class="xs mono" text-anchor="middle">pixels</text>
<text x="24" y="250" class="xs muted" text-anchor="start">No public function turns entities into gpu_draw_items. sandbox bridges it PRIVATELY, inside its own</text>
<text x="24" y="264" class="xs muted" text-anchor="start">main.cpp, which is why the gap was invisible: the one program that crossed it was written before the</text>
<text x="24" y="278" class="xs muted" text-anchor="start">boundary existed. That is why collector renders on the CPU — the engine's REAL renderer is the one</text>
<text x="24" y="292" class="xs muted" text-anchor="start">a game cannot reach.</text>
<text x="24" y="314" class="xs t-hi" text-anchor="start">Module 9's renderer facade is where this is answered.</text>
</svg>
