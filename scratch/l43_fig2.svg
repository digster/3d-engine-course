<svg viewBox="0 0 720 372" role="img" aria-labelledby="l43f2-t l43f2-d">
  <title id="l43f2-t">Which register space each resource must use</title>
  <desc id="l43f2-d">A four-row table. For vertex shaders, sampled textures, storage textures and storage buffers are declared in space0 and become SPIR-V descriptor set 0, while uniform buffers go in space1 and become set 1. For fragment shaders the same two kinds use space2 and space3, becoming sets 2 and 3. The mapping was verified by disassembling this course's own compiled shaders. A wrong space is not a compile error: the shader builds and runs and reads the wrong slot.</desc>
  <defs>
    <marker id="e-i-l43f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l43f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l43f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
<text x="24" y="26" class="sm">where a resource must be declared, per stage</text>
<text x="24" y="46" class="xs muted">fixed by SDL_gpu.h; the right-hand column is what our own compiled output actually contains</text>
<text x="74.0" y="84.0" class="xs muted" text-anchor="middle">stage</text>
<text x="278.0" y="84.0" class="xs muted" text-anchor="middle">what you declare</text>
<text x="490.0" y="84.0" class="xs muted" text-anchor="middle">HLSL register</text>
<text x="606.0" y="84.0" class="xs muted" text-anchor="middle">SPIR-V says</text>
<rect x="28.0" y="96.0" width="92.0" height="40" rx="4" fill="#5ac878" opacity="0.16" stroke="#5ac878" stroke-width="1.3"/>
<text x="74.0" y="121.0" class="xs mono" text-anchor="middle">vertex</text>
<rect x="128.0" y="96.0" width="300.0" height="40" rx="4" class="fill-soft ink-soft" stroke-width="1"/>
<text x="138.0" y="121.0" class="xs">sampled textures, storage textures, storage buffers</text>
<rect x="436.0" y="96.0" width="108.0" height="40" rx="4" fill="#f0961e" opacity="0.16" stroke="#f0961e" stroke-width="1.3"/>
<text x="490.0" y="121.0" class="xs mono" text-anchor="middle">space0</text>
<line x1="548.0" y1="116.0" x2="558.0" y2="116.0" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l43f2)"/>
<text x="606.0" y="121.0" class="xs mono" text-anchor="middle">set 0</text>
<rect x="28.0" y="152.0" width="92.0" height="40" rx="4" fill="#5ac878" opacity="0.16" stroke="#5ac878" stroke-width="1.3"/>
<text x="74.0" y="177.0" class="xs mono" text-anchor="middle">vertex</text>
<rect x="128.0" y="152.0" width="300.0" height="40" rx="4" class="fill-soft ink-soft" stroke-width="1"/>
<text x="138.0" y="177.0" class="xs">uniform buffers</text>
<rect x="436.0" y="152.0" width="108.0" height="40" rx="4" fill="#f0961e" opacity="0.16" stroke="#f0961e" stroke-width="1.3"/>
<text x="490.0" y="177.0" class="xs mono" text-anchor="middle">space1</text>
<line x1="548.0" y1="172.0" x2="558.0" y2="172.0" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l43f2)"/>
<text x="606.0" y="177.0" class="xs mono" text-anchor="middle">set 1</text>
<rect x="28.0" y="208.0" width="92.0" height="40" rx="4" fill="#5082e6" opacity="0.16" stroke="#5082e6" stroke-width="1.3"/>
<text x="74.0" y="233.0" class="xs mono" text-anchor="middle">fragment</text>
<rect x="128.0" y="208.0" width="300.0" height="40" rx="4" class="fill-soft ink-soft" stroke-width="1"/>
<text x="138.0" y="233.0" class="xs">sampled textures, storage textures, storage buffers</text>
<rect x="436.0" y="208.0" width="108.0" height="40" rx="4" fill="#f0961e" opacity="0.16" stroke="#f0961e" stroke-width="1.3"/>
<text x="490.0" y="233.0" class="xs mono" text-anchor="middle">space2</text>
<line x1="548.0" y1="228.0" x2="558.0" y2="228.0" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l43f2)"/>
<text x="606.0" y="233.0" class="xs mono" text-anchor="middle">set 2</text>
<rect x="28.0" y="264.0" width="92.0" height="40" rx="4" fill="#5082e6" opacity="0.16" stroke="#5082e6" stroke-width="1.3"/>
<text x="74.0" y="289.0" class="xs mono" text-anchor="middle">fragment</text>
<rect x="128.0" y="264.0" width="300.0" height="40" rx="4" class="fill-soft ink-soft" stroke-width="1"/>
<text x="138.0" y="289.0" class="xs">uniform buffers</text>
<rect x="436.0" y="264.0" width="108.0" height="40" rx="4" fill="#f0961e" opacity="0.16" stroke="#f0961e" stroke-width="1.3"/>
<text x="490.0" y="289.0" class="xs mono" text-anchor="middle">space3</text>
<line x1="548.0" y1="284.0" x2="558.0" y2="284.0" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l43f2)"/>
<text x="606.0" y="289.0" class="xs mono" text-anchor="middle">set 3</text>
<text x="28.0" y="326.0" class="xs">Check your own shader rather than trusting the table:</text>
<text x="28.0" y="346.0" class="xs mono t-hi">spirv-dis textured.frag.spv | grep DescriptorSet</text>
<text x="28.0" y="366.0" class="xs muted">A wrong space compiles, links and runs &#8212; and reads whatever happens to be bound at the slot you named.</text>
</svg>
