  <text x="482.0" y="138.0" class="xs mono">rasterizer_state</text>
  <rect x="326.0" y="144.0" width="298" height="17.0" fill="#eb786e" opacity="0.14"/>
  <text x="330.0" y="157.0" class="xs mono muted">…MultisampleState</text>
  <text x="482.0" y="157.0" class="xs mono">multisample_state</text>
  <rect x="326.0" y="163.0" width="298" height="17.0" fill="#eb786e" opacity="0.14"/>
  <text x="330.0" y="176.0" class="xs mono muted">…DepthStencilState</text>
  <text x="482.0" y="176.0" class="xs mono">depth_stencil_state</text>
  <rect x="326.0" y="182.0" width="298" height="17.0" fill="#eb786e" opacity="0.14"/>
  <text x="330.0" y="195.0" class="xs mono muted">…PipelineTargetInfo</text>
  <text x="482.0" y="195.0" class="xs mono">target_info</text>
  <rect x="326.0" y="201.0" width="298" height="17.0" fill="#eb786e" opacity="0.14"/>
  <text x="330.0" y="214.0" class="xs mono muted">SDL_PropertiesID</text>
  <text x="482.0" y="214.0" class="xs mono">props</text>
  <text x="16.0" y="260.0" class="xs mono t-hi">10 fields</text>
  <text x="330.0" y="260.0" class="xs mono t-hi">9 fields (53 once the nested state is expanded)</text>
  <text x="16.0" y="286.0" class="sm">We did not approximate a pipeline object. <tspan class="t-hi">We built one</tspan>, and it is the same size.</text>
  <text x="16.0" y="304.0" class="sm muted">Every field on the left has a home on the right: <tspan class="mono">cull</tspan> in rasterizer_state, <tspan class="mono">shade</tspan> in fragment_shader,</text>
  <text x="16.0" y="320.0" class="sm muted"><tspan class="mono">albedo</tspan> split between a binding and a sampler. The port is a rename, and Lesson 4.8 is where it happens.</text>
</svg>
