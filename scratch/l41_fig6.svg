  <text x="16.0" y="157.0" class="xs mono muted">specular</text>
  <text x="184.0" y="157.0" class="xs mono">surface</text>
  <rect x="12.0" y="163.0" width="292" height="17.0" fill="#78b4eb" opacity="0.14"/>
  <text x="16.0" y="176.0" class="xs mono muted">specular_model</text>
