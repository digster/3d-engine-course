<svg viewBox="0 0 640 336" role="img" aria-labelledby="f416-t f416-d">
  <title id="f416-t">fill_style beside SDL_GPUGraphicsPipelineCreateInfo</title>
  <desc id="f416-d">Two field lists side by side. On the left engine fill_style with ten fields: interp, shade, space, cull, lights, surface, model, eye, albedo and encode. On the right SDL_GPUGraphicsPipelineCreateInfo with nine: vertex_shader, fragment_shader, vertex_input_state, primitive_type, rasterizer_state, multisample_state, depth_stencil_state, target_info and props, which expand to 53 leaf fields. The two structs are the same size at the top level.</desc>
  <defs>
    <marker id="e-i-f416" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f416" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f416" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
