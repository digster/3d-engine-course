<svg viewBox="0 0 910 405.0" role="img" aria-labelledby="l77bf1-t l77bf1-d">
  <title id="l77bf1-t">Three orders of one skeleton</title>
  <desc id="l77bf1-d">Three tables side by side. The first is Blender's node array in index order, 21 nodes from head (0) to Armature (20); every one of the 19 joints is marked because its parent has a larger index — the file writes children first. The second is the skin's joint list, 19 slots from hips to foot.R, every parent in an earlier slot, so the list is already parent-first. The third is the imported skeleton: the Armature node first, as joint 0 with no vertices, then the skin's joints in the skin's own order, 20 joints each with a parent earlier than itself.</desc>
