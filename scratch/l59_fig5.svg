<svg viewBox="0 0 720 400" role="img" aria-labelledby="l59f5-t l59f5-d">
  <title id="l59f5-t">Dirty-subtree resolution against the fraction of the world that moved</title>
  <desc id="l59f5-d">A bar chart of the dirty pass's cost relative to a full pass, from 0.08 at one entity in a thousand moving to 1.29 when everything moves, crossing break-even at about a quarter.</desc>
  <defs>
    <marker id="e-i-l59f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l59f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l59f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l59f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l59f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Skipping work is only free if the work you skip is most of it.</text>
<line x1="92" y1="256" x2="652" y2="256" class="grid" stroke-width="1.2"/>
<line x1="92" y1="56" x2="92" y2="256" class="grid" stroke-width="1.2"/>
<line x1="92" y1="256.0" x2="652" y2="256.0" class="grid" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="84" y="260.0" class="xs mono muted" text-anchor="end">0.0x</text>
<line x1="92" y1="184.57142857142856" x2="652" y2="184.57142857142856" class="grid" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="84" y="188.57142857142856" class="xs mono muted" text-anchor="end">0.5x</text>
<line x1="92" y1="113.14285714285714" x2="652" y2="113.14285714285714" class="grid" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="84" y="117.14285714285714" class="xs mono muted" text-anchor="end">1.0x</text>
<line x1="92" y1="113.14285714285714" x2="652" y2="113.14285714285714" class="hi" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="98" y="107.14285714285714" class="xs t-hi" text-anchor="start">break even</text>
<rect x="114.0" y="244.57142857142858" width="36" height="11.428571428571429" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.45"/>
<text x="132.0" y="239.57142857142858" class="xs mono" text-anchor="middle">0.08</text>
<text x="132.0" y="274" class="xs mono muted" text-anchor="middle">0.1%</text>
<text x="132.0" y="288" class="xs muted" text-anchor="middle">→0.5%</text>
<rect x="194.0" y="234.57142857142856" width="36" height="21.42857142857143" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.45"/>
<text x="212.0" y="229.57142857142856" class="xs mono" text-anchor="middle">0.15</text>
<text x="212.0" y="274" class="xs mono muted" text-anchor="middle">1%</text>
<text x="212.0" y="288" class="xs muted" text-anchor="middle">→4.8%</text>
<rect x="274.0" y="198.85714285714283" width="36" height="57.14285714285715" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.45"/>
<text x="292.0" y="193.85714285714283" class="xs mono" text-anchor="middle">0.40</text>
<text x="292.0" y="274" class="xs mono muted" text-anchor="middle">5%</text>
<text x="292.0" y="288" class="xs muted" text-anchor="middle">→20.7%</text>
<rect x="354.0" y="163.1428571428571" width="36" height="92.85714285714288" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.45"/>
<text x="372.0" y="158.1428571428571" class="xs mono" text-anchor="middle">0.65</text>
<text x="372.0" y="274" class="xs mono muted" text-anchor="middle">10%</text>
<text x="372.0" y="288" class="xs muted" text-anchor="middle">→36.4%</text>
<rect x="434.0" y="107.42857142857142" width="36" height="148.57142857142858" rx="2" fill="#e05c5c" stroke="#e05c5c" stroke-width="0.8" fill-opacity="0.45"/>
<text x="452.0" y="102.42857142857142" class="xs mono" text-anchor="middle">1.04</text>
<text x="452.0" y="274" class="xs mono muted" text-anchor="middle">25%</text>
<text x="452.0" y="288" class="xs muted" text-anchor="middle">→66.3%</text>
<rect x="514.0" y="86.0" width="36" height="170.0" rx="2" fill="#e05c5c" stroke="#e05c5c" stroke-width="0.8" fill-opacity="0.45"/>
<text x="532.0" y="81.0" class="xs mono" text-anchor="middle">1.19</text>
<text x="532.0" y="274" class="xs mono muted" text-anchor="middle">50%</text>
<text x="532.0" y="288" class="xs muted" text-anchor="middle">→87.6%</text>
<rect x="594.0" y="71.7142857142857" width="36" height="184.2857142857143" rx="2" fill="#e05c5c" stroke="#e05c5c" stroke-width="0.8" fill-opacity="0.45"/>
<text x="612.0" y="66.7142857142857" class="xs mono" text-anchor="middle">1.29</text>
<text x="612.0" y="274" class="xs mono muted" text-anchor="middle">100%</text>
<text x="612.0" y="288" class="xs muted" text-anchor="middle">→100%</text>
<text x="84" y="274" class="xs muted" text-anchor="end">moved</text>
<text x="84" y="288" class="xs muted" text-anchor="end">reached</text>
<line x1="24" y1="306" x2="696" y2="306" class="grid" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="24" y="326" class="xs t-hi" text-anchor="start">THE AMPLIFICATION IS THE PART NOBODY MENTIONS. Moving 10% of a depth-8 tree dirties 36% of it,</text>
<text x="24" y="340" class="xs muted" text-anchor="start">because every descendant of a moved entity has to move too. 25% moved reaches two thirds of the world.</text>
<text x="24" y="362" class="xs t-bad" text-anchor="start">SO THE CROSSOVER IS AT ~25% MOVED, and past it the dirty pass is SLOWER — 1.29× when everything moves,</text>
<text x="24" y="376" class="xs muted" text-anchor="start">which is exactly what an animated scene does. That is why this engine does not ship one.</text>
<text x="24" y="396" class="xs muted" text-anchor="start">A measurement lesson has to be willing to conclude NO. This one concludes no twice — see also §7.</text>
</svg>
