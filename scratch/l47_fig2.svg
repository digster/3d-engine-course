<svg viewBox="0 0 720 446" role="img" aria-labelledby="f47b-t f47b-d">
  <title id="f47b-t">What each depth format can separate, measured</title>
  <desc id="f47b-d">Top: which depth formats this device accepts — asked rather than assumed, and D24_UNORM, the format a desktop renderer would have hard-coded, is not among them. Below, the smallest separation each format can actually resolve, found by drawing a far surface and then a near one and bisecting on the gap. The tick marks the formula's prediction for D16, which the measurement tracks to within a few per cent from fifty microns at one metre to forty centimetres at ninety.</desc>
  <defs>
    <marker id="e-i-f47b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f47b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f47b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
  <text x="24" y="22" class="sm">the smallest separation each format can resolve &#8212; <tspan class="t-hi">measured</tspan>, and predicted by the formula</text>
  <text x="24" y="40" class="xs muted">asked with SDL_GPUTextureSupportsFormat, not assumed:</text>
  <text x="40" y="58" class="xs mono">D16_UNORM</text>
  <text x="220" y="58" class="xs t-ok">yes</text>
  <text x="330" y="58" class="xs muted">the only one SDL guarantees</text>
  <text x="40" y="73" class="xs mono">D24_UNORM</text>
  <text x="220" y="73" class="xs t-bad">NOT SUPPORTED</text>
  <text x="330" y="73" class="xs muted">the classic desktop choice</text>
  <text x="40" y="88" class="xs mono">D32_FLOAT</text>
  <text x="220" y="88" class="xs t-ok">yes</text>
  <text x="330" y="88" class="xs muted">float depth, and what reversed-Z wants</text>
  <text x="40" y="103" class="xs mono">D24_UNORM_S8_UINT</text>
  <text x="220" y="103" class="xs t-bad">NOT SUPPORTED</text>
  <text x="330" y="103" class="xs muted">with a stencil byte</text>
  <text x="40" y="118" class="xs mono">D32_FLOAT_S8_UINT</text>
  <text x="220" y="118" class="xs t-ok">yes</text>
  <text x="330" y="118" class="xs muted">with a stencil byte</text>
  <text x="40" y="137" class="xs t-hi">D24_UNORM &#8212; the format a desktop renderer would have hard-coded &#8212; is not available on this device</text>
  <text x="96.0" y="180.0" class="xs muted">smallest resolvable separation, millimetres, logarithmic</text>
  <line x1="118.5" y1="198.0" x2="118.5" y2="362.0" class="grid" stroke-width="0.75"/>
  <text x="118.5" y="194.0" class="xs muted" text-anchor="middle">1 &#181;m</text>
  <line x1="267.6" y1="198.0" x2="267.6" y2="362.0" class="grid" stroke-width="0.75"/>
  <text x="267.6" y="194.0" class="xs muted" text-anchor="middle">0.1 mm</text>
  <line x1="416.8" y1="198.0" x2="416.8" y2="362.0" class="grid" stroke-width="0.75"/>
  <text x="416.8" y="194.0" class="xs muted" text-anchor="middle">10 mm</text>
  <line x1="566.0" y1="198.0" x2="566.0" y2="362.0" class="grid" stroke-width="0.75"/>
  <text x="566.0" y="194.0" class="xs muted" text-anchor="middle">1 m</text>
  <text x="24" y="220.0" class="xs">1 m</text>
  <rect x="96.0" y="206.0" width="1.0" height="9" fill="#5082e6" fill-opacity="0.8" stroke="none"/>
  <rect x="96.0" y="216.0" width="149.2" height="9" fill="#eb786e" fill-opacity="0.8" stroke="none"/>
  <line x1="245.8" y1="214.0" x2="245.8" y2="228.0" class="ink" stroke-width="1.4"/>
  <text x="24" y="246.0" class="xs">5 m</text>
  <rect x="96.0" y="232.0" width="89.8" height="9" fill="#5082e6" fill-opacity="0.8" stroke="none"/>
  <rect x="96.0" y="242.0" width="254.7" height="9" fill="#eb786e" fill-opacity="0.8" stroke="none"/>
  <line x1="349.9" y1="240.0" x2="349.9" y2="254.0" class="ink" stroke-width="1.4"/>
  <text x="24" y="272.0" class="xs">10 m</text>
  <rect x="96.0" y="258.0" width="138.5" height="9" fill="#5082e6" fill-opacity="0.8" stroke="none"/>
  <rect x="96.0" y="268.0" width="297.0" height="9" fill="#eb786e" fill-opacity="0.8" stroke="none"/>
  <line x1="394.8" y1="266.0" x2="394.8" y2="280.0" class="ink" stroke-width="1.4"/>
  <text x="24" y="298.0" class="xs">25 m</text>
  <rect x="96.0" y="284.0" width="195.0" height="9" fill="#5082e6" fill-opacity="0.8" stroke="none"/>
  <rect x="96.0" y="294.0" width="357.6" height="9" fill="#eb786e" fill-opacity="0.8" stroke="none"/>
  <line x1="454.2" y1="292.0" x2="454.2" y2="306.0" class="ink" stroke-width="1.4"/>
  <text x="24" y="324.0" class="xs">50 m</text>
  <rect x="96.0" y="310.0" width="245.1" height="9" fill="#5082e6" fill-opacity="0.8" stroke="none"/>
  <rect x="96.0" y="320.0" width="402.8" height="9" fill="#eb786e" fill-opacity="0.8" stroke="none"/>
  <line x1="499.1" y1="318.0" x2="499.1" y2="332.0" class="ink" stroke-width="1.4"/>
  <text x="24" y="350.0" class="xs">90 m</text>
  <rect x="96.0" y="336.0" width="271.8" height="9" fill="#5082e6" fill-opacity="0.8" stroke="none"/>
  <rect x="96.0" y="346.0" width="441.3" height="9" fill="#eb786e" fill-opacity="0.8" stroke="none"/>
  <line x1="537.2" y1="344.0" x2="537.2" y2="358.0" class="ink" stroke-width="1.4"/>
  <rect x="96.0" y="372.0" width="9" height="9" fill="#5082e6" fill-opacity="0.8"/>
  <text x="112.0" y="381.0" class="xs">D32_FLOAT</text>
  <rect x="206.0" y="372.0" width="9" height="9" fill="#eb786e" fill-opacity="0.8"/>
  <text x="222.0" y="381.0" class="xs">D16_UNORM</text>
  <line x1="328.0" y1="370.0" x2="328.0" y2="384.0" class="ink" stroke-width="1.4"/>
  <text x="336.0" y="381.0" class="xs">what the formula predicts for D16</text>
</svg>
