<line x1="248.50" y1="318.00" x2="218.50" y2="172.25" stroke="#e05c5c" stroke-width="1.4" marker-end="url(#e-red-l83f4)"/>
<text x="40" y="338" class="xs muted" text-anchor="start">A point at the cell's centre carries the cell's mass</text>
<text x="40" y="354" class="xs muted" text-anchor="start">and NOT its own spread. Summed over all N³ cells,</text>
<text x="40" y="370" class="xs t-hi" text-anchor="start">that deficit is exactly I / N².</text>
<text x="470" y="76" class="xs muted" text-anchor="start">N</text>
<text x="642" y="76" class="xs muted" text-anchor="end">Ixx, points</text>
<text x="750" y="76" class="xs muted" text-anchor="end">ratio</text>
<text x="858" y="76" class="xs muted" text-anchor="end">1 − 1/N²</text>
<line x1="470" y1="84.0" x2="864" y2="84.0" class="grid" stroke-width="1.0"/>
<text x="470" y="101.0" class="xs" text-anchor="start">4</text>
<text x="642" y="101.0" class="xs mono" text-anchor="end">4.062500</text>
<text x="750" y="101.0" class="xs mono" text-anchor="end">0.937500</text>
<text x="858" y="101.0" class="xs mono" text-anchor="end">0.937500</text>
<text x="470" y="118.0" class="xs" text-anchor="start">8</text>
<text x="642" y="118.0" class="xs mono" text-anchor="end">4.265625</text>
<text x="750" y="118.0" class="xs mono" text-anchor="end">0.984375</text>
<text x="858" y="118.0" class="xs mono" text-anchor="end">0.984375</text>
<text x="470" y="135.0" class="xs" text-anchor="start">20</text>
<text x="642" y="135.0" class="xs mono" text-anchor="end">4.322488</text>
<text x="750" y="135.0" class="xs mono" text-anchor="end">0.997497</text>
<text x="858" y="135.0" class="xs mono" text-anchor="end">0.997500</text>
<text x="470" y="152.0" class="xs" text-anchor="start">50</text>
<text x="642" y="152.0" class="xs mono" text-anchor="end">4.331634</text>
<text x="750" y="152.0" class="xs mono" text-anchor="end">0.999608</text>
<text x="858" y="152.0" class="xs mono" text-anchor="end">0.999600</text>
<text x="470" y="186.5" class="xs muted" text-anchor="start">…and with each cell's own tensor added back</text>
<text x="470" y="206.5" class="xs muted" text-anchor="start">N</text>
<text x="682" y="206.5" class="xs muted" text-anchor="end">Ixx, cells</text>
<text x="858" y="206.5" class="xs muted" text-anchor="end">relative error</text>
<line x1="470" y1="214.5" x2="864" y2="214.5" class="grid" stroke-width="1.0"/>
<text x="470" y="231.5" class="xs" text-anchor="start">4</text>
<text x="682" y="231.5" class="xs mono" text-anchor="end">4.333332</text>
<text x="858" y="231.5" class="xs mono" text-anchor="end">3.301e-07</text>
<text x="470" y="248.5" class="xs" text-anchor="start">8</text>
<text x="682" y="248.5" class="xs mono" text-anchor="end">4.333342</text>
<text x="858" y="248.5" class="xs mono" text-anchor="end">1.871e-06</text>
<text x="470" y="265.5" class="xs" text-anchor="start">20</text>
<text x="682" y="265.5" class="xs mono" text-anchor="end">4.333335</text>
<text x="858" y="265.5" class="xs mono" text-anchor="end">3.301e-07</text>
<text x="470" y="300.0" class="xs muted" text-anchor="start">The closed form is 4.333333. The second table is</text>
<text x="470" y="316.0" class="xs muted" text-anchor="start">exact at N = 4, which is 64 samples — and it can only be</text>
<text x="470" y="332.0" class="xs t-hi" text-anchor="start">exact if the parallel-axis theorem is exactly true.</text>
</svg>
