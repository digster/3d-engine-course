<svg viewBox="0 0 900 420" role="img" aria-labelledby="l83f4-t l83f4-d">
  <title id="l83f4-t">A box filled with a grid of cells, and the deficit that exposes the theorem</title>
  <desc id="l83f4-d">A four-by-four grid is drawn over a box with a sample point at each cell centre, and one cell is highlighted. Summing point masses gives an answer that is low by exactly one over N squared, because each cell's own spread is missing; the first table shows the measured ratio landing on that prediction to six decimals at four different resolutions. Adding each cell's own tensor back makes the sum exact even at the coarsest grid.</desc>
  <defs>
    <marker id="e-i-l83f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l83f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l83f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l83f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l83f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-red-l83f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-blue-l83f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<rect x="40" y="64" width="300" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="40" y="48" class="xs muted" text-anchor="start">N = 4: sixty-four cells, and what each one is missing</text>
<rect x="92" y="98" width="196" height="182" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<line x1="141.0" y1="98" x2="141.0" y2="280" class="grid" stroke-width="1.0"/>
