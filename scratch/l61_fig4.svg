<svg viewBox="0 0 720 420" role="img" aria-labelledby="l61f4-t l61f4-d">
  <title id="l61f4-t">The two conversion points of a colour pipeline</title>
  <desc id="l61f4-d">Inputs decode to linear light on the left, all rendering arithmetic happens in linear in the middle, and the result is encoded once on the right. The CPU path encoded correctly; the GPU path had no encode at all.</desc>
  <defs>
    <marker id="e-i-l61f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l61f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l61f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l61f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l61f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Two conversions. Not three, not one per operation — two, at the edges, with light in between.</text>
<rect x="24" y="62" width="150" height="24" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.18"/>
<text x="99" y="78" class="xs mono" text-anchor="middle">texture</text>
<text x="99" y="100" class="xs muted" text-anchor="middle">_SRGB format: the</text>
<text x="99" y="114" class="xs muted" text-anchor="middle">sampler decodes</text>
<line x1="178" y1="74" x2="236" y2="74" class="hi" stroke-width="1.2" marker-end="url(#e-h-l61f4)"/>
<rect x="24" y="124" width="150" height="24" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.18"/>
<text x="99" y="140" class="xs mono" text-anchor="middle">a tint (Uint32)</text>
<text x="99" y="162" class="xs muted" text-anchor="middle">to_linear()</text>
<text x="99" y="176" class="xs muted" text-anchor="middle">once, at load</text>
<line x1="178" y1="136" x2="236" y2="136" class="hi" stroke-width="1.2" marker-end="url(#e-h-l61f4)"/>
<rect x="24" y="186" width="150" height="24" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.18"/>
<text x="99" y="202" class="xs mono" text-anchor="middle">a light's colour</text>
<text x="99" y="224" class="xs muted" text-anchor="middle">authored linear</text>
<text x="99" y="238" class="xs muted" text-anchor="middle">no conversion</text>
<line x1="178" y1="198" x2="236" y2="198" class="hi" stroke-width="1.2" marker-end="url(#e-h-l61f4)"/>
<text x="99" y="44" class="xs t-ok" text-anchor="middle">INPUTS — decode here</text>
<rect x="242" y="56" width="220" height="194" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.2"/>
<text x="352" y="84" class="sm mono" text-anchor="middle">LIGHT</text>
<text x="352" y="108" class="xs muted" text-anchor="middle">shading</text>
<text x="352" y="126" class="xs muted" text-anchor="middle">interpolation</text>
<text x="352" y="144" class="xs muted" text-anchor="middle">blending</text>
<text x="352" y="162" class="xs muted" text-anchor="middle">mipmaps, filtering</text>
<text x="352" y="180" class="xs muted" text-anchor="middle">anti-aliasing</text>
<text x="352" y="204" class="xs t-hi" text-anchor="middle">every one of these</text>
<text x="352" y="220" class="xs t-hi" text-anchor="middle">is arithmetic, and</text>
<text x="352" y="236" class="xs t-hi" text-anchor="middle">needs real numbers</text>
<text x="600" y="44" class="xs t-ok" text-anchor="middle">OUTPUT — encode ONCE</text>
<line x1="466" y1="100" x2="520" y2="100" class="hi" stroke-width="1.3" marker-end="url(#e-h-l61f4)"/>
<rect x="526" y="88" width="170" height="24" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.2"/>
<text x="611" y="104" class="xs mono" text-anchor="middle">CPU: to_encoded()</text>
<text x="611" y="126" class="xs muted" text-anchor="middle">correct since 1.6</text>
<line x1="466" y1="176" x2="520" y2="176" class="hi" stroke-width="1.3" marker-end="url(#e-h-l61f4)"/>
<rect x="526" y="164" width="170" height="24" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.2"/>
<text x="611" y="180" class="xs mono" text-anchor="middle">GPU: …nothing</text>
<text x="611" y="202" class="xs t-bad" text-anchor="middle">THE HOLE. Light went</text>
<text x="611" y="218" class="xs muted" text-anchor="middle">straight into an SDR</text>
<text x="611" y="234" class="xs muted" text-anchor="middle">swapchain, whose bytes</text>
<text x="611" y="250" class="xs muted" text-anchor="middle">MEAN codes.</text>
<line x1="24" y1="286" x2="696" y2="286" class="grid" stroke-width="1.2"/>
<text x="24" y="308" class="xs t-hi" text-anchor="start">THE RULE IS NOT “CONVERT CAREFULLY”. IT IS “CONVERT TWICE, AT THE EDGES”.</text>
<text x="24" y="328" class="xs muted" text-anchor="start">Converting per operation — which is what this engine did through Module 3, and said so — is slower, lossier at 8 bits, and</text>
<text x="24" y="344" class="xs muted" text-anchor="start">gets one operation wrong the week somebody adds one. Converting at the edges makes the middle a place where the ordinary</text>
<text x="24" y="360" class="xs muted" text-anchor="start">rules of arithmetic hold, which is the only kind of middle a renderer can be written in.</text>
<text x="24" y="386" class="xs t-hi" text-anchor="start">The fix in this lesson is not new maths. It is ONE MISSING EDGE.</text>
</svg>
