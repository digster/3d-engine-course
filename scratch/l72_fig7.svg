<text x="616" y="104" class="xs" text-anchor="start">orientation</text>
<text x="592" y="130" class="xs muted" text-anchor="start">hollow amber:</text>
<text x="592" y="146" class="xs muted" text-anchor="start">the placeholder</text>
<text x="592" y="162" class="xs muted" text-anchor="start">axis, not a</text>
<text x="592" y="178" class="xs muted" text-anchor="start">measurement</text>
<text x="380.0" y="358" class="xs muted" text-anchor="middle">the amber line climbs a decade per decade and ends 78° wrong; the blue one is flat at five millionths of a degree</text>
<text x="380.0" y="384" class="xs muted" text-anchor="middle">same runs, same matrices. the axis is destroyed and the orientation it names is not.</text>
