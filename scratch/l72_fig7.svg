<svg viewBox="0 0 760 404" role="img" aria-labelledby="f72g-t f72g-d">
  <title id="f72g-t">The identity end</title>
  <desc id="f72g-d">A log plot with two curves against the size of the turn, from a hundredth of a radian down to ten to the minus eight. The amber curve, the error in the recovered axis, rises steadily by a factor of ten for every factor of ten the angle shrinks, reaching half a degree at the threshold and then jumping to 78 degrees where the routine returns a placeholder instead — those two points are drawn hollow. The blue curve, the error in the orientation those same numbers rebuild, is flat across the whole range at about five millionths of a degree.</desc>
  <defs>
    <marker id="e-i-f72g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f72g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f72g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f72g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f72g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
