<text x="20" y="300" class="xs muted">100&#215;84 cells of the 320&#215;180 framebuffer, run-length encoded</text>
<text x="348" y="62" class="sm t-hi">12 triangles</text>
<text x="348" y="78" class="xs muted">a cube; the fill culls the six facing away</text>
<text x="348" y="106" class="sm t-hi">2,760 pixels painted</text>
<text x="348" y="122" class="xs muted">counted by --shot, so this figure is checkable</text>
<text x="348" y="150" class="sm t-hi">3 brightnesses</text>
<text x="348" y="166" class="xs muted">one directional light, Lambert, per vertex</text>
<text x="348" y="194" class="sm t-hi">0 mentions of a triangle</text>
<text x="348" y="210" class="xs muted">in the whole source file</text>
<text x="348" y="246" class="xs">The sandbox demo exists to show you the insides,</text>
<text x="348" y="262" class="xs">so it is a bad advertisement for the API.</text>
<text x="348" y="278" class="xs t-ok">This file is the honest one.</text>
