<svg viewBox="0 0 720 380" role="img" aria-labelledby="l52f4-t l52f4-d">
  <title id="l52f4-t">Boilerplate removed, measured</title>
  <desc id="l52f4-d">Paired bars per demo showing lifecycle SDL calls before and after: hello_cube 17 to 0, pong 0, sandbox 31 to 3.</desc>
  <defs>
    <marker id="e-i-l52f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l52f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l52f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l52f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Lifecycle SDL calls a demo has to make for itself</text>
<text x="20" y="36" class="xs muted" text-anchor="start">SDL_Init, SDL_Quit, CreateWindow/Renderer/Texture and their three Destroys, SetRenderVSync,</text>
<text x="20" y="48" class="xs muted" text-anchor="start">SetTextureScaleMode, Lock/UnlockTexture, PollEvent, RenderClear/Texture/Present, SetAppMetadata, GetVersion.</text>
<text x="118" y="102" class="xs mono" text-anchor="end">hello_cube</text>
<text x="118" y="128" class="xs" text-anchor="end"></text>
<rect x="130" y="88" width="255.0" height="16" rx="2" fill="#e05c5c"/>
<text x="393.0" y="100" class="xs mono" text-anchor="start">17   before</text>
<text x="138.0" y="124" class="xs mono" text-anchor="start">0   after</text>
<text x="118" y="164" class="xs mono" text-anchor="end">pong</text>
<text x="118" y="190" class="xs" text-anchor="end"></text>
<text x="130" y="162" class="xs muted" text-anchor="start">—   did not exist yet</text>
<text x="138.0" y="186" class="xs mono" text-anchor="start">0   after</text>
<text x="118" y="226" class="xs mono" text-anchor="end">sandbox</text>
<text x="118" y="252" class="xs" text-anchor="end"></text>
<rect x="130" y="212" width="465.0" height="16" rx="2" fill="#e05c5c"/>
<text x="603.0" y="224" class="xs mono" text-anchor="start">31   before</text>
<rect x="130" y="236" width="45.0" height="16" rx="2" fill="#5ac878"/>
<text x="183.0" y="248" class="xs mono" text-anchor="start">3   after</text>
<text x="118" y="276" class="xs muted" text-anchor="start">pong was a branch inside sandbox's [Tab] switch, not a program.</text>
<line x1="20" y1="292" x2="700" y2="292" class="grid" stroke-width="1"/>
<text x="20" y="314" class="xs t-hi" text-anchor="start">48 across the three demos, before. 3 after — and all three are SDL_PollEvent, in sandbox, on purpose.</text>
<text x="20" y="330" class="xs muted" text-anchor="start">The layer that removed 45 of them is 428 lines of code across five files. It is not free; it is paid for once.</text>
<text x="20" y="346" class="xs muted" text-anchor="start">Counted by scratch/measure_52.py, which strips comments before it counts:</text>
<text x="20" y="360" class="xs muted" text-anchor="start">the first run reported a sentence ABOUT SDL_Init as a call to it.</text>
</svg>
