<svg viewBox="0 0 720 400" role="img" aria-labelledby="l42f5-t l42f5-d">
  <title id="l42f5-t">One float clear colour, two formats, two different bytes</title>
  <desc id="l42f5-d">A graph of the byte stored against the float given in SDL_FColor. A straight blue line is the _UNORM format, where the byte is simply the float times 255: half becomes 128. A curved orange line is the _UNORM_SRGB format, which applies the sRGB encode on write, so half becomes 188. Five measured points are marked on each line and both pass through zero and 255. Dashed guides pick out the value one half and its two answers.</desc>
  <defs>
    <marker id="e-i-l42f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l42f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l42f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
<text x="24" y="26" class="sm">the same clear colour, into two formats</text>
<text x="24" y="44" class="xs muted">measured: clear a 1&#215;1 target, download it, read the byte</text>
