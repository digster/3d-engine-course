<svg viewBox="0 0 720 386" role="img" aria-labelledby="l512f5-t l512f5-d">
  <title id="l512f5-t">The camera boom and the order of its two matrices</title>
  <desc id="l512f5-d">The rover parents a boom which parents the camera. The boom's local basis must be the inverse scale times the inverse roll, in that order, because the inverse of a product reverses it. Written the other way round the camera's placement is not rigid and view_from_camera's assertion fires.</desc>
  <defs>
    <marker id="e-i-l512f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l512f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l512f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l512f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l512f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">Three links, and the one that has to undo the other two.</text>
<rect x="60" y="48" width="160" height="44" rx="3" fill="none" stroke="#f0961e" stroke-width="1.5"/>
<text x="140" y="66" class="sm mono" text-anchor="middle">rover</text>
<text x="140" y="82" class="xs muted" text-anchor="middle">H · Rz(bank) · S</text>
<line x1="223" y1="70" x2="277" y2="70" class="ink" stroke-width="1.3" marker-end="url(#e-i-l512f5)"/>
<rect x="280" y="48" width="160" height="44" rx="3" fill="none" stroke="#5ac878" stroke-width="1.5"/>
<text x="360" y="66" class="sm mono" text-anchor="middle">boom</text>
<text x="360" y="82" class="xs muted" text-anchor="middle">the fix goes here</text>
<line x1="443" y1="70" x2="497" y2="70" class="ink" stroke-width="1.3" marker-end="url(#e-i-l512f5)"/>
<rect x="500" y="48" width="160" height="44" rx="3" fill="none" stroke="#5082e6" stroke-width="1.5"/>
<text x="580" y="66" class="sm mono" text-anchor="middle">camera</text>
<text x="580" y="82" class="xs muted" text-anchor="middle">look_along(...)</text>
<text x="390" y="104" class="xs muted" text-anchor="middle">parent of</text>
<text x="170" y="104" class="xs muted" text-anchor="middle">parent of</text>
<line x1="24" y1="124" x2="696" y2="124" class="grid" stroke-width="1.0"/>
<text x="24" y="146" class="xs" text-anchor="start">WHAT THE BOOM MUST BE</text>
<text x="96" y="166" class="xs muted" text-anchor="end">we want</text>
<text x="108" y="166" class="xs mono" text-anchor="start">world(boom) = H</text>
<text x="96" y="183" class="xs muted" text-anchor="end">we have</text>
<text x="108" y="183" class="xs mono" text-anchor="start">world(rover) = H · Rz(bank) · S</text>
<text x="96" y="200" class="xs muted" text-anchor="end">so</text>
<text x="108" y="200" class="xs mono" text-anchor="start">local = (H · Rz(bank) · S)⁻¹ · H</text>
<text x="96" y="217" class="xs muted" text-anchor="end"></text>
<text x="108" y="217" class="xs mono" text-anchor="start">= S⁻¹ · Rz(−bank) · H⁻¹ · H</text>
<text x="96" y="234" class="xs muted" text-anchor="end"></text>
<text x="108" y="234" class="xs mono" text-anchor="start">= S⁻¹ · Rz(−bank)</text>
<text x="340" y="234" class="xs t-hi" text-anchor="start">← the unscale comes FIRST</text>
<line x1="24" y1="262" x2="696" y2="262" class="grid" stroke-width="1.0"/>
<rect x="30" y="284" width="200" height="30" rx="3" fill="none" stroke="#5ac878" stroke-width="1.4"/>
<text x="130" y="303" class="xs mono" text-anchor="middle">S⁻¹ · Rz(−bank)</text>
<text x="246" y="297" class="xs t-ok" text-anchor="start">rigid</text>
<text x="246" y="310" class="xs muted" text-anchor="start">view_from_camera is defined</text>
<rect x="30" y="324" width="200" height="30" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.4"/>
<text x="130" y="343" class="xs mono" text-anchor="middle">Rz(−bank) · S⁻¹</text>
<text x="246" y="337" class="xs t-bad" text-anchor="start">NOT rigid</text>
<text x="246" y="350" class="xs muted" text-anchor="start">assertion fires, headless run HANGS</text>
<text x="24" y="372" class="xs muted" text-anchor="start">A rotation and a non-uniform scale do not commute, so the second is a different matrix — and not a visibly wrong one.</text>
</svg>
