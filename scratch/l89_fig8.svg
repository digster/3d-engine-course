<svg viewBox="0 0 980 450" role="img" aria-labelledby="f89h-t f89h-d">
  <title id="f89h-t">What one solver pass leaves behind</title>
  <desc id="f89h-d">The penetration of a resting crate after fifteen seconds, against the number of solver passes per step, on a logarithmic axis. At one pass the crate is 275 millimetres into the floor and still sinking; at sixteen and thirty-two passes it has frozen at 7.2 millimetres, which is the penetration it arrived with on the frame it was first detected. A table gives the creep rate and the residual velocity at each pass count.</desc>
  <defs>
    <marker id="e-i-f89h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f89h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f89h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f89h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f89h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-red-f89h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-green-f89h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<rect x="66" y="68" width="400" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="66" y="34" class="sm" text-anchor="start">A crate at rest, fifteen seconds in</text>
<text x="66" y="52" class="xs muted" text-anchor="start">the only thing changing is the number of solver passes</text>
<line x1="66" y1="278.45510226505445" x2="466" y2="278.45510226505445" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="58" y="282.45510226505445" class="xs muted" text-anchor="end">10 mm</text>
<line x1="66" y1="147.08979546989116" x2="466" y2="147.08979546989116" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="58" y="151.08979546989116" class="xs muted" text-anchor="end">100 mm</text>
<text x="94.0" y="336" class="xs muted" text-anchor="middle">1</text>
<text x="160.66666666666669" y="336" class="xs muted" text-anchor="middle">2</text>
<text x="227.33333333333334" y="336" class="xs muted" text-anchor="middle">4</text>
<text x="294.0" y="336" class="xs muted" text-anchor="middle">8</text>
<text x="360.6666666666667" y="336" class="xs muted" text-anchor="middle">16</text>
<text x="427.33333333333337" y="336" class="xs muted" text-anchor="middle">32</text>
<text x="266.0" y="356" class="xs muted" text-anchor="middle">solver passes per step</text>
<path d="M 94.00,89.47 L 160.67,175.12 L 227.33,232.12 L 294.00,277.11 L 360.67,296.84 L 427.33,297.00" fill="none" stroke="#e05c5c" stroke-width="2.2"/>
<circle cx="94.0" cy="89.5" r="3.6" fill="#e05c5c"/>
<circle cx="160.7" cy="175.1" r="3.6" fill="#e05c5c"/>
<circle cx="227.3" cy="232.1" r="3.6" fill="#e05c5c"/>
<circle cx="294.0" cy="277.1" r="3.6" fill="#5ac878"/>
<circle cx="360.7" cy="296.8" r="3.6" fill="#5ac878"/>
<circle cx="427.3" cy="297.0" r="3.6" fill="#5ac878"/>
<line x1="66.0" y1="297.0" x2="466.0" y2="297.0" stroke="#5ac878" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/>
<text x="460" y="314.9973319691174" class="xs" text-anchor="end">7.23 mm — the depth it ARRIVED with</text>
<text x="94.0" y="75.46606088613899" class="xs" text-anchor="middle">sinks forever</text>
<text x="540" y="26" class="xs muted" text-anchor="start">One pass is not a converged solve</text>
<text x="540" y="46" class="xs muted" text-anchor="start">passes</text>
<text x="794" y="46" class="xs muted" text-anchor="end">creep mm/s</text>
<text x="944" y="46" class="xs muted" text-anchor="end">residual m/s</text>
<line x1="540" y1="54.0" x2="950" y2="54.0" class="grid" stroke-width="1.0"/>
<text x="540" y="71.0" class="xs" text-anchor="start">1</text>
<text x="794" y="71.0" class="xs mono" text-anchor="end">15.487</text>
<text x="944" y="71.0" class="xs mono" text-anchor="end">2.6e-02</text>
<text x="540" y="88.0" class="xs" text-anchor="start">2</text>
<text x="794" y="88.0" class="xs mono" text-anchor="end">3.403</text>
<text x="944" y="88.0" class="xs mono" text-anchor="end">2.9e-02</text>
<text x="540" y="105.0" class="xs" text-anchor="start">4</text>
<text x="794" y="105.0" class="xs mono" text-anchor="end">0.767</text>
<text x="944" y="105.0" class="xs mono" text-anchor="end">5.5e-03</text>
<text x="540" y="122.0" class="xs" text-anchor="start">8</text>
<text x="794" y="122.0" class="xs mono" text-anchor="end">0.202</text>
<text x="944" y="122.0" class="xs mono" text-anchor="end">2.3e-04</text>
<text x="540" y="139.0" class="xs" text-anchor="start">16</text>
<text x="794" y="139.0" class="xs mono" text-anchor="end">0.001</text>
<text x="944" y="139.0" class="xs mono" text-anchor="end">1.6e-06</text>
<text x="540" y="156.0" class="xs" text-anchor="start">32</text>
<text x="794" y="156.0" class="xs mono" text-anchor="end">0.000</text>
<text x="944" y="156.0" class="xs mono" text-anchor="end">9.9e-09</text>
<text x="540" y="218" class="xs" text-anchor="start">One pass over a four-point manifold leaves a few</text>
<text x="540" y="234" class="xs" text-anchor="start">centimetres per second of residual approach speed, and</text>
<text x="540" y="250" class="xs" text-anchor="start">the crate sinks for as long as you watch it. Sixteen</text>
<text x="540" y="266" class="xs" text-anchor="start">passes converge and the depth FREEZES — but it freezes</text>
<text x="540" y="282" class="xs" text-anchor="start">at the penetration the crate arrived with, which is</text>
<text x="540" y="298" class="xs" text-anchor="start">one step of approach travel and does not go away.</text>
<text x="540" y="328" class="xs muted" text-anchor="start">Those are 8.10's two jobs, and they need different</text>
<text x="540" y="344" class="xs muted" text-anchor="start">machinery: more iterations for the first, a POSITION</text>
<text x="540" y="360" class="xs muted" text-anchor="start">correction for the second. No velocity solve can undo</text>
<text x="540" y="376" class="xs muted" text-anchor="start">an overlap that is already there. And solving at the</text>
<text x="540" y="392" class="xs muted" text-anchor="start">END of the step instead of the middle adds a third</text>
<text x="540" y="408" class="xs muted" text-anchor="start">failure — g·h² = 2.7250 mm of sink every step,</text>
<text x="540" y="424" class="xs muted" text-anchor="start">whatever the solver does.</text>
<text x="66" y="428" class="xs muted" text-anchor="start">§12 and harness §J. Depth is measured at t = 15 s; creep is the change between t = 5 s and t = 15 s.</text>
</svg>
