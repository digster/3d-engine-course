<svg viewBox="0 0 600 200" role="img" aria-labelledby="f392-t f392-d">
  <title id="f392-t">The half-texel offset, and the shift it causes</title>
  <desc id="f392-d">A step image of eight texels, four white then four black, sampled bilinearly two ways. The solid curve subtracts half a texel and crosses half brightness at u = 0.5, exactly on the boundary between the two blocks. The dashed curve omits the half and crosses at u = 0.4375. The gap between the crossings is 0.0625 of the image, which is half of one texel.</desc>
  <defs>
    <marker id="e-i-f392" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f392" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f392" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f392" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--verify-bd)"/></marker>
  </defs>
