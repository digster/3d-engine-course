<svg viewBox="0 0 640 340" role="img" aria-labelledby="f411-t f411-d">
  <title id="f411-t">A 2x2 quad grid over a small triangle</title>
  <desc id="f411-d">An 8 by 8 pixel grid divided into 2 by 2 quads, with a triangle drawn over it. Lanes the triangle covers are blue and lanes it does not are red; the red ones still run the fragment shader. Arrows on one quad show ddx as the difference between the two lanes in x and ddy as the difference in y, which is why the uncovered lanes have to run at all.</desc>
  <defs>
    <marker id="e-i-f411" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f411" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f411" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
  <text x="16" y="26" class="sm muted">one triangle, one 2&#215;2 quad grid &#8212; lanes the shader runs on</text>
