  <text x="294.0" y="152.0" class="xs mono t-hi">58% efficient</text>
  <text x="294.0" y="184.0" class="xs mono t-hi">&#8594;  ddx = lane 1 &#8722; lane 0</text>
  <text x="294.0" y="200.0" class="xs mono t-hi">&#8595;  ddy = lane 2 &#8722; lane 0</text>
  <text x="16" y="292.0" class="sm">The red lanes run the fragment shader and their results are thrown away.</text>
  <text x="16" y="308.0" class="sm muted">They have to: <tspan class="mono">ddx</tspan> is lane 1 minus lane 0 and <tspan class="mono">ddy</tspan> is lane 2 minus lane 0, so a lane needs its neighbours to</text>
  <text x="16" y="324.0" class="sm muted">have run the same code &#8212; whether or not the triangle covers them. That is where mipmap selection comes from.</text>
