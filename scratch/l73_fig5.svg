<svg viewBox="0 0 760 400" role="img" aria-labelledby="f73e-t f73e-d">
  <title id="f73e-t">Two mirrors make a turn of twice the angle between them</title>
  <desc id="f73e-d">The plane with two mirror lines through the origin, one violet at twenty degrees and one blue at fifty, thirty degrees apart. A pale probe arrow starts along the positive real axis. Reflected in the first mirror it lands at forty degrees, drawn grey; reflected again in the second it lands at sixty degrees, drawn teal, with an arc marking the sixty degrees travelled. A gold arrow at thirty degrees is the rotor, the object carrying half the turn, which is exactly what a quaternion stores. A legend names each element and a panel gives the algebra: a reflection is m squared times the conjugate, so two of them compose to the rotor squared.</desc>
  <defs>
    <marker id="e-i-f73e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f73e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f73e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f73e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f73e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-probe-f73e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8ccd6"/></marker></defs>
<defs><marker id="e-teal-f73e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60ded0"/></marker></defs>
<defs><marker id="e-gold-f73e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f8d678"/></marker></defs>
<text x="214" y="28" class="sm" text-anchor="middle">reflect, then reflect again</text>
<text x="214" y="45" class="xs muted" text-anchor="middle">mirrors at 20° and 50° — 30° apart</text>
