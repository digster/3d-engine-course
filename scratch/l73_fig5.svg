<text x="341.7" y="128.0" class="sm t-hi" text-anchor="start">60°</text>
<rect x="402" y="55" width="16" height="9" rx="2" fill="#c8ccd6" stroke="#c8ccd6" stroke-width="0.0" fill-opacity="0.95"/>
<text x="428" y="64" class="xs mono" text-anchor="start">v</text>
<text x="480" y="64" class="xs muted" text-anchor="start">the probe, at 0°</text>
<rect x="402" y="81" width="16" height="9" rx="2" fill="#d676e2" stroke="#d676e2" stroke-width="0.0" fill-opacity="0.95"/>
<text x="428" y="90" class="xs mono" text-anchor="start">m₀</text>
<text x="480" y="90" class="xs muted" text-anchor="start">the first mirror, at 20°</text>
<rect x="402" y="107" width="16" height="9" rx="2" fill="#8f918a" stroke="#8f918a" stroke-width="0.0" fill-opacity="0.95"/>
<text x="428" y="116" class="xs mono" text-anchor="start">m₀² v̄</text>
<text x="480" y="116" class="xs muted" text-anchor="start">v reflected once — lands at 40°</text>
<rect x="402" y="133" width="16" height="9" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="0.0" fill-opacity="0.95"/>
<text x="428" y="142" class="xs mono" text-anchor="start">m₁</text>
<text x="480" y="142" class="xs muted" text-anchor="start">the second mirror, at 50°</text>
<rect x="402" y="159" width="16" height="9" rx="2" fill="#60ded0" stroke="#60ded0" stroke-width="0.0" fill-opacity="0.95"/>
<text x="428" y="168" class="xs mono" text-anchor="start">→ 60°</text>
<text x="480" y="168" class="xs muted" text-anchor="start">reflected again — TWICE the 30°</text>
<rect x="402" y="185" width="16" height="9" rx="2" fill="#f8d678" stroke="#f8d678" stroke-width="0.0" fill-opacity="0.95"/>
<text x="428" y="194" class="xs mono" text-anchor="start">R</text>
<text x="480" y="194" class="xs muted" text-anchor="start">the rotor, m₁ conj(m₀), at 30°</text>
<rect x="402" y="226" width="326" height="92" rx="3" fill="none" stroke="#8f918a" stroke-width="1.0"/>
<text x="565.0" y="248" class="sm" text-anchor="middle">the algebra, in two lines</text>
<text x="565.0" y="272" class="xs mono t-hi" text-anchor="middle">reflect in m:   v  ↦  m² · conj(v)</text>
<text x="565.0" y="296" class="xs mono t-hi" text-anchor="middle">twice:   v  ↦  (m₁ conj(m₀))² · v</text>
<text x="380.0" y="360" class="xs muted" text-anchor="middle">30° of mirror separation produced 60° of rotation — measured over 4,000 pairs at 3.8e−6 (verify_73 §E.4)</text>
<text x="380.0" y="382" class="xs t-hi" text-anchor="middle">the rotor carries HALF the turn, and that is where the θ/2 in every quaternion comes from</text>
</svg>
