<svg viewBox="0 0 700 330" role="img" aria-labelledby="f614c-t f614c-d">
  <title id="f614c-t">Resolving a half-covered pixel in light and in bytes</title>
  <desc id="f614c-d">A two by two block half white and half black, resolved two ways: averaging linear light gives code 188, averaging stored bytes gives code 127.</desc>
  <defs>
    <marker id="e-i-f614c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f614c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f614c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f614c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f614c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="350.0" y="22" class="sm" text-anchor="middle">Resolving a half-covered pixel: the fourth appearance of one mistake</text>
<text x="116" y="52" class="xs" text-anchor="middle">4 samples</text>
<rect x="70" y="66" width="44" height="44" rx="2" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.85"/>
<rect x="116" y="66" width="44" height="44" rx="2" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.85"/>
<rect x="70" y="112" width="44" height="44" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.25"/>
<rect x="116" y="112" width="44" height="44" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.25"/>
<text x="116" y="178" class="xs" text-anchor="middle">two white, two black</text>
<line x1="176" y1="112" x2="210" y2="112" class="ink-soft" stroke-width="1.3" marker-end="url(#e-s-f614c)"/>
<rect x="228" y="66" width="200" height="60" rx="4" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="328" y="88" class="xs" text-anchor="middle">average the LIGHT</text>
<text x="328" y="108" class="xs" text-anchor="middle">code 188   (correct)</text>
<rect x="228" y="142" width="200" height="60" rx="4" fill="none" stroke="#e05c5c" stroke-width="1.3"/>
<text x="328" y="164" class="xs" text-anchor="middle">average the BYTES</text>
<text x="328" y="184" class="xs" text-anchor="middle">code 127   (the bug)</text>
<rect x="446" y="66" width="190" height="136" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="541" y="90" class="xs" text-anchor="middle">WHY 188</text>
<text x="541" y="108" class="xs" text-anchor="middle">half the light is 0.5</text>
<text x="541" y="124" class="xs" text-anchor="middle">sRGB(0.5) = 0.7354</text>
<text x="541" y="140" class="xs" text-anchor="middle">x 255 = 188</text>
<text x="541" y="166" class="xs" text-anchor="middle">code 127 delivers only</text>
<text x="541" y="182" class="xs" text-anchor="middle">21.2% of the light</text>
<text x="350.0" y="270" class="xs" text-anchor="middle">The symptom is specific and usually misdiagnosed: antialiased edges come out TOO DARK, so every silhouette</text>
<text x="350.0" y="288" class="xs" text-anchor="middle">grows a thin dark outline — and the usual guess is that edges are being blended with the background twice.</text>
<text x="350.0" y="306" class="xs" text-anchor="middle">This is Lesson 6.1's rule arriving for the fourth time, after 6.10's mip chains and 6.11's compositing. It</text>
<text x="350.0" y="324" class="xs" text-anchor="middle">will keep arriving, because every new way of AVERAGING is a new chance to average the wrong quantity.</text>
</svg>
