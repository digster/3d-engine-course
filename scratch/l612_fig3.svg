<line x1="492.0" y1="74.0" x2="518.0" y2="74.0" stroke="#e05c5c" stroke-width="2.2" fill="none" stroke-dasharray="6 4"/>
<text x="528" y="78" class="xs" text-anchor="start">clamp</text>
<text x="528" y="96" class="xs" text-anchor="start">min(x, 1) — what the</text>
<text x="528" y="113" class="xs" text-anchor="start">engine has always done</text>
<line x1="492.0" y1="142.0" x2="518.0" y2="142.0" stroke="#5082e6" stroke-width="2.2" fill="none"/>
<text x="528" y="146" class="xs" text-anchor="start">reinhard</text>
<text x="528" y="164" class="xs" text-anchor="start">x / (1 + x) — never</text>
<text x="528" y="181" class="xs" text-anchor="start">reaches 1; needs 224</text>
<text x="528" y="198" class="xs" text-anchor="start">to make code 255</text>
<line x1="492.0" y1="227.0" x2="518.0" y2="227.0" stroke="#5ac878" stroke-width="2.2" fill="none"/>
<text x="528" y="231" class="xs" text-anchor="start">reinhard-white</text>
<text x="528" y="249" class="xs" text-anchor="start">x(1 + x/W^2)/(1 + x)</text>
<text x="528" y="266" class="xs" text-anchor="start">sends W to exactly 1</text>
<line x1="492.0" y1="295.0" x2="518.0" y2="295.0" stroke="#f0961e" stroke-width="2.2" fill="none"/>
<text x="528" y="299" class="xs" text-anchor="start">aces</text>
<text x="528" y="317" class="xs" text-anchor="start">a FIT, not a model;</text>
<text x="528" y="334" class="xs" text-anchor="start">sends 1.0 to 0.8038</text>
<text x="360.0" y="358" class="xs" text-anchor="middle">THREE PROPERTIES MAKE ONE LEGAL: monotonic (or a highlight can come out darker than its own edge), close to the</text>
<text x="360.0" y="378" class="xs" text-anchor="middle">identity near zero (or the dark end is wrong), and bounded by 1 (or it has not done its job). Everything else is taste.</text>
</svg>
