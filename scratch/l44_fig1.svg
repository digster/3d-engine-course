<svg viewBox="0 0 720 372" role="img" aria-labelledby="l44f1-t l44f1-d">
  <title id="l44f1-t">What creating a shader costs, and what creating a pipeline costs</title>
  <desc id="l44f1-d">Four horizontal bars on a logarithmic millisecond scale. Creating a shader object takes 0.031 ms and does so in every run and every configuration. Creating the first pipeline in a process takes 31.6 ms, which is one-time driver and compiler setup. Each pipeline after it whose state permutation the driver has not seen takes about 2.4 ms — that is the compile, roughly eighty times the cost of creating a shader. A description the driver has compiled before takes 0.024 ms, and because the cache is on disk that remains true across restarts. Enabling the validation layer changes none of these materially.</desc>
  <defs>
    <marker id="e-i-l44f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l44f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l44f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
<text x="24" y="26" class="sm">creating a shader, and creating pipelines &#8212; four measurements of one call</text>
<text x="220.0" y="91.0" class="xs mono" text-anchor="end">SDL_CreateGPUShader</text>
<rect x="232.0" y="74.0" width="47.3" height="26" rx="3" fill="#5acdd7" opacity="0.85"/>
<text x="287.3" y="92.0" class="xs mono">0.031 ms</text>
<text x="236.0" y="115.0" class="xs muted">~0.03 ms in every run and configuration</text>
<text x="220.0" y="149.0" class="xs mono" text-anchor="end">first pipeline in a process</text>
<rect x="232.0" y="132.0" width="336.8" height="26" rx="3" fill="#eb786e" opacity="0.85"/>
<text x="576.8" y="150.0" class="xs mono">31.600 ms</text>
<text x="236.0" y="173.0" class="xs muted">one-time driver and compiler setup</text>
<text x="220.0" y="207.0" class="xs mono" text-anchor="end">each new state permutation</text>
<rect x="232.0" y="190.0" width="229.1" height="26" rx="3" fill="#5082e6" opacity="0.85"/>
<text x="469.1" y="208.0" class="xs mono">2.400 ms</text>
<text x="236.0" y="231.0" class="xs muted">THE COMPILE &#8212; ~80&#215; a shader</text>
<text x="220.0" y="265.0" class="xs mono" text-anchor="end">one compiled before</text>
<rect x="232.0" y="248.0" width="36.6" height="26" rx="3" fill="#5ac878" opacity="0.85"/>
<text x="276.6" y="266.0" class="xs mono">0.024 ms</text>
<text x="236.0" y="289.0" class="xs muted">cached ON DISK, so it survives a restart</text>
<line x1="232.0" y1="306.0" x2="588.0" y2="306.0" class="ink-soft" stroke-width="1.2"/>
<line x1="232.0" y1="306.0" x2="232.0" y2="310.0" class="ink-soft" stroke-width="1"/>
<text x="232.0" y="323.0" class="xs mono muted" text-anchor="middle">0.01</text>
<line x1="328.2" y1="306.0" x2="328.2" y2="310.0" class="ink-soft" stroke-width="1"/>
<text x="328.2" y="323.0" class="xs mono muted" text-anchor="middle">0.1</text>
<line x1="424.5" y1="306.0" x2="424.5" y2="310.0" class="ink-soft" stroke-width="1"/>
<text x="424.5" y="323.0" class="xs mono muted" text-anchor="middle">1</text>
<line x1="520.7" y1="306.0" x2="520.7" y2="310.0" class="ink-soft" stroke-width="1"/>
<text x="520.7" y="323.0" class="xs mono muted" text-anchor="middle">10</text>
<text x="232.0" y="338.0" class="xs muted">milliseconds (log scale)</text>
<text x="24" y="358" class="xs">Validation changes none of this materially: the first pipeline measures 31.8 ms with it on against 31.6 with it off.</text>
</svg>
