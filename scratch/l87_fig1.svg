<svg viewBox="0 0 900 520" role="img" aria-labelledby="l87f1-t l87f1-d">
  <title id="l87f1-t">One contact point cannot hold a crate up; four can.</title>
  <desc id="l87f1-d">Two panels. Left: a crate tilted on a floor with a single contact point at one corner, its centre of mass marked and a dashed gravity arrow through it, and a red arrow at the contact showing the only force available. The support polygon below is a single point. Right: the same crate nearly level with four contact points and a green bar underneath spanning them, labelled support polygon. Below, a table of measurements: one point leaves 0.330 degrees of tilt, 27.989 degrees per second of residual rocking and 21.27 millimetres of sink with zero support area; a four-point manifold leaves 0.041 degrees, 5.234 degrees per second, 1.16 millimetres and 0.6667 square metres.</desc>
  <defs>
    <marker id="e-i-l87f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l87f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l87f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l87f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l87f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-green-l87f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-red-l87f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-purple-l87f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7ede"/></marker></defs>
<text x="20" y="22" class="sm" text-anchor="start">A contact force through one point exerts no torque about itself.</text>
<text x="210" y="42" class="xs" text-anchor="middle">one contact point</text>
<line x1="45.0" y1="232.0" x2="375.0" y2="232.0" stroke="#8f918a" stroke-width="2.0" fill="none"/>
<path d="M 165.47,234.27 L 261.23,227.57 L 254.53,131.81 L 158.77,138.51 Z" fill="none" stroke="#e05c5c" stroke-width="1.7"/>
<circle cx="210.0" cy="183.0" r="3.4" fill="#8f918a"/>
<text x="219.0" y="178.04" class="xs muted" text-anchor="start">com</text>
<line x1="210.00" y1="183.04" x2="210.00" y2="228.00" stroke="#9b7ede" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#e-purple-l87f1)"/>
<circle cx="160.1" cy="232.0" r="4.6" fill="#e05c5c"/>
<line x1="160.08" y1="234.00" x2="160.08" y2="198.00" stroke="#e05c5c" stroke-width="1.8" marker-end="url(#e-red-l87f1)"/>
<circle cx="160.1" cy="248.0" r="3" fill="#e05c5c"/>
<text x="210" y="266" class="xs" text-anchor="middle">support polygon: a point</text>
<text x="210" y="288" class="xs muted" text-anchor="middle">the resultant must pass through it, so the</text>
<text x="210" y="303" class="xs muted" text-anchor="middle">weight of the crate makes a couple about it</text>
<text x="210" y="318" class="xs muted" text-anchor="middle">and the crate turns — every frame, for ever</text>
<text x="660" y="42" class="xs" text-anchor="middle">four contact points</text>
<line x1="495.0" y1="232.0" x2="825.0" y2="232.0" stroke="#8f918a" stroke-width="2.0" fill="none"/>
<path d="M 612.51,231.54 L 708.50,230.53 L 707.49,134.54 L 611.50,135.55 Z" fill="none" stroke="#e05c5c" stroke-width="1.7"/>
<circle cx="660.0" cy="183.0" r="3.4" fill="#8f918a"/>
<text x="669.0" y="178.04" class="xs muted" text-anchor="start">com</text>
<line x1="660.00" y1="183.04" x2="660.00" y2="228.00" stroke="#9b7ede" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#e-purple-l87f1)"/>
<circle cx="612.0" cy="232.0" r="4.6" fill="#5ac878"/>
<line x1="612.00" y1="234.00" x2="612.00" y2="198.00" stroke="#5ac878" stroke-width="1.8" marker-end="url(#e-green-l87f1)"/>
<circle cx="643.7" cy="232.0" r="4.6" fill="#5ac878"/>
<line x1="643.68" y1="234.00" x2="643.68" y2="198.00" stroke="#5ac878" stroke-width="1.8" marker-end="url(#e-green-l87f1)"/>
<circle cx="676.3" cy="232.0" r="4.6" fill="#5ac878"/>
<line x1="676.32" y1="234.00" x2="676.32" y2="198.00" stroke="#5ac878" stroke-width="1.8" marker-end="url(#e-green-l87f1)"/>
<circle cx="708.0" cy="232.0" r="4.6" fill="#5ac878"/>
<line x1="708.00" y1="234.00" x2="708.00" y2="198.00" stroke="#5ac878" stroke-width="1.8" marker-end="url(#e-green-l87f1)"/>
<line x1="612.0" y1="248.0" x2="708.0" y2="248.0" stroke="#5ac878" stroke-width="4.0" fill="none"/>
<text x="660" y="266" class="xs" text-anchor="middle">support polygon</text>
<text x="660" y="288" class="xs muted" text-anchor="middle">four independent non-negative impulses, so the</text>
<text x="660" y="303" class="xs muted" text-anchor="middle">resultant can act ANYWHERE in their hull, and</text>
<text x="660" y="318" class="xs muted" text-anchor="middle">it does: the crate rests</text>
<line x1="20" y1="366" x2="880" y2="366" class="grid" stroke-width="1.0"/>
<text x="24" y="374" class="xs muted" text-anchor="start">§1 — the same crate, the same solver, the same normal</text>
<text x="24" y="394" class="xs muted" text-anchor="start">contacts</text>
<text x="308" y="394" class="xs muted" text-anchor="end">tilt, 2 s</text>
<text x="468" y="394" class="xs muted" text-anchor="end">residual rocking</text>
<text x="578" y="394" class="xs muted" text-anchor="end">sink</text>
<text x="728" y="394" class="xs muted" text-anchor="end">support area</text>
<line x1="24" y1="402.0" x2="734" y2="402.0" class="grid" stroke-width="1.0"/>
<text x="24" y="419.0" class="xs" text-anchor="start">1 point</text>
<text x="308" y="419.0" class="xs mono" text-anchor="end">0.330°</text>
<text x="468" y="419.0" class="xs mono" text-anchor="end">27.989 °/s</text>
<text x="578" y="419.0" class="xs mono" text-anchor="end">21.27 mm</text>
<text x="728" y="419.0" class="xs mono" text-anchor="end">0.0000 m²</text>
<text x="24" y="436.0" class="xs" text-anchor="start">3.33 points (mean)</text>
<text x="308" y="436.0" class="xs mono" text-anchor="end">0.041°</text>
<text x="468" y="436.0" class="xs mono" text-anchor="end">5.234 °/s</text>
<text x="578" y="436.0" class="xs mono" text-anchor="end">1.16 mm</text>
<text x="728" y="436.0" class="xs mono" text-anchor="end">0.6667 m²</text>
<text x="24" y="476" class="xs muted" text-anchor="start">A single point does not TIP a crate that is already flat. It ROCKS it, pushing whichever corner is lowest and turning</text>
<text x="24" y="493" class="xs muted" text-anchor="start">the other one down — and while it rocks, it sinks. Only one corner of four is ever being pushed out.</text>
</svg>
