<text x="370.15686274509807" y="198.0" class="xs mono" text-anchor="middle">188</text>
<text x="512" y="96" class="sm t-bad" text-anchor="start">code 128 emits</text>
<text x="512" y="116" class="sm mono" text-anchor="start">0.2140</text>
<text x="512" y="134" class="xs muted" text-anchor="start">of white's light —</text>
<text x="512" y="150" class="xs muted" text-anchor="start">not half of it.</text>
<text x="512" y="194" class="sm t-ok" text-anchor="start">half the light is</text>
<text x="512" y="214" class="sm mono" text-anchor="start">code 188</text>
<text x="512" y="232" class="xs muted" text-anchor="start">and the gap between</text>
<text x="512" y="248" class="xs muted" text-anchor="start">those two numbers is</text>
<text x="512" y="264" class="xs muted" text-anchor="start">this whole lesson.</text>
<text x="512" y="306" class="xs t-hi" text-anchor="start">the curve above is the</text>
<text x="512" y="322" class="xs t-hi" text-anchor="start">sRGB transfer function;</text>
<text x="512" y="338" class="xs muted" text-anchor="start">the dashed line is the</text>
<text x="512" y="354" class="xs muted" text-anchor="start">assumption it replaces.</text>
<line x1="24" y1="424" x2="696" y2="424" class="grid" stroke-width="1.2"/>
<text x="24" y="446" class="xs t-hi" text-anchor="start">EVERYTHING THE RENDERER COMPUTES IS ON THE VERTICAL AXIS. A reflectance multiplies light; two lamps add their</text>
<text x="24" y="462" class="xs muted" text-anchor="start">light; an average of two colours is an average of their light. Do any of that on the horizontal axis and the answer</text>
</svg>
