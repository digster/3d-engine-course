<svg viewBox="0 0 720 470" role="img" aria-labelledby="l61f1-t l61f1-d">
  <title id="l61f1-t">The sRGB transfer function between stored codes and emitted light</title>
  <desc id="l61f1-d">A plot with stored code on the x axis and emitted light on the y axis. The assumed straight line is dashed; the true sRGB curve bows below it. Code 128 emits 0.2159 of white, and half the light is stored as code 188.</desc>
  <defs>
    <marker id="e-i-l61f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l61f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l61f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l61f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l61f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">A stored value is not an amount of light. It is a CODE for one, and this is the curve between them.</text>
<line x1="90" y1="360" x2="470" y2="360" class="grid" stroke-width="1.2"/>
<line x1="90" y1="60" x2="90" y2="360" class="grid" stroke-width="1.2"/>
<text x="280.0" y="398" class="xs muted" text-anchor="middle">stored code — what is in the byte</text>
<text x="56" y="50" class="xs muted" text-anchor="start">light emitted</text>
<line x1="90.0" y1="360" x2="90.0" y2="365" class="grid" stroke-width="1.0"/>
<text x="90.0" y="378" class="xs muted" text-anchor="middle">0</text>
<line x1="280.0" y1="360" x2="280.0" y2="365" class="grid" stroke-width="1.0"/>
<text x="280.0" y="378" class="xs muted" text-anchor="middle">128</text>
<line x1="470.0" y1="360" x2="470.0" y2="365" class="grid" stroke-width="1.0"/>
<text x="470.0" y="378" class="xs muted" text-anchor="middle">255</text>
<line x1="85" y1="360.0" x2="90" y2="360.0" class="grid" stroke-width="1.0"/>
<text x="80" y="364.0" class="xs muted" text-anchor="end">0</text>
<line x1="85" y1="210.0" x2="90" y2="210.0" class="grid" stroke-width="1.0"/>
<text x="80" y="214.0" class="xs muted" text-anchor="end">0.5</text>
<line x1="85" y1="60.0" x2="90" y2="60.0" class="grid" stroke-width="1.0"/>
<text x="80" y="64.0" class="xs muted" text-anchor="end">1.0</text>
<line x1="90" y1="360" x2="470" y2="60" class="grid" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="371.2" y="120.0" class="xs muted" text-anchor="middle">what everyone assumes</text>
