<text x="160.5" y="255.8" class="xs mono" text-anchor="middle">125</text>
<text x="140.5" y="312.0" class="xs mono muted" text-anchor="middle">512&#178;</text>
<text x="140.5" y="326.0" class="xs muted" text-anchor="middle">1 MB</text>
