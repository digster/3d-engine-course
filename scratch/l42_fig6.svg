<line x1="78.0" y1="223.6" x2="578.0" y2="223.6" class="hi" stroke-width="2" stroke-dasharray="6 4"/>
<text x="586.0" y="227.6" class="xs mono t-hi">273 GB/s</text>
<text x="586.0" y="241.6" class="xs muted">this machine&#8217;s</text>
<text x="586.0" y="253.6" class="xs muted">memory bus</text>
<rect x="78.0" y="342.0" width="11" height="11" fill="#78b4eb" opacity="0.85"/>
<text x="94.0" y="352.0" class="xs">flat colour &#8212; compresses, so the bytes are never moved</text>
<rect x="408.0" y="342.0" width="11" height="11" fill="#eb786e" opacity="0.85"/>
<text x="424.0" y="352.0" class="xs">noise &#8212; cannot compress</text>
