<svg viewBox="0 0 720 360" role="img" aria-labelledby="l42f6-t l42f6-d">
  <title id="l42f6-t">Copy bandwidth on compressible and incompressible content</title>
  <desc id="l42f6-d">A bar chart of copy bandwidth in gigabytes per second at four texture sizes, with two bars per size. The first bar of each pair copies a flat-coloured texture and reports 686 and 798 gigabytes per second at 2048 and 4096 squared — above the dashed line at 273, this machine's entire memory bandwidth, which is impossible. The second bar of each pair copies incompressible noise and settles onto the line at 278. The difference is lossless render-target compression, which makes a flat texture almost free to copy and makes the first measurement fiction.</desc>
  <defs>
    <marker id="e-i-l42f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l42f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l42f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
<text x="24" y="26" class="sm">copy bandwidth, and the number that could not be true</text>
<text x="24" y="44" class="xs muted">the same ping-ponged blits, counting reads and writes, at four texture sizes</text>
<line x1="78.0" y1="294.0" x2="578.0" y2="294.0" class="grid" stroke-width="0.8"/>
<text x="68.0" y="298.0" class="xs mono muted" text-anchor="end">0</text>
<line x1="78.0" y1="242.4" x2="578.0" y2="242.4" class="grid" stroke-width="0.8"/>
<text x="68.0" y="246.4" class="xs mono muted" text-anchor="end">200</text>
<line x1="78.0" y1="190.9" x2="578.0" y2="190.9" class="grid" stroke-width="0.8"/>
<text x="68.0" y="194.9" class="xs mono muted" text-anchor="end">400</text>
<line x1="78.0" y1="139.3" x2="578.0" y2="139.3" class="grid" stroke-width="0.8"/>
<text x="68.0" y="143.3" class="xs mono muted" text-anchor="end">600</text>
