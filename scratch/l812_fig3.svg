<svg viewBox="0 0 980 479.5" role="img" aria-labelledby="g3-t g3-d">
  <title id="g3-t">The swing cone's row, and its rebound against rho to the n</title>
  <desc id="g3-d">Left: a cone about axis a1 with the bone b1 on it at swing angle phi, and n-hat out of the page; the swing row is angular_row(-n). Right: on log axes, the rebound off the cone at 1 to 32 sweeps lying near rho to the n, and a table of speculative and reactive overshoot.</desc>
  <defs>
    <marker id="e-i-g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-blue-g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<defs><marker id="e-purple-g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7ede"/></marker></defs>
<defs><marker id="e-grey-g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<text x="26" y="30" class="sm" text-anchor="start">The cone's row</text>
<line x1="190.0" y1="70.0" x2="67.9" y2="215.5" stroke="#5082e6" stroke-width="1.0" fill="none" stroke-dasharray="5 4"/>
<line x1="190.0" y1="70.0" x2="312.1" y2="215.5" stroke="#5082e6" stroke-width="1.0" fill="none" stroke-dasharray="5 4"/>
<ellipse cx="190" cy="215.5" rx="122.1" ry="22" fill="none" stroke="#5082e6" stroke-width="1.0" stroke-dasharray="5 4"/>
<line x1="190.00" y1="70.00" x2="190.00" y2="269.50" stroke="#8f918a" stroke-width="1.6" marker-end="url(#e-grey-g3)"/>
<text x="182" y="273.5" class="xs" text-anchor="end">a₁: the cone's axis</text>
<line x1="190.00" y1="70.00" x2="288.31" y2="221.38" stroke="#5082e6" stroke-width="2.0" marker-end="url(#e-blue-g3)"/>
<text x="308.3073458202124" y="237.38003751414905" class="xs" text-anchor="start">b₁: the bone</text>
<path d="M 190.00,130.00 L 191.73,129.98 L 193.45,129.90 L 195.18,129.78 L 196.90,129.60 L 198.61,129.38 L 200.32,129.11 L 202.01,128.79 L 203.70,128.41 L 205.38,128.00 L 207.04,127.53 L 208.69,127.01 L 210.32,126.45 L 211.94,125.84 L 213.54,125.19 L 215.12,124.49 L 216.68,123.74 L 218.21,122.95 L 219.73,122.12 L 221.22,121.24 L 222.68,120.32" fill="none" stroke="#5082e6" stroke-width="1.2"/>
<text x="212" y="152" class="xs" text-anchor="middle">φ</text>
<circle cx="190.0" cy="70.0" r="7.0" fill="none" stroke="#9b7ede" stroke-width="1.4"/>
<circle cx="190.0" cy="70.0" r="2.2" fill="#9b7ede"/>
<text x="204" y="62" class="xs" text-anchor="start">n̂ = a₁ × b₁ / |a₁ × b₁|, out of the page</text>
<text x="26" y="320" class="xs" text-anchor="start">cos φ = a₁ · b₁. Differentiate, and divide by |a₁ × b₁| = sin φ:</text>
<text x="26" y="335" class="xs mono" text-anchor="start">dφ/dt = (ω_b − ω_a) · n̂   — exactly, with no correction factor.</text>
<text x="26" y="350" class="xs" text-anchor="start">C = cone − φ ≥ 0, so the row is angular_row(−n̂): the hinge's</text>
<text x="26" y="365" class="xs" text-anchor="start">upper stop, with n̂ for its axis.</text>
<text x="530" y="30" class="sm" text-anchor="start">A rod on a socket at its end, swung into its cone</text>
<rect x="560" y="58" width="360" height="220" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="560" y1="278.0" x2="920" y2="278.0" class="grid" stroke-width="0.6"/>
<text x="554" y="282.0" class="xs mono" text-anchor="end">0.0001</text>
<line x1="560" y1="226.84946158901712" x2="920" y2="226.84946158901712" class="grid" stroke-width="0.6"/>
<text x="554" y="230.84946158901712" class="xs mono" text-anchor="end">0.001</text>
<line x1="560" y1="175.69892317803425" x2="920" y2="175.69892317803425" class="grid" stroke-width="0.6"/>
<text x="554" y="179.69892317803425" class="xs mono" text-anchor="end">0.01</text>
<line x1="560" y1="124.54838476705135" x2="920" y2="124.54838476705135" class="grid" stroke-width="0.6"/>
<text x="554" y="128.54838476705135" class="xs mono" text-anchor="end">0.1</text>
<line x1="560" y1="73.39784635606847" x2="920" y2="73.39784635606847" class="grid" stroke-width="0.6"/>
<text x="554" y="77.39784635606847" class="xs mono" text-anchor="end">1</text>
<text x="580.0" y="294" class="xs mono" text-anchor="middle">1</text>
<text x="644.0" y="294" class="xs mono" text-anchor="middle">2</text>
<text x="708.0" y="294" class="xs mono" text-anchor="middle">4</text>
<text x="772.0" y="294" class="xs mono" text-anchor="middle">8</text>
<text x="836.0" y="294" class="xs mono" text-anchor="middle">16</text>
<text x="900.0" y="294" class="xs mono" text-anchor="middle">32</text>
<text x="740.0" y="310" class="xs muted" text-anchor="middle">sweeps per step</text>
<path d="M 580.00,79.45 L 644.00,85.51 L 708.00,97.62 L 772.00,121.84 L 836.00,170.29 L 900.00,267.18" fill="none" stroke="#9b7ede" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="580.0" cy="71.9" r="3.8" fill="#f0961e"/>
<circle cx="644.0" cy="87.2" r="3.8" fill="#f0961e"/>
<circle cx="708.0" cy="110.9" r="3.8" fill="#f0961e"/>
<circle cx="772.0" cy="128.6" r="3.8" fill="#f0961e"/>
<circle cx="836.0" cy="171.8" r="3.8" fill="#f0961e"/>
<line x1="560.0" y1="328.0" x2="580.0" y2="328.0" stroke="#9b7ede" stroke-width="2.4" fill="none"/>
<text x="588" y="332" class="xs" text-anchor="start">ρⁿ, ρ = m·d² / I_pivot = 0.7614 for this rod</text>
<line x1="560.0" y1="345.0" x2="580.0" y2="345.0" stroke="#f0961e" stroke-width="2.4" fill="none"/>
<text x="588" y="349" class="xs" text-anchor="start">measured rebound speed / arrival speed, restitution zero</text>
<text x="560" y="380" class="xs muted" text-anchor="start">200 arrival phases, 3 rad/s, 40° cone</text>
<text x="560" y="400" class="xs muted" text-anchor="start">socket through the centre</text>
<text x="914" y="400" class="xs muted" text-anchor="end">overshoot</text>
<line x1="560" y1="408.0" x2="920" y2="408.0" class="grid" stroke-width="1.0"/>
<text x="560" y="425.0" class="xs" text-anchor="start">speculative, worst</text>
<text x="914" y="425.0" class="xs mono" text-anchor="end">1.19e-07 rad</text>
<text x="560" y="442.0" class="xs" text-anchor="start">reactive, mean</text>
<text x="914" y="442.0" class="xs mono" text-anchor="end">0.4977 of ω·h</text>
<text x="560" y="459.0" class="xs" text-anchor="start">reactive, worst</text>
<text x="914" y="459.0" class="xs mono" text-anchor="end">0.9952 of ω·h</text>
</svg>
