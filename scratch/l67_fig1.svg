<svg viewBox="0 0 720 356" role="img" aria-labelledby="l67f1-t l67f1-d">
  <title id="l67f1-t">A flat facet against the same facet with per-pixel normals</title>
  <desc id="l67f1-d">On the left a straight line with five identical upward arrows: the normal a triangle actually has, the same at every pixel. On the right the same span drawn as a wavy line with five arrows each perpendicular to the local slope, which is the surface a normal map describes without adding a single triangle.</desc>
  <defs>
    <marker id="e-i-l67f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l67f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l67f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l67f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l67f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="0" y="0" width="720" height="356" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="26" class="lg" text-anchor="middle">A surface is as flat as its triangles</text>
<rect x="24" y="46" width="320" height="200" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="184.0" y="68" class="sm" text-anchor="middle">what the mesh says</text>
<line x1="38" y1="78" x2="330" y2="78" class="grid" stroke-width="1.0"/>
<rect x="376" y="46" width="320" height="200" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="536.0" y="68" class="sm" text-anchor="middle">what the surface is</text>
<line x1="390" y1="78" x2="682" y2="78" class="grid" stroke-width="1.0"/>
<line x1="64" y1="200" x2="304" y2="200" class="ink" stroke-width="1.6"/>
<line x1="74" y1="196" x2="74" y2="138" class="ink" stroke-width="1.3" marker-end="url(#e-i-l67f1)"/>
<line x1="129" y1="196" x2="129" y2="138" class="ink" stroke-width="1.3" marker-end="url(#e-i-l67f1)"/>
<line x1="184" y1="196" x2="184" y2="138" class="ink" stroke-width="1.3" marker-end="url(#e-i-l67f1)"/>
<line x1="239" y1="196" x2="239" y2="138" class="ink" stroke-width="1.3" marker-end="url(#e-i-l67f1)"/>
<line x1="294" y1="196" x2="294" y2="138" class="ink" stroke-width="1.3" marker-end="url(#e-i-l67f1)"/>
<text x="184.0" y="224" class="xs" text-anchor="middle">one normal, interpolated</text>
<text x="184.0" y="240" class="xs" text-anchor="middle">— every pixel agrees</text>
