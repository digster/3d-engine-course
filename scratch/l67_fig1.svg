<line x1="584.0" y1="191.77100646790538" x2="554.4149281177936" y2="141.883898697213" class="hi" stroke-width="1.3" marker-end="url(#e-h-l67f1)"/>
<line x1="632.0" y1="213.31479122813215" x2="644.813601893789" y2="156.74791393666868" class="hi" stroke-width="1.3" marker-end="url(#e-h-l67f1)"/>
<text x="536.0" y="224" class="xs" text-anchor="middle">a normal PER PIXEL</text>
<text x="536.0" y="240" class="xs" text-anchor="middle">— and no more triangles</text>
<rect x="24" y="268" width="672" height="74" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="292" class="sm" text-anchor="middle">The cheapest way to add detail is to lie about the normal, not to add geometry.</text>
<text x="360.0" y="314" class="xs" text-anchor="middle">A normal map stores the difference — but a stored direction needs a FRAME to</text>
<text x="360.0" y="330" class="xs" text-anchor="middle">be expressed in, and finding that frame is the whole of this lesson.</text>
</svg>
