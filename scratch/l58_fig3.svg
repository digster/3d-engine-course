<rect x="450" y="300" width="130" height="30" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.1"/>
<text x="515" y="314" class="xs mono" text-anchor="middle">generation 1</text>
<text x="515" y="326" class="xs mono" text-anchor="middle">live</text>
