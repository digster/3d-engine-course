<text x="515" y="94" class="xs mono" text-anchor="middle">generation 1</text>
<text x="515" y="106" class="xs mono" text-anchor="middle">live</text>
<text x="142" y="72" class="xs muted" text-anchor="end">free list:</text>
<text x="142" y="94" class="xs mono muted" text-anchor="end">[]</text>
