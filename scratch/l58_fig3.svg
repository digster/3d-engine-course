<svg viewBox="0 0 720 390" role="img" aria-labelledby="l58f3-t l58f3-d">
  <title id="l58f3-t">A slot through mint, retire and reuse</title>
  <desc id="l58f3-d">Three panels showing slot 1 holding generation 1 while live, generation 2 while free, and generation 2 while live again after reuse, so the original id no longer matches.</desc>
  <defs>
    <marker id="e-i-l58f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l58f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l58f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l58f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l58f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">One slot, three moments. The generation is what turns a reused index into a detectable mistake.</text>
<text x="24" y="46" class="xs t-hi" text-anchor="start">1.  three ids minted</text>
