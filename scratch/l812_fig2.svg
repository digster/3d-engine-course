<svg viewBox="0 0 980 497" role="img" aria-labelledby="g2-t g2-d">
  <title id="g2-t">The swing as two mirrors, and the conditioning of Euler angles against swing–twist</title>
  <desc id="g2-d">Left: a unit circle with the bone at rest t, its image c, and the half-way vector h; mirror lines perpendicular to t and h; the swing angle phi. Right: on a log axis against the raise angle, Euler angles' sensitivity climbing to 610 at 89.9 degrees and swing–twist's staying near 1.5 until it climbs toward 180.</desc>
  <defs>
    <marker id="e-i-g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
