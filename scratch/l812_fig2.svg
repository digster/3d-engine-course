<defs><marker id="e-grey-g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<text x="26" y="30" class="sm" text-anchor="start">The swing is two mirrors</text>
<circle cx="190" cy="180" r="118" fill="none" class="grid" stroke-width="1"/>
<line x1="190.00" y1="180.00" x2="190.00" y2="298.00" stroke="#8f918a" stroke-width="1.8" marker-end="url(#e-grey-g2)"/>
<text x="182.0" y="314.0" class="xs" text-anchor="end">t: the bone at rest</text>
<line x1="190.00" y1="180.00" x2="300.88" y2="220.36" stroke="#5082e6" stroke-width="1.8" marker-end="url(#e-blue-g2)"/>
<text x="310.88372925273717" y="236.35837691242892" class="xs" text-anchor="start">c: where q sends it</text>
<line x1="190.00" y1="180.00" x2="257.68" y2="276.66" stroke="#5ac878" stroke-width="1.8" marker-end="url(#e-green-g2)"/>
<text x="267.68201948942345" y="292.659941226101" class="xs" text-anchor="start">h: half-way</text>
<line x1="57.8" y1="180.0" x2="322.2" y2="180.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="5 4"/>
<line x1="81.7" y1="255.8" x2="298.3" y2="104.2" stroke="#5ac878" stroke-width="1.0" fill="none" stroke-dasharray="5 4"/>
<path d="M 190.00,222.00 L 191.71,221.97 L 193.42,221.86 L 195.12,221.69 L 196.81,221.44 L 198.49,221.13 L 200.16,220.75 L 201.81,220.30 L 203.44,219.79 L 205.05,219.21 L 206.64,218.57 L 208.19,217.86 L 209.72,217.08 L 211.21,216.25 L 212.67,215.36 L 214.09,214.40 L 215.47,213.40 L 216.81,212.33 L 218.10,211.21 L 219.35,210.04 L 220.55,208.82 L 221.70,207.55 L 222.79,206.24 L 223.83,204.88 L 224.82,203.49 L 225.75,202.05 L 226.61,200.58 L 227.42,199.07 L 228.17,197.53 L 228.85,195.96 L 229.47,194.36" fill="none" stroke="#5082e6" stroke-width="1.2"/>
<text x="220" y="236" class="xs" text-anchor="middle">φ</text>
<text x="26" y="332" class="xs" text-anchor="start">Reflect in the plane ⊥ t, then in the plane ⊥ h:</text>
<text x="26" y="347" class="xs" text-anchor="start">two mirrors make a turn by twice the angle between</text>
<text x="26" y="362" class="xs" text-anchor="start">them — 2·∠(t, h) = φ — about the line they share.</text>
<text x="26" y="377" class="xs" text-anchor="start">That turn is the SWING: the smallest rotation that</text>
<text x="26" y="392" class="xs" text-anchor="start">carries t to c. The TWIST is what is left, a turn</text>
<text x="26" y="407" class="xs" text-anchor="start">about the bone itself: q = swing · twist.</text>
<text x="490" y="30" class="sm" text-anchor="start">A hanging arm raised forward: how far each split's angles jump</text>
