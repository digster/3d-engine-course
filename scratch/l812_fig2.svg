<text x="538" y="362" class="xs" text-anchor="start">Euler (7.2's YXZ): 1/cos(pitch) — locks at 90°, an arm raised forward</text>
<line x1="510.0" y1="375.0" x2="530.0" y2="375.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="538" y="379" class="xs" text-anchor="start">swing–twist: grows as 1/cos(swing/2) — one singularity, at 180°</text>
<text x="538" y="396" class="xs muted" text-anchor="start">rings are measured: the largest angle change per radian of random nudge;</text>
<text x="538" y="413" class="xs muted" text-anchor="start">near 180° swing–twist's sit ≈1.5× above its curve, the swing vector's own blur</text>
<text x="510" y="442" class="xs muted" text-anchor="start">609.9 against 573 at 89.9°: Euler's lock sits in the middle of a</text>
<text x="510" y="457" class="xs muted" text-anchor="start">shoulder's range. Swing–twist reads 1.55 there; its own singularity is the</text>
<text x="510" y="472" class="xs muted" text-anchor="start">antipode of the axis it measures from, which no cone contains.</text>
</svg>
