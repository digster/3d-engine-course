<text x="393" y="189" class="sm" text-anchor="start">v</text>
<text x="437" y="124" class="sm" text-anchor="middle">v′</text>
<text x="300" y="33" class="sm" text-anchor="middle">n</text>
<text x="290" y="148" class="xs" text-anchor="end">v∥ = (n·v) n</text>
<text x="393" y="209" class="xs" text-anchor="start">v⊥</text>
<text x="404" y="125" class="xs" text-anchor="end">n × v</text>
<rect x="546" y="70" width="190" height="150" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="560" y="90" class="xs muted" text-anchor="start">read off the picture</text>
<text x="560" y="116" class="mono xs" text-anchor="start">v cos θ</text>
<text x="560" y="130" class="xs muted" text-anchor="start">most of it leans over</text>
<text x="560" y="154" class="mono xs" text-anchor="start">+ (n × v) sin θ</text>
<text x="560" y="168" class="xs muted" text-anchor="start">and swings sideways</text>
<text x="560" y="192" class="mono xs" text-anchor="start">+ n (n·v)(1 − cos θ)</text>
<text x="560" y="206" class="xs muted" text-anchor="start">restoring the along-axis part</text>
<text x="380.0" y="390" class="xs muted" text-anchor="middle">v⊥ and n × v are perpendicular and the SAME LENGTH, so they are a pair of axes for the disc</text>
<text x="380.0" y="410" class="xs muted" text-anchor="middle">which turns the 3-D problem into the 2-D rotation of Lesson 1.7</text>
</svg>
