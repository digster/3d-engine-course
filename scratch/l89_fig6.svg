<svg viewBox="0 0 980 530" role="img" aria-labelledby="f89f-t f89f-d">
  <title id="f89f-t">The critical slope, and the two limits that compete for it</title>
  <desc id="f89f-d">Left: the angle at which a block starts to move, plotted against its coefficient of friction. The closed form arctangent of mu is drawn as a dashed line. A flat slab tracks it to within half a degree across the range; a cube falls away from it above mu of about 0.5 and is nearly four degrees low at mu of one. Right: the reason — a block slides when the tangent of the angle exceeds mu and tips when it exceeds its width over its height, and a cube's two limits coincide at 45 degrees.</desc>
  <defs>
    <marker id="e-i-f89f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f89f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f89f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f89f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f89f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-green-f89f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-red-f89f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<rect x="66" y="70" width="420" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="66" y="36" class="sm" text-anchor="start">The critical angle, bisected against the engine</text>
<text x="66" y="54" class="xs muted" text-anchor="start">two shapes, same μ, same solver</text>
<line x1="66" y1="292.22222222222223" x2="486" y2="292.22222222222223" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="58" y="296.22222222222223" class="xs muted" text-anchor="end">10°</text>
<line x1="66" y1="236.66666666666669" x2="486" y2="236.66666666666669" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="58" y="240.66666666666669" class="xs muted" text-anchor="end">20°</text>
<line x1="66" y1="181.11111111111111" x2="486" y2="181.11111111111111" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="58" y="185.11111111111111" class="xs muted" text-anchor="end">30°</text>
<line x1="66" y1="125.55555555555554" x2="486" y2="125.55555555555554" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="58" y="129.55555555555554" class="xs muted" text-anchor="end">40°</text>
<line x1="66" y1="70.0" x2="486" y2="70.0" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="58" y="74.0" class="xs muted" text-anchor="end">50°</text>
<line x1="106.0" y1="70" x2="106.0" y2="320" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="106.0" y="338" class="xs muted" text-anchor="middle">0.2</text>
<line x1="186.00000000000006" y1="70" x2="186.00000000000006" y2="320" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="186.00000000000006" y="338" class="xs muted" text-anchor="middle">0.4</text>
<line x1="266.0" y1="70" x2="266.0" y2="320" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="266.0" y="338" class="xs muted" text-anchor="middle">0.6</text>
<line x1="346.00000000000006" y1="70" x2="346.00000000000006" y2="320" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="346.00000000000006" y="338" class="xs muted" text-anchor="middle">0.8</text>
<line x1="426.00000000000006" y1="70" x2="426.00000000000006" y2="320" class="grid" stroke-width="1.0" stroke-dasharray="3 4"/>
<text x="426.00000000000006" y="338" class="xs muted" text-anchor="middle">1.0</text>
<text x="276.0" y="358" class="xs muted" text-anchor="middle">coefficient of friction μ</text>
<line x1="66.0" y1="97.8" x2="486.0" y2="97.8" stroke="#8f918a" stroke-width="1.6" fill="none" stroke-dasharray="6 4"/>
<text x="480" y="89.7777777777778" class="xs muted" text-anchor="end">a cube tips at 45°</text>
<path d="M 106.00,284.94 L 166.00,240.61 L 226.00,200.19 L 326.00,142.94 L 426.00,97.78" fill="none" stroke="#9b7ede" stroke-width="2.4" stroke-dasharray="6 4"/>
<path d="M 106.00,284.96 L 166.00,240.84 L 226.00,202.27 L 326.00,148.93 L 426.00,118.61" fill="none" stroke="#e05c5c" stroke-width="2.0"/>
<path d="M 106.00,284.99 L 166.00,240.69 L 226.00,200.29 L 326.00,143.58 L 426.00,100.16" fill="none" stroke="#5ac878" stroke-width="2.0"/>
<circle cx="106.0" cy="285.0" r="2.8" fill="#e05c5c"/>
<circle cx="166.0" cy="240.8" r="2.8" fill="#e05c5c"/>
<circle cx="226.0" cy="202.3" r="2.8" fill="#e05c5c"/>
<circle cx="326.0" cy="148.9" r="2.8" fill="#e05c5c"/>
<circle cx="426.0" cy="118.6" r="2.8" fill="#e05c5c"/>
<circle cx="106.0" cy="285.0" r="2.8" fill="#5ac878"/>
<circle cx="166.0" cy="240.7" r="2.8" fill="#5ac878"/>
<circle cx="226.0" cy="200.3" r="2.8" fill="#5ac878"/>
<circle cx="326.0" cy="143.6" r="2.8" fill="#5ac878"/>
<circle cx="426.0" cy="100.2" r="2.8" fill="#5ac878"/>
<line x1="76.0" y1="88.0" x2="96.0" y2="88.0" stroke="#9b7ede" stroke-width="2.4" fill="none"/>
<text x="104" y="92" class="xs" text-anchor="start">atan(μ) — the closed form</text>
<line x1="76.0" y1="105.0" x2="96.0" y2="105.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="104" y="109" class="xs" text-anchor="start">a 10:3 slab, which tips at 73°</text>
<line x1="76.0" y1="122.0" x2="96.0" y2="122.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="104" y="126" class="xs" text-anchor="start">a cube, which tips at 45°</text>
<text x="540" y="36" class="sm" text-anchor="start">Two limits, and a block obeys whichever comes first</text>
<line x1="520.0" y1="180.0" x2="690.0" y2="178.1" stroke="#8f918a" stroke-width="1.6" fill="none"/>
<path d="M 552.58,127.89 L 622.11,102.58 L 647.42,172.11 L 577.89,197.42 Z" fill="none" stroke="#5082e6" stroke-width="1.6"/>
<text x="600" y="206" class="xs" text-anchor="middle">cube, w/h = 1</text>
<text x="600" y="224" class="xs muted" text-anchor="middle">tips at 45.0°</text>
<line x1="730.0" y1="180.0" x2="900.0" y2="178.1" stroke="#8f918a" stroke-width="1.6" fill="none"/>
<path d="M 771.43,152.22 L 840.97,126.91 L 848.57,147.78 L 779.03,173.09 Z" fill="none" stroke="#5082e6" stroke-width="1.6"/>
<text x="810" y="206" class="xs" text-anchor="middle">slab, w/h = 10/3</text>
<text x="810" y="224" class="xs muted" text-anchor="middle">tips at 73.3°</text>
<text x="540" y="270" class="xs" text-anchor="start">A block slides when tan θ &gt; μ and TIPS when tan</text>
<text x="540" y="286" class="xs" text-anchor="start">θ &gt; w/h, and it does whichever happens first. A</text>
<text x="540" y="302" class="xs" text-anchor="start">cube's two limits coincide at 45°, so the cube</text>
<text x="540" y="318" class="xs" text-anchor="start">column above is not measuring μ at all past</text>
<text x="540" y="334" class="xs" text-anchor="start">about 0.75 — it is measuring the fixture.</text>
<text x="540" y="364" class="xs muted" text-anchor="start">The tell is that the error GROWS with the</text>
<text x="540" y="380" class="xs muted" text-anchor="start">parameter: 0.004° out at μ = 0.2 and 3.75° at μ</text>
<text x="540" y="396" class="xs muted" text-anchor="start">= 1.0. A wrong constant would have been wrong</text>
<text x="540" y="412" class="xs muted" text-anchor="start">at both. The control is the same instrument</text>
<text x="540" y="428" class="xs muted" text-anchor="start">measuring the other formula — μ = 5, where</text>
<text x="540" y="444" class="xs muted" text-anchor="start">sliding is impossible, lets go at 45.0032°</text>
<text x="540" y="460" class="xs muted" text-anchor="start">against a predicted 45°.</text>
<text x="66" y="516" class="xs muted" text-anchor="start">§8 and harness §G. Both columns are bisections of the engine's own behaviour over sixteen steps, 2 s of drift, a 5 mm threshold.</text>
</svg>
