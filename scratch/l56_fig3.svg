<svg viewBox="0 0 720 322" role="img" aria-labelledby="l56f3-t l56f3-d">
  <title id="l56f3-t">Memory-level parallelism versus a serial dependency chain</title>
  <desc id="l56f3-d">Top: an array of pointers, whose five addresses can be read at once so five cache misses overlap. Bottom: a linked list, where each node's address is stored inside the previous node, so the misses must happen one after another.</desc>
  <defs>
    <marker id="e-i-l56f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l56f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l56f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l56f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l56f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Both are “pointer chasing”, and they are not the same thing at all: 2.4x against 6.5x.</text>
<text x="24" y="52" class="xs t-hi" text-anchor="start">ARRAY OF POINTERS — the addresses are known up front</text>
<rect x="24" y="62" width="48" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="48" y="76" class="xs mono" text-anchor="middle">p0</text>
<rect x="80" y="62" width="48" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="104" y="76" class="xs mono" text-anchor="middle">p1</text>
<rect x="136" y="62" width="48" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="160" y="76" class="xs mono" text-anchor="middle">p2</text>
<rect x="192" y="62" width="48" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="216" y="76" class="xs mono" text-anchor="middle">p3</text>
<rect x="248" y="62" width="48" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="272" y="76" class="xs mono" text-anchor="middle">p4</text>
<line x1="48" y1="84" x2="30" y2="112" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l56f3)"/>
<line x1="104" y1="84" x2="91" y2="112" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l56f3)"/>
<line x1="160" y1="84" x2="152" y2="112" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l56f3)"/>
<line x1="216" y1="84" x2="213" y2="112" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l56f3)"/>
<line x1="272" y1="84" x2="34" y2="112" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l56f3)"/>
<rect x="12" y="114" width="44" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="73" y="114" width="44" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="134" y="114" width="44" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="195" y="114" width="44" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="16" y="114" width="44" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<text x="330" y="60" class="xs" text-anchor="start">The CPU can read p0..p4 in one go and issue FIVE</text>
<text x="330" y="76" class="xs" text-anchor="start">loads at once. They miss in parallel; the misses</text>
<text x="330" y="92" class="xs" text-anchor="start">OVERLAP. That is memory-level parallelism, and it</text>
<text x="330" y="108" class="xs" text-anchor="start">is why scattering objects costs 2.4x and not 20x.</text>
<text x="330" y="130" class="xs t-ok" text-anchor="start">A dozen misses in flight is a factor of a dozen.</text>
<line x1="24" y1="158" x2="696" y2="158" class="grid" stroke-width="1.0"/>
<text x="24" y="180" class="xs t-hi" text-anchor="start">LINKED LIST — each address is INSIDE the previous node</text>
<rect x="24" y="192" width="96" height="26" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="72" y="209" class="xs mono" text-anchor="middle">node 0</text>
<line x1="120" y1="205" x2="142" y2="205" stroke="#e05c5c" stroke-width="1.4" marker-end="url(#e-b-l56f3)"/>
<rect x="144" y="192" width="96" height="26" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="192" y="209" class="xs mono" text-anchor="middle">node 1</text>
<line x1="240" y1="205" x2="262" y2="205" stroke="#e05c5c" stroke-width="1.4" marker-end="url(#e-b-l56f3)"/>
<rect x="264" y="192" width="96" height="26" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="312" y="209" class="xs mono" text-anchor="middle">node 2</text>
<line x1="360" y1="205" x2="382" y2="205" stroke="#e05c5c" stroke-width="1.4" marker-end="url(#e-b-l56f3)"/>
<rect x="384" y="192" width="96" height="26" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="432" y="209" class="xs mono" text-anchor="middle">node 3</text>
<line x1="480" y1="205" x2="502" y2="205" stroke="#e05c5c" stroke-width="1.4" marker-end="url(#e-b-l56f3)"/>
<rect x="504" y="192" width="96" height="26" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="552" y="209" class="xs mono" text-anchor="middle">node 4</text>
<text x="24" y="240" class="xs" text-anchor="start">Load node 0 (miss, ~80 ns). Only then do you learn node 1's address. Load it (miss). Only then…</text>
<text x="24" y="256" class="xs t-bad" text-anchor="start">The misses are SERIAL — a dependency chain — so they add up instead of overlapping.</text>
<line x1="24" y1="274" x2="696" y2="274" class="grid" stroke-width="1.2"/>
<text x="24" y="292" class="xs t-hi" text-anchor="start">A scene TREE is the second picture. That is what creaks — not the hierarchy, not the OOP, not the virtual calls:</text>
<text x="24" y="308" class="xs t-hi" text-anchor="start">the fact that finding the next thing to work on requires having finished fetching the last one.</text>
</svg>
