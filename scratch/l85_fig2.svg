<svg viewBox="0 0 900 420" role="img" aria-labelledby="l85f2-t l85f2-d">
  <title id="l85f2-t">Two shapes and their Minkowski difference: overlap becomes containment of the origin, and distance becomes distance to the origin.</title>
  <desc id="l85f2-d">Three panels. The first shows a blue pentagon A and a green quadrilateral B with the segment between their closest points. The second shows the single set A minus B, drawn in grey, with the origin marked outside it and an arrow v from the origin to its nearest point, whose length is the same number as in the first panel. The third shows the difference set when the shapes overlap, with the origin inside it.</desc>
  <defs>
    <marker id="e-i-l85f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l85f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l85f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l85f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l85f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-purple-l85f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7ede"/></marker></defs>
<defs><marker id="e-amber-l85f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<text x="20" y="22" class="sm" text-anchor="start">The substitution the whole algorithm rests on.</text>
<text x="20" y="42" class="xs muted" text-anchor="start">A question about a PAIR becomes a question about a POINT.</text>
