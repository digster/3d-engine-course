<svg viewBox="0 0 760 440" role="img" aria-labelledby="f72f-t f72f-d">
  <title id="f72f-t">The two extraction routes</title>
  <desc id="f72f-d">A log plot of worst axis error against the size of the turn, for two ways of recovering a rotation's axis. The amber curve, which reads the axis off the antisymmetric part, is lowest at small angles and climbs steeply past 150 degrees to seven thousandths of a degree at 179.9. The blue curve, which reads it off the symmetric part, starts high at 30 degrees and then stays flat at about a hundred-thousandth of a degree all the way to a half turn. They cross in a shaded band from about 95 to 142 degrees, and a dashed teal line marks the 120 degree threshold in the middle of it.</desc>
  <defs>
    <marker id="e-i-f72f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f72f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f72f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f72f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f72f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
