<rect x="586" y="62" width="158" height="132" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<line x1="594.0" y1="80.0" x2="614.0" y2="80.0" stroke="#f0961e" stroke-width="2.4" fill="none"/>
<text x="620" y="84" class="xs" text-anchor="start">R − Rᵀ</text>
<line x1="594.0" y1="102.0" x2="614.0" y2="102.0" stroke="#5082e6" stroke-width="2.4" fill="none"/>
<text x="620" y="106" class="xs" text-anchor="start">R + Rᵀ</text>
<text x="594" y="132" class="xs muted" text-anchor="start">worst axis error</text>
<text x="594" y="148" class="xs muted" text-anchor="start">over 4,000 axes,</text>
<text x="594" y="164" class="xs muted" text-anchor="start">matrices carrying</text>
<text x="594" y="180" class="mono xs muted" text-anchor="start">1e-7 absolute</text>
<text x="380.0" y="370" class="xs muted" text-anchor="middle">shaded: the band where the two are within 25% of each other and the winner flips from probe to probe</text>
<text x="380.0" y="393" class="xs muted" text-anchor="middle">outside it the choice is decisive — R − Rᵀ is 6.8× better at 30°, R + Rᵀ is 569× better at 179.9°</text>
<text x="380.0" y="420" class="xs muted" text-anchor="middle">the threshold is derived from tan(θ/2) = √3 and lands in the middle of the band, which is the best place for one to be</text>
</svg>
