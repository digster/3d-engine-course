<text x="586" y="267.6125" class="xs" text-anchor="start">capsule vs box</text>
<line x1="572.0" y1="270.6" x2="582.0" y2="279.6" stroke="#5082e6" stroke-width="0.9" fill="none" stroke-dasharray="2 2"/>
<text x="586" y="283.6125" class="xs" text-anchor="start">box vs box</text>
<line x1="572.0" y1="277.0" x2="582.0" y2="295.6" stroke="#8f918a" stroke-width="0.9" fill="none" stroke-dasharray="2 2"/>
<text x="586" y="299.6125" class="xs" text-anchor="start">hull vs hull</text>
<line x1="20" y1="330" x2="880" y2="330" class="grid" stroke-width="1.0"/>
<text x="20" y="354" class="sm t-hi" text-anchor="start">8.5 ran this table for GJK and found the SPHERE flat at ONE iteration. Here it is the worst row — 28.6 rising to the cap.</text>
<text x="20" y="376" class="xs" text-anchor="start">Same shape, same support function, opposite behaviour. GJK walks TO a ball's surface, and the nearest point of a ball to an outside point is on</text>
<text x="20" y="392" class="xs" text-anchor="start">the line to its centre, so the first support call lands on the answer. EPA has to COVER that surface with flat triangles, and no finite number of</text>
<text x="20" y="408" class="xs" text-anchor="start">them is ever exact. A box and a hull are polytopes: their vertex sets are finite, so the expansion finishes and the tolerance is never what stopped it.</text>
<text x="20" y="430" class="xs muted" text-anchor="start">Which is why 8.4 ships `collide(sphere, sphere)` as one subtraction, and why an engine keeps it.</text>
</svg>
