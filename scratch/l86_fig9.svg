<svg viewBox="0 0 900 450" role="img" aria-labelledby="l86f9-t l86f9-d">
  <title id="l86f9-t">Mean EPA expansions against tolerance for five shape pairs.</title>
  <desc id="l86f9-d">A line chart with tolerance from 1e-2 to 1e-6 on the horizontal axis. Box against box is flat at about 10 expansions and hull against hull flat at about 8: both are polytopes and terminate exactly. Capsule and sphere against a box climb gently. Sphere against sphere climbs steeply from 28.6 to the 60-expansion cap, because a ball has no faces to reach.</desc>
