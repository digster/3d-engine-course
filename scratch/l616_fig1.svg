<svg viewBox="0 0 720 384" role="img" aria-labelledby="f616a-t f616a-d">
  <title id="f616a-t">Where an off-screen object is rejected</title>
  <desc id="f616a-d">A pipeline diagram: draw list, submit, vertex shader, clip, raster, fragment. The GPU rejects off-screen geometry at the clipper, after the vertex shader has run. Frustum culling rejects it before submission. Below, a log-scale bar pair comparing the cost of the test with the cost of the work it skips.</desc>
  <defs>
    <marker id="e-i-f616a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f616a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f616a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f616a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f616a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">Two places an off-screen object can be thrown away, and everything between them is paid for</text>
<rect x="46" y="104" width="98" height="44" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="95.0" y="131" class="xs" text-anchor="middle">draw list</text>
<line x1="144" y1="126.0" x2="158" y2="126.0" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-f616a)"/>
<rect x="158" y="104" width="98" height="44" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="207.0" y="131" class="xs" text-anchor="middle">submit</text>
<line x1="256" y1="126.0" x2="270" y2="126.0" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-f616a)"/>
<rect x="270" y="104" width="98" height="44" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.3"/>
<text x="319.0" y="131" class="xs" text-anchor="middle">vertex shader</text>
<line x1="368" y1="126.0" x2="382" y2="126.0" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-f616a)"/>
<rect x="382" y="104" width="98" height="44" rx="3" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="431.0" y="131" class="xs" text-anchor="middle">clip</text>
<line x1="480" y1="126.0" x2="494" y2="126.0" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-f616a)"/>
<rect x="494" y="104" width="98" height="44" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="543.0" y="131" class="xs" text-anchor="middle">raster</text>
<line x1="592" y1="126.0" x2="606" y2="126.0" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-f616a)"/>
<rect x="606" y="104" width="98" height="44" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="655.0" y="131" class="xs" text-anchor="middle">fragment</text>
<line x1="431.0" y1="148.0" x2="431.0" y2="174.0" stroke="#f0961e" stroke-width="1.4" fill="none"/>
<text x="431.0" y="190" class="xs" text-anchor="middle">THE GPU NOTICES HERE</text>
<text x="431.0" y="206" class="xs" text-anchor="middle">— and every stage to its</text>
<text x="431.0" y="222" class="xs" text-anchor="middle">left already ran</text>
<line x1="95.0" y1="104.0" x2="95.0" y2="82.0" stroke="#5ac878" stroke-width="1.6" fill="none"/>
<text x="101.0" y="60" class="xs" text-anchor="middle">WE NOTICE HERE</text>
<text x="101.0" y="75" class="xs" text-anchor="middle">six dot products</text>
<text x="319.0" y="94" class="xs" text-anchor="middle">runs on EVERY vertex</text>
<text x="360.0" y="238" class="xs" text-anchor="middle">One object's cost, measured on this engine's CPU path (verify_616 §H)</text>
<rect x="150" y="264" width="173.4" height="20" rx="2" fill="#5ac878" fill-opacity="0.42" stroke="#5ac878" stroke-width="1.2"/>
<text x="142" y="279" class="xs" text-anchor="end">the frustum test</text>
<text x="331.43871487223146" y="279" class="xs" text-anchor="start">58.3 ns</text>
<rect x="150" y="298" width="430.0" height="20" rx="2" fill="#e05c5c" fill-opacity="0.42" stroke="#e05c5c" stroke-width="1.2"/>
<text x="142" y="313" class="xs" text-anchor="end">the work it skips</text>
<text x="588.0" y="313" class="xs" text-anchor="start">23,821.2 ns</text>
<text x="360.0" y="344" class="xs" text-anchor="middle">log scale — the ratio is 409x, so culling pays as soon as it rejects one object in 409</text>
</svg>
