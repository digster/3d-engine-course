<text x="215.17647058823528" y="168" class="xs muted" text-anchor="middle">handed one</text>
<line x1="459.4117647058823" y1="110" x2="459.4117647058823" y2="108" class="grid" stroke-width="1.0"/>
<line x1="459.4117647058823" y1="108" x2="459.4117647058823" y2="114" class="grid" stroke-width="1.0"/>
