<svg viewBox="0 0 760 430" role="img" aria-labelledby="l617f1-t l617f1-d">
  <title id="l617f1-t">The engine's frame today: seventeen render passes across four owners</title>
  <desc id="l617f1-d">A strip of seventeen render passes grouped by the type that records them, above a list of the four facts a human currently maintains by hand: the pass order, every load op, every store op, and which passes run at all.</desc>
  <defs>
    <marker id="e-i-l617f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
