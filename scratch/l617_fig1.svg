<text x="653.2" y="168" class="xs muted" text-anchor="middle">handed one</text>
<text x="34" y="202" class="xs t-bad" text-anchor="start">FOUR FACTS, EACH WRITTEN DOWN BY A HUMAN AND CHECKED BY NOTHING</text>
<rect x="34" y="211" width="150" height="20" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.1"/>
<text x="109" y="224" class="xs" text-anchor="middle">the ORDER</text>
<text x="196" y="224" class="xs muted" text-anchor="start">lives in whichever function assembles the frame, plus prose in three headers</text>
<rect x="34" y="245" width="150" height="20" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.1"/>
<text x="109" y="258" class="xs" text-anchor="middle">every LOAD OP</text>
<text x="196" y="258" class="xs muted" text-anchor="start">DONT_CARE / CLEAR / LOAD, chosen per attachment; 6.13 called one 'load-bearing'</text>
<rect x="34" y="279" width="150" height="20" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.1"/>
<text x="109" y="292" class="xs" text-anchor="middle">every STORE OP</text>
<text x="196" y="292" class="xs muted" text-anchor="start">4.7 chose DONT_CARE for the scene depth; 6.8 had to choose STORE for the map</text>
<rect x="34" y="313" width="150" height="20" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.1"/>
<text x="109" y="326" class="xs" text-anchor="middle">which passes RUN</text>
<text x="196" y="326" class="xs muted" text-anchor="start">gpu_post.cpp:562 — `if (!s.enabled) { return; }`, a second copy of a dependency</text>
<line x1="34" y1="366" x2="726" y2="366" class="grid" stroke-width="1.2"/>
<text x="34" y="386" class="xs t-ok" text-anchor="start">All four are consequences of ONE thing each pass could say instead: what it reads, and what it writes.</text>
</svg>
