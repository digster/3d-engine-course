<svg viewBox="0 0 900 488" role="img" aria-labelledby="l87f3-t l87f3-d">
  <title id="l87f3-t">The contact normal swings ninety degrees in one ten-micrometre step while the depth changes by ten thousandths of a millimetre.</title>
  <desc id="l87f3-d">Three panels showing a small cube pressed into a wall that ends, seen from above. In each, two arrows leave the cube: one out through the wall's face costing 50 millimetres, one past the wall's end costing 1 minus z plus 0.2. At z = 1.10 the face escape is shorter and is drawn in green; at z = 1.20 the end escape is; at z = 1.15 they are equal. A table records that over a single 10 micrometre step across that crossing the normal changes by 90.00 degrees while the depth changes by 0.01001 millimetres.</desc>
  <defs>
    <marker id="e-i-l87f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l87f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l87f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l87f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l87f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-purple-l87f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7ede"/></marker></defs>
<defs><marker id="e-green-l87f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-red-l87f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<text x="20" y="22" class="sm" text-anchor="start">The depth is continuous. The direction is not — and that is a property of a minimum.</text>
<path d="M 125.20,272.00 L 182.80,272.00 L 182.80,201.60 L 125.20,201.60 Z" fill="none" stroke="#8f918a" stroke-width="1.6"/>
<text x="154.0" y="244.0" class="xs muted" text-anchor="middle">wall</text>
<path d="M 170.00,208.00 L 221.20,208.00 L 221.20,156.80 L 170.00,156.80 Z" fill="none" stroke="#e05c5c" stroke-width="1.7"/>
<line x1="195.60" y1="182.40" x2="195.60" y2="156.80" stroke="#5ac878" stroke-width="2.0" marker-end="url(#e-green-l87f3)"/>
<line x1="195.60" y1="182.40" x2="246.80" y2="182.40" stroke="#8f918a" stroke-width="2.0" marker-end="url(#e-purple-l87f3)"/>
<text x="170" y="66" class="xs" text-anchor="middle">z = 1.10 m</text>
<text x="170" y="294" class="xs muted" text-anchor="middle">out through the face, 50 mm</text>
<text x="170" y="312" class="xs mono" text-anchor="middle">depth 50 mm</text>
<path d="M 415.20,272.00 L 472.80,272.00 L 472.80,201.60 L 415.20,201.60 Z" fill="none" stroke="#8f918a" stroke-width="1.6"/>
<text x="444.0" y="244.0" class="xs muted" text-anchor="middle">wall</text>
<path d="M 466.40,208.00 L 517.60,208.00 L 517.60,156.80 L 466.40,156.80 Z" fill="none" stroke="#e05c5c" stroke-width="1.7"/>
<line x1="492.00" y1="182.40" x2="492.00" y2="156.80" stroke="#5ac878" stroke-width="2.0" marker-end="url(#e-green-l87f3)"/>
<line x1="492.00" y1="182.40" x2="517.60" y2="182.40" stroke="#8f918a" stroke-width="2.0" marker-end="url(#e-purple-l87f3)"/>
<text x="460" y="66" class="xs" text-anchor="middle">z = 1.15 m</text>
<text x="460" y="294" class="xs muted" text-anchor="middle">the two are equal</text>
<text x="460" y="312" class="xs mono" text-anchor="middle">depth 50 mm</text>
<path d="M 705.20,272.00 L 762.80,272.00 L 762.80,201.60 L 705.20,201.60 Z" fill="none" stroke="#8f918a" stroke-width="1.6"/>
<text x="734.0" y="244.0" class="xs muted" text-anchor="middle">wall</text>
<path d="M 762.80,208.00 L 814.00,208.00 L 814.00,156.80 L 762.80,156.80 Z" fill="none" stroke="#e05c5c" stroke-width="1.7"/>
<line x1="788.40" y1="182.40" x2="788.40" y2="156.80" stroke="#8f918a" stroke-width="2.0" marker-end="url(#e-purple-l87f3)"/>
<line x1="788.40" y1="182.40" x2="788.40" y2="182.40" stroke="#5ac878" stroke-width="2.0" marker-end="url(#e-green-l87f3)"/>
<text x="750" y="66" class="xs" text-anchor="middle">z = 1.20 m</text>
<text x="750" y="294" class="xs muted" text-anchor="middle">out past the end, 40 mm</text>
<text x="750" y="312" class="xs mono" text-anchor="middle">depth 0 mm</text>
<line x1="20" y1="336" x2="880" y2="336" class="grid" stroke-width="1.0"/>
<text x="24" y="364" class="xs muted" text-anchor="start">over one 10 µm step, either side of z = 1.15</text>
<text x="588" y="364" class="xs muted" text-anchor="end">measured</text>
<line x1="24" y1="372.0" x2="594" y2="372.0" class="grid" stroke-width="1.0"/>
<text x="24" y="389.0" class="xs" text-anchor="start">worst change in the NORMAL</text>
<text x="588" y="389.0" class="xs mono" text-anchor="end">90.00°</text>
<text x="24" y="406.0" class="xs" text-anchor="start">worst change in the DEPTH</text>
<text x="588" y="406.0" class="xs mono" text-anchor="end">0.01001 mm</text>
<text x="24" y="432" class="xs muted" text-anchor="start">The two escapes cost 0.05 and 1 − (z − 0.2). They cross at z = 1.15, and past it the OTHER one is shorter: min of two</text>
<text x="24" y="449" class="xs muted" text-anchor="start">smooth functions is not smooth where the argmin changes.</text>
<text x="24" y="478" class="xs t-hi" text-anchor="start">Every penetration-depth implementation has this. 8.7 does not remove it; it makes the contact SET survive it.</text>
</svg>
