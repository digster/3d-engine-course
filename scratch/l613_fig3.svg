<text x="370.0" y="262" class="xs" text-anchor="middle">UP   a 1-2-1 tent, ADDED into the level below by the hardware (src*1 + dst*1)</text>
<text x="370.0" y="278" class="xs" text-anchor="middle">so level 0 holds the SUM of every level — Gaussians whose widths double</text>
<rect x="40" y="328" width="300" height="76" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="190" y="348" class="xs" text-anchor="middle">MEMORY</text>
<text x="190" y="365" class="xs" text-anchor="middle">0.3330 of one full target = 1.32 MB</text>
<text x="190" y="380" class="xs" text-anchor="middle">against the HDR target's 3.96 MB</text>
<text x="190" y="395" class="xs" text-anchor="middle">1/4 + 1/16 + ... = 1/3, the mip number again</text>
<rect x="376" y="328" width="324" height="76" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="538" y="348" class="xs" text-anchor="middle">COST</text>
<text x="538" y="365" class="xs" text-anchor="middle">the WHOLE bloom is 0.666 of ONE full-screen pass</text>
<text x="538" y="380" class="xs" text-anchor="middle">one sigma-64 separable Gaussian would be 385 taps</text>
<text x="538" y="395" class="xs" text-anchor="middle">per axis — 399 million texel fetches for one frame</text>
<text x="370.0" y="432" class="xs" text-anchor="middle">Eleven render passes for six levels (2n-1): a pass writes ONE target, and none may read what it writes.</text>
</svg>
