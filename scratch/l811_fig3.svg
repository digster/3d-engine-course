<text x="944" y="118.0" class="xs mono" text-anchor="end">97.32%</text>
<text x="560" y="135.0" class="xs" text-anchor="start">960 Hz</text>
<text x="706" y="135.0" class="xs mono" text-anchor="end">0.4956 m</text>
<text x="786" y="135.0" class="xs mono" text-anchor="end">0.4956 m</text>
<text x="866" y="135.0" class="xs mono" text-anchor="end">0.7371 m</text>
<text x="944" y="135.0" class="xs mono" text-anchor="end">99.32%</text>
<text x="560" y="152.0" class="xs" text-anchor="start">exact</text>
