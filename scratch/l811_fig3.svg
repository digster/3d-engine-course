<text x="786" y="152.0" class="xs mono" text-anchor="end">0.5000 m</text>
<text x="866" y="152.0" class="xs mono" text-anchor="end">0.7500 m</text>
<text x="944" y="152.0" class="xs mono" text-anchor="end">100.00%</text>
<text x="560" y="184.5" class="xs muted" text-anchor="start">The rope lets go EXACTLY where the rod's row changes sign from</text>
<text x="560" y="199.5" class="xs muted" text-anchor="start">tension to compression, at every rate — two instruments, one</text>
<text x="560" y="214.5" class="xs muted" text-anchor="start">fact. Both read low at 60 Hz because the bob arrives with 10%</text>
<text x="560" y="229.5" class="xs muted" text-anchor="start">less energy than it started with, and that is not the rope; it</text>
<text x="560" y="244.5" class="xs muted" text-anchor="start">is §5.</text>
