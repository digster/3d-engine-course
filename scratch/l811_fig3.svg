<svg viewBox="0 0 980 398" role="img" aria-labelledby="f3-t f3-d">
  <title id="f3-t">A bob on a rope and on a rod, swung up past the horizontal</title>
  <desc id="f3-d">Left: a circle of radius L about a pin. The rope's path follows the circle to the height L/2 above the pin and then leaves on a parabola; the rod's continues to 3L/4. Right: the measured release height, turning height and peak at 60, 240 and 960 Hz, with the energy left.</desc>
