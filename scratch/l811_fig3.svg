<circle cx="323.9" cy="130.0" r="4.2" fill="#f0961e"/>
<text x="333.92304845413264" y="148.00000000000003" class="xs" text-anchor="start">the rope lets go</text>
<text x="263.92304845413264" y="47.599999999999994" class="xs muted" text-anchor="middle">…and the bob flies</text>
<text x="234" y="332" class="xs muted" text-anchor="start">…and lands exactly here</text>
<circle cx="220.0" cy="310.0" r="4.2" fill="#5082e6"/>
<line x1="220.00" y1="310.00" x2="266.00" y2="310.00" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-f3)"/>
<text x="270" y="314" class="xs" text-anchor="start">v₀</text>
<line x1="26.0" y1="350.0" x2="46.0" y2="350.0" stroke="#f0961e" stroke-width="2.4" fill="none"/>
<text x="54" y="354" class="xs" text-anchor="start">rope: the circle, then a parabola — lets go at L/2, where tension reaches zero</text>
<line x1="26.0" y1="367.0" x2="46.0" y2="367.0" stroke="#9b7ede" stroke-width="2.4" fill="none"/>
<text x="54" y="371" class="xs" text-anchor="start">rod: carries on in compression, to its peak at 3L/4</text>
<text x="560" y="56" class="xs muted" text-anchor="start">Measured, a 1 m joint</text>
<text x="560" y="76" class="xs muted" text-anchor="start">rate</text>
<text x="706" y="76" class="xs muted" text-anchor="end">rope lets go</text>
<text x="786" y="76" class="xs muted" text-anchor="end">rod turns</text>
<text x="866" y="76" class="xs muted" text-anchor="end">rod peaks</text>
<text x="944" y="76" class="xs muted" text-anchor="end">energy left</text>
