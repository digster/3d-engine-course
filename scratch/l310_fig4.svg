<svg viewBox="0 0 640 352" role="img" aria-labelledby="f3106-t f3106-d">
  <title id="f3106-t">Amdahl's law, with this lesson's own optimisation plotted on it</title>
  <desc id="f3106-d">A log-log chart of whole-frame speedup against the speedup of one phase, for four different phase shares. Each curve flattens to a horizontal ceiling: 100x for a phase that is 99 per cent of the frame, 25x for 96 per cent, 4x for 75 per cent and 2x for 50 per cent. A marked point shows this lesson's result - a 1.30 times faster fill occupying 96 per cent of the frame, giving a 1.29 times faster frame.</desc>
