<text x="74" y="245.25000000000003" class="xs" text-anchor="end">0.7</text>
<line x1="84" y1="187.75" x2="514" y2="187.75" class="grid" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="74" y="191.75" class="xs" text-anchor="end">0.8</text>
<line x1="84" y1="134.25" x2="514" y2="134.25" class="grid" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="74" y="138.25" class="xs" text-anchor="end">0.9</text>
<line x1="84" y1="80.75000000000003" x2="514" y2="80.75000000000003" class="grid" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="74" y="84.75000000000003" class="xs" text-anchor="end">1.0</text>
<line x1="84.0" y1="54" x2="84.0" y2="268" class="grid" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="84.0" y="286" class="xs" text-anchor="middle">0.10</text>
<line x1="191.5" y1="54" x2="191.5" y2="268" class="grid" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="191.5" y="286" class="xs" text-anchor="middle">0.25</text>
<line x1="299.0" y1="54" x2="299.0" y2="268" class="grid" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="299.0" y="286" class="xs" text-anchor="middle">0.50</text>
<line x1="406.5" y1="54" x2="406.5" y2="268" class="grid" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="406.5" y="286" class="xs" text-anchor="middle">0.75</text>
<line x1="514.0" y1="54" x2="514.0" y2="268" class="grid" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="514.0" y="286" class="xs" text-anchor="middle">1.00</text>
<text x="299.0" y="306" class="xs" text-anchor="middle">roughness</text>
<text x="38" y="161.0" class="xs" text-anchor="middle">split / true</text>
