<rect x="530" y="54" width="170" height="78" rx="4" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<line x1="544.0" y1="76.0" x2="568.0" y2="76.0" stroke="#5082e6" stroke-width="2.2" fill="none"/>
<text x="574" y="80" class="xs" text-anchor="start">n·v = 0.9</text>
<line x1="544.0" y1="104.0" x2="568.0" y2="104.0" stroke="#e05c5c" stroke-width="2.2" fill="none"/>
<text x="574" y="108" class="xs" text-anchor="start">n·v = 0.4</text>
<rect x="530" y="148" width="170" height="120" rx="4" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="615" y="168" class="xs" text-anchor="middle">AT GRAZING IT IS</text>
<text x="615" y="186" class="xs" text-anchor="middle">29% DARK;</text>
<text x="615" y="204" class="xs" text-anchor="middle">head-on, never worse</text>
<text x="615" y="222" class="xs" text-anchor="middle">than 5.8%. More</text>
<text x="615" y="240" class="xs" text-anchor="middle">than four times the</text>
<text x="615" y="258" class="xs" text-anchor="middle">error, same material.</text>
<rect x="84" y="296" width="616" height="90" rx="4" fill="none" stroke="#e05c5c" stroke-width="1.3"/>
<text x="360.0" y="316" class="xs" text-anchor="middle">THAT ASYMMETRY IS THE ASSUMPTION n = v = r, MADE VISIBLE.</text>
<text x="360.0" y="336" class="xs" text-anchor="middle">A prefiltered value is indexed by ONE direction while the true integral depends on two, so the</text>
<text x="360.0" y="354" class="xs" text-anchor="middle">prefilter bakes its lobe around the REFLECTION. At a grazing view that points across the horizon and</text>
<text x="360.0" y="372" class="xs" text-anchor="middle">averages in ground the real surface never sees. What it discards is the stretched highlight.</text>
</svg>
