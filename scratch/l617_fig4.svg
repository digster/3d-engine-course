<svg viewBox="0 0 760 404" role="img" aria-labelledby="l617f4-t l617f4-d">
  <title id="l617f4-t">Culling and ordering a three-pass graph</title>
  <desc id="l617f4-d">Three declared passes - blur, combine and unused - with the imported resource `out` as the cull root. Backward reachability keeps blur and combine and drops unused, whose only output nobody reads.</desc>
  <defs>
    <marker id="e-i-l617f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l617f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l617f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l617f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l617f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">Three passes, two resources, and every answer checkable by reading.</text>
<text x="34" y="52" class="xs" text-anchor="start">DECLARED</text>
<rect x="34" y="68" width="76" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.16"/>
<text x="72" y="83" class="xs mono" text-anchor="middle">blur</text>
<text x="122" y="83" class="xs mono" text-anchor="start">writes  tmp@0 -&gt; tmp@1</text>
<rect x="34" y="98" width="76" height="22" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<text x="72" y="113" class="xs mono" text-anchor="middle">combine</text>
<text x="122" y="113" class="xs mono" text-anchor="start">samples tmp@1;  writes out@0 -&gt; out@1</text>
<rect x="34" y="128" width="76" height="22" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="72" y="143" class="xs mono" text-anchor="middle">unused</text>
<text x="122" y="143" class="xs mono" text-anchor="start">writes  tmp@1 -&gt; tmp@2</text>
<text x="34" y="176" class="xs muted" text-anchor="start">`out` is IMPORTED — somebody else owns it, so its value is the only thing</text>
<text x="34" y="190" class="xs muted" text-anchor="start">observable after the frame ends. That makes it the cull root.</text>
<line x1="34" y1="210" x2="726" y2="210" class="grid" stroke-width="1.2"/>
<text x="34" y="234" class="xs" text-anchor="start">REACHABILITY, BACKWARDS FROM THE IMPORT</text>
<rect x="78" y="264" width="104" height="36" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="78" y="264" width="104" height="36" rx="3" fill="none" stroke="#5082e6" stroke-width="1.2"/>
<text x="130" y="286" class="xs mono" text-anchor="middle">blur</text>
<text x="130" y="314" class="xs t-ok" text-anchor="middle">LIVE</text>
<rect x="288" y="264" width="104" height="36" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="288" y="264" width="104" height="36" rx="3" fill="none" stroke="#5ac878" stroke-width="1.2"/>
<text x="340" y="286" class="xs mono" text-anchor="middle">combine</text>
<text x="340" y="314" class="xs t-ok" text-anchor="middle">LIVE</text>
<rect x="508" y="264" width="104" height="36" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" stroke-dasharray="4 3" fill-opacity="0.06"/>
<rect x="508" y="264" width="104" height="36" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="560" y="286" class="xs mono" text-anchor="middle">unused</text>
<text x="560" y="314" class="xs t-bad" text-anchor="middle">CULLED</text>
<line x1="182" y1="282" x2="286" y2="282" class="ink" stroke-width="1.3" marker-end="url(#e-i-l617f4)"/>
<text x="234" y="274" class="xs mono" text-anchor="middle">tmp@1</text>
<line x1="392" y1="274" x2="452" y2="256" stroke="#5ac878" stroke-width="1.3" marker-end="url(#e-g-l617f4)"/>
<text x="448" y="250" class="xs mono" text-anchor="start">out@1  (imported)</text>
<line x1="182.0" y1="336.0" x2="508.0" y2="336.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="4 3"/>
<text x="345" y="354" class="xs muted" text-anchor="middle">tmp@1 — a real edge, and it leads nowhere</text>
<text x="34" y="384" class="xs" text-anchor="start">`unused` writes tmp@2, and nothing reads tmp@2. It is not scheduled, so nothing it reads is either.</text>
</svg>
