<svg viewBox="0 0 980 340" role="img" aria-labelledby="f8-t f8-d">
  <title id="f8-t">The hinge's alignment rows, and the frame their impulse is cached in</title>
  <desc id="f8-d">Left: the hinge axis as each body carries it, with two perpendiculars p0 and p1; the misalignment a1 cross b1 resolved along them is the rows' error. Right: a door's anchor gap, misalignment and tilt on a hinge and on a ball-socket alone, and a count of basis flips on a sagging bridge when the basis is chosen from the world axis rather than from body a's own.</desc>
  <defs>
    <marker id="e-i-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-blue-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<defs><marker id="e-amber-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-red-f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<text x="26" y="34" class="sm" text-anchor="start">Two axes that must stay one</text>
<line x1="180.00" y1="220.00" x2="180.00" y2="70.00" stroke="#5082e6" stroke-width="2.0" marker-end="url(#e-blue-f8)"/>
<text x="172" y="64" class="xs" text-anchor="end">a₁ — the axis as body a carries it</text>
<line x1="180.00" y1="220.00" x2="211.19" y2="73.28" stroke="#e05c5c" stroke-width="2.0" marker-end="url(#e-red-f8)"/>
<text x="219.1867536226639" y="75.27785988992915" class="xs" text-anchor="start">b₁ — as body b carries it</text>
<line x1="180.00" y1="220.00" x2="290.00" y2="220.00" stroke="#f0961e" stroke-width="1.6" marker-end="url(#e-amber-f8)"/>
<text x="294" y="224" class="xs mono" text-anchor="start">p₀</text>
<circle cx="180.0" cy="220.0" r="7" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<circle cx="180.0" cy="220.0" r="2.2" fill="#f0961e"/>
<text x="168" y="240" class="xs mono" text-anchor="end">p₁ (out of the page)</text>
<text x="26" y="264" class="xs" text-anchor="start">C_i = (a₁ × b₁) · p_i — two angles the hinge must not allow.</text>
<text x="26" y="280" class="xs" text-anchor="start">J_i = [ 0, −p_i, 0, p_i ]: the relative spin may lie along a₁ and nowhere else.</text>
<text x="26" y="296" class="xs" text-anchor="start">p₀ and p₁ are chosen from the axis IN BODY a's FRAME, where it never moves,</text>
<text x="26" y="312" class="xs" text-anchor="start">and the cached impulse is stored as a WORLD vector — 8.10 §4's bug, avoided twice.</text>
<text x="540" y="26" class="xs muted" text-anchor="start">A door on its hinge, and on a socket alone</text>
<text x="540" y="46" class="xs muted" text-anchor="start">a 10 kg door, 5 s</text>
<text x="748" y="46" class="xs muted" text-anchor="end">anchor gap</text>
<text x="840" y="46" class="xs muted" text-anchor="end">misalignment</text>
<text x="910" y="46" class="xs muted" text-anchor="end">tilt</text>
<line x1="540" y1="54.0" x2="916" y2="54.0" class="grid" stroke-width="1.0"/>
<text x="540" y="71.0" class="xs" text-anchor="start">hinge</text>
<text x="748" y="71.0" class="xs mono" text-anchor="end">0.088 mm</text>
<text x="840" y="71.0" class="xs mono" text-anchor="end">0.0001°</text>
<text x="910" y="71.0" class="xs mono" text-anchor="end">0.00°</text>
<text x="540" y="88.0" class="xs" text-anchor="start">ball-socket only</text>
<text x="748" y="88.0" class="xs mono" text-anchor="end">4.694 mm</text>
<text x="840" y="88.0" class="xs mono" text-anchor="end">—</text>
<text x="910" y="88.0" class="xs mono" text-anchor="end">175.98°</text>
<text x="540" y="112.5" class="xs muted" text-anchor="start">A twelve-plank bridge under a bouncing ball, 10 s</text>
<text x="540" y="132.5" class="xs muted" text-anchor="start">basis chosen from</text>
<text x="824" y="132.5" class="xs muted" text-anchor="end">turned &gt; 30°</text>
<text x="900" y="132.5" class="xs muted" text-anchor="end">worst</text>
<line x1="540" y1="140.5" x2="906" y2="140.5" class="grid" stroke-width="1.0"/>
<text x="540" y="157.5" class="xs" text-anchor="start">the world axis (8.10's way)</text>
<text x="824" y="157.5" class="xs mono" text-anchor="end">127 of 7,787</text>
<text x="900" y="157.5" class="xs mono" text-anchor="end">90.0°</text>
<text x="540" y="174.5" class="xs" text-anchor="start">body a's own axis (8.11)</text>
<text x="824" y="174.5" class="xs mono" text-anchor="end">0 of 7,787</text>
<text x="900" y="174.5" class="xs mono" text-anchor="end">9.8°</text>
<text x="540" y="203.0" class="xs muted" text-anchor="start">A hinge axis along z, on a plank moving in the x–y plane, has x and y</text>
<text x="540" y="218.0" class="xs muted" text-anchor="start">components that are rounding noise either side of zero, so a basis chosen</text>
<text x="540" y="233.0" class="xs muted" text-anchor="start">from it in world space flips by exactly 90°. Chosen where the axis is a</text>
<text x="540" y="248.0" class="xs muted" text-anchor="start">constant, it turns only as the plank does.</text>
</svg>
