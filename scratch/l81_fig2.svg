<text x="520" y="360" class="xs" text-anchor="start">Order is a statement about h → 0 at fixed t.</text>
<text x="520" y="377" class="xs t-hi" text-anchor="start">A game asks the opposite: t → ∞ at fixed h.</text>
<text x="520" y="394" class="xs muted" text-anchor="start">Explicit MULTIPLIES by 1.9 a second. The other two</text>
<text x="520" y="411" class="xs muted" text-anchor="start">are straight on a log axis, which is ADDING.</text>
<text x="520" y="434" class="xs muted" text-anchor="start">Nothing measured on the left can see any of it.</text>
