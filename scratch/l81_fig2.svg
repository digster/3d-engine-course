  <title id="l81f2-t">Two log-log plots: error against step size, and error against simulated time</title>
  <desc id="l81f2-d">On the left the error after one period falls as the step shrinks, and all three rules look respectable. On the right the step is held at 1/60 and time is varied instead: explicit Euler's error multiplies while the other two only add.</desc>
