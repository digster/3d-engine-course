<svg viewBox="0 0 900 440" role="img" aria-labelledby="l86f1-t l86f1-d">
  <title id="l86f1-t">What GJK returns when two shapes overlap, and what a solver needs instead.</title>
  <desc id="l86f1-d">Left, two wireframe crates overlapping, with an amber arrow marking the 0.400 m penetration depth GJK does not compute, and a table showing GJK reporting status intersecting, distance zero and a zero direction. Right, tables: the axis was exactly zero on all 200,000 overlapping pairs measured; centre-to-centre as a guessed normal is 40.15 degrees off on average and implies a push 1.71 times the true minimum translation; EPA's normal is 0.0089 degrees off.</desc>
  <defs>
    <marker id="e-i-l86f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l86f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l86f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l86f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l86f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-amber-l86f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-red-l86f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-grey-l86f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<defs><marker id="e-purple-l86f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7ede"/></marker></defs>
<text x="20" y="22" class="sm" text-anchor="start">Two crates overlapping. GJK answers the question it was asked, and stops.</text>
<line x1="144.5" y1="199.1" x2="194.9" y2="216.3" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="144.5" y1="141.5" x2="194.9" y2="158.8" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="105.1" y1="221.2" x2="155.5" y2="238.5" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="105.1" y1="163.7" x2="155.5" y2="180.9" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="144.5" y1="199.1" x2="144.5" y2="141.5" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="194.9" y1="216.3" x2="194.9" y2="158.8" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="105.1" y1="221.2" x2="105.1" y2="163.7" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="155.5" y1="238.5" x2="155.5" y2="180.9" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="144.5" y1="199.1" x2="105.1" y2="221.2" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="194.9" y1="216.3" x2="155.5" y2="238.5" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="144.5" y1="141.5" x2="105.1" y2="163.7" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="194.9" y1="158.8" x2="155.5" y2="180.9" stroke="#5082e6" stroke-width="1.3" fill="none"/>
<line x1="174.7" y1="200.8" x2="225.2" y2="218.1" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="174.7" y1="143.3" x2="225.2" y2="160.6" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="135.3" y1="222.9" x2="185.8" y2="240.2" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="135.3" y1="165.4" x2="185.8" y2="182.7" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="174.7" y1="200.8" x2="174.7" y2="143.3" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="225.2" y1="218.1" x2="225.2" y2="160.6" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="135.3" y1="222.9" x2="135.3" y2="165.4" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="185.8" y1="240.2" x2="185.8" y2="182.7" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="174.7" y1="200.8" x2="135.3" y2="222.9" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="225.2" y1="218.1" x2="185.8" y2="240.2" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="174.7" y1="143.3" x2="135.3" y2="165.4" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="225.2" y1="160.6" x2="185.8" y2="182.7" stroke="#e05c5c" stroke-width="1.3" fill="none"/>
<line x1="175.22" y1="190.01" x2="195.39" y2="196.92" stroke="#f0961e" stroke-width="2.4" marker-end="url(#e-amber-l86f1)"/>
<line x1="185.30288176158115" y1="187.4625697238899" x2="211.30288176158115" y2="159.4625697238899" class="grid" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="215.30288176158115" y="159.4625697238899" class="xs t-hi" text-anchor="start">0.400 m</text>
<text x="150" y="306" class="xs muted" text-anchor="middle">what a solver needs: HOW FAR, and WHICH WAY</text>
<text x="20" y="338" class="xs muted" text-anchor="start"></text>
<text x="334" y="338" class="xs muted" text-anchor="end"></text>
<line x1="20" y1="346.0" x2="340" y2="346.0" class="grid" stroke-width="1.0"/>
<text x="20" y="363.0" class="xs" text-anchor="start">GJK status</text>
<text x="334" y="363.0" class="xs mono" text-anchor="end">intersecting</text>
<text x="20" y="380.0" class="xs" text-anchor="start">GJK distance</text>
<text x="334" y="380.0" class="xs mono" text-anchor="end">0.000000 m</text>
<text x="20" y="397.0" class="xs" text-anchor="start">GJK direction</text>
<text x="334" y="397.0" class="xs mono" text-anchor="end">(0, 0, 0)</text>
<text x="20" y="414.0" class="xs" text-anchor="start">8.5's separation.depth</text>
<text x="334" y="414.0" class="xs mono" text-anchor="end">+0  (placeholder)</text>
<text x="400" y="50" class="xs" text-anchor="start">8.5's doc comment called the axis “the last search direction, a</text>
<text x="400" y="66" class="xs" text-anchor="start">reasonable guess at a contact normal”. It was not a poor normal.</text>
<text x="400" y="82" class="xs" text-anchor="start">`gjk_result::direction` is only written on the SEPARATED path:</text>
<text x="400" y="108" class="xs muted" text-anchor="start"></text>
<text x="824" y="108" class="xs muted" text-anchor="end"></text>
<line x1="400" y1="116.0" x2="830" y2="116.0" class="grid" stroke-width="1.0"/>
<text x="400" y="133.0" class="xs" text-anchor="start">overlapping pairs measured</text>
<text x="824" y="133.0" class="xs mono" text-anchor="end">200,000</text>
<text x="400" y="150.0" class="xs" text-anchor="start">of which the axis was exactly zero</text>
<text x="824" y="150.0" class="xs mono" text-anchor="end">200,000  (100.0%)</text>
<text x="400" y="182.5" class="xs" text-anchor="start">So the guess a naive implementation reaches for instead — centre</text>
<text x="400" y="198.5" class="xs" text-anchor="start">to centre — against the true minimum-translation normal:</text>
<text x="400" y="220.5" class="xs muted" text-anchor="start"></text>
<text x="824" y="220.5" class="xs muted" text-anchor="end"></text>
<line x1="400" y1="228.5" x2="830" y2="228.5" class="grid" stroke-width="1.0"/>
<text x="400" y="245.5" class="xs" text-anchor="start">angle, mean</text>
<text x="824" y="245.5" class="xs mono" text-anchor="end">40.15°</text>
<text x="400" y="262.5" class="xs" text-anchor="start">angle, p95 / max</text>
<text x="824" y="262.5" class="xs mono" text-anchor="end">78.2° / 90°</text>
<text x="400" y="279.5" class="xs" text-anchor="start">push it implies, mean</text>
<text x="824" y="279.5" class="xs mono" text-anchor="end">1.71× the MTV</text>
<text x="400" y="296.5" class="xs" text-anchor="start">push it implies, max</text>
<text x="824" y="296.5" class="xs mono" text-anchor="end">2,538× the MTV</text>
<text x="400" y="333.0" class="xs muted" text-anchor="start">CONTROL — this lesson's answer, against the same exact reference:</text>
<text x="400" y="355.0" class="xs muted" text-anchor="start"></text>
<text x="844" y="355.0" class="xs muted" text-anchor="end"></text>
<line x1="400" y1="363.0" x2="850" y2="363.0" class="grid" stroke-width="1.0"/>
<text x="400" y="380.0" class="xs" text-anchor="start">angle, mean / p99.9</text>
<text x="844" y="380.0" class="xs mono" text-anchor="end">0.0089° / 0.0283°</text>
<text x="400" y="397.0" class="xs" text-anchor="start">depth error, mean / max</text>
<text x="844" y="397.0" class="xs mono" text-anchor="end">2.574e-07 / 3.107e-04 m</text>
</svg>
