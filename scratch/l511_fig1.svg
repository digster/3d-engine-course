<svg viewBox="0 0 720 430" role="img" aria-labelledby="l511f1-t l511f1-d">
  <title id="l511f1-t">Immediate-mode debug drawing compared with a queue-then-flush design</title>
  <desc id="l511f1-d">On the left, line3 needs a framebuffer and a projector at every call, so only the renderer can call it, it works on one surface, and a line lives one frame. On the right, four different systems queue world-space segments into debug_lines, and one flush per camera hands them to a backend.</desc>
  <defs>
    <marker id="e-i-l511f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l511f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l511f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l511f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l511f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">The same debug line, drawn two ways. Only one of them can be said by code that is not the renderer.</text>
<text x="24" y="52" class="xs t-bad" text-anchor="start">BEFORE — line3(fb, a, b, colour, pr)</text>
<rect x="24" y="70" width="132" height="24" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.14"/>
<text x="90" y="86" class="xs" text-anchor="middle">collision system</text>
<line x1="158" y1="82" x2="214" y2="82" class="ink-soft" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="226" y="86" class="sm t-bad" text-anchor="middle">✗</text>
<text x="238" y="86" class="xs muted" text-anchor="start">no framebuffer</text>
<rect x="24" y="104" width="132" height="24" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.14"/>
<text x="90" y="120" class="xs" text-anchor="middle">ECS pass</text>
<line x1="158" y1="116" x2="214" y2="116" class="ink-soft" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="226" y="120" class="sm t-bad" text-anchor="middle">✗</text>
<text x="238" y="120" class="xs muted" text-anchor="start">no framebuffer</text>
<rect x="24" y="138" width="132" height="24" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.14"/>
<text x="90" y="154" class="xs" text-anchor="middle">mesh loader</text>
<line x1="158" y1="150" x2="214" y2="150" class="ink-soft" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="226" y="154" class="sm t-bad" text-anchor="middle">✗</text>
<text x="238" y="154" class="xs muted" text-anchor="start">no framebuffer</text>
<rect x="24" y="172" width="132" height="24" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="90" y="188" class="xs" text-anchor="middle">the renderer</text>
<line x1="158" y1="184" x2="236" y2="184" stroke="#5ac878" stroke-width="1.3" marker-end="url(#e-g-l511f1)"/>
<text x="197" y="178" class="xs muted" text-anchor="middle">has both</text>
<rect x="24" y="214" width="316" height="46" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="182" y="232" class="xs mono" text-anchor="middle">framebuffer&amp; + const projector&amp;</text>
<text x="182" y="250" class="xs t-bad" text-anchor="middle">required AT EVERY CALL SITE</text>
<text x="24" y="284" class="xs t-bad" text-anchor="start">✗  only the renderer can call it</text>
<text x="24" y="304" class="xs t-bad" text-anchor="start">✗  framebuffer only — no GPU surface</text>
<text x="24" y="324" class="xs t-bad" text-anchor="start">✗  a line lives exactly one frame</text>
<line x1="360" y1="44" x2="360" y2="400" class="grid" stroke-width="1.2"/>
<text x="380" y="52" class="xs t-ok" text-anchor="start">AFTER — two files, one direction</text>
<rect x="380" y="70" width="132" height="24" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="446" y="86" class="xs" text-anchor="middle">collision system</text>
<line x1="514" y1="82" x2="556" y2="82" stroke="#5ac878" stroke-width="1.2" marker-end="url(#e-g-l511f1)"/>
<rect x="380" y="104" width="132" height="24" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="446" y="120" class="xs" text-anchor="middle">ECS pass</text>
<line x1="514" y1="116" x2="556" y2="116" stroke="#5ac878" stroke-width="1.2" marker-end="url(#e-g-l511f1)"/>
<rect x="380" y="138" width="132" height="24" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="446" y="154" class="xs" text-anchor="middle">mesh loader</text>
<line x1="514" y1="150" x2="556" y2="150" stroke="#5ac878" stroke-width="1.2" marker-end="url(#e-g-l511f1)"/>
<rect x="380" y="172" width="132" height="24" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="446" y="188" class="xs" text-anchor="middle">the renderer</text>
<line x1="514" y1="184" x2="556" y2="184" stroke="#5ac878" stroke-width="1.2" marker-end="url(#e-g-l511f1)"/>
<rect x="560" y="70" width="136" height="126" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.2"/>
<text x="628" y="96" class="xs mono" text-anchor="middle">debug_lines</text>
<text x="628" y="114" class="xs muted" text-anchor="middle">world-space</text>
<text x="628" y="130" class="xs muted" text-anchor="middle">segments +</text>
<text x="628" y="146" class="xs muted" text-anchor="middle">a lifetime</text>
<text x="628" y="172" class="xs muted" text-anchor="middle">bounded, counted</text>
<line x1="628" y1="200" x2="628" y2="220" class="hi" stroke-width="1.3" marker-end="url(#e-h-l511f1)"/>
<text x="628" y="238" class="xs muted" text-anchor="middle">one flush, per camera</text>
<rect x="392" y="262" width="140" height="26" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.18"/>
<text x="462" y="279" class="xs mono" text-anchor="middle">framebuffer</text>
<rect x="556" y="262" width="140" height="26" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.14"/>
<text x="626" y="279" class="xs mono" text-anchor="middle">SDL_GPU (M6)</text>
<line x1="596" y1="246" x2="500" y2="258" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l511f1)"/>
<line x1="660" y1="246" x2="648" y2="258" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l511f1)"/>
<text x="380" y="318" class="xs t-ok" text-anchor="start">✓  anybody queues; the renderer draws</text>
<text x="380" y="338" class="xs t-ok" text-anchor="start">✓  one queue, any number of backends</text>
<text x="380" y="358" class="xs t-ok" text-anchor="start">✓  a line can outlive its frame</text>
<text x="24" y="396" class="xs t-hi" text-anchor="start">The queue is not an optimisation and makes nothing faster. It removes an ARGUMENT from every call site —</text>
<text x="24" y="414" class="xs t-hi" text-anchor="start">and that argument was the reason the caller had to be the renderer.</text>
</svg>
