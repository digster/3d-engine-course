<svg viewBox="0 0 900 400" role="img" aria-labelledby="l87f11-t l87f11-d">
  <title id="l87f11-t">The cost of a contact manifold against the penetration depth it is built on.</title>
  <desc id="l87f11-d">A horizontal bar chart over 20,000 overlapping box pairs on a release build: GJK's distance query alone costs 87.3 nanoseconds per pair, GJK followed by EPA costs 252.0, building the manifold alone costs 142.9, and the whole narrow phase costs 395.1. One support_face query costs 5.2 nanoseconds, and twenty thousand whole queries allocate nothing at all.</desc>
  <defs>
    <marker id="e-i-l87f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l87f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l87f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l87f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l87f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-amber-l87f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-green-l87f11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<text x="20" y="22" class="sm" text-anchor="start">The manifold is a third of the narrow phase. The penetration depth is still what costs.</text>
<text x="30" y="84" class="xs" text-anchor="start">GJK distance only</text>
<rect x="240" y="72" width="88.38268792710706" height="13" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.85"/>
<text x="336.38268792710704" y="83" class="xs mono" text-anchor="start">   87.3 ns/pair</text>
<text x="30" y="118" class="xs" text-anchor="start">GJK + EPA</text>
<rect x="240" y="106" width="255.12528473804096" height="13" rx="2" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.85"/>
<text x="503.12528473804093" y="117" class="xs mono" text-anchor="start">  252.0 ns/pair</text>
<text x="30" y="152" class="xs" text-anchor="start">build_manifold alone</text>
<rect x="240" y="140" width="144.67223487724627" height="13" rx="2" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.85"/>
<text x="392.6722348772463" y="151" class="xs mono" text-anchor="start">  142.9 ns/pair</text>
<text x="30" y="186" class="xs" text-anchor="start">the whole narrow phase</text>
<rect x="240" y="174" width="400.0" height="13" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.85"/>
<text x="648.0" y="185" class="xs mono" text-anchor="start">  395.1 ns/pair</text>
<text x="30" y="242" class="xs" text-anchor="start">one `support_face`</text>
<text x="240" y="242" class="xs mono" text-anchor="start">5.2 ns</text>
<text x="30" y="266" class="xs" text-anchor="start">allocations, 20,000 whole queries</text>
<text x="240" y="266" class="xs mono t-hi" text-anchor="start">0</text>
<text x="30" y="290" class="xs" text-anchor="start">sizeof(contact_id) / (contact_point)</text>
<text x="240" y="290" class="xs mono" text-anchor="start">8 / 40 bytes</text>
<line x1="20" y1="312" x2="880" y2="312" class="grid" stroke-width="1.0"/>
<text x="24" y="336" class="xs" text-anchor="start">8.6 §12 deleted four default member initialisers and bought 20.5%. The same question here buys nothing, and the reason is the one 8.6 named:</text>
<text x="24" y="354" class="xs muted" text-anchor="start">the tell was the ARRAY, not the struct. `polytope` held 128 faces and `expand` rebuilt a three-kilobyte horizon array once per pass; a `contact_face` is</text>
<text x="24" y="372" class="xs muted" text-anchor="start">124 bytes and a query builds exactly two of them, once. There is no array of them anywhere.</text>
<text x="24" y="396" class="xs muted" text-anchor="start">Nothing here allocates, measured by replacing the global operator new and counting — 6.17 §9's method, for the third lesson running.</text>
</svg>
