<svg viewBox="0 0 720 300" role="img" aria-labelledby="l55f1-t l55f1-d">
  <title id="l55f1-t">The three questions an asset system answers</title>
  <desc id="l55f1-d">Three rows — loading, finding, unloading — each with the question it asks and a note on what the engine did instead before this lesson.</desc>
  <defs>
    <marker id="e-i-l55f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l55f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l55f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l55f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l55f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Lesson 5.4 built the mechanism. These are the three questions it does not answer.</text>
<rect x="24" y="42" width="172" height="56" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.14"/>
<text x="110" y="60" class="sm t-hi" text-anchor="middle">LOADING</text>
<text x="110" y="76" class="xs muted" text-anchor="middle">where does a mesh come from,</text>
<text x="110" y="89" class="xs muted" text-anchor="middle">and who decides?</text>
<text x="216" y="60" class="xs" text-anchor="start">40 lines of demo code opened a file, timed it, parsed it,</text>
<text x="216" y="75" class="xs" text-anchor="start">flipped its uvs and logged about it. Four of the six steps</text>
<text x="216" y="90" class="xs" text-anchor="start">were an engine's job.</text>
<line x1="24" y1="108" x2="696" y2="108" class="grid" stroke-width="1.0" stroke-dasharray="2 3"/>
<rect x="24" y="120" width="172" height="56" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.14"/>
<text x="110" y="138" class="sm t-hi" text-anchor="middle">FINDING</text>
<text x="110" y="154" class="xs muted" text-anchor="middle">ask for “torus.obj” twice —</text>
<text x="110" y="167" class="xs muted" text-anchor="middle">get the same handle?</text>
<text x="216" y="138" class="xs" text-anchor="start">There has never been a name → handle map in this engine,</text>
<text x="216" y="153" class="xs" text-anchor="start">so every request was a fresh file read. 200 KB, 3.7 ms,</text>
<text x="216" y="168" class="xs" text-anchor="start">every time.</text>
<line x1="24" y1="186" x2="696" y2="186" class="grid" stroke-width="1.0" stroke-dasharray="2 3"/>
<rect x="24" y="198" width="172" height="56" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.14"/>
<text x="110" y="216" class="sm t-hi" text-anchor="middle">UNLOADING</text>
<text x="110" y="232" class="xs muted" text-anchor="middle">the word this module has</text>
<text x="110" y="245" class="xs muted" text-anchor="middle">been building towards.</text>
<text x="216" y="216" class="xs" text-anchor="start">Nothing in this engine has ever freed anything. Every</text>
<text x="216" y="231" class="xs" text-anchor="start">“is this still valid?” so far has been hypothetical,</text>
<text x="216" y="246" class="xs" text-anchor="start">because the answer was always yes.</text>
<line x1="24" y1="282" x2="696" y2="282" class="grid" stroke-width="1.2"/>
<text x="24" y="296" class="xs t-hi" text-anchor="start">All three were unanswerable before 5.4, for one reason: you cannot free a thing safely until you can say what happens to the references.</text>
</svg>
