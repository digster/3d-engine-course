l lbl-v">v</text><line class="vec-h" x1="340.0" y1="300.0" x2="282.5" y2="142.1" stroke-width="2.4" marker-end="url(#a-h)"/><text x="271.0" y="123.5" class="lbl lbl-h">h</text><path class="arc" d="M 360.1,185.8 A 116.0,116.0 0 0 1 428.9,225.4" fill="none" stroke-width="1.4"/><text x="417.0" y="172.5" class="sm">&#945; = 40&#176;</text><path class="arc" d="M 318.8,241.7 A 62.0,62.0 0 0 1 340.0,238.0" fill="none" stroke-width="1.4"/><text x="241.1" y="254.6" class="sm">&#946; = 20&#176;</text><text x="70" y="44" class="sm" font-weight="700">Move the eye by one degree and h moves by half a degree. That is the whole 4&#215; rule.</text><text x="70" y="64" class="xs muted">R is l mirrored about n, so it sits at 50&#176;; h bisects l and v, so it sits at -20&#176;. &#945; = 40&#176; and &#946; = 20&#176;, exactly half.</text>
</svg>
