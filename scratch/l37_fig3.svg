<svg viewBox="0 0 680 360" role="img" aria-labelledby="f3-t f3-d">
  <title id="f3-t">The angle to the halfway vector is exactly half the angle to the mirror ray</title>
  <desc id="f3-d">The surface and normal again. Four arrows leave the same point: l at 50 degrees left of the normal, R at 50 degrees right, v at 10 degrees right, and h at 20 degrees left. An outer arc marks alpha, the 40-degree angle between R and v; an inner arc marks beta, the 20-degree angle between n and h. Beta is exactly half of alpha.</desc>
