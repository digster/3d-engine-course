<line x1="600.0" y1="121.0" x2="660.0" y2="164.0" stroke="#8f918a" stroke-width="1.0" fill="none"/>
<text x="470.0" y="224" class="xs" text-anchor="start">an IMPORT's version 0 is real: whatever the</text>
<text x="470.0" y="238" class="xs" text-anchor="start">texture holds when the frame begins</text>
<text x="470.0" y="262" class="xs t-ok" text-anchor="start">1 live pass; 0 channels differ from frame 1</text>
