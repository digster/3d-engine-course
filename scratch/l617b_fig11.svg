<line x1="95.0" y1="134.0" x2="240.0" y2="164.0" stroke="#8f918a" stroke-width="1.0" fill="none"/>
<text x="40.0" y="224.0" class="xs" text-anchor="start">every face: CLEAR, STORE (derived)</text>
<text x="40.0" y="240.0" class="xs muted" text-anchor="start">the faces form a CHAIN: each clear consumes</text>
<text x="40.0" y="254.0" class="xs muted" text-anchor="start">the previous version, so layers survive</text>
<text x="40.0" y="278.0" class="xs t-ok" text-anchor="start">vs the hand-recorded frame: 0 of 196,608 channels differ</text>
<text x="620.0" y="52" class="xs" text-anchor="middle">frame 2: the cache</text>
