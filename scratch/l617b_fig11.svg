<rect x="264.0" y="64.0" width="50.0" height="26.0" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.0" fill-opacity="0.22"/>
<text x="289.0" y="81.0" class="xs mono" text-anchor="middle">face +Z</text>
