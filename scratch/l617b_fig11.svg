<svg viewBox="0 0 820 360" role="img" aria-labelledby="l617bf11-t l617bf11-d">
  <title id="l617bf11-t">Local shadows in the frame graph</title>
  <desc id="l617bf11-d">Frame one declares six cube-face passes in a chain and one spot pass, each clearing and storing, before the scene pass samples the final versions. Frame two declares no shadow passes and samples version zero of the imported maps, which is last frame's contents, and renders the same image.</desc>
  <defs>
    <marker id="e-i-l617bf11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l617bf11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l617bf11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l617bf11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l617bf11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
