<svg viewBox="0 0 720 420" role="img" aria-labelledby="l63f5-t l63f5-d">
  <title id="l63f5-t">Shadowing and masking</title>
  <desc id="l63f5-d">Left: a rough profile under a grazing light, with the facets in shadow drawn faint and the lit ones highlighted. Right: Smith's G1 against angle for four roughnesses, falling from 1 at the normal toward 0 at grazing incidence, and falling faster the rougher the surface.</desc>
