<text x="360.0" y="336" class="sm t-hi" text-anchor="middle">At 75° a near-smooth surface still shows 0.9920 of itself and a fully rough one only 0.4112.</text>
<text x="360.0" y="358" class="xs muted" text-anchor="middle">THIS IS THE TERM LESSON 6.2 WAS MISSING when it measured a 5.36× view-angle swing it could not explain. A rough surface really does</text>
<text x="360.0" y="374" class="xs muted" text-anchor="middle">hide part of itself from you, and a model with no G has no way to say so — which is why its swing looked arbitrary.</text>
<text x="360.0" y="396" class="xs t-hi" text-anchor="middle">Separable Smith assumes “lit” and “visible” are independent. They share a height field. Measured 1.715× apart at grazing.</text>
</svg>
