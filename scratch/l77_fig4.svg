<text x="556.0" y="64.0" class="xs muted" text-anchor="middle">how far apart the two rules are, at the midpoint</text>
<text x="380.0" y="328.0" class="sm" text-anchor="middle">and two things that end the argument</text>
<text x="380.0" y="348.0" class="xs muted" text-anchor="middle">a scale of ZERO is how an animator hides a thing, and ln(0) is −∞: the geometric rule</text>
<text x="380.0" y="364.0" class="xs muted" text-anchor="middle">does not shrink toward zero, it teleports there on the first frame after t = 0. A mirrored</text>
<text x="380.0" y="380.0" class="xs muted" text-anchor="middle">rig carries a NEGATIVE scale, and ln(−1) is NaN. glTF’s LINEAR mode is (1−t)·vₖ + t·vₖ₊₁.</text>
