<svg viewBox="0 0 760 380" role="img" aria-labelledby="l617f2-t l617f2-d">
  <title id="l617f2-t">A resource as a sequence of versions rather than a mutable texture</title>
  <desc id="l617f2-d">Above, a single texture pointer written by three passes with no way to name the intermediate states. Below, the same resource as three versions - hdr@0 undefined, hdr@1 from the scene pass, hdr@2 from the skybox - each with exactly one producer.</desc>
  <defs>
    <marker id="e-i-l617f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l617f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l617f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l617f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l617f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">A resource is not a texture. It is a variable, and a variable has values over time.</text>
<text x="34" y="54" class="xs t-bad" text-anchor="start">THE TEXTURE VIEW — one object, mutated in place</text>
<rect x="180" y="66" width="400" height="26" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.14"/>
<text x="380" y="83" class="xs mono" text-anchor="middle">SDL_GPUTexture* hdr</text>
<line x1="240" y1="104" x2="240" y2="94" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f2)"/>
<text x="240" y="118" class="xs muted" text-anchor="middle">scene writes it</text>
<line x1="400" y1="104" x2="400" y2="94" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f2)"/>
<text x="400" y="118" class="xs muted" text-anchor="middle">skybox writes it</text>
<line x1="560" y1="104" x2="560" y2="94" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f2)"/>
<text x="560" y="118" class="xs muted" text-anchor="middle">resolve reads it</text>
<text x="380" y="140" class="xs muted" text-anchor="middle">Nothing here distinguishes 'the image before the skybox' from 'the image after it'.</text>
<line x1="34" y1="160" x2="726" y2="160" class="grid" stroke-width="1.2"/>
<text x="34" y="184" class="xs t-ok" text-anchor="start">THE VERSION VIEW — three values, and each has one producer</text>
<rect x="46" y="216" width="88" height="26" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="46" y="216" width="88" height="26" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="90" y="233" class="xs mono" text-anchor="middle">hdr@0</text>
<text x="90" y="260" class="xs muted" text-anchor="middle">undefined</text>
<line x1="140" y1="229" x2="268" y2="229" class="ink" stroke-width="1.3" marker-end="url(#e-i-l617f2)"/>
<text x="204" y="224" class="xs t-hi" text-anchor="middle">scene</text>
<rect x="276" y="216" width="88" height="26" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="276" y="216" width="88" height="26" rx="3" fill="none" stroke="#5082e6" stroke-width="1.1"/>
<text x="320" y="233" class="xs mono" text-anchor="middle">hdr@1</text>
<text x="320" y="260" class="xs muted" text-anchor="middle">what the scene pass produced</text>
<line x1="370" y1="229" x2="498" y2="229" class="ink" stroke-width="1.3" marker-end="url(#e-i-l617f2)"/>
<text x="434" y="224" class="xs t-hi" text-anchor="middle">skybox</text>
<rect x="506" y="216" width="88" height="26" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="506" y="216" width="88" height="26" rx="3" fill="none" stroke="#f0961e" stroke-width="1.1"/>
<text x="550" y="233" class="xs mono" text-anchor="middle">hdr@2</text>
<text x="550" y="260" class="xs muted" text-anchor="middle">what the skybox produced from hdr@1</text>
<text x="34" y="310" class="xs" text-anchor="start">Now 'the bloom samples hdr@1' is a statement a compiler can act on. It fixes the ORDER (whoever</text>
<text x="34" y="326" class="xs" text-anchor="start">produced hdr@1 runs first), the STORE OP (hdr@1 has a reader, so it must be written out), and the</text>
<text x="34" y="342" class="xs" text-anchor="start">LIFETIME (hdr is live from the scene pass to the bloom). One sentence, three deductions.</text>
</svg>
