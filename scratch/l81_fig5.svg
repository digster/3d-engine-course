<text x="560" y="286.5" class="xs" text-anchor="start">energy after 60 s</text>
<text x="872" y="286.5" class="xs mono" text-anchor="end">1.1270e+17</text>
<text x="560" y="303.5" class="xs" text-anchor="start">(1 + h²ω²)³⁶⁰⁰</text>
<text x="872" y="303.5" class="xs mono" text-anchor="end">1.1270e+17</text>
