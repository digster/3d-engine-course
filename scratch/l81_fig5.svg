<text x="872" y="110.0" class="xs mono" text-anchor="end">9.9117e-01 m</text>
<text x="560" y="127.0" class="xs" text-anchor="start">velocity Verlet</text>
<text x="872" y="127.0" class="xs mono" text-anchor="end">9.9996e-01 m</text>
<text x="560" y="157.5" class="xs muted" text-anchor="start">One centimetre of overlap between a box and</text>
<text x="560" y="173.5" class="xs muted" text-anchor="start">the floor is a spring. Under explicit Euler</text>
<text x="560" y="189.5" class="xs muted" text-anchor="start">that centimetre becomes 3,357 km in a</text>
<text x="560" y="205.5" class="xs muted" text-anchor="start">minute — and the first ten seconds look</text>
<text x="560" y="221.5" class="xs t-hi" text-anchor="start">completely normal, which is the trap.</text>
<text x="560" y="261.5" class="xs muted" text-anchor="start">the determinant IS the blow-up</text>
<text x="872" y="261.5" class="xs muted" text-anchor="end"></text>
