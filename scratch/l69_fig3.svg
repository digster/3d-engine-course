<svg viewBox="0 0 720 330" role="img" aria-labelledby="f69c-t f69c-d">
  <title id="f69c-t">A corner-fitted box against a bounding sphere</title>
  <desc id="f69c-d">Two panels showing the same frustum slice at two camera yaws. The dashed axis-aligned box that contains it changes size by 30 per cent between them; the bounding circle is identical in both.</desc>
  <defs>
    <marker id="e-i-f69c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f69c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f69c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f69c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f69c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">Fitting the box: a sphere, not the eight corners</text>
<polygon points="114.7,121.3 255.3,121.3 255.3,198.7 114.7,198.7" fill="#5082e6" stroke="#5082e6" fill-opacity="0.28" stroke-width="1.3"/>
<rect x="114.69999999999999" y="89.69999999999999" width="140.60000000000002" height="140.60000000000002" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="185" y="79.69999999999999" class="xs" text-anchor="middle">box side 1.90r</text>
<circle cx="185" cy="160" r="74" fill="none" stroke="#5ac878" stroke-width="1.6"/>
<text x="185" y="254" class="xs" text-anchor="middle">camera facing along the light</text>
<polygon points="480.3,90.3 600.1,163.8 559.7,229.7 439.9,156.2" fill="#5082e6" stroke="#5082e6" fill-opacity="0.28" stroke-width="1.3"/>
<rect x="439.85782439261277" y="79.8578243926128" width="160.2843512147744" height="160.2843512147744" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="520" y="69.8578243926128" class="xs" text-anchor="middle">box side 2.17r</text>
<circle cx="520" cy="160" r="74" fill="none" stroke="#5ac878" stroke-width="1.6"/>
<text x="520" y="254" class="xs" text-anchor="middle">the same camera, turned 30°</text>
<text x="185" y="296" class="xs" text-anchor="middle">at 30 deg the dashed box is already 14% wider</text>
<text x="520" y="296" class="xs" text-anchor="middle">over a FULL turn it spans 30.2%; the circle, 9.9e-08</text>
<text x="360.0" y="318" class="xs" text-anchor="middle">and world_per_texel is the box side over the resolution — so a box that resizes resizes every texel in the map</text>
</svg>
