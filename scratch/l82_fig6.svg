<svg viewBox="0 0 900 330" role="img" aria-labelledby="l82f6-t l82f6-d">
  <title id="l82f6-t">A pebble, a million-kilogram body and a fixed body after one second of gravity</title>
  <desc id="l82f6-d">The first two arrows are identical in length at 4.987 metres; the third body has not moved.</desc>
  <defs>
    <marker id="e-i-l82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-fall-l82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<text x="40" y="30" class="sm t-hi" text-anchor="start">“JUST MAKE THE FLOOR VERY HEAVY” — ONE SECOND LATER</text>
<text x="202" y="82" class="xs" text-anchor="end">a 10 g pebble</text>
<text x="202" y="98" class="xs mono muted" text-anchor="end">0.01 kg, dynamic</text>
<line x1="220" y1="74" x2="220" y2="108" class="grid" stroke-width="1.0"/>
<circle cx="220" cy="82" r="5" fill="#8f918a" fill-opacity="0.5"/>
<line x1="228.00" y1="82.00" x2="569.07" y2="82.00" stroke="#e05c5c" stroke-width="2.2" marker-end="url(#e-fall-l82f6)"/>
<text x="579.0724299999999" y="86" class="xs mono" text-anchor="start">fell 4.987 m</text>
<text x="202" y="148" class="xs" text-anchor="end">a 1,000,000 kg floor</text>
<text x="202" y="164" class="xs mono muted" text-anchor="end">1e6 kg, dynamic</text>
<line x1="220" y1="140" x2="220" y2="174" class="grid" stroke-width="1.0"/>
<circle cx="220" cy="148" r="5" fill="#8f918a" fill-opacity="0.5"/>
<line x1="228.00" y1="148.00" x2="569.07" y2="148.00" stroke="#e05c5c" stroke-width="2.2" marker-end="url(#e-fall-l82f6)"/>
<text x="579.0724299999999" y="152" class="xs mono" text-anchor="start">fell 4.987 m</text>
<text x="202" y="214" class="xs" text-anchor="end">a fixed body</text>
<text x="202" y="230" class="xs mono muted" text-anchor="end">inv_mass = 0</text>
<line x1="220" y1="206" x2="220" y2="240" class="grid" stroke-width="1.0"/>
<circle cx="220" cy="214" r="5" fill="#8f918a" fill-opacity="0.5"/>
<text x="234" y="218" class="xs mono t-ok" text-anchor="start">fell 0.000 m — did not move, at all</text>
<line x1="220" y1="60" x2="220" y2="246" class="ink-soft" stroke-width="1.2"/>
<text x="220" y="52" class="xs muted" text-anchor="middle">start</text>
<text x="430.0" y="264" class="xs muted" text-anchor="middle">distance fallen in one second →</text>
<text x="40" y="296" class="xs muted" text-anchor="start">The two arrows are the same length to the last decimal place, because gravity does not ask what anything weighs.</text>
<text x="40" y="314" class="xs" text-anchor="start">A hundred million times the mass buys exactly nothing. inv_mass = 0 is not a large number; it is a different kind of answer.</text>
</svg>
