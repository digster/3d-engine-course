<svg viewBox="0 0 900 410" role="img" aria-labelledby="l81f9-t l81f9-d">
  <title id="l81f9-t">Per-step damping at four step rates, and the drag step that reverses</title>
  <desc id="l81f9-d">The same line v times equals 0.99 retains 74 percent of the velocity per second at 30 Hz and 24 percent at 144 Hz, while pow of the per-second factor gives the same answer at every rate. Beside it, explicit drag reverses the velocity once h times k passes 1.</desc>
