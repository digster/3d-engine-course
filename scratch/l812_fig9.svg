<svg viewBox="0 0 980 389" role="img" aria-labelledby="g9-t g9-d">
  <title id="g9-t">The chord as the handed-over velocity, the momentum it keeps, and the joint residual</title>
  <desc id="g9-d">Left: a curved path with two consecutive positions and the chord between them, parallel to the tangent at the midpoint. Middle: the centre of mass travels 1.179 m forward in half a second with the chord and 0.010 m handed over at rest. Right: for eight limb joints, the measured anchor velocity mismatch at handoff against the centripetal prediction.</desc>
  <defs>
    <marker id="e-i-g9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-g9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-g9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-g9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-g9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-green-g9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-purple-g9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7ede"/></marker></defs>
<text x="26" y="30" class="sm" text-anchor="start">The chord is the velocity</text>
<path d="M 50.00,190.00 L 55.00,185.23 L 60.00,180.48 L 65.00,175.74 L 70.00,171.03 L 75.00,166.35 L 80.00,161.72 L 85.00,157.14 L 90.00,152.63 L 95.00,148.18 L 100.00,143.81 L 105.00,139.53 L 110.00,135.34 L 115.00,131.26 L 120.00,127.29 L 125.00,123.43 L 130.00,119.70 L 135.00,116.10 L 140.00,112.64 L 145.00,109.32 L 150.00,106.16 L 155.00,103.15 L 160.00,100.31 L 165.00,97.64 L 170.00,95.14 L 175.00,92.81 L 180.00,90.67 L 185.00,88.72 L 190.00,86.95 L 195.00,85.38 L 200.00,84.01 L 205.00,82.83 L 210.00,81.86 L 215.00,81.09 L 220.00,80.52 L 225.00,80.16 L 230.00,80.01 L 235.00,80.06 L 240.00,80.32 L 245.00,80.78 L 250.00,81.45 L 255.00,82.32 L 260.00,83.40 L 265.00,84.67 L 270.00,86.15 L 275.00,87.81 L 280.00,89.67 L 285.00,91.72 L 290.00,93.96 L 295.00,96.37 L 300.00,98.96 L 305.00,101.72 L 310.00,104.64 L 315.00,107.73 L 320.00,110.97 L 325.00,114.36 L 330.00,117.89 L 335.00,121.55 L 340.00,125.35 L 345.00,129.26 L 350.00,133.29" fill="none" stroke="#8f918a" stroke-width="1.6"/>
<circle cx="155.0" cy="103.2" r="4.0" fill="#5082e6"/>
<circle cx="236.0" cy="80.1" r="4.0" fill="#5082e6"/>
<text x="145.0" y="93.15458863410547" class="xs mono" text-anchor="end">x(n−1)</text>
<text x="244.0" y="98.09336263777499" class="xs mono" text-anchor="start">x(n)</text>
<line x1="155.00" y1="103.15" x2="236.00" y2="80.09" stroke="#5ac878" stroke-width="2.0" marker-end="url(#e-green-g9)"/>
<line x1="159.5" y1="95.7" x2="231.5" y2="74.8" stroke="#9b7ede" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>
<text x="225.5" y="51.236474935692726" class="xs" text-anchor="start">the tangent at the midpoint: parallel</text>
<text x="26" y="250" class="xs" text-anchor="start">Semi-implicit Euler moves a body by x(n) = x(n−1) + h·v(n).</text>
<text x="26" y="265" class="xs" text-anchor="start">So the chord (x(n) − x(n−1))/h is not an approximation of the</text>
<text x="26" y="280" class="xs" text-anchor="start">velocity the solver should inherit — it IS that velocity.</text>
<text x="26" y="295" class="xs" text-anchor="start">Against the clip's own: 0.0045 m/s at the step's middle,</text>
<text x="26" y="310" class="xs" text-anchor="start">0.2320 m/s at its end — second order, and first.</text>
<text x="26" y="325" class="xs" text-anchor="start">Rotation: the linearised spin inverts to the Rodrigues vector</text>
<text x="26" y="340" class="xs" text-anchor="start">(2/h)·Δq.v/Δq.w; it lands to 1.57e-07 rad, the logarithm</text>
<text x="26" y="355" class="xs" text-anchor="start">misses by 9.75e-05 against θ³/12 = 9.76e-05.</text>
<text x="420" y="30" class="sm" text-anchor="start">Tripped at 2.5 m/s</text>
<rect x="530" y="56" width="90.6923076923077" height="18" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.6"/>
<text x="420" y="69" class="xs" text-anchor="start">the chord (steer)</text>
<text x="626.6923076923077" y="69" class="xs mono" text-anchor="start">1.179 m</text>
<rect x="530" y="100" width="1.5" height="18" rx="2" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.6"/>
<text x="420" y="113" class="xs" text-anchor="start">at rest (control)</text>
<text x="537.5" y="113" class="xs mono" text-anchor="start">0.010 m</text>
<text x="420" y="148" class="xs muted" text-anchor="start">centre of mass forward, first 0.5 s</text>
<text x="420" y="174" class="xs muted" text-anchor="start">Momentum handed over: 204.40 kg·m/s = 80 kg</text>
<text x="420" y="189" class="xs muted" text-anchor="start">× 2.555 m/s, exactly the clip's. At rest,</text>
<text x="420" y="204" class="xs muted" text-anchor="start">the character stops dead and topples.</text>
<text x="700" y="30" class="sm" text-anchor="start">Each joint at the instant of handoff</text>
<text x="700" y="69" class="xs" text-anchor="start">upperarm.L</text>
<rect x="784" y="58" width="34.425000000000004" height="16" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.55"/>
<circle cx="818.5" cy="66.0" r="6.5" fill="#9b7ede" fill-opacity="0.22"/>
<circle cx="818.5" cy="66.0" r="2.4" fill="#9b7ede"/>
<text x="950" y="69" class="xs mono" text-anchor="end">18.4</text>
<text x="700" y="95" class="xs" text-anchor="start">forearm.L</text>
<rect x="784" y="84" width="35.25" height="16" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.55"/>
<circle cx="819.4" cy="92.0" r="6.5" fill="#9b7ede" fill-opacity="0.22"/>
<circle cx="819.4" cy="92.0" r="2.4" fill="#9b7ede"/>
<text x="950" y="95" class="xs mono" text-anchor="end">18.8</text>
<text x="700" y="121" class="xs" text-anchor="start">upperarm.R</text>
<rect x="784" y="110" width="34.40625" height="16" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.55"/>
<circle cx="818.4" cy="118.0" r="6.5" fill="#9b7ede" fill-opacity="0.22"/>
<circle cx="818.4" cy="118.0" r="2.4" fill="#9b7ede"/>
<text x="950" y="121" class="xs mono" text-anchor="end">18.4</text>
<text x="700" y="147" class="xs" text-anchor="start">forearm.R</text>
<rect x="784" y="136" width="35.625" height="16" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.55"/>
<circle cx="819.5" cy="144.0" r="6.5" fill="#9b7ede" fill-opacity="0.22"/>
<circle cx="819.5" cy="144.0" r="2.4" fill="#9b7ede"/>
<text x="950" y="147" class="xs mono" text-anchor="end">19.0</text>
<text x="700" y="173" class="xs" text-anchor="start">thigh.L</text>
<rect x="784" y="162" width="55.18125" height="16" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.55"/>
<circle cx="839.2" cy="170.0" r="6.5" fill="#9b7ede" fill-opacity="0.22"/>
<circle cx="839.2" cy="170.0" r="2.4" fill="#9b7ede"/>
<text x="950" y="173" class="xs mono" text-anchor="end">29.4</text>
<text x="700" y="199" class="xs" text-anchor="start">shin.L</text>
<rect x="784" y="188" width="102.65625" height="16" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.55"/>
<circle cx="886.4" cy="196.0" r="6.5" fill="#9b7ede" fill-opacity="0.22"/>
<circle cx="886.4" cy="196.0" r="2.4" fill="#9b7ede"/>
<text x="950" y="199" class="xs mono" text-anchor="end">54.8</text>
<text x="700" y="225" class="xs" text-anchor="start">thigh.R</text>
<rect x="784" y="214" width="54.918749999999996" height="16" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.55"/>
<circle cx="839.0" cy="222.0" r="6.5" fill="#9b7ede" fill-opacity="0.22"/>
<circle cx="839.0" cy="222.0" r="2.4" fill="#9b7ede"/>
<text x="950" y="225" class="xs mono" text-anchor="end">29.3</text>
<text x="700" y="251" class="xs" text-anchor="start">shin.R</text>
<rect x="784" y="240" width="136.29375" height="16" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.55"/>
<circle cx="920.4" cy="248.0" r="6.5" fill="#9b7ede" fill-opacity="0.22"/>
<circle cx="920.4" cy="248.0" r="2.4" fill="#9b7ede"/>
<text x="950" y="251" class="xs mono" text-anchor="end">72.7</text>
<text x="950" y="52" class="xs muted" text-anchor="end">mm/s</text>
<line x1="700.0" y1="284.0" x2="720.0" y2="284.0" stroke="#5082e6" stroke-width="2.4" fill="none"/>
<text x="728" y="288" class="xs" text-anchor="start">anchor velocity mismatch, measured</text>
<line x1="700.0" y1="301.0" x2="720.0" y2="301.0" stroke="#9b7ede" stroke-width="2.4" fill="none"/>
<text x="728" y="305" class="xs" text-anchor="start">½h·|ω_b×(ω_b×r_b) − ω_a×(ω_a×r_a)|</text>
<text x="700" y="332" class="xs muted" text-anchor="start">Worst disagreement 0.43%. The chord of a</text>
<text x="700" y="347" class="xs muted" text-anchor="start">rotation is not its tangent; the solver's</text>
<text x="700" y="362" class="xs muted" text-anchor="start">first sweep removes the difference.</text>
</svg>
