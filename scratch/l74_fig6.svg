<svg viewBox="0 0 760 404" role="img" aria-labelledby="f74f-t f74f-d">
  <title id="f74f-t">Shepperd's four candidates, and why there is no bad case</title>
  <desc id="f74f-d">On the left, a bar chart of which of the four components the pivot chose over twenty thousand random rotations: w fifty-six percent, and x, y and z about fifteen percent each. Below it, the identity that the four candidates sum to four, so the largest is at least one; the smallest pivot seen was 1.038. On the right, a log-scale plot of round-trip pose error against turn angle for two routes. Shepperd's stays below one hundredth of a millionth of a degree across the whole range. The naive route tracks it up to about one hundred and twenty degrees and then diverges, reaching one hundred and eighty degrees of error at a turn of 179.99 degrees.</desc>
  <defs>
    <marker id="e-i-f74f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f74f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f74f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f74f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f74f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="180" y="54.0" class="sm" text-anchor="middle">which component the pivot picked</text>
<text x="180" y="70.0" class="xs muted" text-anchor="middle">20,000 random rotations</text>
<rect x="30" y="84.0" width="300.0" height="176.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<rect x="38" y="104.0" width="222.0" height="14.96" rx="2" fill="#f8d678" stroke="#f8d678" stroke-width="1.0" fill-opacity="0.85"/>
<text x="38" y="97.0" class="xs muted" text-anchor="start">w</text>
<text x="264.0" y="115.96000000000001" class="xs mono" text-anchor="start">56.1%</text>
<rect x="38" y="148.0" width="58.2045434298441" height="14.96" rx="2" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.0" fill-opacity="0.85"/>
<text x="38" y="141.0" class="xs muted" text-anchor="start">x</text>
<text x="100.20454342984411" y="159.96" class="xs mono" text-anchor="start">14.7%</text>
<rect x="38" y="192.0" width="58.81763919821826" height="14.96" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="1.0" fill-opacity="0.85"/>
<text x="38" y="185.0" class="xs muted" text-anchor="start">y</text>
<text x="100.81763919821826" y="203.96" class="xs mono" text-anchor="start">14.9%</text>
<rect x="38" y="236.0" width="56.52347438752784" height="14.96" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.0" fill-opacity="0.85"/>
<text x="38" y="229.0" class="xs muted" text-anchor="start">z</text>
<text x="98.52347438752784" y="247.96" class="xs mono" text-anchor="start">14.3%</text>
<rect x="30" y="84.0" width="300.0" height="176.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="180" y="292" class="sm mono t-hi" text-anchor="middle">4w² + 4x² + 4y² + 4z² = 4, always</text>
<text x="180" y="312" class="xs muted" text-anchor="middle">so the largest is ≥ 1 and the divisor ≥ 2.</text>
<text x="180" y="328" class="xs mono muted" text-anchor="middle">smallest pivot seen in 20,000: 1.038415</text>
<text x="180" y="344" class="xs t-hi" text-anchor="middle">There is no bad case. There is no threshold.</text>
<text x="580.0" y="54.0" class="sm" text-anchor="middle">round trip, pose error</text>
<text x="580.0" y="70.0" class="xs muted" text-anchor="middle">matrix → quat → matrix, degrees</text>
<rect x="430.0" y="84.0" width="300.0" height="176.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="434.0" y1="229.8181818181818" x2="726.0" y2="229.8181818181818" class="grid" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="424.0" y="232.8181818181818" class="xs mono muted" text-anchor="end">1e-12</text>
<line x1="434.0" y1="193.45454545454544" x2="726.0" y2="193.45454545454544" class="grid" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="424.0" y="196.45454545454544" class="xs mono muted" text-anchor="end">1e-8</text>
<line x1="434.0" y1="157.0909090909091" x2="726.0" y2="157.0909090909091" class="grid" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="424.0" y="160.0909090909091" class="xs mono muted" text-anchor="end">1e-4</text>
<line x1="434.0" y1="120.72727272727273" x2="726.0" y2="120.72727272727273" class="grid" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="424.0" y="123.72727272727273" class="xs mono muted" text-anchor="end">1e0</text>
<path d="M 444.00,244.31 L 445.51,184.93 L 512.00,170.39 L 580.00,176.82 L 625.33,174.53 L 700.89,165.70 L 714.49,180.93 L 715.98,166.65 L 716.00,166.62" fill="none" stroke="#60ded0" stroke-width="1.6"/>
