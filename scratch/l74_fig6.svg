<circle cx="715.98" cy="166.65" r="2.4" fill="#60ded0"/>
<circle cx="716.00" cy="166.62" r="2.4" fill="#60ded0"/>
<path d="M 444.00,244.31 L 445.51,184.93 L 512.00,170.39 L 580.00,176.82 L 625.33,168.94 L 700.89,155.34 L 714.49,153.77 L 715.98,100.22 L 716.00,100.22" fill="none" stroke="#f0961e" stroke-width="1.6"/>
<circle cx="444.00" cy="244.31" r="2.4" fill="#f0961e"/>
<circle cx="445.51" cy="184.93" r="2.4" fill="#f0961e"/>
<circle cx="512.00" cy="170.39" r="2.4" fill="#f0961e"/>
<circle cx="580.00" cy="176.82" r="2.4" fill="#f0961e"/>
<circle cx="625.33" cy="168.94" r="2.4" fill="#f0961e"/>
<circle cx="700.89" cy="155.34" r="2.4" fill="#f0961e"/>
<circle cx="714.49" cy="153.77" r="2.4" fill="#f0961e"/>
<circle cx="715.98" cy="100.22" r="2.4" fill="#f0961e"/>
<circle cx="716.00" cy="100.22" r="2.4" fill="#f0961e"/>
<text x="448.0" y="274.0" class="xs mono muted" text-anchor="start">0°</text>
<text x="712.0" y="274.0" class="xs mono muted" text-anchor="end">180°</text>
<text x="450.0" y="106.0" class="xs mono" text-anchor="start">naive: 180.0° of error at 179.99°</text>
<text x="450.0" y="240.0" class="xs mono" text-anchor="start">Shepperd: never worse than 1.1e−05°</text>
<text x="580.0" y="292" class="sm t-hi" text-anchor="middle">the naive route divides by 4w</text>
<text x="580.0" y="312" class="xs muted" text-anchor="middle">w = cos(θ/2), so at a half-turn it divides by nothing</text>
<text x="580.0" y="328" class="xs muted" text-anchor="middle">and at exactly 180° it returns the identity.</text>
<text x="580.0" y="344" class="xs muted" text-anchor="middle">Lesson 7.2 needed two routes and a crossover at 120°.</text>
<text x="380.0" y="382" class="xs muted" text-anchor="middle">Four candidates instead of three is what removes the bad case — and four candidates is what having a</text>
<text x="380.0" y="398" class="xs muted" text-anchor="middle">fourth component means. The representation with no singularity has the unconditional extraction.</text>
</svg>
