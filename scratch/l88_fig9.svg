<text x="470" y="42" class="sm" text-anchor="start">entries, 2000 crates at a 1 m cell</text>
<text x="470" y="60" class="xs" text-anchor="start">crates only — 30,225 entries, 1,090 pairs</text>
<rect x="470" y="66" width="103.44780999216407" height="18" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="1.0" fill-opacity="0.35"/>
<text x="470" y="104" class="xs" text-anchor="start">+ plate, guard off — 111,027 entries, 1,127 pairs</text>
<rect x="470" y="110" width="380.0" height="18" rx="2" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.0" fill-opacity="0.35"/>
<text x="470" y="148" class="xs" text-anchor="start">+ plate, guard on — 30,225 entries, 1,127 pairs</text>
<rect x="470" y="154" width="103.44780999216407" height="18" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="1.0" fill-opacity="0.35"/>
<text x="50" y="290" class="xs muted" text-anchor="start">cells the 200 × 0.2 × 200 m plate wants</text>
<text x="424" y="290" class="xs muted" text-anchor="end">count</text>
<line x1="50" y1="298.0" x2="430" y2="298.0" class="grid" stroke-width="1.0"/>
<text x="50" y="315.0" class="xs" text-anchor="start">4 m</text>
<text x="424" y="315.0" class="xs mono" text-anchor="end">5,202</text>
<text x="50" y="332.0" class="xs" text-anchor="start">2 m</text>
<text x="424" y="332.0" class="xs mono" text-anchor="end">20,402</text>
<text x="50" y="349.0" class="xs" text-anchor="start">1 m</text>
<text x="424" y="349.0" class="xs mono" text-anchor="end">80,802</text>
<text x="50" y="366.0" class="xs" text-anchor="start">0.5 m</text>
<text x="424" y="366.0" class="xs mono" text-anchor="end">321,602</text>
<text x="50" y="383.0" class="xs" text-anchor="start">0.25 m</text>
<text x="424" y="383.0" class="xs mono" text-anchor="end">1,283,202</text>
<text x="520" y="290" class="xs muted" text-anchor="start">for comparison</text>
<text x="874" y="290" class="xs muted" text-anchor="end">entries</text>
<line x1="520" y1="298.0" x2="880" y2="298.0" class="grid" stroke-width="1.0"/>
<text x="520" y="315.0" class="xs" text-anchor="start">crates only</text>
<text x="874" y="315.0" class="xs mono" text-anchor="end">30,225</text>
<text x="520" y="332.0" class="xs" text-anchor="start">the plate alone, 1 m cell</text>
<text x="874" y="332.0" class="xs mono" text-anchor="end">80,802</text>
<text x="50" y="411" class="xs muted" text-anchor="start">The plate is not exotic. It is the floor. At a 1 m cell it wants 80,802 cells for itself, nearly three times what the</text>
<text x="50" y="428" class="xs muted" text-anchor="start">entire scene of two thousand crates wants, and it is alone in almost every one of them — so the grid pays to insert it</text>
<text x="50" y="445" class="xs muted" text-anchor="start">and gains nothing. The cliff is cubic in the reciprocal of the cell size, which is why the table above quadruples and</text>
<text x="50" y="462" class="xs muted" text-anchor="start">then quadruples again. A uniform grid has no structural answer to this: the answer is hierarchical, and this engine</text>
<text x="50" y="479" class="xs muted" text-anchor="start">will not build one. What it does instead is NOTICE — past max_cells_per_proxy a proxy stops being gridded and is</text>
<text x="50" y="496" class="xs muted" text-anchor="start">tested against everything, which keeps the contract exactly (the pair sets with the guard on and off are equal) and is</text>
<text x="50" y="513" class="xs muted" text-anchor="start">linear in the number of such proxies times n. With one floor that is free. With sixty-four large objects it is most of</text>
<text x="50" y="530" class="xs muted" text-anchor="start">the broadphase, and that is the grid telling you to use a tree.</text>
</svg>
