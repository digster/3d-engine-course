<text x="102.22423357669315" y="285.1597333652254" class="xs t-hi" text-anchor="middle">d₃</text>
<text x="218.0" y="322" class="xs muted" text-anchor="middle">a convex set is the intersection of every half-plane containing it</text>
<text x="218.0" y="340" class="xs muted" text-anchor="middle">and `support` names the boundary of each one</text>
