<text x="532" y="232" class="xs" text-anchor="start">an ordinary chain:</text>
<text x="532" y="250" class="xs" text-anchor="start">31.2% of the leaves</text>
<text x="532" y="268" class="xs" text-anchor="start">gone by level 6</text>
<text x="360.0" y="336" class="xs" text-anchor="middle">Nothing in the chain is wrong, and nothing in the alpha test is wrong.</text>
<text x="360.0" y="358" class="xs" text-anchor="middle">AVERAGING AND THRESHOLDING DO NOT COMMUTE — and only one of the two is the mip chain's business.</text>
