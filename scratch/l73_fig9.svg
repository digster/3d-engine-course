<text x="380.0" y="336" class="xs muted" text-anchor="middle">under 60° of arc the cheap blend is wrong by about a degree and nobody will ever see it;</text>
<text x="380.0" y="354" class="xs muted" text-anchor="middle">at 150° it is wrong by 26° and the character's arm visibly lurches through the middle of the turn.</text>
<text x="380.0" y="378" class="xs t-hi" text-anchor="middle">That is the whole decision, and it is a threshold on the ARC rather than a preference between two functions.</text>
