<svg viewBox="0 0 760 402" role="img" aria-labelledby="f73i-t f73i-d">
  <title id="f73i-t">nlerp's speed ratio and its error, measured</title>
  <desc id="f73i-d">Two panels. The left plots nlerp's fastest step divided by its slowest against the size of the arc, on a logarithmic scale from one to ten thousand. A blue curve is the closed form, secant squared of half the arc; seven amber dots are measurements at ten, thirty, sixty, ninety, one hundred and twenty, one hundred and fifty and one hundred and seventy-nine degrees, and each lands on the curve. The right panel is a bar chart of how far nlerp and slerp get from each other at the same value of t: 0.005 degrees at a ten-degree arc, four degrees at ninety, and seventy-seven degrees at a hundred and seventy-nine.</desc>
