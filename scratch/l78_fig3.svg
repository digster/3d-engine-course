<text x="528" y="176.5" class="xs" text-anchor="start">The rms is a property of the signals.</text>
<text x="528" y="193.5" class="xs muted" text-anchor="start">The peak is the largest coincidence that</text>
<text x="528" y="209.5" class="xs muted" text-anchor="start">happened to occur, and a longer window</text>
<text x="528" y="225.5" class="xs t-hi" text-anchor="start">holds more chances. Headroom is a BET.</text>
<text x="528" y="262.5" class="xs muted" text-anchor="start">headroom for 16</text>
