<svg viewBox="0 0 900 430" role="img" aria-labelledby="l78f3-t l78f3-d">
  <title id="l78f3-t">Peak and RMS against voice count, with N and sqrt(N) reference lines</title>
  <desc id="l78f3-d">On log-log axes the RMS of N uncorrelated voices lies exactly on sqrt(N) while the peak lies above it and well below N. A control mixing the same voice N times lands exactly on N. A table shows the peak of 16 voices rising from 6.98x to 10.46x as the observation window grows from 10 ms to 8 s.</desc>
