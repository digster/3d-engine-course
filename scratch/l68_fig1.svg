<svg viewBox="0 0 720 360" role="img" aria-labelledby="l68f1-t l68f1-d">
  <title id="l68f1-t">Why nothing casts a shadow</title>
  <desc id="l68f1-d">Two panels, each showing parallel light rays falling on a ground line past a rectangular caster. In the left panel points A and B are both drawn lit because the shading equation only asks whether a surface faces the light. In the right panel B lies in the caster's shadow, which nothing in the equation can detect.</desc>
  <defs>
    <marker id="e-i-l68f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l68f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l68f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l68f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l68f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="0" y="0" width="720" height="360" class="bg"/>
<rect x="20" y="34" width="328" height="254" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="184" y="24" class="sm" text-anchor="middle">What the shading equation asks</text>
<line x1="40" y1="214.0" x2="328" y2="214.0" class="ink-soft" stroke-width="1.6"/>
<line x1="54.0" y1="58.0" x2="144.06664199358164" y2="214.0" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<line x1="96.0" y1="58.0" x2="148.0" y2="148.06664199358158" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<line x1="138.0" y1="58.0" x2="176.10511776651532" y2="124.0" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<line x1="180.0" y1="58.0" x2="270.06664199358164" y2="214.0" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<line x1="222.0" y1="58.0" x2="312.06664199358164" y2="214.0" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<text x="256" y="48" class="xs" text-anchor="start">the sun</text>
<rect x="148" y="124" width="62" height="44" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.3"/>
<rect x="148" y="124" width="62" height="44" rx="3" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<circle cx="90.0" cy="214.0" r="4" fill="#5082e6"/>
<text x="90" y="234.0" class="xs" text-anchor="middle">A</text>
<circle cx="205.6" cy="214.0" r="4" fill="#5082e6"/>
<text x="205.55811238272278" y="234.0" class="xs" text-anchor="middle">B</text>
<text x="184" y="252" class="sm" text-anchor="middle">n.l is the same at A and at B</text>
<text x="184" y="274" class="xs" text-anchor="middle">so both are drawn fully lit</text>
<rect x="372" y="34" width="328" height="254" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="536" y="24" class="sm" text-anchor="middle">What it needs to ask</text>
<line x1="392" y1="214.0" x2="680" y2="214.0" class="ink-soft" stroke-width="1.6"/>
<line x1="406.0" y1="58.0" x2="496.06664199358164" y2="214.0" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<line x1="448.0" y1="58.0" x2="500.0" y2="148.06664199358158" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<line x1="490.0" y1="58.0" x2="528.1051177665153" y2="124.0" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<line x1="532.0" y1="58.0" x2="622.0666419935817" y2="214.0" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<line x1="574.0" y1="58.0" x2="664.0666419935817" y2="214.0" class="hi" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#e-h-l68f1)"/>
<text x="608" y="48" class="xs" text-anchor="start">the sun</text>
<rect x="500" y="124" width="62" height="44" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.3"/>
<rect x="500" y="124" width="62" height="44" rx="3" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<circle cx="442.0" cy="214.0" r="4" fill="#5082e6"/>
<text x="442" y="234.0" class="xs" text-anchor="middle">A</text>
<circle cx="557.6" cy="214.0" r="4" fill="#5082e6"/>
<text x="557.5581123827228" y="234.0" class="xs" text-anchor="middle">B</text>
<rect x="526.6" y="207.0" width="62.0" height="7" fill="#9b7ede" fill-opacity="0.6"/>
<text x="536" y="252" class="sm" text-anchor="middle">B cannot SEE the light</text>
<text x="536" y="274" class="xs" text-anchor="middle">and nothing in the equation knows</text>
<text x="360.0" y="330" class="sm" text-anchor="middle">Every light in this engine is unoccluded: shading consults one normal and</text>
<text x="360.0" y="350" class="xs" text-anchor="middle">one direction, and never the rest of the scene. That is why objects float.</text>
</svg>
