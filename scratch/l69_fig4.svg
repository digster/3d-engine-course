<svg viewBox="0 0 720 348" role="img" aria-labelledby="f69d-t f69d-d">
  <title id="f69d-t">Texel snapping</title>
  <desc id="f69d-d">Two rows of four frames as a camera walks 0.4 of a texel each frame. The purple bar is fixed geometry in both. In the unsnapped row the texel grid slides continuously and the shadow edge sits at a different offset from the geometry every frame. In the snapped row the grid holds still for two frames and then jumps a whole texel, so the offset repeats.</desc>
