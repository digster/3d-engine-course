<svg viewBox="0 0 720 380" role="img" aria-labelledby="f45e-t f45e-d">
  <title id="f45e-t">Vertex rate and instance rate, and what each costs</title>
  <desc id="f45e-d">Slot 0 advances one element per vertex; slot 1 advances one element per instance, so every vertex of instance 1 reads the same placement record. Nothing else about the two buffers differs — same buffer type, same bind call, same attribute list. Below: 53,024 bytes of torus are uploaded once and never touched again, while 196 bytes of placement are rewritten each frame, which is 0.37% of the data on the device.</desc>
  <defs>
    <marker id="e-i-f45e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f45e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f45e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
  <text x="24" y="22" class="sm">one draw call, seven instances &#8212; and the only thing that makes slot 1 different is <tspan class="t-hi">input_rate</tspan></text>
  <text x="24" y="61" class="xs">slot 0</text>
  <text x="24" y="74" class="xs mono t-hi">VERTEX</text>
  <text x="24" y="88" class="xs muted">one element per vertex</text>
  <rect x="132.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="147.0" y="65" class="xs mono t-inv" text-anchor="middle">v0</text>
  <rect x="162.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="177.0" y="65" class="xs mono t-inv" text-anchor="middle">v1</text>
  <rect x="192.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="207.0" y="65" class="xs mono t-inv" text-anchor="middle">v2</text>
  <rect x="222.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="237.0" y="65" class="xs mono t-inv" text-anchor="middle">v3</text>
  <rect x="252.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="267.0" y="65" class="xs mono t-inv" text-anchor="middle">v4</text>
  <rect x="282.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="297.0" y="65" class="xs mono t-inv" text-anchor="middle">v5</text>
  <rect x="312.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="327.0" y="65" class="xs mono t-inv" text-anchor="middle">v6</text>
  <rect x="342.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="357.0" y="65" class="xs mono t-inv" text-anchor="middle">v7</text>
  <rect x="372.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="387.0" y="65" class="xs mono t-inv" text-anchor="middle">v8</text>
  <rect x="402.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="417.0" y="65" class="xs mono t-inv" text-anchor="middle">v9</text>
  <rect x="432.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="447.0" y="65" class="xs mono t-inv" text-anchor="middle">v10</text>
  <rect x="462.0" y="48" width="30.0" height="26" fill="#5082e6" fill-opacity="0.7" stroke="var(--dia-bg)" stroke-width="0.75"/>
  <text x="477.0" y="65" class="xs mono t-inv" text-anchor="middle">v11</text>
