<svg viewBox="0 0 720 408" role="img" aria-labelledby="f46d-t f46d-d">
  <title id="f46d-t">Sixteen floats through the uniform boundary</title>
  <desc id="f46d-d">Our mat4 stores four columns contiguously. Pushing a matrix whose element at written (row, col) is 16·row + col + 1 and asking the shader to report m[row][col] returns exactly that table: every element landed where our storage put it, with no transpose. The compiled SPIR-V decorates the member RowMajor, which looks like the opposite and is an artefact of the toolchain's naming rather than a statement about the bytes.</desc>
  <defs>
    <marker id="e-i-f46d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f46d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f46d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
  <text x="24" y="22" class="sm">a claim this course has carried since Lesson 2.6, finally checked</text>
  <text x="24" y="52" class="xs muted">engine::mat4 in memory &#8212; four columns, contiguous</text>
