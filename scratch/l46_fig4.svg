  <text x="452.0" y="202.0" class="xs">we wrote 16&#215;row + col + 1</text>
  <rect x="24" y="206" width="672" height="60" class="fill-soft ink" stroke-width="0.75" rx="3"/>
  <text x="40" y="230" class="sm t-ok">every element landed where our storage put it. No transpose, anywhere.</text>
  <text x="40" y="250" class="xs muted">so the column-major choice Lesson 2.6 made for its own reasons is also the one this boundary wanted</text>
  <rect x="24" y="284" width="672" height="108" class="fill-soft ink" stroke-width="0.75" rx="3"/>
  <text x="40" y="306" class="sm t-bad">&#9888; and do not believe the intermediate</text>
  <text x="40" y="328" class="xs mono">spirv-dis build/shaders/mesh.vert.spv | grep RowMajor</text>
  <text x="40" y="346" class="xs mono muted">OpMemberDecorate %Camera 0 RowMajor</text>
  <text x="40" y="370" class="xs">which looks exactly like the transpose the table above proves is not happening. It is an artefact of how DXC names things on the way to SPIR-V.</text>
