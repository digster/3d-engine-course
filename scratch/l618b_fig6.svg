<text x="170" y="172" class="xs" text-anchor="middle">16 slots</text>
<text x="170" y="188" class="xs mono" text-anchor="middle">mask = 15</text>
<text x="170" y="218" class="xs mono" text-anchor="middle">this step: first = 13</text>
<text x="170" y="232" class="xs mono" text-anchor="middle">count = 5</text>
<text x="30" y="338" class="xs" text-anchor="start">amber: respawned this step (13, 14, 15, 0, 1)</text>
<text x="30" y="352" class="xs" text-anchor="start">blue: stepped, if alive</text>
<text x="360" y="58" class="xs muted" text-anchor="start">the real pool, across the counter's wrap</text>
<text x="360" y="78" class="xs muted" text-anchor="start">serial</text>
<text x="510" y="78" class="xs muted" text-anchor="start">s &amp; 1023</text>
<text x="610" y="78" class="xs muted" text-anchor="start">s % 1000</text>
<text x="360" y="98" class="xs mono" text-anchor="start">4294967293</text>
<text x="510" y="98" class="xs mono t-ok" text-anchor="start">1021</text>
<text x="610" y="98" class="xs mono " text-anchor="start">293</text>
