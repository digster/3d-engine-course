<text x="510" y="183" class="xs mono t-ok" text-anchor="start">2</text>
<text x="610" y="183" class="xs mono " text-anchor="start">2</text>
<text x="360" y="214" class="xs" text-anchor="start">A power of two divides 2^32, so the mask is continuous where the</text>
<text x="360" y="228" class="xs" text-anchor="start">counter wraps; 1,000 jumps from slot 295 to 0 (after 59.7 hours).</text>
<text x="360" y="256" class="xs" text-anchor="start">A slot comes round every capacity / rate seconds:</text>
<text x="360" y="272" class="xs mono t-ok" text-anchor="start">65,536 / 20,000 = 3.28 s &gt; 3.0 s life   -&gt;   0 cut short</text>
<text x="360" y="288" class="xs mono t-bad" text-anchor="start">32,768 / 20,000 = 1.64 s   -&gt;   152,704 of 200,000 cut short</text>
<text x="360" y="304" class="xs mono t-bad" text-anchor="start">(76.4%), each losing 0.685 s of life on average</text>
</svg>
