<svg viewBox="0 0 880 356" role="img" aria-labelledby="l618bf6-t l618bf6-d">
  <title id="l618bf6-t">Emission as a ring</title>
  <desc id="l618bf6-d">A ring of sixteen slots in which serial numbers 13 to 17 are born this step into slots 13, 14, 15, 0 and 1. A table shows real serials crossing 2^32 mapping to consecutive slots under a power-of-two mask but jumping under modulo 1,000. The pool must outlast the longest life: 65,536 slots cut nothing short at 20,000 a second; 32,768 cut 152,704 of 200,000.</desc>
  <defs>
    <marker id="e-i-l618bf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l618bf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l618bf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l618bf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l618bf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-amb-l618bf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
