<svg viewBox="0 0 760 428" role="img" aria-labelledby="f72e-t f72e-d">
  <title id="f72e-t">What an axis error costs</title>
  <desc id="f72e-d">A plot of the factor by which an error in a rotation's axis is magnified into an error in the resulting orientation, against the size of the turn. The teal curve is two times the sine of half the angle: it starts at zero, passes through 1.41 at ninety degrees, and reaches two at a half turn. Amber dots are measured values from six probes, lying on the curve to within two parts in a hundred thousand.</desc>
  <defs>
    <marker id="e-i-f72e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f72e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f72e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f72e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f72e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
