<text x="342.0" y="344" class="xs muted" text-anchor="middle">θ — how big the turn is</text>
<text x="34" y="181.0" class="xs muted" text-anchor="middle">cost</text>
<text x="34" y="197.0" class="xs muted" text-anchor="middle">factor</text>
<line x1="112.0" y1="96.0" x2="103.1" y2="293.7" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="2 3"/>
<text x="108" y="88" class="xs t-ok" text-anchor="start">0 — an axis error here costs nothing</text>
<line x1="572.0" y1="266.0" x2="575.3" y2="74.2" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="2 3"/>
<text x="576" y="276" class="xs t-bad" text-anchor="end">2 — and here it costs double</text>
<rect x="610" y="62" width="148" height="108" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="618" y="82" class="xs" text-anchor="start">teal: 2 sin(θ/2)</text>
<text x="618" y="100" class="xs muted" text-anchor="start">amber: measured,</text>
<text x="618" y="116" class="xs muted" text-anchor="start">a 0.001 rad tilt</text>
<text x="618" y="140" class="xs muted" text-anchor="start">worst relative</text>
<text x="618" y="156" class="mono xs muted" text-anchor="start">error 2.3e-05</text>
<text x="380.0" y="382" class="xs muted" text-anchor="middle">so the extraction's two hard ends are not equally dangerous: the one at θ = 0 is multiplied by zero</text>
<text x="380.0" y="408" class="xs muted" text-anchor="middle">and the one at θ = 180° is multiplied by two, exactly where the axis is hardest to find</text>
</svg>
