<rect x="695" y="97" width="17" height="24" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="0.6" fill-opacity="0.55"/>
<text x="430" y="226" class="xs muted" text-anchor="start">memory ∝ the SCENE; no bounds to declare, no edge,</text>
<text x="430" y="243" class="xs muted" text-anchor="start">and a collision costs a comparison, never an answer</text>
<text x="50" y="282" class="xs muted" text-anchor="start">the textbook hash, measured against balls in bins</text>
<text x="50" y="302" class="xs muted" text-anchor="start">§7 — buckets holding 2+ cells</text>
<text x="292" y="302" class="xs muted" text-anchor="end">cells</text>
<text x="360" y="302" class="xs muted" text-anchor="end">buckets</text>
<text x="410" y="302" class="xs muted" text-anchor="end">xor</text>
<text x="460" y="302" class="xs muted" text-anchor="end">mix</text>
<text x="518" y="302" class="xs muted" text-anchor="end">chance</text>
<line x1="50" y1="310.0" x2="524" y2="310.0" class="grid" stroke-width="1.0"/>
<text x="50" y="327.0" class="xs" text-anchor="start">lattice</text>
<text x="292" y="327.0" class="xs mono" text-anchor="end">1,445</text>
<text x="360" y="327.0" class="xs mono" text-anchor="end">4,096</text>
<text x="410" y="327.0" class="xs mono" text-anchor="end">254</text>
<text x="460" y="327.0" class="xs mono" text-anchor="end">209</text>
<text x="518" y="327.0" class="xs mono" text-anchor="end">202</text>
<text x="50" y="344.0" class="xs" text-anchor="start">scattered</text>
<text x="292" y="344.0" class="xs mono" text-anchor="end">7,301</text>
<text x="360" y="344.0" class="xs mono" text-anchor="end">16,384</text>
<text x="410" y="344.0" class="xs mono" text-anchor="end">1175</text>
<text x="460" y="344.0" class="xs mono" text-anchor="end">1240</text>
<text x="518" y="344.0" class="xs mono" text-anchor="end">1215</text>
<text x="600" y="282" class="xs muted" text-anchor="start">and the load factor</text>
<text x="600" y="302" class="xs muted" text-anchor="start">load</text>
<text x="730" y="302" class="xs muted" text-anchor="end">buckets</text>
<text x="798" y="302" class="xs muted" text-anchor="end">shared</text>
<text x="866" y="302" class="xs muted" text-anchor="end">chance</text>
<line x1="600" y1="310.0" x2="872" y2="310.0" class="grid" stroke-width="1.0"/>
<text x="600" y="327.0" class="xs" text-anchor="start">1 : 1</text>
<text x="730" y="327.0" class="xs mono" text-anchor="end">2,048</text>
<text x="798" y="327.0" class="xs mono" text-anchor="end">346</text>
<text x="866" y="327.0" class="xs mono" text-anchor="end">323</text>
<text x="600" y="344.0" class="xs" text-anchor="start">1 : 2</text>
<text x="730" y="344.0" class="xs mono" text-anchor="end">4,096</text>
<text x="798" y="344.0" class="xs mono" text-anchor="end">254</text>
<text x="866" y="344.0" class="xs mono" text-anchor="end">202</text>
<text x="600" y="361.0" class="xs" text-anchor="start">1 : 4</text>
<text x="730" y="361.0" class="xs mono" text-anchor="end">8,192</text>
<text x="798" y="361.0" class="xs mono" text-anchor="end">176</text>
<text x="866" y="361.0" class="xs mono" text-anchor="end">113</text>
<text x="600" y="378.0" class="xs" text-anchor="start">1 : 8</text>
<text x="730" y="378.0" class="xs mono" text-anchor="end">16,384</text>
<text x="798" y="378.0" class="xs mono" text-anchor="end">156</text>
<text x="866" y="378.0" class="xs mono" text-anchor="end">60</text>
<text x="50" y="406" class="xs muted" text-anchor="start">On a lattice of crates — which is what a physics scene looks like the moment it settles — the textbook hash puts 254</text>
<text x="50" y="423" class="xs muted" text-anchor="start">pairs of cells in a shared bucket where chance would put 202, and a stronger mix puts 209. It stays, and the</text>
<text x="50" y="440" class="xs muted" text-anchor="start">measurement is also why: those extra collisions are worth 9.4% of the inner loop (99,852 pair tests against 90,514),</text>
<text x="50" y="457" class="xs muted" text-anchor="start">and the hash that removes them costs 2.0× as much per call (0.115 ns against 0.231). Note the load-factor table's last</text>
<text x="50" y="474" class="xs muted" text-anchor="start">column: the gap to chance WIDENS as the table grows, which is this hash's signature and the reason buying a bigger</text>
<text x="50" y="491" class="xs muted" text-anchor="start">table is not the fix.</text>
</svg>
