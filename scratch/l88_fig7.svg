<text x="50" y="226" class="xs muted" text-anchor="start">memory ∝ the WORLD's volume; a 1 km world at a 1 m</text>
<text x="50" y="243" class="xs muted" text-anchor="start">cell is 10⁹ cells — and it has an EDGE to fall off</text>
<text x="430" y="40" class="sm" text-anchor="start">a hash of the occupied cells</text>
<rect x="430" y="96" width="19" height="26" rx="2" fill="none" stroke="#8f918a" stroke-width="0.9"/>
<rect x="452" y="96" width="19" height="26" rx="2" fill="none" stroke="#8f918a" stroke-width="0.9"/>
