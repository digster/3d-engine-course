<text x="505.5" y="140" class="xs" text-anchor="middle">2 cells</text>
<rect x="563" y="97" width="17" height="24" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="0.6" fill-opacity="0.55"/>
