<text x="50" y="408" class="xs muted" text-anchor="start">Halve the cell and each object claims eight times as many of them; double it and each cell holds eight times as many</text>
<text x="50" y="425" class="xs muted" text-anchor="start">objects, whose pair loop is quadratic. Both wings go as the cube, so the minimum sits where a·E(s) = b·T(s) and moves</text>
<text x="50" y="442" class="xs muted" text-anchor="start">as the SIXTH ROOT of the scene's density — which is why one formula that never looks at density can serve. Measured:</text>
<text x="50" y="459" class="xs muted" text-anchor="start">the model's optimum is 3.30 m (2.13× the mean longest side) on this scene and 2.05 m (1.32×) on one four times denser.</text>
<text x="50" y="476" class="xs muted" text-anchor="start">The two constants came out at 8.1 and 5.5 nanoseconds on BOTH scenes, because they are properties of the machine</text>
<text x="50" y="493" class="xs muted" text-anchor="start">rather than of the crowd.</text>
</svg>
