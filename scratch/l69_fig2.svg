<svg viewBox="0 0 720 320" role="img" aria-labelledby="f69b-t f69b-d">
  <title id="f69b-t">Uniform, logarithmic and practical split schemes</title>
  <desc id="f69b-d">Three horizontal bars showing where each scheme cuts a frustum between 0.1 and 60 metres. Uniform cuts at 15, 30 and 45. Logarithmic cuts at 0.55, 3.1 and 17.3. The practical blend cuts at 7.8, 16.3 and 28.6.</desc>
  <defs>
    <marker id="e-i-f69b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f69b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f69b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f69b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f69b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">Where to cut, and the two schemes that are both wrong</text>
<line x1="90" y1="80" x2="640" y2="80" class="grid" stroke-width="1.0"/>
<text x="82" y="84" class="xs" text-anchor="end">uniform</text>
<rect x="90.0" y="69" width="137.5" height="22" rx="2" fill="#8f918a" stroke="#8f918a" fill-opacity="0.50" stroke-width="1.0"/>
<rect x="227.5" y="69" width="137.5" height="22" rx="2" fill="#8f918a" stroke="#8f918a" fill-opacity="0.40" stroke-width="1.0"/>
<rect x="365.0" y="69" width="137.5" height="22" rx="2" fill="#8f918a" stroke="#8f918a" fill-opacity="0.30" stroke-width="1.0"/>
<rect x="502.5" y="69" width="137.5" height="22" rx="2" fill="#8f918a" stroke="#8f918a" fill-opacity="0.20" stroke-width="1.0"/>
<text x="227.5459098497496" y="64" class="xs" text-anchor="middle">15.1</text>
<text x="365.0" y="64" class="xs" text-anchor="middle">30.1</text>
<text x="502.5459098497496" y="64" class="xs" text-anchor="middle">45.0</text>
<text x="94" y="116" class="xs" text-anchor="start">equal metres: cascade 0 covers 15 m and the near field is no better off</text>
<line x1="90" y1="150" x2="640" y2="150" class="grid" stroke-width="1.0"/>
<text x="82" y="154" class="xs" text-anchor="end">logarithmic</text>
<rect x="90.0" y="139" width="4.1" height="22" rx="2" fill="#5082e6" stroke="#5082e6" fill-opacity="0.50" stroke-width="1.0"/>
<rect x="94.1" y="139" width="23.4" height="22" rx="2" fill="#5082e6" stroke="#5082e6" fill-opacity="0.40" stroke-width="1.0"/>
<rect x="117.5" y="139" width="130.6" height="22" rx="2" fill="#5082e6" stroke="#5082e6" fill-opacity="0.30" stroke-width="1.0"/>
<rect x="248.1" y="139" width="391.9" height="22" rx="2" fill="#5082e6" stroke="#5082e6" fill-opacity="0.20" stroke-width="1.0"/>
<text x="94.13188647746244" y="134" class="xs" text-anchor="middle">0.6</text>
<text x="117.54590984974959" y="134" class="xs" text-anchor="middle">3.1</text>
<text x="248.1135225375626" y="134" class="xs" text-anchor="middle">17.3</text>
<text x="94" y="186" class="xs" text-anchor="start">equal texels-per-pixel: correct, and cascade 0 is spent on your shoes</text>
<line x1="90" y1="220" x2="640" y2="220" class="grid" stroke-width="1.0"/>
<text x="82" y="224" class="xs" text-anchor="end">practical</text>
<rect x="90.0" y="209" width="70.5" height="22" rx="2" fill="#5ac878" stroke="#5ac878" fill-opacity="0.50" stroke-width="1.0"/>
<rect x="160.5" y="209" width="77.8" height="22" rx="2" fill="#5ac878" stroke="#5ac878" fill-opacity="0.40" stroke-width="1.0"/>
<rect x="238.3" y="209" width="113.1" height="22" rx="2" fill="#5ac878" stroke="#5ac878" fill-opacity="0.30" stroke-width="1.0"/>
<rect x="351.4" y="209" width="288.6" height="22" rx="2" fill="#5ac878" stroke="#5ac878" fill-opacity="0.20" stroke-width="1.0"/>
<text x="160.51752921535893" y="204" class="xs" text-anchor="middle">7.8</text>
<text x="238.2888146911519" y="204" class="xs" text-anchor="middle">16.2</text>
<text x="351.41068447412357" y="204" class="xs" text-anchor="middle">28.6</text>
<text x="94" y="256" class="xs" text-anchor="start">the blend, lambda = 0.5 — each end explicable, the middle useful</text>
<line x1="90" y1="268" x2="640" y2="268" class="grid" stroke-width="1.0"/>
<line x1="90.0" y1="264" x2="90.0" y2="272" class="grid" stroke-width="1.0"/>
<text x="90.0" y="288" class="xs" text-anchor="middle">0.1</text>
<line x1="226.81135225375627" y1="264" x2="226.81135225375627" y2="272" class="grid" stroke-width="1.0"/>
<text x="226.81135225375627" y="288" class="xs" text-anchor="middle">15</text>
<line x1="364.5409015025042" y1="264" x2="364.5409015025042" y2="272" class="grid" stroke-width="1.0"/>
<text x="364.5409015025042" y="288" class="xs" text-anchor="middle">30</text>
<line x1="502.2704507512521" y1="264" x2="502.2704507512521" y2="272" class="grid" stroke-width="1.0"/>
<text x="502.2704507512521" y="288" class="xs" text-anchor="middle">45</text>
<line x1="640.0" y1="264" x2="640.0" y2="272" class="grid" stroke-width="1.0"/>
<text x="640.0" y="288" class="xs" text-anchor="middle">60</text>
<text x="360.0" y="306" class="xs" text-anchor="middle">distance from the eye, metres</text>
</svg>
