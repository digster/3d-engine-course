<svg viewBox="0 0 900 494" role="img" aria-labelledby="l87f7-t l87f7-d">
  <title id="l87f7-t">Sutherland-Hodgman clipping of the incident face against the reference face's four side planes, one pass per panel.</title>
  <desc id="l87f7-d">Four panels. In each, a blue rectangle is the reference face and a grey dashed rotated square is the incident face. A green dashed line marks the side plane being applied, with a short green arrow for its outward normal. The amber polygon is what survives so far, with its vertices marked: the incident square is progressively cut back as each of the four planes is applied, gaining a crossing vertex where an edge leaves the half-space and losing the vertices outside it.</desc>
