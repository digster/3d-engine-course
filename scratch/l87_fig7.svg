<text x="776" y="318" class="xs mono" text-anchor="middle">5 vertices left</text>
<line x1="20" y1="340" x2="880" y2="340" class="grid" stroke-width="1.0"/>
<text x="24" y="362" class="xs" text-anchor="start">For edge v[i] → v[i+1] of a polygon wound counter-clockwise about its own normal, the OUTWARD in-plane direction is</text>
<text x="24" y="379" class="xs" text-anchor="start">cross(edge, normal). Keep every vertex on the non-positive side; where an edge crosses, insert the crossing point.</text>
<text x="24" y="406" class="xs muted" text-anchor="start">REVERSE THE WINDING AND EVERY SIDE PLANE FACES INWARD. §5's control does exactly that, and the manifold comes back</text>
<text x="24" y="423" class="xs muted" text-anchor="start">with 0 of 4 incident vertices inside — an empty contact on a pair that is plainly touching. It is the quietest way</text>
<text x="24" y="440" class="xs muted" text-anchor="start">there is to lose a floor.</text>
<text x="24" y="467" class="xs muted" text-anchor="start">The final polygon is the CONTACT SET: the intersection of two convex faces, which is convex and has at most (m + n)</text>
<text x="24" y="484" class="xs muted" text-anchor="start">vertices — each plane adds at most two and removes at least one.</text>
</svg>
