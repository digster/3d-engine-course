<line x1="685.0" y1="232.0" x2="801.0" y2="232.0" stroke="#5082e6" stroke-width="6.0" fill="none"/>
<line x1="725.0" y1="239.0" x2="761.0" y2="239.0" stroke="#e05c5c" stroke-width="6.0" fill="none"/>
<line x1="625.0" y1="228.0" x2="861.0" y2="228.0" stroke="#8f918a" stroke-width="1.0" fill="none"/>
<line x1="849.0" y1="106.0" x2="849.0" y2="188.0" stroke="#5082e6" stroke-width="6.0" fill="none"/>
<line x1="856.0" y1="142.0" x2="856.0" y2="178.0" stroke="#e05c5c" stroke-width="6.0" fill="none"/>
<line x1="845.0" y1="90.0" x2="845.0" y2="210.0" stroke="#8f918a" stroke-width="1.0" fill="none"/>
<text x="743.0" y="266" class="xs muted" text-anchor="middle">the ball sits in the cup's mouth,</text>
<text x="743.0" y="280" class="xs muted" text-anchor="middle">touching nothing — and no direction</text>
<text x="743.0" y="294" class="xs muted" text-anchor="middle">can say so, because the gap is not</text>
<text x="743.0" y="308" class="xs muted" text-anchor="middle">between the two SHAPES, it is inside</text>
<text x="743.0" y="322" class="xs muted" text-anchor="middle">one of them</text>
</svg>
