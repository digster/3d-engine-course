<svg viewBox="0 0 900 400" role="img" aria-labelledby="l83f1-t l83f1-d">
  <title id="l83f1-t">Three ways to push a box: off-centre, through the centre, and as a couple</title>
  <desc id="l83f1-d">The first panel shows a force applied at the top of a box with the lever arm drawn from the centre of mass, producing a torque of ten newton-metres about minus z. The second shows the same force aimed at the centre, where the lever arm and the force are parallel and the torque is exactly zero. The third shows two equal and opposite forces offset from each other: no net force at all, and a torque of minus ten.</desc>
  <defs>
    <marker id="e-i-l83f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l83f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l83f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l83f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l83f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-red-l83f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-blue-l83f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<defs><marker id="e-green-l83f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-amber-l83f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<rect x="40" y="66" width="250" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="40" y="40" class="xs muted" text-anchor="start">a push at the top</text>
<rect x="142.0" y="145.0" width="46.0" height="92.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<circle cx="165.0" cy="191.0" r="3.4" fill="#8f918a"/>
<text x="135.0" y="195.0" class="xs muted" text-anchor="end">centre of mass</text>
<line x1="165.00" y1="191.00" x2="165.00" y2="145.00" stroke="#ebc860" stroke-width="2.0" marker-end="url(#e-amber-l83f1)"/>
<text x="157.0" y="168.0" class="xs mono" text-anchor="end">r</text>
<line x1="165.00" y1="145.00" x2="243.00" y2="145.00" stroke="#e05c5c" stroke-width="2.4" marker-end="url(#e-red-l83f1)"/>
<text x="205.0" y="135.0" class="xs mono" text-anchor="middle">F = 10 N</text>
<path d="M 125.0,243.0 A 40 40 0 0 1 205.0,243.0" fill="none" stroke="#5082e6" stroke-width="2.0" marker-end="url(#e-blue-l83f1)"/>
<text x="165.0" y="277.0" class="xs mono" text-anchor="middle">τ = r × F = (0, 0, −10)</text>
<text x="165.0" y="293.0" class="xs muted" text-anchor="middle">N·m, about −z</text>
<rect x="324" y="66" width="250" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="324" y="40" class="xs muted" text-anchor="start">the same force, aimed</text>
<text x="324" y="55" class="xs muted" text-anchor="start">at the centre</text>
<rect x="426.0" y="145.0" width="46.0" height="92.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<circle cx="449.0" cy="191.0" r="3.4" fill="#8f918a"/>
<line x1="449.00" y1="191.00" x2="472.00" y2="145.00" stroke="#ebc860" stroke-width="2.0" marker-end="url(#e-amber-l83f1)"/>
<line x1="472.00" y1="145.00" x2="459.35" y2="170.30" stroke="#e05c5c" stroke-width="2.4" marker-end="url(#e-red-l83f1)"/>
<text x="511.0" y="160.64" class="xs mono" text-anchor="start">F ∥ r</text>
<text x="449.0" y="277.0" class="xs mono" text-anchor="middle">τ = 0.0000e+00 N·m</text>
<text x="449.0" y="293.0" class="xs t-hi" text-anchor="middle">exactly, not nearly</text>
<rect x="608" y="66" width="250" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="608" y="40" class="xs muted" text-anchor="start">a couple</text>
<rect x="710.0" y="145.0" width="46.0" height="92.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<circle cx="733.0" cy="191.0" r="3.4" fill="#8f918a"/>
<line x1="733.00" y1="145.00" x2="795.00" y2="145.00" stroke="#e05c5c" stroke-width="2.4" marker-end="url(#e-red-l83f1)"/>
<line x1="733.00" y1="237.00" x2="671.00" y2="237.00" stroke="#e05c5c" stroke-width="2.4" marker-end="url(#e-red-l83f1)"/>
<text x="767.0" y="135.0" class="xs mono" text-anchor="middle">+5 N</text>
<text x="699.0" y="255.0" class="xs mono" text-anchor="middle">−5 N</text>
<text x="733.0" y="277.0" class="xs mono" text-anchor="middle">net force 0, net τ = −10</text>
<text x="733.0" y="293.0" class="xs muted" text-anchor="middle">spin without push</text>
<text x="40" y="356" class="xs muted" text-anchor="start">The lever arm is measured from the CENTRE OF MASS, and that choice is what decouples the two halves of a step: about any</text>
<text x="40" y="372" class="xs muted" text-anchor="start">other point, a force through the centre of mass would produce a torque, and pushing a crate squarely in the middle would set it spinning.</text>
</svg>
