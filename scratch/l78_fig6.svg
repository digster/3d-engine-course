<line x1="62.0" y1="407.0" x2="82.0" y2="407.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="90" y="411" class="xs" text-anchor="start">the mistake: 1/d^2</text>
<text x="540" y="68" class="xs muted" text-anchor="start">per doubling of distance</text>
<text x="844" y="68" class="xs muted" text-anchor="end"></text>
<line x1="540" y1="76.0" x2="850" y2="76.0" class="grid" stroke-width="1.0"/>
<text x="540" y="93.0" class="xs" text-anchor="start">1/d  (pressure)</text>
<text x="844" y="93.0" class="xs mono" text-anchor="end">-6.02 dB</text>
<text x="540" y="110.0" class="xs" text-anchor="start">1/d^2  (intensity)</text>
<text x="844" y="110.0" class="xs mono" text-anchor="end">-12.04 dB</text>
<text x="540" y="136.5" class="xs" text-anchor="start">Energy spreads over a sphere, so INTENSITY</text>
<text x="540" y="152.5" class="xs muted" text-anchor="start">falls as 1/d^2. A sample is a PRESSURE, and</text>
<text x="540" y="168.5" class="xs muted" text-anchor="start">pressure is the square root of intensity.</text>
<text x="540" y="206.5" class="xs muted" text-anchor="start">emitter (3, 0, -4), gain 0.8</text>
<text x="844" y="206.5" class="xs muted" text-anchor="end"></text>
