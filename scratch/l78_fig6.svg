<svg viewBox="0 0 900 440" role="img" aria-labelledby="l78f6-t l78f6-d">
  <title id="l78f6-t">Four distance-attenuation curves in decibels against a log distance axis</title>
  <desc id="l78f6-d">The inverse law falls 6.02 dB per doubling, the mistaken inverse-square law falls 12.04 dB, the linear law holds up and then collapses, and our inverse_ranged curve follows the inverse law close in and reaches silence at 50 m. The bare inverse law is marked at -33.98 dB where it is cut off.</desc>
