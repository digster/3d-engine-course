<svg viewBox="0 0 720 380" role="img" aria-labelledby="f614e-t f614e-d">
  <title id="f614e-t">MSAA against SSAA sampling patterns</title>
  <desc id="f614e-d">Two pixels showing four coverage samples each, one with a single shader evaluation and one with four, beside the measured difference in shaded value at four roughnesses.</desc>
  <defs>
    <marker id="e-i-f614e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f614e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f614e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f614e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f614e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">MSAA and SSAA differ in exactly one thing: how often the shader runs</text>
<rect x="130" y="60" width="96" height="96" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<circle cx="158.8" cy="88.8" r="3.2" fill="#5082e6"/>
<circle cx="197.2" cy="88.8" r="3.2" fill="#5082e6"/>
<circle cx="158.8" cy="127.2" r="3.2" fill="#5082e6"/>
<circle cx="197.2" cy="127.2" r="3.2" fill="#5082e6"/>
<circle cx="178.0" cy="108.0" r="7.5" fill="none" stroke="#f0961e" stroke-width="2.0"/>
<text x="178.0" y="176" class="xs" text-anchor="middle">MSAA</text>
<text x="178.0" y="192" class="xs" text-anchor="middle">4 coverage, 1 shade</text>
<rect x="330" y="60" width="96" height="96" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<circle cx="358.8" cy="88.8" r="3.2" fill="#5082e6"/>
<circle cx="397.2" cy="88.8" r="3.2" fill="#5082e6"/>
<circle cx="358.8" cy="127.2" r="3.2" fill="#5082e6"/>
<circle cx="397.2" cy="127.2" r="3.2" fill="#5082e6"/>
<circle cx="358.8" cy="88.8" r="7.5" fill="none" stroke="#5ac878" stroke-width="2.0"/>
<circle cx="397.2" cy="88.8" r="7.5" fill="none" stroke="#5ac878" stroke-width="2.0"/>
<circle cx="358.8" cy="127.2" r="7.5" fill="none" stroke="#5ac878" stroke-width="2.0"/>
<circle cx="397.2" cy="127.2" r="7.5" fill="none" stroke="#5ac878" stroke-width="2.0"/>
<text x="378.0" y="176" class="xs" text-anchor="middle">SSAA</text>
<text x="378.0" y="192" class="xs" text-anchor="middle">4 coverage, 4 shades</text>
<circle cx="510" cy="76" r="3.2" fill="#5082e6"/>
<text x="524" y="80" class="xs" text-anchor="start">coverage + depth sample</text>
<circle cx="510" cy="102" r="7.5" fill="none" stroke="#f0961e" stroke-width="2.0"/>
<text x="524" y="106" class="xs" text-anchor="start">shader evaluation</text>
<text x="524" y="132" class="xs" text-anchor="start">MSAA costs ~1.3x</text>
<text x="524" y="148" class="xs" text-anchor="start">SSAA costs 4x</text>
<text x="360.0" y="210" class="xs" text-anchor="middle">on an INTERIOR pixel — one primitive, no silhouette:</text>
<text x="150" y="234" class="xs" text-anchor="middle">roughness</text>
<text x="280" y="234" class="xs" text-anchor="middle">MSAA</text>
<text x="400" y="234" class="xs" text-anchor="middle">SSAA</text>
<text x="530" y="234" class="xs" text-anchor="middle">ratio</text>
<text x="150" y="254" class="xs" text-anchor="middle">0.50</text>
<text x="280" y="254" class="xs" text-anchor="middle">5.99</text>
<text x="400" y="254" class="xs" text-anchor="middle">5.97</text>
<text x="530" y="254" class="xs" text-anchor="middle">1.003x</text>
<text x="150" y="272" class="xs" text-anchor="middle">0.20</text>
<text x="280" y="272" class="xs" text-anchor="middle">191.66</text>
<text x="400" y="272" class="xs" text-anchor="middle">181.98</text>
<text x="530" y="272" class="xs" text-anchor="middle">1.053x</text>
<text x="150" y="290" class="xs" text-anchor="middle">0.10</text>
<text x="280" y="290" class="xs" text-anchor="middle">406.28</text>
<text x="400" y="290" class="xs" text-anchor="middle">1,288.18</text>
<text x="530" y="290" class="xs" text-anchor="middle">0.315x</text>
<text x="150" y="308" class="xs" text-anchor="middle">0.05</text>
<text x="280" y="308" class="xs" text-anchor="middle">52.02</text>
<text x="400" y="308" class="xs" text-anchor="middle">15,587.65</text>
<text x="530" y="308" class="xs" text-anchor="middle">0.003x</text>
<text x="360.0" y="336" class="xs" text-anchor="middle">THE GAP BETWEEN THE TWO COLUMNS IS THE SHADING ALIASING, and MSAA cannot reach it by construction. Shading once</text>
<text x="360.0" y="354" class="xs" text-anchor="middle">per primitive per pixel is not a shortcut MSAA takes — it is what MSAA IS, and what makes it affordable.</text>
<text x="360.0" y="372" class="xs" text-anchor="middle">At roughness 0.05 the two answers differ by a factor of 300.</text>
</svg>
