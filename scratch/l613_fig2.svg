<svg viewBox="0 0 720 420" role="img" aria-labelledby="f613b-t f613b-d">
  <title id="f613b-t">The pyramid's kernel against a single Gaussian</title>
  <desc id="f613b-d">A log-log plot of radially averaged intensity against radius for a single bright pixel blurred by the pyramid, compared with one Gaussian of sigma 16.</desc>
  <defs>
    <marker id="e-i-f613b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f613b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f613b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f613b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f613b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">What a point of light becomes: the pyramid's tail against one Gaussian</text>
<rect x="108" y="60" width="408" height="240" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="142.50969537762202" y1="300" x2="142.50969537762202" y2="305" class="grid" stroke-width="1.0"/>
<text x="142.50969537762202" y="320" class="xs" text-anchor="middle">4</text>
<line x1="225.65807459054852" y1="300" x2="225.65807459054852" y2="305" class="grid" stroke-width="1.0"/>
<text x="225.65807459054852" y="320" class="xs" text-anchor="middle">8</text>
<line x1="308.80645380347505" y1="300" x2="308.80645380347505" y2="305" class="grid" stroke-width="1.0"/>
<text x="308.80645380347505" y="320" class="xs" text-anchor="middle">16</text>
<line x1="391.9548330164016" y1="300" x2="391.9548330164016" y2="305" class="grid" stroke-width="1.0"/>
<text x="391.9548330164016" y="320" class="xs" text-anchor="middle">32</text>
<line x1="475.10321222932805" y1="300" x2="475.10321222932805" y2="305" class="grid" stroke-width="1.0"/>
<text x="475.10321222932805" y="320" class="xs" text-anchor="middle">64</text>
<text x="312.0" y="342" class="xs" text-anchor="middle">radius from the source, in texels</text>
<line x1="103" y1="60.0" x2="108" y2="60.0" class="grid" stroke-width="1.0"/>
<text x="98" y="64.0" class="xs" text-anchor="end">10</text>
<line x1="103" y1="108.0" x2="108" y2="108.0" class="grid" stroke-width="1.0"/>
<text x="98" y="112.0" class="xs" text-anchor="end">1</text>
<line x1="103" y1="156.0" x2="108" y2="156.0" class="grid" stroke-width="1.0"/>
<text x="98" y="160.0" class="xs" text-anchor="end">0.1</text>
<line x1="103" y1="204.0" x2="108" y2="204.0" class="grid" stroke-width="1.0"/>
<text x="98" y="208.0" class="xs" text-anchor="end">0.01</text>
<line x1="103" y1="252.0" x2="108" y2="252.0" class="grid" stroke-width="1.0"/>
<text x="98" y="256.0" class="xs" text-anchor="end">0.001</text>
<line x1="103" y1="300.0" x2="108" y2="300.0" class="grid" stroke-width="1.0"/>
<text x="98" y="304.0" class="xs" text-anchor="end">0.0001</text>
<polyline points="142.5,108.7 225.7,110.6 308.8,118.4 392.0,149.7 475.1,274.8" fill="none" stroke="#8f918a" stroke-width="2.0" stroke-dasharray="5 3"/>
<polyline points="142.5,84.3 225.7,111.1 308.8,140.2 392.0,171.8 475.1,209.2" fill="none" stroke="#f0961e" stroke-width="2.4"/>
<circle cx="142.5" cy="84.3" r="3.2" fill="#f0961e"/>
<circle cx="225.7" cy="111.1" r="3.2" fill="#f0961e"/>
<circle cx="308.8" cy="140.2" r="3.2" fill="#f0961e"/>
<circle cx="392.0" cy="171.8" r="3.2" fill="#f0961e"/>
<circle cx="475.1" cy="209.2" r="3.2" fill="#f0961e"/>
<circle cx="142.5" cy="108.7" r="2.6" fill="#8f918a"/>
<circle cx="225.7" cy="110.6" r="2.6" fill="#8f918a"/>
<circle cx="308.8" cy="118.4" r="2.6" fill="#8f918a"/>
<circle cx="392.0" cy="149.7" r="2.6" fill="#8f918a"/>
<circle cx="475.1" cy="274.8" r="2.6" fill="#8f918a"/>
<line x1="540.0" y1="74.0" x2="562.0" y2="74.0" stroke="#f0961e" stroke-width="2.4" fill="none"/>
<text x="568" y="78" class="xs" text-anchor="start">the pyramid</text>
<text x="568" y="94" class="xs" text-anchor="start">slope -2.01 at r = 16</text>
<text x="568" y="108" class="xs" text-anchor="start">— an inverse-square tail</text>
<line x1="540.0" y1="142.0" x2="562.0" y2="142.0" stroke="#8f918a" stroke-width="2.0" fill="none"/>
<text x="568" y="146" class="xs" text-anchor="start">one Gaussian, sigma 16</text>
<text x="568" y="162" class="xs" text-anchor="start">exp(-r^2) has no tails:</text>
<text x="568" y="176" class="xs" text-anchor="start">it falls off a cliff</text>
<rect x="534" y="200" width="168" height="60" rx="4" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="618" y="220" class="xs" text-anchor="middle">over one octave, 32 to 64:</text>
<text x="618" y="238" class="xs" text-anchor="middle">pyramid falls 6.0x</text>
<text x="618" y="252" class="xs" text-anchor="middle">Gaussian falls 403x</text>
<text x="360.0" y="360" class="xs" text-anchor="middle">Both curves are the SAME delta through the SAME measurement. The octave ratio is normalisation-independent, so no</text>
<text x="360.0" y="378" class="xs" text-anchor="middle">choice of scale can move it. Measured glare in a real eye falls roughly as 1/r^2, which is what a SUM of Gaussians</text>
<text x="360.0" y="396" class="xs" text-anchor="middle">whose widths double produces and what no single Gaussian can. The pyramid is cheaper AND closer to the physics —</text>
<text x="360.0" y="414" class="xs" text-anchor="middle">which is a coincidence worth noticing when it happens.</text>
</svg>
