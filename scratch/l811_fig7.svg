<text x="538" y="334" class="xs" text-anchor="start">T₀ / AGM(1, cos(a/2)) — the elliptic integral, in disguise</text>
<line x1="510.0" y1="347.0" x2="530.0" y2="347.0" stroke="#5082e6" stroke-width="2.4" fill="none"/>
<text x="538" y="351" class="xs" text-anchor="start">measured at 3840 Hz, first period</text>
<line x1="510.0" y1="364.0" x2="530.0" y2="364.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="538" y="368" class="xs" text-anchor="start">a point mass at the same d — 13.8% short at every amplitude</text>
<text x="510" y="393" class="xs muted" text-anchor="start">Second order in h</text>
<text x="510" y="413" class="xs muted" text-anchor="start">rate</text>
<text x="694" y="413" class="xs muted" text-anchor="end">error at 2°</text>
