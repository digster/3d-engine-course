<svg viewBox="0 0 980 509.5" role="img" aria-labelledby="f7-t f7-d">
  <title id="f7-t">A physical pendulum: the parallel axis sets its period</title>
  <desc id="f7-d">Left: a plank on a pin at its top, with its centre half a metre below, and the arithmetic from I_cm through the parallel-axis theorem to the period. Right: the period against amplitude from 0 to 150 degrees on the AGM formula, the measured points at 3840 Hz, the point-mass period as a dashed line, and a table showing the period error falling by four with each halving of the step.</desc>
  <defs>
    <marker id="e-i-f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-amber-f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<text x="26" y="34" class="sm" text-anchor="start">A 1 m plank on a pin at its top</text>
<path d="M 160.67,67.34 L 209.06,261.40 L 187.71,266.72 L 139.33,72.66 Z" fill="none" stroke="#5082e6" stroke-width="1.5"/>
<circle cx="150.0" cy="70.0" r="4.0" fill="#8f918a"/>
<circle cx="174.2" cy="167.0" r="4.0" fill="#5082e6"/>
<line x1="150.0" y1="70.0" x2="174.2" y2="167.0" stroke="#f0961e" stroke-width="2.0" fill="none"/>
<text x="190.19218955996678" y="118.51478631379982" class="xs" text-anchor="start">d = 0.5 m</text>
<text x="190.19218955996678" y="171.02957262759963" class="xs muted" text-anchor="start">centre</text>
<line x1="150.0" y1="70.0" x2="150.0" y2="290.0" stroke="#8f918a" stroke-width="0.8" fill="none" stroke-dasharray="3 4"/>
<text x="26" y="314" class="xs mono" text-anchor="start">I_cm about the pin's axis = m(w² + h²)/12</text>
<text x="400" y="314" class="xs mono" text-anchor="end">= 0.173333 kg m²</text>
<text x="26" y="331" class="xs mono" text-anchor="start">I_pivot = I_cm + m d²  (8.3's parallel axis)</text>
<text x="400" y="331" class="xs mono" text-anchor="end">= 0.673333 kg m²</text>
<text x="26" y="348" class="xs mono" text-anchor="start">T = 2π √(I_pivot / m g d)</text>
<text x="400" y="348" class="xs mono" text-anchor="end">= 1.646116 s</text>
<text x="26" y="365" class="xs mono" text-anchor="start">a point mass at d: T = 2π √(d / g)</text>
<text x="400" y="365" class="xs mono" text-anchor="end">= 1.418503 s</text>
<text x="26" y="390" class="xs" text-anchor="start">measured at 2°: 1.645967 s against 1.646241 predicted</text>
<text x="510" y="34" class="sm" text-anchor="start">Period against amplitude, over the small-swing period</text>
<rect x="510" y="64" width="400" height="220" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="510" y1="284.0" x2="910" y2="284.0" class="grid" stroke-width="0.6"/>
<text x="504" y="288.0" class="xs mono" text-anchor="end">0.8</text>
<line x1="510" y1="247.33333333333334" x2="910" y2="247.33333333333334" class="grid" stroke-width="0.6"/>
<text x="504" y="251.33333333333334" class="xs mono" text-anchor="end">0.9</text>
<line x1="510" y1="210.66666666666669" x2="910" y2="210.66666666666669" class="grid" stroke-width="0.6"/>
<text x="504" y="214.66666666666669" class="xs mono" text-anchor="end">1.0</text>
<line x1="510" y1="173.99999999999994" x2="910" y2="173.99999999999994" class="grid" stroke-width="0.6"/>
<text x="504" y="177.99999999999994" class="xs mono" text-anchor="end">1.1</text>
<line x1="510" y1="137.33333333333334" x2="910" y2="137.33333333333334" class="grid" stroke-width="0.6"/>
<text x="504" y="141.33333333333334" class="xs mono" text-anchor="end">1.2</text>
<line x1="510" y1="100.66666666666663" x2="910" y2="100.66666666666663" class="grid" stroke-width="0.6"/>
<text x="504" y="104.66666666666663" class="xs mono" text-anchor="end">1.3</text>
<line x1="510" y1="64.0" x2="910" y2="64.0" class="grid" stroke-width="0.6"/>
<text x="504" y="68.0" class="xs mono" text-anchor="end">1.4</text>
<text x="510.0" y="300" class="xs mono" text-anchor="middle">0°</text>
<text x="590.0" y="300" class="xs mono" text-anchor="middle">30°</text>
<text x="670.0" y="300" class="xs mono" text-anchor="middle">60°</text>
<text x="750.0" y="300" class="xs mono" text-anchor="middle">90°</text>
<text x="830.0" y="300" class="xs mono" text-anchor="middle">120°</text>
<text x="910.0" y="300" class="xs mono" text-anchor="middle">150°</text>
<text x="710.0" y="316" class="xs muted" text-anchor="middle">amplitude</text>
