<svg viewBox="0 0 900 380" role="img" aria-labelledby="l78f4-t l78f4-d">
  <title id="l78f4-t">A clipped sine and the harmonics the clipping adds</title>
  <desc id="l78f4-d">Left: a sine at three times full scale, drawn dashed, and the same sine after the clamp, with flat tops. Right: bars showing the third, fifth and seventh harmonics at master gains of 3 and 6, reaching -16.5 dB and -11.0 dB relative to the fundamental.</desc>
