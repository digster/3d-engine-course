<svg viewBox="0 0 760 330" role="img" aria-labelledby="f71d-t f71d-d">
  <title id="f71d-t">The three knob axes, losing a dimension</title>
  <desc id="f71d-d">Three panels at pitch zero, sixty and ninety degrees. Each shows the three axes the three knobs turn about, as arrows from a common origin, with the parallelepiped they span shaded. At zero the box is fat and the determinant is one. At sixty it is visibly flattened, determinant one half. At ninety the green and blue arrows are parallel and the box has collapsed to a flat sheet with zero volume.</desc>
  <defs>
    <marker id="e-i-f71d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f71d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f71d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f71d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f71d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
