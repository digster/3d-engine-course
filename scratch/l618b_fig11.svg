<text x="250.0" y="330" class="xs mono muted" text-anchor="middle">4</text>
<text x="250.0" y="281.4766852256321" class="xs mono" text-anchor="middle">12</text>
<rect x="278.0" y="296.8474269216583" width="44.0" height="19.15257307834167" rx="0" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.5"/>
<text x="298.0" y="330" class="xs mono muted" text-anchor="middle">5</text>
<text x="298.0" y="292.8474269216583" class="xs mono" text-anchor="middle">4</text>
<rect x="326.0" y="307.7514357483707" width="44.0" height="8.248564251629322" rx="0" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.5"/>
<text x="346.0" y="330" class="xs mono muted" text-anchor="middle">6</text>
<text x="346.0" y="303.7514357483707" class="xs mono" text-anchor="middle">1</text>
<rect x="374.0" y="307.7514357483707" width="44.0" height="8.248564251629322" rx="0" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.5"/>
<text x="394.0" y="330" class="xs mono muted" text-anchor="middle">7</text>
<text x="394.0" y="303.7514357483707" class="xs mono" text-anchor="middle">1</text>
<rect x="422.0" y="307.7514357483707" width="44.0" height="8.248564251629322" rx="0" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.5"/>
