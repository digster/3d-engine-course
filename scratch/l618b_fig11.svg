<text x="442.0" y="303.7514357483707" class="xs mono" text-anchor="middle">1</text>
<rect x="470.0" y="307.7514357483707" width="44.0" height="8.248564251629322" rx="0" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.5"/>
<text x="490.0" y="330" class="xs mono muted" text-anchor="middle">9</text>
<text x="490.0" y="303.7514357483707" class="xs mono" text-anchor="middle">1</text>
<text x="300.0" y="346" class="xs muted" text-anchor="middle">half-float ULPs between two draws of one state (log scale)</text>
<text x="580" y="200" class="xs" text-anchor="start">the same pool, drawn after two compactions:</text>
<text x="580" y="216" class="xs" text-anchor="start">about 7,000 to 9,000 of 172,800 channels</text>
<text x="580" y="232" class="xs" text-anchor="start">differ, the worst by 8 to 11 half-float ULPs,</text>
<text x="580" y="248" class="xs" text-anchor="start">and the total light agrees to 1 part in 10^4.</text>
<text x="580" y="264" class="xs" text-anchor="start"></text>
<text x="580" y="280" class="xs" text-anchor="start">Addition is commutative in the maths;</text>
<text x="580" y="296" class="xs" text-anchor="start">sixteen-bit float addition rounds after</text>
<text x="580" y="312" class="xs" text-anchor="start">every add, so the ORDER moves the last</text>
<text x="580" y="328" class="xs" text-anchor="start">bits — and moves nothing else.</text>
</svg>
