  <rect x="150.0" y="34.0" width="13.3" height="22" fill="#ebc864"/>
  <rect x="163.3" y="34.0" width="0.0" height="22" fill="#dc8cc8"/>
  <rect x="163.3" y="34.0" width="388.1" height="22" fill="#eb786e"/>
  <rect x="551.4" y="34.0" width="1.0" height="22" fill="#78b4eb"/>
  <rect x="552.4" y="34.0" width="0.8" height="22" fill="#9696dc"/>
  <rect x="553.2" y="34.0" width="0.8" height="22" fill="#6e7080"/>
  <rect x="150.0" y="34.0" width="404.0" height="22" fill="none" class="ink" stroke-width="1"/>
  <text x="357.3" y="49.0" class="xs mono t-onlight" text-anchor="middle">fill 96.1%</text>
  <text x="562.0" y="49.0" class="xs mono">1.61 ms</text>
  <rect x="16.0" y="69.0" width="8" height="8" fill="#78c88c"/>
  <text x="30.0" y="76.0" class="xs mono">build</text>
  <text x="184.0" y="76.0" class="xs mono" text-anchor="end">    0.00 us</text>
  <text x="242.0" y="76.0" class="xs mono muted" text-anchor="end">  0.0%</text>
  <rect x="16.0" y="84.0" width="8" height="8" fill="#ebc864"/>
  <text x="30.0" y="91.0" class="xs mono">collect</text>
  <text x="184.0" y="91.0" class="xs mono" text-anchor="end">   53.08 us</text>
  <text x="242.0" y="91.0" class="xs mono muted" text-anchor="end">  3.3%</text>
  <rect x="16.0" y="99.0" width="8" height="8" fill="#dc8cc8"/>
  <text x="30.0" y="106.0" class="xs mono">sort</text>
