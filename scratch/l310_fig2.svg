  <rect x="150.0" y="190.0" width="404.0" height="22" fill="none" class="ink" stroke-width="1"/>
  <text x="351.4" y="205.0" class="xs mono t-onlight" text-anchor="middle">fill 99.2%</text>
  <text x="562.0" y="205.0" class="xs mono">23.42 ms</text>
  <rect x="16.0" y="225.0" width="8" height="8" fill="#78c88c"/>
  <text x="30.0" y="232.0" class="xs mono">build</text>
  <text x="184.0" y="232.0" class="xs mono" text-anchor="end">    0.12 us</text>
