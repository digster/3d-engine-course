<svg viewBox="0 0 640 360" role="img" aria-labelledby="f3102-t f3102-d">
  <title id="f3102-t">The same frame at two resolutions, phase by phase</title>
  <desc id="f3102-d">Two stacked bars showing where a frame's time goes. At 320 by 180 the fill is 96.1 per cent of a 1.61 millisecond frame; at 1280 by 720 it is 99.2 per cent of a 23.42 millisecond frame. Every other phase is a sliver. The collect phase measures 53.08 microseconds at the small size and 55.04 at the large one - unchanged - while the fill grows fifteenfold, which is the ratio of the pixel counts.</desc>
  <defs>
    <marker id="e-i-f3102" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f3102" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f3102" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f3102" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--verify-bd)"/></marker>
  </defs>
