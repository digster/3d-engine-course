  <text x="542.0" y="106.0" class="xs mono muted" text-anchor="end">  0.2%</text>
  <text x="562.0" y="66.0" class="xs muted">621 fps</text>
  <text x="16" y="178.0" class="sm">1280 x 720<tspan class="muted">  &#8212; same geometry, 475,218 covered px</tspan></text>
  <rect x="150.0" y="190.0" width="0.0" height="22" fill="#78c88c"/>
  <rect x="150.0" y="190.0" width="0.9" height="22" fill="#ebc864"/>
