  <rect x="16.0" y="255.0" width="8" height="8" fill="#dc8cc8"/>
  <text x="30.0" y="262.0" class="xs mono">sort</text>
  <text x="184.0" y="262.0" class="xs mono" text-anchor="end">    0.00 us</text>
  <text x="242.0" y="262.0" class="xs mono muted" text-anchor="end">  0.0%</text>
  <rect x="16.0" y="270.0" width="8" height="8" fill="#eb786e"/>
  <text x="30.0" y="277.0" class="xs mono">fill</text>
  <text x="184.0" y="277.0" class="xs mono" text-anchor="end">23243.92 us</text>
  <text x="242.0" y="277.0" class="xs mono muted" text-anchor="end"> 99.2%</text>
  <rect x="316.0" y="225.0" width="8" height="8" fill="#78b4eb"/>
  <text x="330.0" y="232.0" class="xs mono">overlay</text>
  <text x="484.0" y="232.0" class="xs mono" text-anchor="end">    4.71 us</text>
  <text x="542.0" y="232.0" class="xs mono muted" text-anchor="end">  0.0%</text>
  <rect x="316.0" y="240.0" width="8" height="8" fill="#9696dc"/>
  <text x="330.0" y="247.0" class="xs mono">present</text>
  <text x="484.0" y="247.0" class="xs mono" text-anchor="end">   66.25 us</text>
  <text x="542.0" y="247.0" class="xs mono muted" text-anchor="end">  0.3%</text>
  <rect x="316.0" y="255.0" width="8" height="8" fill="#6e7080"/>
  <text x="330.0" y="262.0" class="xs mono">other</text>
  <text x="484.0" y="262.0" class="xs mono" text-anchor="end">   53.59 us</text>
  <text x="542.0" y="262.0" class="xs mono muted" text-anchor="end">  0.2%</text>
  <text x="562.0" y="222.0" class="xs muted">43 fps</text>
  <text x="16" y="332" class="sm t-hi">collect: 53.08 us &#8594; 55.04 us. Sixteen times the pixels moved it by 3.7%.</text>
  <text x="16" y="348" class="sm t-hi">fill: 1.55 ms &#8594; 23.24 ms. Fifteen times, which is the pixel count.</text>
