<line x1="186.00" y1="196.00" x2="75.15" y2="132.00" stroke="#ec7a8c" stroke-width="1.8" marker-end="url(#e-rose-f76f)"/>
<line x1="296.9" y1="132.0" x2="75.1" y2="132.0" stroke="#f8d678" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
<line x1="186.00" y1="196.00" x2="186.00" y2="132.00" stroke="#60c4ce" stroke-width="2.2" marker-end="url(#e-teal-f76f)"/>
<text x="322.85125168440817" y="136.0" class="xs mono" text-anchor="start">R₀ v</text>
<text x="49.148748315591845" y="136.0" class="xs mono" text-anchor="end">R₁ v</text>
<text x="186.0" y="120.0" class="xs mono" text-anchor="middle">½(R₀v + R₁v)</text>
<text x="186.0" y="350.0" class="xs muted" text-anchor="middle">the blend leaves the circle INWARD</text>
<path d="M 157.42,179.50 A 33.00,33.00 0 0 1 214.58,179.50" fill="none" class="ink-soft" stroke-width="1.1"/>
<text x="160.0" y="180.0" class="sm mono" text-anchor="middle">θ</text>
<text x="372.0" y="58" class="sm" text-anchor="start">the isoceles triangle does the whole job</text>
<text x="372.0" y="84" class="xs muted" text-anchor="start">R₀v and R₁v are both length |v| and θ apart.</text>
<text x="372.0" y="102" class="xs muted" text-anchor="start">Their midpoint lies on the BISECTOR, and the</text>
<text x="372.0" y="120" class="xs muted" text-anchor="start">bisector of an isoceles triangle meets the base</text>
<text x="372.0" y="138" class="xs muted" text-anchor="start">at a right angle — so the midpoint is at</text>
<text x="372.0" y="156" class="xs muted" text-anchor="start">|v| · cos(θ/2).</text>
<text x="372.0" y="174" class="xs muted" text-anchor="start"></text>
<text x="372.0" y="192" class="xs muted" text-anchor="start">Nothing in that sentence mentions skinning,</text>
<text x="372.0" y="210" class="xs muted" text-anchor="start">a joint, or a matrix. It is the same half-angle</text>
<text x="372.0" y="228" class="xs muted" text-anchor="start">Lesson 7.3 found between two mirrors and</text>
<text x="372.0" y="246" class="xs muted" text-anchor="start">Lesson 7.4 found inside a quaternion.</text>
<text x="372.0" y="274.0" class="xs muted" text-anchor="start">twist</text>
<text x="568.0" y="274.0" class="xs muted" text-anchor="end">measured</text>
<text x="696.0" y="274.0" class="xs muted" text-anchor="end">cos(θ/2)</text>
