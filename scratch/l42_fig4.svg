<line x1="608.9" y1="82" x2="608.9" y2="306.0" class="ink" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="602.9" y="78" class="xs mono" text-anchor="end">16.667 ms &#8212; one 60 Hz frame</text>
