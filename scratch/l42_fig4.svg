<rect x="605.3" y="172.0" width="3.6" height="46.0" fill="#7a7a72" opacity="0.88"/>
<text x="618.9" y="200.0" class="xs mono">16.667 ms</text>
<line x1="594.4" y1="218.0" x2="594.4" y2="232.0" class="hi" stroke-width="1.2"/>
<text x="588.4" y="244.0" class="xs mono t-hi" text-anchor="end">fence 0.761</text>
<text x="118.0" y="280.0" class="xs mono" text-anchor="end">IMMEDIATE</text>
