<svg viewBox="0 0 720 356" role="img" aria-labelledby="l42f4-t l42f4-d">
  <title id="l42f4-t">A frame's time, with and without a GPU sync</title>
  <desc id="l42f4-d">Three horizontal stacked bars on a shared millisecond scale. The first, with the fence off, is draw 0.30, record 0.23 and acquire 16.00 milliseconds, totalling 16.667. The second, with a full GPU sync every frame, adds a fence band of 0.761 milliseconds while the acquire band shrinks from 16.00 to 15.27 — and the bar ends in exactly the same place, 16.667 milliseconds. A dashed line marks the 60 Hz budget of 16.667 milliseconds, which both bars reach. The third bar, in IMMEDIATE present mode, is only 4.816 milliseconds, showing that almost all of the first two is waiting for the display.</desc>
  <defs>
    <marker id="e-i-l42f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l42f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l42f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
<text x="24" y="26" class="sm">where one frame of the GPU probe actually goes</text>
<text x="24" y="46" class="xs muted">measured on a 60 Hz display, averaged over 160 frames, variants run alternately in one session</text>
<text x="118.0" y="120.0" class="xs mono" text-anchor="end">[4] off</text>
<rect x="130.0" y="92.0" width="8.6" height="46.0" fill="#5ac878" opacity="0.88"/>
<rect x="138.6" y="92.0" width="6.5" height="46.0" fill="#5acdd7" opacity="0.88"/>
<rect x="145.1" y="92.0" width="459.8" height="46.0" fill="#5082e6" opacity="0.88"/>
<text x="375.1" y="120.0" class="xs t-inv" text-anchor="middle">16.00</text>
<rect x="605.0" y="92.0" width="4.0" height="46.0" fill="#7a7a72" opacity="0.88"/>
<text x="618.9" y="120.0" class="xs mono">16.667 ms</text>
<text x="118.0" y="200.0" class="xs mono" text-anchor="end">[4] on</text>
