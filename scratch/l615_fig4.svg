<rect x="52" y="354" width="652" height="82" rx="4" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="360.0" y="376" class="xs" text-anchor="middle">k = ½·log₂( lobe solid angle / texel solid angle ) — 6.14’s closed-form lobe width, cashed.</text>
<text x="360.0" y="396" class="xs" text-anchor="middle">The two never differ by more than 0.77 of a level (at roughness 0.45). THE FOLKLORE IS NOT ARBITRARY.</text>
<text x="360.0" y="416" class="xs" text-anchor="middle">For comparison √roughness, also seen in the wild, is off by 2.21 levels. And note the direction: a near-mirror is OVER-blurred.</text>
</svg>
