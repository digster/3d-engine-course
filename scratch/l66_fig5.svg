<svg viewBox="0 0 720 400" role="img" aria-labelledby="l66f5-t l66f5-d">
  <title id="l66f5-t">The four layers a glTF texture reference passes through</title>
  <desc id="l66f5-d">Four stacked layers. The file holds a URI string and a material index. parse_gltf turns them into descriptions, still strings and indices. asset_store::load_model resolves them into handles against its search path and pools. The renderer resolves a handle to a pointer once per draw through bind_albedo.</desc>
  <defs>
    <marker id="e-i-l66f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l66f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l66f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l66f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l66f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="0" y="0" width="720" height="400" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="26" class="lg" text-anchor="middle">Where a reference stops being a string</text>
<rect x="24" y="48" width="672" height="68" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.09"/>
<rect x="24" y="48" width="672" height="68" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="36" y="72" class="sm" text-anchor="start">the file</text>
<text x="36" y="92" class="xs" text-anchor="start">assets/cube.gltf + cube.bin</text>
<rect x="290" y="58" width="210" height="20" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.26"/>
<text x="395" y="72" class="xs" text-anchor="middle">"uri": "uv_grid.png"</text>
<text x="395" y="96" class="xs" text-anchor="middle">"material": 0</text>
<rect x="520" y="70" width="160" height="20" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="600" y="84" class="xs" text-anchor="middle">bytes</text>
<line x1="360.0" y1="118" x2="360.0" y2="129" class="ink" stroke-width="1.4" marker-end="url(#e-i-l66f5)"/>
<rect x="24" y="132" width="672" height="68" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.09"/>
<rect x="24" y="132" width="672" height="68" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="36" y="156" class="sm" text-anchor="start">parse_gltf / load_gltf</text>
<text x="36" y="176" class="xs" text-anchor="start">gfx/gltf.cpp — the only file that sees cgltf</text>
<rect x="290" y="142" width="210" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.26"/>
<text x="395" y="156" class="xs" text-anchor="middle">base_colour_uri = "uv_grid.png"</text>
<text x="395" y="180" class="xs" text-anchor="middle">material = 0</text>
<rect x="520" y="154" width="160" height="20" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="600" y="168" class="xs" text-anchor="middle">descriptions</text>
<line x1="360.0" y1="202" x2="360.0" y2="213" class="ink" stroke-width="1.4" marker-end="url(#e-i-l66f5)"/>
<rect x="24" y="216" width="672" height="68" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.09"/>
<rect x="24" y="216" width="672" height="68" rx="3" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="36" y="240" class="sm" text-anchor="start">asset_store::load_model</text>
<text x="36" y="260" class="xs" text-anchor="start">asset/asset_store.cpp — search path, cache, pools</text>
<rect x="290" y="226" width="210" height="20" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.26"/>
<text x="395" y="240" class="xs" text-anchor="middle">albedo_map = handle 3:1</text>
<text x="395" y="264" class="xs" text-anchor="middle">material_handle 0:1</text>
<rect x="520" y="238" width="160" height="20" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="600" y="252" class="xs" text-anchor="middle">handles</text>
<line x1="360.0" y1="286" x2="360.0" y2="297" class="ink" stroke-width="1.4" marker-end="url(#e-i-l66f5)"/>
<rect x="24" y="300" width="672" height="68" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.09"/>
<rect x="24" y="300" width="672" height="68" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3"/>
<text x="36" y="324" class="sm" text-anchor="start">scene_object</text>
<text x="36" y="344" class="xs" text-anchor="start">the renderer's own vocabulary</text>
<rect x="290" y="310" width="210" height="20" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.26"/>
<text x="395" y="324" class="xs" text-anchor="middle">mat.albedo_map</text>
<text x="395" y="348" class="xs" text-anchor="middle">bind_albedo() -&gt; const texture*</text>
<rect x="520" y="322" width="160" height="20" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="600" y="336" class="xs" text-anchor="middle">pointers, once per draw</text>
<text x="360.0" y="380" class="xs" text-anchor="middle">A parser that returned handles could never be tested from a string literal, nor run offline in Module 9.</text>
</svg>
