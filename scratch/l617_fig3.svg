<svg viewBox="0 0 760 400" role="img" aria-labelledby="l617f3-t l617f3-d">
  <title id="l617f3-t">Four derived facts from one dataflow statement</title>
  <desc id="l617f3-d">The declaration `keep` - this pass's output depends on what was already in the target - fanning out into four consequences the compiler derives: the ordering edge, the LOAD op, the producer's STORE op, and the resource's lifetime.</desc>
  <defs>
    <marker id="e-i-l617f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l617f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l617f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l617f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l617f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">What follows from `keep`, and why it is not four decisions.</text>
<rect x="40" y="150" width="250" height="62" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="40" y="150" width="250" height="62" rx="3" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="165" y="174" class="xs mono" text-anchor="middle">level[i-1] = fg.keep(up, level[i-1])</text>
<text x="165" y="194" class="xs muted" text-anchor="middle">"my output depends on what</text>
<text x="165" y="206" class="xs muted" text-anchor="middle">was already in this target"</text>
<rect x="380" y="52" width="340" height="62" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.12"/>
<rect x="380" y="52" width="340" height="62" rx="3" fill="none" stroke="#5ac878" stroke-width="1.1"/>
<text x="392" y="72" class="xs" text-anchor="start">ORDERING</text>
<text x="392" y="90" class="xs muted" text-anchor="start">whoever produced level[i-1]'s current</text>
<text x="392" y="104" class="xs muted" text-anchor="start">version must run before this pass</text>
<line x1="296" y1="181" x2="374" y2="83" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f3)"/>
<rect x="380" y="134" width="340" height="62" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.12"/>
<rect x="380" y="134" width="340" height="62" rx="3" fill="none" stroke="#5082e6" stroke-width="1.1"/>
<text x="392" y="154" class="xs" text-anchor="start">LOAD OP</text>
<text x="392" y="172" class="xs muted" text-anchor="start">SDL_GPU_LOADOP_LOAD, because the old</text>
<text x="392" y="186" class="xs muted" text-anchor="start">contents are an operand of the blend</text>
<line x1="296" y1="181" x2="374" y2="165" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f3)"/>
<rect x="380" y="216" width="340" height="62" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.12"/>
<rect x="380" y="216" width="340" height="62" rx="3" fill="none" stroke="#9b7ede" stroke-width="1.1"/>
<text x="392" y="236" class="xs" text-anchor="start">STORE OP</text>
<text x="392" y="254" class="xs muted" text-anchor="start">the producer's store becomes STORE:</text>
<text x="392" y="268" class="xs muted" text-anchor="start">this pass is a reader of its version</text>
<line x1="296" y1="181" x2="374" y2="247" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f3)"/>
<rect x="380" y="298" width="340" height="62" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.12"/>
<rect x="380" y="298" width="340" height="62" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.1"/>
<text x="392" y="318" class="xs" text-anchor="start">LIFETIME</text>
<text x="392" y="336" class="xs muted" text-anchor="start">level[i-1] is live from its producer</text>
<text x="392" y="350" class="xs muted" text-anchor="start">through this pass, so the pool cannot reuse it</text>
<line x1="296" y1="181" x2="374" y2="329" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f3)"/>
</svg>
