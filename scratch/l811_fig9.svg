<svg viewBox="0 0 980 504.5" role="img" aria-labelledby="f9-t f9-d">
  <title id="f9-t">A hinge limit: speculation, and the convergence rate the parallel axis sets</title>
  <desc id="f9-d">Left: a door on a pin; the limit row rotates it about its centre and the pin pulls back, so Gauss-Seidel between them contracts by rho = m d squared over I_pivot per sweep; and a table of a turnstile's overshoot, uniform when reactive and zero when speculative. Right: the error left after 1, 2, 4 and 8 sweeps for three pin offsets, lying on rho to the n, and the rebound each leaves at eight sweeps.</desc>
  <defs>
    <marker id="e-i-f9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-amber-f9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-blue-f9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<text x="26" y="34" class="sm" text-anchor="start">The limit row turns the door about its CENTRE</text>
<rect x="70" y="138" width="260" height="24" rx="3" fill="none" stroke="#5082e6" stroke-width="1.4"/>
<circle cx="70.0" cy="150.0" r="4.2" fill="#8f918a"/>
<text x="66" y="180" class="xs muted" text-anchor="middle">pin</text>
<circle cx="200.0" cy="150.0" r="4.0" fill="#5082e6"/>
<text x="200.0" y="180" class="xs muted" text-anchor="middle">centre</text>
<path d="M 238.11,128.00 L 235.60,124.14 L 232.70,120.56 L 229.44,117.30 L 225.86,114.40 L 222.00,111.89 L 217.90,109.80 L 213.60,108.15 L 209.15,106.96 L 204.60,106.24 L 200.00,106.00 L 195.40,106.24 L 190.85,106.96 L 186.40,108.15 L 182.10,109.80 L 178.00,111.89 L 174.14,114.40 L 170.56,117.30 L 167.30,120.56 L 164.40,124.14 L 161.89,128.00" fill="none" stroke="#f0961e" stroke-width="1.6"/>
<text x="200.0" y="96" class="xs" text-anchor="middle">what the limit row sees: I_cm</text>
<line x1="70.00" y1="90.00" x2="70.00" y2="132.00" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-f9)"/>
<text x="78" y="86" class="xs" text-anchor="start">the pin pulls back</text>
<text x="26" y="208" class="xs" text-anchor="start">The door really turns about the pin, where its inertia is I_cm + m d².</text>
<text x="26" y="224" class="xs" text-anchor="start">The limit changes ω by the right amount for I_cm; the pin then gives</text>
<text x="26" y="240" class="xs" text-anchor="start">back a fraction   ρ = m d² / (I_cm + m d²)   of it. Gauss–Seidel between</text>
<text x="26" y="256" class="xs" text-anchor="start">the two contracts by ρ per sweep: 3/4 for ANY uniform slab hinged at its</text>
<text x="26" y="272" class="xs" text-anchor="start">edge, whatever its size — the parallel axis again, as a rate.</text>
<text x="26" y="298" class="xs muted" text-anchor="start">Overshoot past the stop, in units of ω h</text>
<text x="26" y="318" class="xs muted" text-anchor="start">turnstile, 200 phases</text>
<text x="290" y="318" class="xs muted" text-anchor="end">mean</text>
<text x="380" y="318" class="xs muted" text-anchor="end">largest</text>
<line x1="26" y1="326.0" x2="386" y2="326.0" class="grid" stroke-width="1.0"/>
<text x="26" y="343.0" class="xs" text-anchor="start">reactive</text>
<text x="290" y="343.0" class="xs mono" text-anchor="end">0.4985</text>
<text x="380" y="343.0" class="xs mono" text-anchor="end">0.9960</text>
<text x="26" y="360.0" class="xs" text-anchor="start">speculative</text>
<text x="290" y="360.0" class="xs mono" text-anchor="end">0.0000</text>
<text x="380" y="360.0" class="xs mono" text-anchor="end">0.0000</text>
<text x="560" y="34" class="sm" text-anchor="start">Error left after n sweeps, one step into the stop</text>
<rect x="560" y="64" width="360" height="200" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="560" y1="264.0" x2="920" y2="264.0" class="grid" stroke-width="0.6"/>
<text x="554" y="268.0" class="xs mono" text-anchor="end">1e-3</text>
<line x1="560" y1="197.33333333333334" x2="920" y2="197.33333333333334" class="grid" stroke-width="0.6"/>
<text x="554" y="201.33333333333334" class="xs mono" text-anchor="end">1e-2</text>
<line x1="560" y1="130.66666666666669" x2="920" y2="130.66666666666669" class="grid" stroke-width="0.6"/>
<text x="554" y="134.66666666666669" class="xs mono" text-anchor="end">1e-1</text>
<line x1="560" y1="64.0" x2="920" y2="64.0" class="grid" stroke-width="0.6"/>
<text x="554" y="68.0" class="xs mono" text-anchor="end">1</text>
<path d="M 580.00,88.70 L 686.67,113.40 L 749.06,138.10 L 793.33,162.80 L 827.67,187.50 L 855.73,212.20 L 879.45,236.89 L 900.00,261.59" fill="none" stroke="#9b7ede" stroke-width="1.0" stroke-dasharray="4 4"/>
<circle cx="580.0" cy="88.7" r="3.6" fill="#5ac878"/>
<circle cx="686.7" cy="113.4" r="3.6" fill="#5ac878"/>
<circle cx="793.3" cy="162.8" r="3.6" fill="#5ac878"/>
<circle cx="900.0" cy="261.2" r="3.6" fill="#5ac878"/>
<path d="M 580.00,72.40 L 686.67,80.81 L 749.06,89.21 L 793.33,97.61 L 827.67,106.01 L 855.73,114.42 L 879.45,122.82 L 900.00,131.22" fill="none" stroke="#9b7ede" stroke-width="1.0" stroke-dasharray="4 4"/>
<circle cx="580.0" cy="72.4" r="3.6" fill="#f0961e"/>
<circle cx="686.7" cy="80.8" r="3.6" fill="#f0961e"/>
<circle cx="793.3" cy="97.6" r="3.6" fill="#f0961e"/>
<circle cx="900.0" cy="131.2" r="3.6" fill="#f0961e"/>
<path d="M 580.00,66.34 L 686.67,68.68 L 749.06,71.02 L 793.33,73.35 L 827.67,75.69 L 855.73,78.03 L 879.45,80.37 L 900.00,82.71" fill="none" stroke="#9b7ede" stroke-width="1.0" stroke-dasharray="4 4"/>
<circle cx="580.0" cy="66.3" r="3.6" fill="#e05c5c"/>
<circle cx="686.7" cy="68.7" r="3.6" fill="#e05c5c"/>
<circle cx="793.3" cy="73.4" r="3.6" fill="#e05c5c"/>
<circle cx="900.0" cy="82.7" r="3.6" fill="#e05c5c"/>
<text x="580.0" y="280" class="xs mono" text-anchor="middle">1</text>
<text x="686.6666666666667" y="280" class="xs mono" text-anchor="middle">2</text>
<text x="793.3333333333334" y="280" class="xs mono" text-anchor="middle">4</text>
<text x="900.0" y="280" class="xs mono" text-anchor="middle">8</text>
<text x="740.0" y="296" class="xs muted" text-anchor="middle">sweeps</text>
<line x1="560.0" y1="310.0" x2="580.0" y2="310.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="588" y="314" class="xs" text-anchor="start">pin a full width out:  ρ = 0.9224</text>
<line x1="560.0" y1="327.0" x2="580.0" y2="327.0" stroke="#f0961e" stroke-width="2.4" fill="none"/>
<text x="588" y="331" class="xs" text-anchor="start">at the edge (a door):  ρ = 0.7481</text>
<line x1="560.0" y1="344.0" x2="580.0" y2="344.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="588" y="348" class="xs" text-anchor="start">a quarter of the way out:  ρ = 0.4261</text>
<line x1="560.0" y1="361.0" x2="580.0" y2="361.0" stroke="#9b7ede" stroke-width="2.4" fill="none"/>
<text x="588" y="365" class="xs" text-anchor="start">ρⁿ, predicted — through the centre ρ = 0, exact in one</text>
<text x="560" y="388" class="xs muted" text-anchor="start">Restitution zero, and still it bounces</text>
<text x="560" y="408" class="xs muted" text-anchor="start">pin</text>
<text x="740" y="408" class="xs muted" text-anchor="end">ρ⁸</text>
<text x="900" y="408" class="xs muted" text-anchor="end">rebound at 8 sweeps</text>
<line x1="560" y1="416.0" x2="906" y2="416.0" class="grid" stroke-width="1.0"/>
<text x="560" y="433.0" class="xs" text-anchor="start">d = 0.00 W</text>
<text x="740" y="433.0" class="xs mono" text-anchor="end">0.00000</text>
<text x="900" y="433.0" class="xs mono" text-anchor="end">0.00% of arrival</text>
<text x="560" y="450.0" class="xs" text-anchor="start">d = 0.25 W</text>
<text x="740" y="450.0" class="xs mono" text-anchor="end">0.00109</text>
<text x="900" y="450.0" class="xs mono" text-anchor="end">0.11% of arrival</text>
<text x="560" y="467.0" class="xs" text-anchor="start">d = 0.50 W</text>
<text x="740" y="467.0" class="xs mono" text-anchor="end">0.09813</text>
<text x="900" y="467.0" class="xs mono" text-anchor="end">7.53% of arrival</text>
<text x="560" y="484.0" class="xs" text-anchor="start">d = 1.00 W</text>
<text x="740" y="484.0" class="xs mono" text-anchor="end">0.52388</text>
<text x="900" y="484.0" class="xs mono" text-anchor="end">27.06% of arrival</text>
</svg>
