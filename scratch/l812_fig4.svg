<svg viewBox="0 0 980 422" role="img" aria-labelledby="g4-t g4-d">
  <title id="g4-t">The twist row's axis, and the error of the obvious ones</title>
  <desc id="g4-d">Left: the cone axis, the bone, and the twist row's axis — the half-way vector scaled by 1/cos(phi/2) — with the formula for the twist rate and the bound on the bone row's error. Right: on a log axis, the worst relative error of three candidate rows in seven swing bins: the half-way row near 1e-3 everywhere, the bone and cone-axis rows above 1 beyond a degree of swing.</desc>
  <defs>
    <marker id="e-i-g4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-g4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-g4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-g4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-g4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-blue-g4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<defs><marker id="e-green-g4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-grey-g4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<text x="26" y="30" class="sm" text-anchor="start">What the twist's rate is about</text>
<line x1="170.00" y1="70.00" x2="170.00" y2="190.00" stroke="#8f918a" stroke-width="1.9" marker-end="url(#e-grey-g4)"/>
<text x="178.0" y="204.0" class="xs" text-anchor="start">a₁ (t)</text>
<line x1="170.00" y1="70.00" x2="288.18" y2="90.84" stroke="#5082e6" stroke-width="1.9" marker-end="url(#e-blue-g4)"/>
<text x="296.176930361465" y="104.83778132003165" class="xs" text-anchor="start">b₁ (c)</text>
<line x1="170.00" y1="70.00" x2="270.69" y2="190.00" stroke="#5ac878" stroke-width="1.9" marker-end="url(#e-green-g4)"/>
<text x="278.6919557412736" y="204.0" class="xs" text-anchor="start">(a₁ + b₁)/(1 + a₁·b₁)</text>
<text x="26" y="226" class="xs" text-anchor="start">The swing's own angular velocity is 2h × ḣ — perpendicular to</text>
<text x="26" y="241" class="xs" text-anchor="start">h, so it has no component along a₁ + b₁. Every other bit of the</text>
<text x="26" y="256" class="xs" text-anchor="start">relative spin along that axis is twist:</text>
<text x="26" y="286" class="xs mono" text-anchor="start">dθ/dt = (ω_b − ω_a) · (a₁ + b₁) / (1 + a₁·b₁)</text>
<text x="26" y="316" class="xs" text-anchor="start">the half-way axis over cos(φ/2). A row about the bone is wrong</text>
<text x="26" y="331" class="xs" text-anchor="start">by −(ω⊥ · a₁)/(1 + cos φ): at most |ω⊥|·tan(φ/2) — measured to</text>
<text x="26" y="346" class="xs" text-anchor="start">1.0045 of that bound.</text>
<text x="490" y="30" class="sm" text-anchor="start">40,000 random joints: row J·V against dθ/dt, by swing</text>
<rect x="520" y="58" width="420" height="230" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="520" y1="288.0" x2="940" y2="288.0" class="grid" stroke-width="0.6"/>
<text x="514" y="292.0" class="xs mono" text-anchor="end">0.0001</text>
<line x1="520" y1="242.0" x2="940" y2="242.0" class="grid" stroke-width="0.6"/>
<text x="514" y="246.0" class="xs mono" text-anchor="end">0.001</text>
<line x1="520" y1="196.0" x2="940" y2="196.0" class="grid" stroke-width="0.6"/>
<text x="514" y="200.0" class="xs mono" text-anchor="end">0.01</text>
<line x1="520" y1="150.0" x2="940" y2="150.0" class="grid" stroke-width="0.6"/>
