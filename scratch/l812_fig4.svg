<text x="910.0" y="304" class="xs mono" text-anchor="middle">150–175</text>
<text x="730.0" y="320" class="xs muted" text-anchor="middle">swing (degrees)</text>
<line x1="520.0" y1="338.0" x2="540.0" y2="338.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="548" y="342" class="xs" text-anchor="start">half-way / cos(φ/2) — the engine's row: float-difference resolution</text>
<line x1="520.0" y1="355.0" x2="540.0" y2="355.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="548" y="359" class="xs" text-anchor="start">about the bone, b₁</text>
<line x1="520.0" y1="372.0" x2="540.0" y2="372.0" stroke="#f0961e" stroke-width="2.4" fill="none"/>
<text x="548" y="376" class="xs" text-anchor="start">about the cone's axis, a₁</text>
<text x="548" y="393" class="xs muted" text-anchor="start">worst |row − rate| / max(1, |rate|); at exactly zero swing all three agree to 9.5e-07</text>
</svg>
