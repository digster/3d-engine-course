<text x="418.0" y="250.0" class="xs t-hi" text-anchor="start">The bottom row is the worst case that exists.</text>
<text x="418.0" y="266.0" class="xs muted" text-anchor="start">A rotation arc cannot exceed 180° once nearest has</text>
