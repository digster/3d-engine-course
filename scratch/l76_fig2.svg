<svg viewBox="0 0 760 392" role="img" aria-labelledby="f76b-t f76b-d">
  <title id="f76b-t">The two factors of a skinning matrix</title>
  <desc id="f76b-d">Model space to joint space at bind time, then joint space to model space at pose time. The inner labels cancel and the outer labels are the same space, so a skinning matrix maps model space to itself.</desc>
  <defs>
    <marker id="e-i-f76b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f76b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f76b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f76b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f76b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-amber-f76b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2ba5c"/></marker></defs>
<defs><marker id="e-teal-f76b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60c4ce"/></marker></defs>
<rect x="24.0" y="74.0" width="176.0" height="62.0" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="112.0" y="100.0" class="sm" text-anchor="middle">MODEL space</text>
<text x="112.0" y="118.0" class="xs muted" text-anchor="middle">the mesh, as modelled</text>
<rect x="292.0" y="74.0" width="176.0" height="62.0" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="380.0" y="100.0" class="sm" text-anchor="middle">JOINT space</text>
<text x="380.0" y="118.0" class="xs muted" text-anchor="middle">joint j, at BIND time</text>
<rect x="560.0" y="74.0" width="176.0" height="62.0" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="648.0" y="100.0" class="sm" text-anchor="middle">MODEL space</text>
<text x="648.0" y="118.0" class="xs muted" text-anchor="middle">the mesh, deformed</text>
<line x1="206.00" y1="105.00" x2="284.00" y2="105.00" stroke="#f2ba5c" stroke-width="1.8" marker-end="url(#e-amber-f76b)"/>
<line x1="474.00" y1="105.00" x2="552.00" y2="105.00" stroke="#60c4ce" stroke-width="1.8" marker-end="url(#e-teal-f76b)"/>
<text x="246.0" y="64.0" class="xs mono" text-anchor="middle">joint_from_model</text>
<text x="246.0" y="156.0" class="xs muted" text-anchor="middle">the inverse bind matrix</text>
<text x="246.0" y="170.0" class="xs muted" text-anchor="middle">baked once</text>
<text x="514.0" y="64.0" class="xs mono" text-anchor="middle">model_from_joint</text>
<text x="514.0" y="156.0" class="xs muted" text-anchor="middle">the joint, POSED</text>
<text x="514.0" y="170.0" class="xs muted" text-anchor="middle">rebuilt every frame</text>
<line x1="24" y1="216.0" x2="736" y2="216.0" class="grid" stroke-width="1.0"/>
<text x="380.0" y="240.0" class="sm mono" text-anchor="middle">skin  =  model_from_joint  ·  joint_from_model</text>
<text x="380.0" y="262.0" class="xs muted" text-anchor="middle">the inner labels agree — same joint, two different TIMES</text>
<text x="380.0" y="288.0" class="sm mono" text-anchor="middle">skin  =  model_from_model</text>
<text x="380.0" y="310.0" class="xs muted" text-anchor="middle">…and so do the outer ones, which is why four of them may be added</text>
<text x="380.0" y="370" class="xs muted" text-anchor="middle">at the bind pose the two factors are inverses, so every skin is I — measured 4.768e-07</text>
</svg>
