<svg viewBox="0 0 900 400" role="img" aria-labelledby="l81f4-t l81f4-d">
  <title id="l81f4-t">Three integrators as update matrices with their determinants</title>
  <desc id="l81f4-d">Explicit Euler, semi-implicit Euler and backward Euler written as two update lines and a 2x2 matrix each, with determinants 1+h^2w^2, exactly 1, and 1/(1+h^2w^2) respectively.</desc>
  <defs>
    <marker id="e-i-l81f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l81f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l81f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l81f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l81f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="40" y="52" width="266" height="250" rx="3" fill="none" stroke="#eb6060" stroke-width="1.3"/>
<line x1="54.0" y1="78.0" x2="292.0" y2="78.0" stroke="#eb6060" stroke-width="2.2" fill="none"/>
<text x="173.0" y="72" class="sm" text-anchor="middle">explicit Euler</text>
<text x="173.0" y="104" class="sm mono" text-anchor="middle">vₙ₊₁ = vₙ − hω²·xₙ</text>
<text x="173.0" y="124" class="sm mono" text-anchor="middle">xₙ₊₁ = xₙ + h·vₙ</text>
<text x="173.0" y="166" class="sm mono" text-anchor="middle">⎡  1      h  ⎤</text>
<text x="173.0" y="186" class="sm mono" text-anchor="middle">⎣ −hω²   1  ⎦</text>
<text x="173.0" y="232" class="sm mono t-hi" text-anchor="middle">det = 1 + h²ω²</text>
<text x="173.0" y="262" class="sm t-bad" text-anchor="middle">&gt; 1 always. GROWS.</text>
<text x="173.0" y="286" class="xs muted" text-anchor="middle">the obvious order</text>
<rect x="328" y="52" width="266" height="250" rx="3" fill="none" stroke="#78dca0" stroke-width="1.3"/>
<line x1="342.0" y1="78.0" x2="580.0" y2="78.0" stroke="#78dca0" stroke-width="2.2" fill="none"/>
<text x="461.0" y="72" class="sm" text-anchor="middle">semi-implicit Euler</text>
<text x="461.0" y="104" class="sm mono" text-anchor="middle">vₙ₊₁ = vₙ − hω²·xₙ</text>
<text x="461.0" y="124" class="sm mono" text-anchor="middle">xₙ₊₁ = xₙ + h·vₙ₊₁</text>
<text x="461.0" y="166" class="sm mono" text-anchor="middle">⎡ 1−h²ω²   h ⎤</text>
<text x="461.0" y="186" class="sm mono" text-anchor="middle">⎣  −hω²    1 ⎦</text>
<text x="461.0" y="232" class="sm mono t-hi" text-anchor="middle">det = 1</text>
<text x="461.0" y="262" class="sm t-ok" text-anchor="middle">exactly. PRESERVES.</text>
<text x="461.0" y="286" class="xs muted" text-anchor="middle">one subscript apart</text>
<rect x="616" y="52" width="266" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<line x1="630.0" y1="78.0" x2="868.0" y2="78.0" stroke="#8f918a" stroke-width="2.2" fill="none"/>
<text x="749.0" y="72" class="sm" text-anchor="middle">backward Euler</text>
<text x="749.0" y="104" class="sm mono" text-anchor="middle">vₙ₊₁ = vₙ − hω²·xₙ₊₁</text>
<text x="749.0" y="124" class="sm mono" text-anchor="middle">xₙ₊₁ = xₙ + h·vₙ₊₁</text>
<text x="749.0" y="166" class="sm mono" text-anchor="middle">  1   ⎡  1      h  ⎤</text>
<text x="749.0" y="186" class="sm mono" text-anchor="middle">——— ⎣ −hω²   1  ⎦</text>
<text x="749.0" y="232" class="sm mono t-hi" text-anchor="middle">det = 1 / (1 + h²ω²)</text>
<text x="749.0" y="262" class="sm muted" text-anchor="middle">&lt; 1 always. SHRINKS.</text>
<text x="749.0" y="286" class="xs muted" text-anchor="middle">an implicit solve</text>
<text x="450.0" y="336" class="sm" text-anchor="middle">The ONLY difference between the first two is which velocity the position line uses — vₙ or vₙ₊₁.</text>
<text x="450.0" y="358" class="sm mono t-hi" text-anchor="middle">That one subscript moves the determinant from 1.010966229 to exactly 1.000000000 at h = 1/60.</text>
<text x="450.0" y="382" class="xs muted" text-anchor="middle">Backward Euler is the mirror image of the first and is why nobody ships it: costly to solve, and it bleeds energy.</text>
</svg>
