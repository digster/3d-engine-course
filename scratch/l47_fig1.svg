  <line x1="80.2" y1="46.0" x2="80.2" y2="286.0" class="hi" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="88.2" y="109.5" class="xs t-bad">70% of the whole range is spent in the first metre</text>
  <text x="80.2" y="300.0" class="xs muted" text-anchor="middle">1</text>
  <text x="118.0" y="300.0" class="xs muted" text-anchor="middle">10</text>
  <text x="286.0" y="300.0" class="xs muted" text-anchor="middle">50</text>
  <text x="496.0" y="300.0" class="xs muted" text-anchor="middle">100</text>
  <text x="286.0" y="314.0" class="xs muted" text-anchor="middle">distance from the eye, metres</text>
  <text x="518.0" y="76.0" class="sm">why</text>
  <text x="518.0" y="102.0" class="xs mono">z = (f/(f&#8722;n)) &#215; (1 &#8722; n/d)</text>
  <text x="518.0" y="120.0" class="xs mono t-hi">dz/dd = (f/(f&#8722;n)) &#215; n/d&#178;</text>
  <text x="518.0" y="138.0" class="xs "></text>
  <text x="518.0" y="156.0" class="xs ">resolution falls off as</text>
  <text x="518.0" y="174.0" class="xs t-hi">the SQUARE of distance</text>
  <rect x="24" y="324" width="672" height="76" class="fill-soft ink" stroke-width="0.75" rx="3"/>
  <text x="40" y="346" class="sm">so the smallest gap a buffer of N evenly spaced codes can resolve is</text>
  <text x="40" y="370" class="sm mono t-hi">&#916;d = (f &#8722; n) &#215; d&#178; / (f &#215; n &#215; N)</text>
  <text x="40" y="390" class="xs muted">which Figure 2 measures against, and finds agreeing to within a few per cent across two orders of magnitude</text>
</svg>
