  <text x="68.0" y="230.0" class="xs muted" text-anchor="end">0.25</text>
  <line x1="76.0" y1="166.0" x2="496.0" y2="166.0" class="grid" stroke-width="0.75"/>
  <text x="68.0" y="170.0" class="xs muted" text-anchor="end">0.5</text>
  <line x1="76.0" y1="106.0" x2="496.0" y2="106.0" class="grid" stroke-width="0.75"/>
  <text x="68.0" y="110.0" class="xs muted" text-anchor="end">0.75</text>
  <text x="68.0" y="290.0" class="xs muted" text-anchor="end">0  near</text>
  <text x="68.0" y="50.0" class="xs muted" text-anchor="end">1  far</text>
