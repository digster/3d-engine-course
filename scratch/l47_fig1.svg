<svg viewBox="0 0 720 414" role="img" aria-labelledby="f47a-t f47a-d">
  <title id="f47a-t">Where the depth range goes</title>
  <desc id="f47a-d">Depth-buffer z against distance from the eye, for a frustum with near 0.3 and far 100. The curve is not a line: 70% of the entire representable range is spent in the first metre, because the perspective divide puts 1/d into the depth value. Differentiating gives dz/dd proportional to n/d squared, so depth resolution falls off as the square of distance — which is why a buffer that separates millimetres up close cannot separate half a metre at ninety.</desc>
  <defs>
    <marker id="e-i-f47a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f47a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f47a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
  <text x="24" y="22" class="sm">z in the depth buffer against distance from the eye &#8212; near 0.3, far 100</text>
  <rect x="76.0" y="46.0" width="420.0" height="240.0" class="fill-soft ink" stroke-width="0.75"/>
