<svg viewBox="0 0 760 366" role="img" aria-labelledby="f73a-t f73a-d">
  <title id="f73a-t">The quarter turn and i squared</title>
  <desc id="f73a-d">Two panels showing the same three arrows on the unit circle. On the left they are labelled by coordinates: the point (1,0) in blue, turned a quarter circle anticlockwise to (0,1) in teal, and turned again to (-1,0) in amber, with both ninety-degree arcs marked. On the right the identical arrows are labelled 1, i and minus 1. A box underneath states the conclusion: turning a quarter circle twice is multiplication by minus one, so i squared equals minus one is a measurement of the plane rather than an axiom imposed on the algebra.</desc>
  <defs>
    <marker id="e-i-f73a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
