t-anchor="end">the short bar is a microfacet with this tilt;</text><text x="640" y="126" class="xs muted" text-anchor="end">it sends l straight into v</text><path class="arc" d="M 281.0,258.9 A 64.0,64.0 0 0 1 312.4,238.5" fill="none" stroke-width="1.4"/><path class="arc" d="M 308.5,225.0 A 78.0,78.0 0 0 1 354.1,225.8" fill="none" stroke-width="1.4"/><text x="256.3" y="229.6" class="sm muted">34&#176;</text><text x="247.8" y="196.0" class="sm muted">34&#176;</text><text x="70" y="46" class="sm" font-weight="700">h = normalise(l + v) bisects them &#8212; and that is exactly what makes it the needed normal.</text><text x="70" y="66" class="xs muted">Here l is 50&#176; from n and v is 18&#176; the other way, so h sits 16&#176; from n. dot(n,h) = 0.9613.</text>
</svg>
