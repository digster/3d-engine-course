<svg viewBox="0 0 660 360" role="img" aria-labelledby="f2-t f2-d">
  <title id="f2-t">The halfway vector bisects the light and eye directions</title>
  <desc id="f2-d">The same horizontal surface and upward normal. An arrow l points up-left at 50 degrees from the normal and an arrow v points up-right at 18 degrees. Between them, an arrow h sits at 16 degrees to the left of the normal, exactly bisecting them: 34 degrees from l and 34 degrees from v. A short thick bar drawn perpendicular to h represents a microfacet whose tilt would reflect the light straight into the eye.</desc>
  <defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--axis-y)"/></marker>
    <marker id="a-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn-bd)"/></marker>
    <marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--note-bd)"/></marker>
    <marker id="a-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--pitfall-bd)"/></marker>
    <marker id="a-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok-bd)"/></marker>
  </defs>
<line class="surf" x1="60.0" y1="300.0" x2="600.0" y2="300.0" stroke-width="2.5"/><line class="hatch" x1="75.0" y1="300.0" x2="66.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="89.0" y1="300.0" x2="80.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="103.0" y1="300.0" x2="94.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="117.0" y1="300.0" x2="108.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="131.0" y1="300.0" x2="122.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="145.0" y1="300.0" x2="136.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="159.0" y1="300.0" x2="150.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="173.0" y1="300.0" x2="164.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="187.0" y1="300.0" x2="178.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="201.0" y1="300.0" x2="192.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="215.0" y1="300.0" x2="206.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="229.0" y1="300.0" x2="220.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="243.0" y1="300.0" x2="234.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="257.0" y1="300.0" x2="248.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="271.0" y1="300.0" x2="262.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="285.0" y1="300.0" x2="276.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="299.0" y1="300.0" x2="290.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="313.0" y1="300.0" x2="304.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="327.0" y1="300.0" x2="318.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="341.0" y1="300.0" x2="332.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="355.0" y1="300.0" x2="346.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="369.0" y1="300.0" x2="360.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="383.0" y1="300.0" x2="374.0" y2="309.0" stroke-width="1"/><line class="hatch" x1="397.0" y1="30