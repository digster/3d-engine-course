<svg viewBox="0 0 980 336" role="img" aria-labelledby="f3-t f3-d">
  <title id="f3-t">The tangent basis flips between frames, and the cached friction goes sideways</title>
  <desc id="f3-d">Left: two consecutive frames of a near-vertical contact. The normal barely moves, but the comparison between two components of order 1e-05 flips, so the tangent basis rotates by ninety degrees. Right: the measurement — 113 of 11830 manifold-frames rotate by more than thirty degrees, worst case 134.6, and storing the basis takes the tower's sideways drift from 380 mm to 155.</desc>
  <defs>
    <marker id="e-i-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-amber-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0961e"/></marker></defs>
<defs><marker id="e-red-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-blue-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<text x="26" y="36" class="sm" text-anchor="start">tangent_basis picks its seed from the normal's SMALLEST component</text>
<text x="136" y="70" class="xs mono" text-anchor="middle">frame n</text>
<rect x="46" y="96" width="180" height="130" rx="3" fill="none" stroke="#8f918a" stroke-width="1.0"/>
<line x1="136.00" y1="206.00" x2="136.00" y2="118.00" stroke="#5082e6" stroke-width="1.8" marker-end="url(#e-blue-f3)"/>
<text x="150" y="136" class="xs mono" text-anchor="start">n</text>
<text x="136" y="222" class="xs mono" text-anchor="middle">|n.x| 1.2e-05   |n.z| 3.0e-05</text>
<line x1="136.00" y1="166.00" x2="192.00" y2="166.00" stroke="#f0961e" stroke-width="1.7" marker-end="url(#e-amber-f3)"/>
<text x="202" y="170" class="xs mono" text-anchor="middle">t1</text>
<line x1="136.00" y1="166.00" x2="136.00" y2="206.00" stroke="#f0961e" stroke-width="1.7" marker-end="url(#e-amber-f3)"/>
<text x="136" y="198" class="xs mono" text-anchor="middle">t2</text>
<text x="386" y="70" class="xs mono" text-anchor="middle">frame n+1</text>
<rect x="296" y="96" width="180" height="130" rx="3" fill="none" stroke="#8f918a" stroke-width="1.0"/>
<line x1="386.00" y1="206.00" x2="386.00" y2="118.00" stroke="#5082e6" stroke-width="1.8" marker-end="url(#e-blue-f3)"/>
<text x="400" y="136" class="xs mono" text-anchor="start">n</text>
<text x="386" y="222" class="xs mono" text-anchor="middle">|n.x| 3.1e-05   |n.z| 9.0e-06</text>
<line x1="386.00" y1="166.00" x2="386.00" y2="126.00" stroke="#f0961e" stroke-width="1.7" marker-end="url(#e-amber-f3)"/>
<text x="386" y="118" class="xs mono" text-anchor="middle">t1</text>
<line x1="386.00" y1="166.00" x2="442.00" y2="166.00" stroke="#f0961e" stroke-width="1.7" marker-end="url(#e-amber-f3)"/>
<text x="452" y="170" class="xs mono" text-anchor="middle">t2</text>
<line x1="236.00" y1="160.00" x2="286.00" y2="160.00" stroke="#e05c5c" stroke-width="1.8" marker-end="url(#e-red-f3)"/>
<text x="261" y="148" class="xs mono" text-anchor="middle">90°</text>
<text x="46" y="268" class="xs muted" text-anchor="start">Two numbers around 1e-05 decide which axis seeds the cross product, and</text>
<text x="46" y="284" class="xs muted" text-anchor="start">they cross constantly. The basis is not stored with the impulses, so last</text>
<text x="46" y="300" class="xs muted" text-anchor="start">frame's friction is applied in this frame's directions — sideways.</text>
<text x="590" y="54" class="xs muted" text-anchor="start">Measured</text>
<text x="590" y="74" class="xs muted" text-anchor="start">ten-crate tower, 20 s</text>
<text x="928" y="74" class="xs muted" text-anchor="end">value</text>
<line x1="590" y1="82.0" x2="934" y2="82.0" class="grid" stroke-width="1.0"/>
<text x="590" y="99.0" class="xs" text-anchor="start">manifold-frames sampled</text>
<text x="928" y="99.0" class="xs mono" text-anchor="end">11,830</text>
<text x="590" y="116.0" class="xs" text-anchor="start">…whose basis rotated &gt; 30°</text>
<text x="928" y="116.0" class="xs mono" text-anchor="end">113 (0.96%)</text>
<text x="590" y="133.0" class="xs" text-anchor="start">worst rotation</text>
<text x="928" y="133.0" class="xs mono" text-anchor="end">134.6°</text>
<text x="590" y="150.0" class="xs" text-anchor="start">sideways drift, basis stored</text>
<text x="928" y="150.0" class="xs mono" text-anchor="end">155 mm</text>
<text x="590" y="167.0" class="xs" text-anchor="start">sideways drift, pre-8.10</text>
<text x="928" y="167.0" class="xs mono" text-anchor="end">380 mm</text>
<text x="590" y="234" class="xs" text-anchor="start">The fix is two dot products and it is exact:</text>
<text x="590" y="252" class="xs muted" text-anchor="start">rebuild the impulse in the frame it was measured</text>
<text x="590" y="268" class="xs muted" text-anchor="start">in, then re-measure it in this one.</text>
<text x="590" y="294" class="xs" text-anchor="start">A CACHED NUMBER IS MEANINGLESS WITHOUT THE</text>
<text x="590" y="310" class="xs" text-anchor="start">FRAME IT WAS MEASURED IN.</text>
</svg>
