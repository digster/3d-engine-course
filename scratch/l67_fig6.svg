  <title id="l67f6-t">The torus rendered flat and normal-mapped, side by side</title>
  <desc id="l67f6-d">Two dark framebuffers each containing an amber torus seen at a shallow angle. The left is smooth with a single broad highlight; the right carries a grid of dimples around the ring. The geometry is identical in both — 2,304 triangles — and only the shading normal differs.</desc>
