<svg viewBox="0 0 720 392" role="img" aria-labelledby="l66f2-t l66f2-d">
  <title id="l66f2-t">The accessor chain and the combinatorial matrix behind it</title>
  <desc id="l66f2-d">Three linked boxes: accessor 0 (VEC3 of FLOAT, count 8) points at bufferView 0 (offset 0, length 96 bytes), which points at buffer 0 (the external file cube.bin, 328 bytes). Below, four independent axes of variation — component type, normalized, packing and sparseness — multiplying out to forty legal encodings of the same eight positions.</desc>
  <defs>
    <marker id="e-i-l66f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l66f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l66f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l66f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l66f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
