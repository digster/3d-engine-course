<text x="252.7" y="147.5" class="sm mono" text-anchor="start">z</text>
<text x="221.6" y="59.5" class="sm mono t-hi" text-anchor="middle">i·z</text>
<text x="196" y="332" class="xs muted" text-anchor="middle">the teal arrow is the blue one, turned a quarter circle</text>
<text x="196" y="350" class="xs t-hi" text-anchor="middle">and a quarter circle is × i</text>
<rect x="406" y="56" width="322" height="248" rx="3" fill="none" stroke="#8f918a" stroke-width="1.0"/>
<text x="567.0" y="80" class="sm" text-anchor="middle">why the exponential turns up</text>
<text x="567.0" y="106" class="xs muted" text-anchor="middle">go round the unit circle at unit speed</text>
<text x="567.0" y="125" class="xs muted" text-anchor="middle">the velocity is perpendicular to</text>
<text x="567.0" y="144" class="xs muted" text-anchor="middle">the position, and always unit length</text>
<text x="567.0" y="163" class="xs muted" text-anchor="middle">perpendicular, in this algebra, is × i</text>
<text x="567.0" y="201" class="xs mono t-hi" text-anchor="middle">z′(θ) = i · z(θ),    z(0) = 1</text>
<text x="567.0" y="239" class="xs muted" text-anchor="middle">the only function whose derivative is</text>
<text x="567.0" y="258" class="xs muted" text-anchor="middle">itself times a constant is exp</text>
<text x="567.0" y="296" class="xs mono t-hi" text-anchor="middle">z(θ) = exp(iθ) = cos θ + i sin θ</text>
<text x="567.0" y="332" class="xs muted" text-anchor="middle">nothing here is a definition to be swallowed —</text>
<text x="567.0" y="350" class="xs muted" text-anchor="middle">the equation is the picture, written down</text>
</svg>
