<svg viewBox="0 0 760 378" role="img" aria-labelledby="f73d-t f73d-d">
  <title id="f73d-t">Euler's formula from the velocity of a circling point</title>
  <desc id="f73d-d">The unit circle with three positions marked. At each, a blue arrow runs from the origin to the point and a teal arrow leaves the point at right angles to it, in the direction of travel. The teal arrow is the blue one turned a quarter circle, which in this algebra is multiplication by i. A panel beside the picture turns that into the differential equation z prime of theta equals i times z of theta with z of zero equal to one, whose solution is exp of i theta, which is cosine theta plus i sine theta.</desc>
  <defs>
    <marker id="e-i-f73d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f73d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f73d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f73d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f73d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-blue-f73d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<defs><marker id="e-teal-f73d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60ded0"/></marker></defs>
<text x="196" y="28" class="sm" text-anchor="middle">a point going round at unit speed</text>
<text x="196" y="45" class="xs muted" text-anchor="middle">blue is where it is, teal is where it is going</text>
