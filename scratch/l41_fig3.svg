<svg viewBox="0 0 640 328" role="img" aria-labelledby="f413-t f413-d">
  <title id="f413-t">Divergence in a warp, and the measured cost of it</title>
  <desc id="f413-d">The top shows one warp of 32 lanes running an if-else. Both the A row and the B row execute across all 32 lanes, with the lanes that do not take that side drawn pale to mean masked off. Beneath, a chart of measured cost against coherence: the penalty is 1.00 times when runs are 1024 pixels long, 1.03 at 64, and steps up to 1.93 at 8 pixels and below. A dashed line marks the warp width of 32, exactly where the step happens.</desc>
