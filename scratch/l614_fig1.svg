<svg viewBox="0 0 720 400" role="img" aria-labelledby="f614a-t f614a-d">
  <title id="f614a-t">Geometric aliasing against shading aliasing</title>
  <desc id="f614a-d">Left: a staircase of filled cells approximating a straight edge. Right: a shiny sphere with a narrow specular lobe falling between the pixel's sample points.</desc>
