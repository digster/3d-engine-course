<text x="472" y="226" class="xs" text-anchor="middle">the lobe is NARROWER than the spacing</text>
<text x="472" y="242" class="xs" text-anchor="middle">of the samples hunting for it, so it lands</text>
<text x="472" y="258" class="xs" text-anchor="middle">BETWEEN them and the pixel reports nothing</text>
<rect x="60" y="300" width="600" height="54" rx="4" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<text x="360" y="320" class="xs" text-anchor="middle">MSAA multisamples COVERAGE and shades ONCE per primitive per pixel. That asymmetry is what makes it</text>
<text x="360" y="338" class="xs" text-anchor="middle">cost ~1.3x instead of 4x — and it is exactly why it fixes the left-hand problem and not the right-hand one.</text>
<text x="360.0" y="392" class="xs" text-anchor="middle">You cannot buy shading samples with a coverage feature.</text>
