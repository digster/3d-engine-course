<text x="24" y="306" class="xs t-ok" text-anchor="start">READ THE LEFT HALF FIRST.</text>
<text x="178" y="306" class="xs" text-anchor="start">Up to a thousand objects every layout is within 13% of every other, except</text>
<text x="24" y="322" class="xs" text-anchor="start">the virtual call. THE KNEE IS BETWEEN 1,000 AND 10,000 — which is where 96 bytes an object stops fitting in L2.</text>
<text x="24" y="340" class="xs t-hi" text-anchor="start">Our scene is FOUR objects. On this data, nothing in this lesson justifies changing it.</text>
