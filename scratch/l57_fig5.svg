<svg viewBox="0 0 720 340" role="img" aria-labelledby="l57f5-t l57f5-d">
  <title id="l57f5-t">Cost of one structural change in each design, at two entity widths</title>
  <desc id="l57f5-d">A bar chart of nanoseconds per add or remove at 100,000 entities. The archetype costs 13.1 ns for a four-component entity and 58.5 ns for a twelve-component one. The sparse set costs 4.25 and 4.23 ns respectively — flat in entity width.</desc>
  <defs>
    <marker id="e-i-l57f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l57f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l57f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l57f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l57f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Nanoseconds per structural change, at 100,000 entities. The axis that matters is entity WIDTH.</text>
<rect x="150" y="52" width="430" height="168" rx="3" class="fill-soft grid" stroke-width="1.2" stroke-dasharray="2 4"/>
<line x1="150" y1="220.0" x2="580" y2="220.0" class="grid" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="142" y="224.0" class="xs muted" text-anchor="end">0</text>
<line x1="150" y1="178.0" x2="580" y2="178.0" class="grid" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="142" y="182.0" class="xs muted" text-anchor="end">16</text>
<line x1="150" y1="136.0" x2="580" y2="136.0" class="grid" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="142" y="140.0" class="xs muted" text-anchor="end">32</text>
<line x1="150" y1="94.0" x2="580" y2="94.0" class="grid" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="142" y="98.0" class="xs muted" text-anchor="end">48</text>
<line x1="150" y1="52.0" x2="580" y2="52.0" class="grid" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="142" y="56.0" class="xs muted" text-anchor="end">64</text>
<text x="142" y="46" class="xs muted" text-anchor="end">ns / op</text>
<rect x="184" y="185.6125" width="56" height="34.387499999999996" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.3"/>
<text x="212.0" y="179.6125" class="xs t-hi" text-anchor="middle">13.1</text>
<text x="212.0" y="236" class="xs muted" text-anchor="middle">4 components</text>
<rect x="284" y="66.49000000000001" width="56" height="153.51" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.3"/>
<text x="312.0" y="60.49000000000001" class="xs t-hi" text-anchor="middle">58.5</text>
<text x="312.0" y="236" class="xs muted" text-anchor="middle">12 components</text>
<rect x="384" y="208.84375" width="56" height="11.15625" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.3"/>
<text x="412.0" y="202.84375" class="xs t-hi" text-anchor="middle">4.2</text>
<text x="412.0" y="236" class="xs muted" text-anchor="middle">4 components</text>
<rect x="484" y="208.89625" width="56" height="11.103750000000002" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.3"/>
<text x="512.0" y="202.89625" class="xs t-hi" text-anchor="middle">4.2</text>
<text x="512.0" y="236" class="xs muted" text-anchor="middle">12 components</text>
<text x="234" y="252" class="xs" text-anchor="middle">archetype</text>
<text x="434" y="252" class="xs" text-anchor="middle">sparse set</text>
<line x1="248" y1="187.6125" x2="302" y2="61.49000000000001" stroke="#e05c5c" stroke-width="1.6" marker-end="url(#e-b-l57f5)"/>
<text x="354" y="82" class="xs" style="fill:#e05c5c" text-anchor="start">4.5&#215;, for eight components</text>
<text x="354" y="96" class="xs" style="fill:#e05c5c" text-anchor="start">no query ever reads</text>
<line x1="412" y1="192.84375" x2="512" y2="192.84375" stroke="#5ac878" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="462" y="187.84375" class="xs" style="fill:#5ac878" text-anchor="middle">did not move</text>
<line x1="24" y1="268" x2="696" y2="268" class="grid" stroke-width="1.2"/>
<text x="24" y="288" class="xs t-hi" text-anchor="start">The archetype's cost is the entity's TOTAL WIDTH; the sparse set's is one pool, whatever else the entity has.</text>
<text x="24" y="306" class="xs" text-anchor="start">A real entity carries ten to thirty components. Four is the number that flatters the archetype, and this course will not</text>
<text x="24" y="322" class="xs" text-anchor="start">stay at four past Module 8.</text>
</svg>
