<svg viewBox="0 0 720 396" role="img" aria-labelledby="f616e-t f616e-d">
  <title id="f616e-t">The false-positive corner case and its measured rate</title>
  <desc id="f616e-d">Left: a frustum with its left and far planes extended as dashed rays past the frustum itself, and a box placed up and to the left. The box's top-right corner is inside the left plane's half-space and its bottom-left corner is inside the far plane's, so two different corners satisfy two different planes and no single test rejects it - yet the box never enters the region where all six hold at once. Right: over two hundred thousand random boxes, 316 such false positives, 0.69 per cent of those kept, and zero false rejections.</desc>
  <defs>
    <marker id="e-i-f616e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f616e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f616e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f616e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f616e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="360.0" y="22" class="sm" text-anchor="middle">A box can fail to be rejected while being entirely outside — and the effect has a measured size</text>
<line x1="206.0" y1="268.0" x2="101.8" y2="34.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="4 4"/>
<line x1="30.0" y1="100.0" x2="131.2" y2="100.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="4 4"/>
<line x1="206.0" y1="268.0" x2="131.2" y2="100.0" stroke="#5082e6" stroke-width="1.6" fill="none"/>
<line x1="206.0" y1="268.0" x2="280.8" y2="100.0" stroke="#5082e6" stroke-width="1.6" fill="none"/>
<line x1="131.2" y1="100.0" x2="280.8" y2="100.0" stroke="#5082e6" stroke-width="1.6" fill="none"/>
<circle cx="206.0" cy="268.0" r="3.6" fill="#e05c5c"/>
<text x="206.0" y="286.0" class="xs" text-anchor="middle">eye</text>
<text x="206.0" y="126.0" class="xs" text-anchor="middle">the frustum</text>
<text x="284.79841913183407" y="90.0" class="xs" text-anchor="start">far plane</text>
<rect x="40.0" y="50.0" width="88.0" height="70.0" rx="3" fill="none" stroke="#f0961e" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="128.0" cy="50.0" r="4.4" fill="#5ac878"/>
<circle cx="40.0" cy="120.0" r="4.4" fill="#9b7ede"/>
<text x="138.0" y="46.0" class="xs" text-anchor="start">inside the LEFT plane</text>
<text x="34.0" y="140.0" class="xs" text-anchor="start">inside the FAR plane</text>
<text x="84.0" y="164.0" class="xs" text-anchor="middle">…and outside the frustum</text>
<text x="50" y="298.0" class="xs" text-anchor="start">dashed = a plane, extended past the frustum</text>
<text x="176.0" y="320.0" class="xs" text-anchor="middle">Two DIFFERENT corners satisfy two different planes,</text>
<text x="176.0" y="336.0" class="xs" text-anchor="middle">and every plane is satisfied by some corner — so no</text>
<text x="176.0" y="352.0" class="xs" text-anchor="middle">single half-space test can reject the box, even</text>
<text x="176.0" y="368.0" class="xs" text-anchor="middle">though their intersection never contains any of it.</text>
<text x="578" y="54" class="xs" text-anchor="middle">MEASURED (verify_616 §E)</text>
<text x="504" y="88" class="xs" text-anchor="end">200,000</text>
<text x="516" y="88" class="xs" text-anchor="start">boxes tested</text>
<text x="504" y="118" class="xs" text-anchor="end">45,512</text>
<text x="516" y="118" class="xs" text-anchor="start">kept by the six tests</text>
<text x="504" y="148" class="xs" text-anchor="end">45,196</text>
<text x="516" y="148" class="xs" text-anchor="start">genuinely intersect</text>
<text x="504" y="178" class="xs" text-anchor="end">316</text>
<text x="516" y="178" class="xs" text-anchor="start">kept but invisible — 0.69%</text>
<line x1="446.0" y1="186.0" x2="700.0" y2="186.0" stroke="#f0961e" stroke-width="0.9" fill="none" stroke-dasharray="3 3"/>
<text x="504" y="208" class="xs" text-anchor="end">0</text>
<text x="516" y="208" class="xs" text-anchor="start">VISIBLE boxes rejected</text>
<line x1="446.0" y1="216.0" x2="700.0" y2="216.0" stroke="#5ac878" stroke-width="0.9" fill="none" stroke-dasharray="3 3"/>
<rect x="440" y="246" width="260" height="96" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="570" y="266" class="xs" text-anchor="middle">THE ASYMMETRY IS THE LICENCE.</text>
<text x="570" y="286" class="xs" text-anchor="middle">Keeping something invisible costs</text>
<text x="570" y="304" class="xs" text-anchor="middle">a draw call. Rejecting something</text>
<text x="570" y="322" class="xs" text-anchor="middle">visible is a hole in the picture.</text>
</svg>
