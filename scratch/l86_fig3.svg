<svg viewBox="0 0 900 440" role="img" aria-labelledby="l86f3-t l86f3-d">
  <title id="l86f3-t">EPA's two bounds squeezing the penetration depth from both sides, the mirror image of GJK's.</title>
  <desc id="l86f3-d">Three snapshots of the same Minkowski difference in grey with an amber polygon growing inside it over successive expansions. In each, the closest edge is green, a purple arrow runs from the origin to it, and a dashed grey supporting line marks the upper bound. The lower bound rises and the upper bound falls until they meet.</desc>
