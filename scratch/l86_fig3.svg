<text x="48" y="380" class="xs" text-anchor="start">the inner polytope: every vertex is a real point of A ⊖ B</text>
<line x1="20.0" y1="393.0" x2="40.0" y2="393.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="48" y="397" class="xs" text-anchor="start">its closest edge — a LOWER bound, because the polytope fits inside</text>
<line x1="20.0" y1="410.0" x2="40.0" y2="410.0" stroke="#8f918a" stroke-width="2.4" fill="none"/>
<text x="48" y="414" class="xs" text-anchor="start">the supporting line through the support point — an UPPER bound</text>
<text x="560" y="380" class="xs" text-anchor="start">They meet at 0.951057 m, which is the number figure 2</text>
<text x="560" y="397" class="xs" text-anchor="start">measured by brute force. Note the direction of travel:</text>
<text x="560" y="414" class="xs t-hi" text-anchor="start">GJK's bound only ever FELL. This one only ever RISES.</text>
