<circle cx="509.1" cy="272.0" r="3.4" fill="none" stroke="#5082e6" stroke-width="1.6"/>
<circle cx="533.9" cy="272.0" r="3.4" fill="none" stroke="#5082e6" stroke-width="1.6"/>
<path d="M 118.99,66.00 L 217.32,110.44 L 276.73,140.08 L 333.94,178.79 L 423.59,247.73 L 509.13,272.00 L 533.89,272.00" fill="none" stroke="#e05c5c" stroke-width="1.9"/>
<circle cx="119.0" cy="66.0" r="3.2" fill="#e05c5c"/>
<circle cx="217.3" cy="110.4" r="3.2" fill="#e05c5c"/>
<circle cx="276.7" cy="140.1" r="3.2" fill="#e05c5c"/>
<circle cx="333.9" cy="178.8" r="3.2" fill="#e05c5c"/>
<circle cx="423.6" cy="247.7" r="3.2" fill="#e05c5c"/>
<circle cx="509.1" cy="272.0" r="3.4" fill="none" stroke="#e05c5c" stroke-width="1.6"/>
<circle cx="533.9" cy="272.0" r="3.4" fill="none" stroke="#e05c5c" stroke-width="1.6"/>
<circle cx="119.0" cy="66.0" r="7" fill="none" stroke="#e05c5c" stroke-width="1.8"/>
<text x="132.98521161962086" y="100.0" class="xs t-bad" text-anchor="start">returns 0</text>
<line x1="572.0" y1="78.0" x2="592.0" y2="78.0" stroke="#5082e6" stroke-width="1.9" fill="none"/>
<text x="572.0" y="94.0" class="mono xs" text-anchor="start">atan2(|R−Rᵀ|/2,</text>
<text x="572.0" y="107.0" class="mono xs" text-anchor="start">  (tr R − 1)/2)</text>
<text x="572.0" y="123.0" class="xs t-ok" text-anchor="start">what we ship</text>
<line x1="572.0" y1="152.0" x2="592.0" y2="152.0" stroke="#e05c5c" stroke-width="1.9" fill="none"/>
<text x="572.0" y="168.0" class="mono xs" text-anchor="start">acos((tr R − 1)/2)</text>
<text x="572.0" y="182.0" class="xs muted" text-anchor="start">every textbook</text>
<text x="572.0" y="198.0" class="xs t-bad" text-anchor="start">100% wrong at</text>
<text x="572.0" y="212.0" class="mono xs t-bad" text-anchor="start">0.004°</text>
<circle cx="582.0" cy="238.0" r="3.4" fill="none" stroke="#8f918a" stroke-width="1.6"/>
<text x="572.0" y="256.0" class="xs muted" text-anchor="start">hollow: measured</text>
<text x="572.0" y="270.0" class="xs muted" text-anchor="start">as exactly zero</text>
<text x="390.0" y="310.0" class="xs muted" text-anchor="middle">the angle actually turned</text>
<text x="390.0" y="326" class="xs" text-anchor="middle">a 2,048-step path across 120° takes 0.059° steps, so the red curve is measuring nothing there</text>
<text x="390.0" y="344" class="xs muted" text-anchor="middle">the two formulas are algebraically identical, and one of them cannot do the job</text>
</svg>
