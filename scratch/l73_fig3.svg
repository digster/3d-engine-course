<svg viewBox="0 0 760 362" role="img" aria-labelledby="f73c-t f73c-d">
  <title id="f73c-t">A rotation matrix stores cosine and sine twice</title>
  <desc id="f73c-d">A memory-layout diagram. The top row shows a two-by-two matrix holding a rotation as four floats: cosine theta, sine theta, minus sine theta, cosine theta. Brackets above link the first two to the last two, showing that the second pair is the first pair again with one sign flipped. The bottom row shows a complex number holding the same rotation in two floats. A table compares the two on storage, composition cost, application cost, drift, renormalisation and interpolation; the complex number wins every row except application, where the two are identical.</desc>
  <defs>
    <marker id="e-i-f73c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f73c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f73c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f73c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f73c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="164" y="24" class="xs t-hi" text-anchor="middle">the same two numbers, stored twice</text>
<text x="164.0" y="60" class="sm" text-anchor="middle">mat2, holding a rotation</text>
<text x="164.0" y="75" class="xs muted" text-anchor="middle">four floats, two of them redundant</text>
<rect x="34" y="104" width="61" height="38" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.24"/>
<text x="64.5" y="128" class="sm mono" text-anchor="middle">cos θ</text>
<text x="64.5" y="156" class="xs mono muted" text-anchor="middle">c0.x</text>
<rect x="100" y="104" width="61" height="38" rx="3" fill="#60ded0" stroke="#60ded0" stroke-width="1.2" fill-opacity="0.24"/>
<text x="130.5" y="128" class="sm mono" text-anchor="middle">sin θ</text>
<text x="130.5" y="156" class="xs mono muted" text-anchor="middle">c0.y</text>
<rect x="166" y="104" width="61" height="38" rx="3" fill="#60ded0" stroke="#60ded0" stroke-width="1.2" fill-opacity="0.24"/>
<text x="196.5" y="128" class="sm mono" text-anchor="middle">−sin θ</text>
<text x="196.5" y="156" class="xs mono muted" text-anchor="middle">c1.x</text>
<rect x="232" y="104" width="61" height="38" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.24"/>
<text x="262.5" y="128" class="sm mono" text-anchor="middle">cos θ</text>
<text x="262.5" y="156" class="xs mono muted" text-anchor="middle">c1.y</text>
<text x="164" y="200" class="sm" text-anchor="middle">complex, holding the same rotation</text>
<text x="164" y="215" class="xs muted" text-anchor="middle">two floats, and nothing else</text>
<rect x="34" y="244" width="61" height="38" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.24"/>
<text x="64.5" y="268" class="sm mono" text-anchor="middle">cos θ</text>
<text x="64.5" y="296" class="xs mono muted" text-anchor="middle">re</text>
<rect x="100" y="244" width="61" height="38" rx="3" fill="#60ded0" stroke="#60ded0" stroke-width="1.2" fill-opacity="0.24"/>
<text x="130.5" y="268" class="sm mono" text-anchor="middle">sin θ</text>
<text x="130.5" y="296" class="xs mono muted" text-anchor="middle">im</text>
<path d="M 64.50,100.00 L 64.50,90.00 L 262.50,90.00 L 262.50,100.00" fill="none" stroke="#f0961e" stroke-width="1.3"/>
<path d="M 130.50,100.00 L 130.50,80.00 L 196.50,80.00 L 196.50,100.00" fill="none" stroke="#60ded0" stroke-width="1.3"/>
<rect x="356" y="76" width="372" height="214" rx="3" fill="none" stroke="#8f918a" stroke-width="1.0"/>
<text x="542.0" y="100" class="sm" text-anchor="middle">what the two extra floats buy</text>
<text x="600" y="126" class="xs mono muted" text-anchor="end">mat2</text>
<text x="712" y="126" class="xs mono t-hi" text-anchor="end">complex</text>
<text x="372" y="150" class="xs muted" text-anchor="start">storage</text>
<text x="600" y="150" class="xs mono" text-anchor="end">16 bytes</text>
<text x="712" y="150" class="xs mono t-hi" text-anchor="end">8 bytes</text>
<text x="372" y="172" class="xs muted" text-anchor="start">compose two</text>
<text x="600" y="172" class="xs mono" text-anchor="end">1.139 ns</text>
<text x="712" y="172" class="xs mono t-hi" text-anchor="end">0.605 ns</text>
<text x="372" y="194" class="xs muted" text-anchor="start">apply to a point</text>
<text x="600" y="194" class="xs mono" text-anchor="end">0.637 ns</text>
<text x="712" y="194" class="xs mono t-hi" text-anchor="end">0.610 ns</text>
<text x="372" y="216" class="xs muted" text-anchor="start">drift, 10⁶ products</text>
<text x="600" y="216" class="xs mono" text-anchor="end">2.42e−5</text>
<text x="712" y="216" class="xs mono t-hi" text-anchor="end">3.93e−6</text>
<text x="372" y="238" class="xs muted" text-anchor="start">renormalise</text>
<text x="600" y="238" class="xs mono" text-anchor="end">Gram–Schmidt</text>
<text x="712" y="238" class="xs mono t-hi" text-anchor="end">one divide</text>
<text x="372" y="260" class="xs muted" text-anchor="start">interpolate</text>
<text x="600" y="260" class="xs mono" text-anchor="end">not a rotation</text>
<text x="712" y="260" class="xs mono t-hi" text-anchor="end">on the arc</text>
<text x="380.0" y="320" class="xs muted" text-anchor="middle">applying is the one row where nothing is saved: both are four multiplies and two adds, and they are</text>
<text x="380.0" y="338" class="xs muted" text-anchor="middle">the SAME four multiplies. The savings are in keeping a rotation and combining two, not in using one.</text>
</svg>
