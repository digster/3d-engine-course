<text x="187.66666666666666" y="288" class="xs mono" text-anchor="middle">1 / 48000 s = 20.83 us</text>
<text x="246.0" y="308" class="xs muted" text-anchor="middle">the samples ARE the sound. There is nothing else in the file.</text>
<text x="516" y="36" class="xs muted" text-anchor="start">the arithmetic, once</text>
<text x="516" y="56" class="xs muted" text-anchor="start"></text>
<text x="868" y="56" class="xs muted" text-anchor="end"></text>
<line x1="516" y1="64.0" x2="874" y2="64.0" class="grid" stroke-width="1.0"/>
<text x="516" y="81.0" class="xs" text-anchor="start">1 frame</text>
<text x="868" y="81.0" class="xs mono" text-anchor="end">1 sample per channel</text>
<text x="516" y="98.0" class="xs" text-anchor="start">48,000</text>
<text x="868" y="98.0" class="xs mono" text-anchor="end">frames per second</text>
<text x="516" y="115.0" class="xs" text-anchor="start">2</text>
<text x="868" y="115.0" class="xs mono" text-anchor="end">channels, interleaved: L R L R</text>
<text x="516" y="132.0" class="xs" text-anchor="start">4 bytes</text>
<text x="868" y="132.0" class="xs mono" text-anchor="end">one float sample</text>
<text x="516" y="149.0" class="xs" text-anchor="start">384 KB</text>
<text x="868" y="149.0" class="xs mono" text-anchor="end">one second of stereo</text>
<text x="516" y="166.0" class="xs" text-anchor="start">22 MB</text>
<text x="868" y="166.0" class="xs mono" text-anchor="end">one minute of music</text>
<line x1="516" y1="184.5" x2="874" y2="184.5" class="grid" stroke-width="1.0"/>
<text x="516" y="206.5" class="xs" text-anchor="start">A device consumes frames on a clock it owns.</text>
<text x="516" y="224.5" class="xs muted" text-anchor="start">Nothing you do changes the rate; you can only</text>
<text x="516" y="240.5" class="xs muted" text-anchor="start">be ready or be late.</text>
