<svg viewBox="0 0 760 372" role="img" aria-labelledby="f77d-t f77d-d">
  <title id="f77d-t">Where nlerp is free and where it is not</title>
  <desc id="f77d-d">The nlerp-slerp lag plotted against the rotation between two orientations on log axes, with a clip's adjacent keyframes clustered far below the half-degree threshold and a cross-fade's arcs above it.</desc>
  <defs>
    <marker id="e-i-f77d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f77d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f77d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f77d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f77d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="380.0" y="30" class="sm" text-anchor="middle">nlerp is fine inside a clip and not fine between two</text>
<text x="380.0" y="47" class="xs muted" text-anchor="middle">rotation degrees throughout — the sphere arc a quaternion walks is half of each number</text>
