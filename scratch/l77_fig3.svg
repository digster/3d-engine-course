<text x="380.0" y="290.0" class="xs muted" text-anchor="middle">rotation between two keys, or between two poses</text>
<text x="68.0" y="94.0" class="xs mono" text-anchor="end">1e+0</text>
<text x="68.0" y="232.0" class="xs mono" text-anchor="end">1e−5</text>
<text x="68.0" y="74.0" class="xs muted" text-anchor="end">nlerp lag</text>
<rect x="76.0" y="300.0" width="12" height="9" rx="2" fill="#60c4ce" stroke="#60c4ce" stroke-width="0.8"/>
<text x="94.0" y="310.0" class="xs muted" text-anchor="start">adjacent keys of a 30 Hz clip, at four limb speeds</text>
<rect x="76.0" y="318.0" width="12" height="9" rx="2" fill="#ec7a8c" stroke="#ec7a8c" stroke-width="0.8"/>
<text x="94.0" y="328.0" class="xs muted" text-anchor="start">arcs a cross-fade between two poses can reach</text>
<text x="380.0" y="354.0" class="xs muted" text-anchor="middle">a limb turning at 720°/s moves 24° between keys and nlerp lags it by 0.0169° — three orders inside the threshold.</text>
