<svg viewBox="0 0 660 244" role="img" aria-labelledby="g2-t g2-d">
  <title id="g2-t">Where the shading equation is evaluated, on one triangle, three ways</title>
  <desc id="g2-d">Three copies of the same triangle side by side. The first, labelled FLAT, has a single red dot at its centroid: one call to the shading equation. The second, labelled GOURAUD, has three red dots, one at each corner. The third, labelled PER-PIXEL, is covered in a lattice of small red dots, one for every covered pixel. The caption notes that the equation itself is identical in all three.</desc>
  <defs>
    <marker id="d-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok-bd)"/></marker>
    <marker id="d-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--verify-bd)"/></marker>
    <marker id="d-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
  </defs>
<text x="16" y="26" class="sm" font-weight="700">The same triangle, the same equation. Only the sample points move.</text><polygon points="74.0,150.0 168.0,150.0 121.0,58.0" fill="var(--dia-fill)" stroke="var(--dia-ink)" stroke-width="1.6"/><circle cx="121.0" cy="119.3" r="5" fill="var(--verify-bd)"/><text x="121.0" y="180" class="sm" text-anchor="middle" font-weight="700">FLAT</text><text x="121.0" y="196" class="xs muted" text-anchor="middle">1 call, at the centroid</text><polygon points="284.0,150.0 378.0,150.0 331.0,58.0" fill="var(--dia-fill)" stroke="var(--dia-ink)" stroke-width="1.6"/><circle cx="284.0" cy="150.0" r="5" fill="var(--verify-bd)"/><circle cx="378.0" cy="150.0" r="5" fill="var(--verify-bd)"/><circle cx="331.0" cy="58.0" r="5" fill="var(--verify-bd)"/><text x="331.0" y="180" class="sm" text-anchor="middle" font-weight="700">GOURAUD</text><text x="331.0" y="196" class="xs muted" text-anchor="middle">3 calls, at the corners</text><polygon points="494.0,150.0 588.0,150.0 541.0,58.0" fill="var(--dia-fill)" stroke="var(--dia-ink)" stroke-width="1.6"/><circle cx="538.0" cy="73.0" r="2.4" fill="var(--verify-bd)"/><circle cx="538.0" cy="84.0" r="2.4" fill="var(--verify-bd)"/><circle cx="549.0" cy="84.0" r="2.4" fill="var(--verify-bd)"/><circle cx="527.0" cy="95.0" r="2.4" fill="var(--verify-bd)"/><circle cx="538.0" cy="95.0" r="2.4" fill="var(--verify-bd)"/><circle cx="549.0" cy="95.0" r="2.4" fill="var(--verify-bd)"/><circle cx="527.0" cy="106.0" r="2.4" fill="var(--verify-bd)"/><circle cx="538.0" cy="106.0" r="2.4" fill="var(--verify-bd)"/><circle cx="549.0" cy="106.0" r="2.4" fill="var(--verify-bd)"/><circle cx="560.0" cy="106.0" r="2.4" fill="var(--verify-bd)"/><circle cx="516.0" cy="117.0" r="2.4" fill="var(--verify-bd)"/><circle cx="527.0" cy="117.0" r="2.4" fill="var(--verify-bd)"/><circle cx="538.0" cy="117.0" r="2.4" fill="var(--verify-bd)"/><circle cx="549.0" cy="117.0" r="2.4" fill="var(--verify-bd)"/><circle cx="560.0" cy="117.0" r="2.4" fill="var(--verify-bd)"/><circle cx="571.0" cy="117.0" r="2.4" fill="var(--verify-bd)"/><circle cx="516.0" cy="128.0" r="2.4" fill="var(--verify-bd)"/><circle cx="527.0" cy="128.0" r="2.4" fill="var(--verify-bd)"/><circle cx="538.0" cy="128.0" r="2.4" fill="var(--verify-bd)"/><circle cx="549.0" cy="128.0" r="2.4" fill="var(--verify-bd)"/><circle cx="560.0" cy="128.0" r="2.4" fill="var(--verify-bd)"/><circle cx="571.0" cy="128.0" r="2.4" fill="var(--verify-bd)"/><circle cx="505.0" cy="139.0" r="2.4" fill="var(--verify-bd)"/><circle cx="516.0" cy="139.0" r="2.4" fill="var(--verify-bd)"/><circle cx="527.0" cy="139.0" r="2.4" fill="var(--verify-bd)"/><circle cx="538.0" cy="139.0" r="2.4" fill="var(--verify-bd)"/><circle cx="549.0" cy="139.0" r="2.4" fill="var(--verify-bd)"/><circle cx="560.0" cy="139.0" r="2.4" fill="var(--verify-bd)"/><circle cx="571.0" cy="139.0" r="2.4" fill="var(--verify-bd)"/><circle cx="582.0" cy="139.0" r="2.4" fill="var(--verify-bd)"/><text x="541.0" y="180" class="sm" text-anchor="middle" font-weight="700">PER-PIXEL</text><text x="541.0" y="196" class="xs muted" text-anchor="middle">1 call per covered pixel</text><text x="16" y="226" class="xs muted">Red dots are calls to shade(). The equation, the normal matrix, the light and the material are identical in all three.</text>
</svg>
