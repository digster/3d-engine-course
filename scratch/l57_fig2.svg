<svg viewBox="0 0 720 330" role="img" aria-labelledby="l57f2-t l57f2-d">
  <title id="l57f2-t">The sparse-set redirect as a two-deep dependency chain</title>
  <desc id="l57f2-d">Top: three boxes in a row showing dense[i] feeding sparse[e] feeding data[idx], a chain of depth two. Bottom: five such chains drawn one above the other and marked as independent, so their cache misses overlap the way an array of pointers does and a linked list cannot.</desc>
  <defs>
    <marker id="e-i-l57f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l57f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l57f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l57f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l57f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Two loads in a row is a dependency chain. Whether that costs anything depends on what else is in flight.</text>
<text x="24" y="48" class="xs t-hi" text-anchor="start">ONE ENTITY, ONE EXTRA COMPONENT</text>
<rect x="40" y="60" width="150" height="34" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.18"/>
<text x="115" y="76" class="xs mono" text-anchor="middle">dense[i]</text>
<text x="115" y="89" class="xs muted" text-anchor="middle">sequential</text>
<line x1="192" y1="77" x2="236" y2="77" class="hi" stroke-width="1.4" marker-end="url(#e-h-l57f2)"/>
<rect x="240" y="60" width="150" height="34" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.18"/>
<text x="315" y="76" class="xs mono" text-anchor="middle">sparse[e]</text>
<text x="315" y="89" class="xs muted" text-anchor="middle">depends on e</text>
<line x1="392" y1="77" x2="436" y2="77" class="hi" stroke-width="1.4" marker-end="url(#e-h-l57f2)"/>
<rect x="440" y="60" width="150" height="34" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.18"/>
<text x="515" y="76" class="xs mono" text-anchor="middle">data[idx]</text>
<text x="515" y="89" class="xs muted" text-anchor="middle">depends on idx</text>
<text x="640" y="79" class="xs t-hi" text-anchor="start">depth 2</text>
<text x="24" y="112" class="xs muted" text-anchor="start">The address of the second load is not known until the first returns. That is the SAME SHAPE as a linked list — and it is</text>
<text x="24" y="126" class="xs muted" text-anchor="start">not the same cost, for the reason Lesson 5.6 measured.</text>
<line x1="24" y1="142" x2="696" y2="142" class="grid" stroke-width="1.2"/>
<text x="24" y="164" class="xs t-hi" text-anchor="start">…BUT THE LOOP HAS MANY ENTITIES, AND THEIR CHAINS ARE INDEPENDENT</text>
<text x="52" y="188" class="xs mono muted" text-anchor="end">i=0</text>
<rect x="60" y="178" width="84" height="14" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="146" y1="185" x2="154" y2="185" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="156" y="178" width="84" height="14" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="242" y1="185" x2="250" y2="185" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="252" y="178" width="84" height="14" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="52" y="208" class="xs mono muted" text-anchor="end">i=1</text>
<rect x="60" y="198" width="84" height="14" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="146" y1="205" x2="154" y2="205" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="156" y="198" width="84" height="14" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="242" y1="205" x2="250" y2="205" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="252" y="198" width="84" height="14" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="52" y="228" class="xs mono muted" text-anchor="end">i=2</text>
<rect x="60" y="218" width="84" height="14" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="146" y1="225" x2="154" y2="225" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="156" y="218" width="84" height="14" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="242" y1="225" x2="250" y2="225" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="252" y="218" width="84" height="14" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="52" y="248" class="xs mono muted" text-anchor="end">i=3</text>
<rect x="60" y="238" width="84" height="14" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="146" y1="245" x2="154" y2="245" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="156" y="238" width="84" height="14" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="242" y1="245" x2="250" y2="245" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="252" y="238" width="84" height="14" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<text x="52" y="268" class="xs mono muted" text-anchor="end">i=4</text>
<rect x="60" y="258" width="84" height="14" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="146" y1="265" x2="154" y2="265" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="156" y="258" width="84" height="14" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.16"/>
<line x1="242" y1="265" x2="250" y2="265" class="ink-soft" stroke-width="0.9" marker-end="url(#e-s-l57f2)"/>
<rect x="252" y="258" width="84" height="14" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="56" y="174" width="296" height="106" rx="4" fill="none" stroke="#5ac878" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="364" y="200" class="xs" text-anchor="start">Five chains, started five cycles apart, all</text>
<text x="364" y="216" class="xs" text-anchor="start">outstanding at once. Their misses OVERLAP.</text>
<text x="364" y="238" class="xs muted" text-anchor="start">A linked list cannot do this: node 2's address</text>
<text x="364" y="252" class="xs muted" text-anchor="start">is inside node 1, so nothing can start until</text>
<text x="364" y="266" class="xs muted" text-anchor="start">node 1 has arrived. 5.6 measured 2.4x vs 6.5x.</text>
<line x1="24" y1="296" x2="696" y2="296" class="grid" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="24" y="316" class="xs t-hi" text-anchor="start">So the redirect is LATENCY, not bandwidth — and latency is the kind of cost a machine can hide. Whether it does is §5.2.</text>
</svg>
