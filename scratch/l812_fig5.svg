<svg viewBox="0 0 980 425.5" role="img" aria-labelledby="g5-t g5-d">
  <title id="g5-t">Codman's paradox, and the naive twist row in a solver</title>
  <desc id="g5-d">Left: a sphere with the octant path an arm takes, down, forward, out to the side and down again, which leaves it turned 90 degrees about itself. Right: a table of circles at four swings, each leaving exactly 2 pi (1 - cos phi) of twist; and bars of the worst twist a rod reaches against a 20-degree stop under the half-way rows, the bone rows with split impulse, and the bone rows with no position pass.</desc>
  <defs>
    <marker id="e-i-g5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-g5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-g5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-g5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-g5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
