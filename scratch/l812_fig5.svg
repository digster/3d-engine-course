<circle cx="180.0" cy="304.1" r="3.4" fill="#f0961e"/>
<text x="180.0" y="332.0" class="xs" text-anchor="start">down</text>
<circle cx="102.9" cy="218.4" r="3.4" fill="#f0961e"/>
<text x="50.502394381733154" y="241.69035687784086" class="xs" text-anchor="end">forward</text>
<circle cx="271.9" cy="213.8" r="3.4" fill="#f0961e"/>
<text x="313.5823780917009" y="228.6373824554609" class="xs" text-anchor="start">out to the side</text>
<text x="26" y="344" class="xs" text-anchor="start">Carried round with NO spin about itself, the arm comes home</text>
<text x="26" y="359" class="xs" text-anchor="start">turned 90.000° about its own axis — the solid angle of the</text>
<text x="26" y="374" class="xs" text-anchor="start">octant it enclosed, π/2. A circle at swing φ encloses 2π(1 − cos φ).</text>
<text x="470" y="44" class="xs muted" text-anchor="start">Measured by carrying a body round each loop, 8,000 steps</text>
<text x="470" y="64" class="xs muted" text-anchor="start">circle at swing</text>
<text x="784" y="64" class="xs muted" text-anchor="end">twist after one loop</text>
<text x="934" y="64" class="xs muted" text-anchor="end">2π(1 − cos φ)</text>
<line x1="470" y1="72.0" x2="940" y2="72.0" class="grid" stroke-width="1.0"/>
<text x="470" y="89.0" class="xs" text-anchor="start">30°</text>
<text x="784" y="89.0" class="xs mono" text-anchor="end">48.231°</text>
<text x="934" y="89.0" class="xs mono" text-anchor="end">48.231°</text>
<text x="470" y="106.0" class="xs" text-anchor="start">60°</text>
<text x="784" y="106.0" class="xs mono" text-anchor="end">180.000°</text>
<text x="934" y="106.0" class="xs mono" text-anchor="end">180.000°</text>
<text x="470" y="123.0" class="xs" text-anchor="start">90°</text>
<text x="784" y="123.0" class="xs mono" text-anchor="end">360.000°</text>
<text x="934" y="123.0" class="xs mono" text-anchor="end">360.000°</text>
<text x="470" y="140.0" class="xs" text-anchor="start">120°</text>
<text x="784" y="140.0" class="xs mono" text-anchor="end">540.000°</text>
<text x="934" y="140.0" class="xs mono" text-anchor="end">540.000°</text>
<text x="470" y="180.5" class="sm" text-anchor="start">A rod circling the rim of a 60° cone, twist stop at ±20°</text>
<rect x="700" y="200.5" width="21.052631578947366" height="20" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.6"/>
<text x="470" y="214.5" class="xs" text-anchor="start">half-way / cos, split impulse</text>
<text x="729.0526315789474" y="214.5" class="xs mono" text-anchor="start">20.00°</text>
<rect x="700" y="234.5" width="30.61052631578947" height="20" rx="2" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.6"/>
<text x="470" y="248.5" class="xs" text-anchor="start">about the bone, split impulse</text>
<text x="738.6105263157895" y="248.5" class="xs mono" text-anchor="start">29.08°</text>
<rect x="700" y="268.5" width="189.4" height="20" rx="2" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.6"/>
<text x="470" y="282.5" class="xs" text-anchor="start">about the bone, no position pass</text>
<text x="897.4" y="282.5" class="xs mono" text-anchor="start">179.93°</text>
<line x1="721.1" y1="192.5" x2="721.1" y2="302.5" stroke="#9b7ede" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
<text x="721.0526315789474" y="316.5" class="xs muted" text-anchor="middle">the stop, 20°</text>
<text x="470" y="338.5" class="xs muted" text-anchor="start">The bone row never sees the twist move — the rod has no spin about itself — so</text>
<text x="470" y="353.5" class="xs muted" text-anchor="start">only the position pass, which measures the TRUE twist, pushes back. It removes β</text>
<text x="470" y="368.5" class="xs muted" text-anchor="start">of the violation a step while the circling adds α̇(1 − cos φ)·h, and settles</text>
<text x="470" y="383.5" class="xs muted" text-anchor="start">where they balance: 9.55° past the stop predicted, 9.08° measured. With no</text>
<text x="470" y="398.5" class="xs muted" text-anchor="start">position pass it walks straight through.</text>
</svg>
