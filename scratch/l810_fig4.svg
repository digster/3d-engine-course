<svg viewBox="0 0 980 412" role="img" aria-labelledby="f4-t f4-d">
  <title id="f4-t">The arrival depth is a ceiling, not an equality</title>
  <desc id="f4-d">Left: a body crosses the surface part way through a step and is not sampled until the next one, so the overlap it is first seen with is somewhere between zero and one step of travel. Right: 200 finely spaced drop heights per row show the arrival depth uniform on [0, v h] with a mean of 0.49 and a largest value of 0.97, and a table showing the settled depth changing by 3% across a sixty-four-fold range of iteration count.</desc>
  <defs>
    <marker id="e-i-f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-blue-f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<defs><marker id="e-red-f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<text x="30" y="36" class="sm" text-anchor="start">The body crosses the surface INSIDE a step</text>
<line x1="30.0" y1="150.0" x2="430.0" y2="150.0" stroke="#8f918a" stroke-width="2.0" fill="none"/>
<text x="34" y="142" class="xs muted" text-anchor="start">surface</text>
<rect x="60" y="66" width="60" height="44" rx="3" fill="none" stroke="#5082e6" stroke-width="1.4"/>
<text x="90" y="58" class="xs mono" text-anchor="middle">step n</text>
<rect x="200" y="122" width="60" height="44" rx="3" fill="none" stroke="#8f918a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="230" y="114" class="xs mono" text-anchor="middle">crossing</text>
<rect x="330" y="172" width="60" height="44" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.4"/>
<text x="360" y="232" class="xs mono" text-anchor="middle">step n+1</text>
<line x1="120.00" y1="88.00" x2="198.00" y2="130.00" stroke="#5082e6" stroke-width="1.5" marker-end="url(#e-blue-f4)"/>
<line x1="260.00" y1="156.00" x2="328.00" y2="190.00" stroke="#e05c5c" stroke-width="1.5" marker-end="url(#e-red-f4)"/>
<line x1="360.0" y1="150.0" x2="360.0" y2="172.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="374" y="166" class="xs mono" text-anchor="start">depth</text>
<text x="30" y="258" class="xs muted" text-anchor="start">The narrow phase is asked once a step. How much of the step was left</text>
<text x="30" y="274" class="xs muted" text-anchor="start">over when the surface was crossed is a property of where the body</text>
<text x="30" y="290" class="xs muted" text-anchor="start">happened to be when the step began — which is to say, arbitrary.</text>
<text x="530" y="40" class="sm" text-anchor="start">Arrival depth as a fraction of v·h, 200 drops per row</text>
<rect x="530" y="62" width="380" height="150" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="530.0" y1="62" x2="530.0" y2="212" class="grid" stroke-width="0.7"/>
<text x="530.0" y="228" class="xs mono" text-anchor="middle">0.00</text>
<line x1="625.0" y1="62" x2="625.0" y2="212" class="grid" stroke-width="0.7"/>
<text x="625.0" y="228" class="xs mono" text-anchor="middle">0.25</text>
<line x1="720.0" y1="62" x2="720.0" y2="212" class="grid" stroke-width="0.7"/>
<text x="720.0" y="228" class="xs mono" text-anchor="middle">0.50</text>
<line x1="815.0" y1="62" x2="815.0" y2="212" class="grid" stroke-width="0.7"/>
<text x="815.0" y="228" class="xs mono" text-anchor="middle">0.75</text>
<line x1="910.0" y1="62" x2="910.0" y2="212" class="grid" stroke-width="0.7"/>
<text x="910.0" y="228" class="xs mono" text-anchor="middle">1.00</text>
<text x="720.0" y="246" class="xs muted" text-anchor="middle">fraction of v·h</text>
<line x1="531.9" y1="87.0" x2="879.2" y2="87.0" stroke="#5082e6" stroke-width="6.0" fill="none"/>
<circle cx="714.7" cy="87.0" r="4.2" fill="#9b7ede"/>
<text x="538" y="75.0" class="xs mono" text-anchor="start">0.10 m drop  ·  v·h = 35.4 mm</text>
<line x1="531.5" y1="137.0" x2="891.0" y2="137.0" stroke="#5082e6" stroke-width="6.0" fill="none"/>
<circle cx="715.8" cy="137.0" r="4.2" fill="#9b7ede"/>
<text x="538" y="125.0" class="xs mono" text-anchor="start">0.50 m drop  ·  v·h = 60.0 mm</text>
<line x1="530.8" y1="187.0" x2="899.4" y2="187.0" stroke="#5082e6" stroke-width="6.0" fill="none"/>
<circle cx="721.9" cy="187.0" r="4.2" fill="#9b7ede"/>
<text x="538" y="175.0" class="xs mono" text-anchor="start">2.00 m drop  ·  v·h = 109.0 mm</text>
<line x1="910.0" y1="62.0" x2="910.0" y2="212.0" stroke="#e05c5c" stroke-width="2.0" fill="none"/>
<text x="904" y="56" class="xs" text-anchor="end">v·h, the ceiling</text>
<line x1="530.0" y1="266.0" x2="550.0" y2="266.0" stroke="#5082e6" stroke-width="2.4" fill="none"/>
<text x="558" y="270" class="xs" text-anchor="start">range over 200 finely spaced drop heights</text>
<line x1="530.0" y1="283.0" x2="550.0" y2="283.0" stroke="#9b7ede" stroke-width="2.4" fill="none"/>
<text x="558" y="287" class="xs" text-anchor="start">mean — 0.49, which is what UNIFORM means</text>
<text x="530" y="328" class="xs muted" text-anchor="start">Frozen: 3.1% over a 64× range</text>
<text x="530" y="348" class="xs muted" text-anchor="start">velocity iterations</text>
<text x="770" y="348" class="xs muted" text-anchor="end">1</text>
<text x="836" y="348" class="xs muted" text-anchor="end">8</text>
<text x="902" y="348" class="xs muted" text-anchor="end">64</text>
<line x1="530" y1="356.0" x2="908" y2="356.0" class="grid" stroke-width="1.0"/>
<text x="530" y="373.0" class="xs" text-anchor="start">settled depth, mm</text>
<text x="770" y="373.0" class="xs mono" text-anchor="end">17.696</text>
<text x="836" y="373.0" class="xs mono" text-anchor="end">17.770</text>
<text x="902" y="373.0" class="xs mono" text-anchor="end">17.750</text>
</svg>
