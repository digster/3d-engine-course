<line x1="150.0" y1="175.0" x2="364.4" y2="224.5" stroke="#f0961e" stroke-width="1.1" fill="none"/>
<line x1="150.0" y1="175.0" x2="364.4" y2="125.5" stroke="#f0961e" stroke-width="1.1" fill="none"/>
<line x1="257.2" y1="150.3" x2="257.2" y2="199.7" stroke="#f0961e" stroke-width="3.0" fill="none"/>
<line x1="364.4" y1="125.5" x2="364.4" y2="224.5" stroke="#f0961e" stroke-width="3.0" fill="none"/>
<circle cx="150.0" cy="175.0" r="7" fill="#f0961e" stroke="none"/>
<text x="150.0" y="201.0" class="xs mono" text-anchor="middle">lamp, intensity I</text>
<text x="263.18070712637586" y="179.0" class="xs" text-anchor="start">A at d</text>
<text x="378.0" y="179.0" class="xs" text-anchor="start">4A at 2d</text>
<text x="255" y="262" class="xs muted" text-anchor="middle">same rays, same power</text>
<text x="255" y="280" class="xs t-hi" text-anchor="middle">spread 4x as thin: E = I / d²</text>
<text x="480.0" y="70" class="sm" text-anchor="start">measured, verify_617b §A</text>
<text x="480.0" y="92" class="xs muted" text-anchor="start">intensity pi, white surface facing it:</text>
<text x="488.0" y="109" class="xs mono" text-anchor="start">  1 m</text>
<text x="550.0" y="109" class="xs mono" text-anchor="start">E = 3.1416   renders 1.0000</text>
<text x="488.0" y="126" class="xs mono" text-anchor="start">  2 m</text>
<text x="550.0" y="126" class="xs mono" text-anchor="start">E = 0.7854   renders 0.2500</text>
<text x="488.0" y="143" class="xs mono" text-anchor="start">  4 m</text>
<text x="550.0" y="143" class="xs mono" text-anchor="start">E = 0.1963   renders 0.0625</text>
<text x="480.0" y="160" class="xs muted" text-anchor="start">power through spheres of 0.5, 2, 8 m:</text>
<text x="488.0" y="177" class="xs mono" text-anchor="start"></text>
<text x="550.0" y="177" class="xs mono" text-anchor="start">39.47852 each (4πI = 39.47842)</text>
<text x="480.0" y="194" class="xs muted" text-anchor="start">a lamp D m above a 1 m patch vs the sun:</text>
<text x="488.0" y="211" class="xs mono" text-anchor="start">  D = 2</text>
<text x="550.0" y="211" class="xs mono" text-anchor="start">16.19% off at the corner</text>
<text x="488.0" y="228" class="xs mono" text-anchor="start">  D = 10</text>
<text x="550.0" y="228" class="xs mono" text-anchor="start">0.745%  — (D/d)³, as derived</text>
<text x="488.0" y="245" class="xs mono" text-anchor="start">  D = 100</text>
<text x="550.0" y="245" class="xs mono" text-anchor="start">0.0075%</text>
<text x="480.0" y="274" class="xs t-hi" text-anchor="start">at one metre a lamp of intensity π IS the engine's sun</text>
</svg>
