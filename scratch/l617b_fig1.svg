<svg viewBox="0 0 800 330" role="img" aria-labelledby="l617bf1-t l617bf1-d">
  <title id="l617bf1-t">The inverse-square law from a sphere</title>
  <desc id="l617bf1-d">A lamp at the left with two concentric spherical shells at distance d and 2d. A beam of rays cuts a patch of area A from the first and 4A from the second, so the same power is spread four times as thinly. The measured values from the harness sit to the right.</desc>
  <defs>
    <marker id="e-i-l617bf1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l617bf1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l617bf1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l617bf1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l617bf1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="24" class="sm" text-anchor="start">A lamp spreads its power over spheres, and a sphere of twice the radius has four times the area.</text>
<path d="M 234.26,245.71 L 236.68,242.72 L 238.99,239.66 L 241.19,236.51 L 243.29,233.29 L 245.26,230.00 L 247.12,226.64 L 248.87,223.22 L 250.49,219.74 L 251.99,216.21 L 253.37,212.62 L 254.62,208.99 L 255.74,205.32 L 256.73,201.61 L 257.60,197.87 L 258.33,194.10 L 258.93,190.31 L 259.40,186.50 L 259.73,182.67 L 259.93,178.84 L 260.00,175.00 L 259.93,171.16 L 259.73,167.33 L 259.40,163.50 L 258.93,159.69 L 258.33,155.90 L 257.60,152.13 L 256.73,148.39 L 255.74,144.68 L 254.62,141.01 L 253.37,137.38 L 251.99,133.79 L 250.49,130.26 L 248.87,126.78 L 247.12,123.36 L 245.26,120.00 L 243.29,116.71 L 241.19,113.49 L 238.99,110.34 L 236.68,107.28 L 234.26,104.29" fill="none" stroke="#8f918a" stroke-width="1.2"/>
