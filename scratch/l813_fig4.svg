<svg viewBox="0 0 980 415.0" role="img" aria-labelledby="h4-t h4-d">
  <title id="h4-t">Why one cast per obstacle, why divide by the closing speed, and why a skin</title>
  <desc id="h4-d">Left: a mover passing a ball at a grazing angle toward a wall; one Newton step on the union flies through the wall, one cast per obstacle stops at it. Middle: on a log axis, Newton steps against sphere-tracing steps to reach a face at 90 down to 1 degree — 2 against 237. Right: a table of four skins with the gap a cast leaves and how often the next cast starts inside, and the upper-bound control.</desc>
  <defs>
    <marker id="e-i-h4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-h4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-h4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-h4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-h4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-red-h4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-green-h4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-grey-h4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<text x="26" y="30" class="sm" text-anchor="start">One cast against a union flies through</text>
<circle cx="50.0" cy="200.0" r="24.0" fill="none" stroke="#8f918a" stroke-width="1.4"/>
<text x="50.0" y="238.0" class="xs" text-anchor="middle">mover</text>
<circle cx="128.0" cy="125.0" r="27.0" fill="none" stroke="#5082e6" stroke-width="1.4"/>
<text x="128.0" y="90.0" class="xs" text-anchor="middle">passed, grazing</text>
<path d="M 254.00,296.00 L 266.00,296.00 L 266.00,128.00 L 254.00,128.00 Z" fill="#5082e6" fill-opacity="0.18" stroke="#5082e6" stroke-width="1.2"/>
<text x="260.0" y="120.0" class="xs" text-anchor="middle">wall</text>
<line x1="77.00" y1="200.00" x2="344.00" y2="200.00" stroke="#e05c5c" stroke-width="1.8" marker-end="url(#e-red-h4)"/>
<text x="80.0" y="192" class="xs" text-anchor="start">one step on min(f₁, f₂): through</text>
<line x1="77.00" y1="221.00" x2="227.00" y2="221.00" stroke="#5ac878" stroke-width="1.8" marker-end="url(#e-green-h4)"/>
<text x="146.0" y="237.0" class="xs" text-anchor="middle">one cast each: stops at the wall</text>
<text x="26" y="326.0" class="xs mono" text-anchor="start">11,194 of 20,000 grazing passes: through the wall</text>
<text x="26" y="341.0" class="xs mono" text-anchor="start">one cast per obstacle, smallest t: 0</text>
<text x="26" y="356.0" class="xs" text-anchor="start">The nearer ball's plane is almost parallel to the</text>
<text x="26" y="371.0" class="xs" text-anchor="start">motion, so its step is long — and it says nothing</text>
<text x="26" y="386.0" class="xs" text-anchor="start">about the wall. A plane separates ONE pair.</text>
<text x="370" y="30" class="sm" text-anchor="start">Steps to a face at a grazing angle</text>
<rect x="390" y="58" width="230" height="190" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="390" y1="248.0" x2="620" y2="248.0" class="grid" stroke-width="0.6"/>
