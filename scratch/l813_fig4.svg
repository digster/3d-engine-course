<text x="384" y="178.98093025017712" class="xs mono" text-anchor="end">10</text>
<line x1="390" y1="101.96186050035425" x2="620" y2="101.96186050035425" class="grid" stroke-width="0.6"/>
<text x="384" y="105.96186050035425" class="xs mono" text-anchor="end">100</text>
<rect x="398.28" y="226.01906974982288" width="11.799999999999999" height="21.980930250177124" rx="1" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.7"/>
<text x="404.17999999999995" y="222.01906974982288" class="xs mono" text-anchor="middle">2</text>
<rect x="412.08" y="226.01906974982288" width="11.799999999999999" height="21.980930250177124" rx="1" fill="#e05c5c" stroke="#e05c5c" stroke-width="0.8" fill-opacity="0.7"/>
<text x="417.97999999999996" y="222.01906974982288" class="xs mono" text-anchor="middle">2</text>
<text x="413.0" y="264" class="xs mono" text-anchor="middle">90°</text>
<rect x="444.28" y="226.01906974982288" width="11.799999999999999" height="21.980930250177124" rx="1" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.7"/>
<text x="450.17999999999995" y="222.01906974982288" class="xs mono" text-anchor="middle">2</text>
<rect x="458.08" y="191.18011957232483" width="11.799999999999999" height="56.81988042767517" rx="1" fill="#e05c5c" stroke="#e05c5c" stroke-width="0.8" fill-opacity="0.7"/>
<text x="463.97999999999996" y="187.18011957232483" class="xs mono" text-anchor="middle">6</text>
<text x="459.0" y="264" class="xs mono" text-anchor="middle">30°</text>
<rect x="490.28" y="226.01906974982288" width="11.799999999999999" height="21.980930250177124" rx="1" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.7"/>
<text x="496.17999999999995" y="222.01906974982288" class="xs mono" text-anchor="middle">2</text>
<rect x="504.08" y="136.17283413610835" width="11.799999999999999" height="111.82716586389165" rx="1" fill="#e05c5c" stroke="#e05c5c" stroke-width="0.8" fill-opacity="0.7"/>
<text x="509.97999999999996" y="132.17283413610835" class="xs mono" text-anchor="middle">34</text>
<text x="505.0" y="264" class="xs mono" text-anchor="middle">10°</text>
<rect x="536.28" y="226.01906974982288" width="11.799999999999999" height="21.980930250177124" rx="1" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.7"/>
<text x="542.18" y="222.01906974982288" class="xs mono" text-anchor="middle">2</text>
<rect x="550.0799999999999" y="102.9277761586365" width="11.799999999999999" height="145.0722238413635" rx="1" fill="#e05c5c" stroke="#e05c5c" stroke-width="0.8" fill-opacity="0.7"/>
<text x="555.9799999999999" y="98.9277761586365" class="xs mono" text-anchor="middle">97</text>
<text x="551.0" y="264" class="xs mono" text-anchor="middle">3°</text>
<rect x="582.28" y="226.01906974982288" width="11.799999999999999" height="21.980930250177124" rx="1" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.7"/>
<text x="588.18" y="222.01906974982288" class="xs mono" text-anchor="middle">2</text>
<rect x="596.0799999999999" y="74.59808488441169" width="11.799999999999999" height="173.4019151155883" rx="1" fill="#e05c5c" stroke="#e05c5c" stroke-width="0.8" fill-opacity="0.7"/>
<text x="601.9799999999999" y="70.59808488441169" class="xs mono" text-anchor="middle">237</text>
<text x="597.0" y="264" class="xs mono" text-anchor="middle">1°</text>
<text x="505.0" y="280" class="xs muted" text-anchor="middle">angle between the motion and the face</text>
<line x1="370.0" y1="298.0" x2="390.0" y2="298.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="398" y="302" class="xs" text-anchor="start">the cast: gap ÷ closing speed</text>
<line x1="370.0" y1="315.0" x2="390.0" y2="315.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="398" y="319" class="xs" text-anchor="start">sphere tracing: gap ÷ |d|</text>
<text x="660" y="30" class="sm" text-anchor="start">Cast, then slide from where it stopped</text>
<text x="660" y="50" class="xs muted" text-anchor="start">≈4,000 hits each; gaps in mm</text>
<text x="660" y="70" class="xs muted" text-anchor="start">skin</text>
<text x="796" y="70" class="xs muted" text-anchor="end">mean gap</text>
<text x="876" y="70" class="xs muted" text-anchor="end">worst gap</text>
<text x="964" y="70" class="xs muted" text-anchor="end">starts inside</text>
<line x1="660" y1="78.0" x2="970" y2="78.0" class="grid" stroke-width="1.0"/>
<text x="660" y="95.0" class="xs" text-anchor="start">0</text>
<text x="796" y="95.0" class="xs mono" text-anchor="end">133.76</text>
<text x="876" y="95.0" class="xs mono" text-anchor="end">2336.3</text>
<text x="964" y="95.0" class="xs mono t-bad" text-anchor="end">2.1%</text>
<text x="660" y="112.0" class="xs" text-anchor="start">0.1 mm</text>
<text x="796" y="112.0" class="xs mono" text-anchor="end">108.14</text>
<text x="876" y="112.0" class="xs mono" text-anchor="end">2244.3</text>
<text x="964" y="112.0" class="xs mono t-bad" text-anchor="end">7.3%</text>
<text x="660" y="129.0" class="xs" text-anchor="start">1 mm</text>
<text x="796" y="129.0" class="xs mono" text-anchor="end">1.06</text>
<text x="876" y="129.0" class="xs mono" text-anchor="end">3.3</text>
<text x="964" y="129.0" class="xs mono t-ok" text-anchor="end">0.0%</text>
<text x="660" y="146.0" class="xs" text-anchor="start">1 cm</text>
<text x="796" y="146.0" class="xs mono" text-anchor="end">10.04</text>
<text x="876" y="146.0" class="xs mono" text-anchor="end">11.1</text>
<text x="964" y="146.0" class="xs mono t-ok" text-anchor="end">0.0%</text>
<text x="660" y="174.5" class="xs muted" text-anchor="start">With no skin the cast lands ON the contact —</text>
<text x="660" y="189.5" class="xs muted" text-anchor="start">against a face, in one step — GJK calls that</text>
<text x="660" y="204.5" class="xs muted" text-anchor="start">intersecting, and the cast falls back to the</text>
<text x="660" y="219.5" class="xs muted" text-anchor="start">step before: often the start. A skin thinner</text>
<text x="660" y="234.5" class="xs muted" text-anchor="start">than GJK's own margin is worse than none. A</text>
<text x="660" y="249.5" class="xs muted" text-anchor="start">millimetre, and nothing starts inside.</text>
<text x="660" y="280.5" class="xs" text-anchor="start">Stepping from GJK's distance (an UPPER bound):</text>
<text x="660" y="295.5" class="xs mono t-bad" text-anchor="start">377 of 6,049 hits late, up to 0.17 mm inside the skin.</text>
<text x="660" y="310.5" class="xs mono t-ok" text-anchor="start">From its certified LOWER bound: none.</text>
</svg>
