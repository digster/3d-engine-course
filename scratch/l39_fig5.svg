<svg viewBox="0 0 600 258" role="img" aria-labelledby="f395-t f395-d">
  <title id="f395-t">Two uv conventions, and the flip between them</title>
  <desc id="f395-d">The same four-quadrant image drawn twice. On the left, texture space, where v increases downwards from the top as SDL_GPU specifies; the coordinate (0.25, 0.25) lands in the red top-left quadrant. On the right, OBJ space, where v increases upwards from the bottom; the same coordinate lands in the blue bottom-left quadrant. An arrow between them is labelled v maps to 1 minus v, applied once at import.</desc>
  <defs>
    <marker id="e-i-f395" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f395" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f395" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f395" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--verify-bd)"/></marker>
  </defs>
<text x="16" y="30" class="sm">the same image, and the same number, under two conventions</text>
<rect x="92.0" y="76.0" width="66.0" height="66.0" fill="#d8484c"/>
<rect x="158.0" y="76.0" width="66.0" height="66.0" fill="#5fbf6a"/>
<rect x="92.0" y="142.0" width="66.0" height="66.0" fill="#4c7fd8"/>
<rect x="158.0" y="142.0" width="66.0" height="66.0" fill="#e0b24c"/>
<rect x="92.0" y="76.0" width="16.5" height="16.5" fill="#f2efe8"/>
<rect x="92.0" y="76.0" width="132.0" height="132.0" fill="none" stroke="var(--dia-ink)" stroke-width="1.2"/>
<rect x="372.0" y="76.0" width="66.0" height="66.0" fill="#d8484c"/>
<rect x="438.0" y="76.0" width="66.0" height="66.0" fill="#5fbf6a"/>
<rect x="372.0" y="142.0" width="66.0" height="66.0" fill="#4c7fd8"/>
<rect x="438.0" y="142.0" width="66.0" height="66.0" fill="#e0b24c"/>
<rect x="372.0" y="76.0" width="16.5" height="16.5" fill="#f2efe8"/>
<rect x="372.0" y="76.0" width="132.0" height="132.0" fill="none" stroke="var(--dia-ink)" stroke-width="1.2"/>
<text x="158.0" y="44.0" class="sm mono" text-anchor="middle">texture space</text>
<text x="158.0" y="58.0" class="xs muted" text-anchor="middle">SDL_GPU: v down from the top</text>
<text x="438.0" y="44.0" class="sm mono" text-anchor="middle">OBJ space</text>
<text x="438.0" y="58.0" class="xs muted" text-anchor="middle">Wavefront: v up from the bottom</text>
<line x1="74.0" y1="76.0" x2="74.0" y2="208.0" class="ax-y" stroke-width="1.5" marker-end="url(#e-i-f395)"/>
<text x="68.0" y="86.0" class="xs mono lbl-y" text-anchor="end">v=0</text>
