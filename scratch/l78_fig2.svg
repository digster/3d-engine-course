  <title id="l78f2-t">Two clocks: a slipping 60 Hz simulation above, a fixed device clock below</title>
  <desc id="l78f2-d">The simulation's frames vary in length and a long one is merely a hitch. The device consumes a fixed buffer every 10.67 ms and two undelivered buffers become 21 ms of silence with a discontinuity at each end. A row of bars shows buffer size against latency.</desc>
