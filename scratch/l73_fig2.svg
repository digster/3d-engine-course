<line x1="550.00" y1="268.00" x2="587.20" y2="218.40" stroke="#f0961e" stroke-width="1.9" marker-end="url(#e-amber-f73b)"/>
<circle cx="587.20" cy="218.40" r="3.0" fill="#f0961e"/>
<text x="597.9" y="211.4" class="xs mono" text-anchor="start">z = 3 + 4i</text>
<line x1="550.00" y1="268.00" x2="488.00" y2="144.00" stroke="#60ded0" stroke-width="1.9" marker-end="url(#e-teal-f73b)"/>
<circle cx="488.00" cy="144.00" r="3.0" fill="#60ded0"/>
<text x="476.8" y="135.5" class="xs mono" text-anchor="end">zw = −5 + 10i</text>
<path d="M 588.82,190.36 L 584.53,188.36 L 580.13,186.60 L 575.65,185.08 L 571.09,183.80 L 566.47,182.78 L 561.80,182.01 L 557.09,181.49 L 552.37,181.23 L 547.63,181.23 L 542.91,181.49 L 538.20,182.01 L 533.53,182.78 L 528.91,183.80 L 524.35,185.08 L 519.87,186.60 L 515.47,188.36 L 511.18,190.36" fill="none" stroke="#60ded0" stroke-width="1.6"/>
<text x="380" y="180" class="sm mono t-hi" text-anchor="middle">× |z| = 5</text>
<text x="380" y="200" class="xs muted" text-anchor="middle">and turned</text>
<text x="380" y="216" class="xs mono t-hi" text-anchor="middle">by arg z = 53.130°</text>
<text x="380" y="248" class="xs muted" text-anchor="middle">the two arcs</text>
<text x="380" y="264" class="xs muted" text-anchor="middle">are equal</text>
<rect x="150" y="316" width="460" height="58" rx="3" fill="none" stroke="#8f918a" stroke-width="1.0"/>
<text x="380" y="336" class="xs mono t-hi" text-anchor="middle">5 × 2.2360680 = 11.1803398</text>
<text x="380" y="356" class="xs mono t-hi" text-anchor="middle">53.13010° + 63.43495° = 116.56505°</text>
<text x="380" y="388" class="xs muted" text-anchor="middle">moduli multiply, arguments add — and neither fact was put into the multiplication rule on purpose</text>
</svg>
