<svg viewBox="0 0 820 360" role="img" aria-labelledby="l617bf5-t l617bf5-d">
  <title id="l617bf5-t">A perspective shadow map</title>
  <desc id="l617bf5-d">Left: a spot light's shadow frustum with one texel's footprint growing from 1.7 mm at 1 m to 13.2 mm at 8 m. Right: the bias needed on a 45-degree surface in device-depth units against distance, falling as one over distance, and 6.8's orthographic formula as a constant that crosses it at 0.4 m.</desc>
