<svg viewBox="0 0 760 404" role="img" aria-labelledby="f74g-t f74g-d">
  <title id="f74g-t">What a quaternion costs, measured</title>
  <desc id="f74g-d">Three bar charts. Composing: a quaternion product at 1.666 nanoseconds against a three-by-three matrix product at 2.612, so 1.57 times cheaper. Applying to a point: a matrix times a vector at 1.070 against the quaternion sandwich at 1.679, so 1.57 times dearer. Repairing a drifted rotation: one fast renormalisation step at 1.059 against Gram-Schmidt at 3.437, so 3.25 times cheaper. Below, the crossover: converting to a matrix costs 4.619 nanoseconds and each vector rotated saves 0.609, so build the matrix once you are rotating more than 7.6 vectors by the same quaternion.</desc>
  <defs>
    <marker id="e-i-f74g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f74g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f74g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f74g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f74g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="135.0" y="46.0" class="sm" text-anchor="middle">composing two rotations</text>
<text x="135.0" y="62.0" class="xs muted" text-anchor="middle">16,384,000 operations, best of three</text>
<rect x="30" y="76.0" width="210.0" height="150.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<rect x="38" y="96.0" width="84.19295558958652" height="25.500000000000004" rx="2" fill="#60ded0" stroke="#60ded0" stroke-width="1.0" fill-opacity="0.85"/>
<text x="38" y="89.0" class="xs muted" text-anchor="start">quat x quat</text>
<text x="126.19295558958652" y="118.5" class="xs mono" text-anchor="start">1.666 ns</text>
<rect x="38" y="171.0" width="132.0" height="25.500000000000004" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.0" fill-opacity="0.85"/>
<text x="38" y="164.0" class="xs muted" text-anchor="start">mat3 x mat3</text>
<text x="174.0" y="193.5" class="xs mono" text-anchor="start">2.612 ns</text>
<text x="381.0" y="46.0" class="sm" text-anchor="middle">applying one to a point</text>
<text x="381.0" y="62.0" class="xs muted" text-anchor="middle">the row where the quaternion LOSES</text>
<rect x="276" y="76.0" width="210.0" height="150.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<rect x="284" y="96.0" width="84.12150089338893" height="25.500000000000004" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.0" fill-opacity="0.85"/>
<text x="284" y="89.0" class="xs muted" text-anchor="start">mat3 x vec3</text>
<text x="372.12150089338894" y="118.5" class="xs mono" text-anchor="start">1.070 ns</text>
<rect x="284" y="171.0" width="132.0" height="25.500000000000004" rx="2" fill="#60ded0" stroke="#60ded0" stroke-width="1.0" fill-opacity="0.85"/>
<text x="284" y="164.0" class="xs muted" text-anchor="start">rotate(q, v)</text>
<text x="420.0" y="193.5" class="xs mono" text-anchor="start">1.679 ns</text>
<text x="627.0" y="46.0" class="sm" text-anchor="middle">repairing a drifted one</text>
<text x="627.0" y="62.0" class="xs muted" text-anchor="middle">one Taylor step against Gram-Schmidt</text>
<rect x="522" y="76.0" width="210.0" height="150.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<rect x="530" y="96.0" width="40.671515856851904" height="25.500000000000004" rx="2" fill="#60ded0" stroke="#60ded0" stroke-width="1.0" fill-opacity="0.85"/>
<text x="530" y="89.0" class="xs muted" text-anchor="start">renormalised_fast</text>
<text x="574.6715158568519" y="118.5" class="xs mono" text-anchor="start">1.059 ns</text>
<rect x="530" y="171.0" width="132.0" height="25.500000000000004" rx="2" fill="#5082e6" stroke="#5082e6" stroke-width="1.0" fill-opacity="0.85"/>
<text x="530" y="164.0" class="xs muted" text-anchor="start">Gram-Schmidt</text>
<text x="666.0" y="193.5" class="xs mono" text-anchor="start">3.437 ns</text>
<text x="135" y="252" class="xs t-hi" text-anchor="middle">1.57× cheaper</text>
<text x="381" y="252" class="xs t-hi" text-anchor="middle">1.57× dearer</text>
<text x="627" y="252" class="xs t-hi" text-anchor="middle">3.25× cheaper</text>
<line x1="40" y1="276" x2="720" y2="276" class="grid" stroke-width="1.0"/>
<text x="380.0" y="302" class="sm" text-anchor="middle">mat3_from_quat costs 4.619 ns, and each vector saves 0.609 ns</text>
<text x="380.0" y="326" class="sm t-hi" text-anchor="middle">⇒  build the matrix once you are rotating more than 7.6 vectors by the same quaternion</text>
<text x="380.0" y="352" class="xs muted" text-anchor="middle">Rotate one point, use the sandwich. Rotate a mesh, or a skeleton's worth of vertices, build the matrix.</text>
<text x="380.0" y="370" class="xs muted" text-anchor="middle">That single number is why every renderer that is handed quaternions converts them before it draws — and why</text>
<text x="380.0" y="388" class="xs muted" text-anchor="middle">`mat3_from_quat` is not an afterthought in this header. Storage: 16 bytes against 36.</text>
</svg>
