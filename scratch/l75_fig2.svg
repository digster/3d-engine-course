<text x="250.0" y="418.0" class="xs muted" text-anchor="middle">outward ticks: slerp   ·   inward ticks: nlerp</text>
<text x="250.0" y="432.0" class="xs muted" text-anchor="middle">gold: the chord, and eleven equal steps along it</text>
<rect x="508.0" y="78.0" width="224.0" height="82" rx="4" class="fill-soft grid" stroke-width="1.2"/>
<text x="518.0" y="95.0" class="xs t-hi" text-anchor="start">The path is identical.</text>
<text x="518.0" y="110.0" class="xs muted" text-anchor="start">Every chord point is a positive</text>
<text x="518.0" y="123.0" class="xs muted" text-anchor="start">multiple of a point of the a–b plane,</text>
<text x="518.0" y="136.0" class="xs muted" text-anchor="start">and normalising moves a point along</text>
<text x="518.0" y="149.0" class="xs muted" text-anchor="start">its own radius. It cannot leave.</text>
<rect x="508.0" y="172.0" width="224.0" height="82" rx="4" class="fill-soft grid" stroke-width="1.2"/>
<text x="518.0" y="189.0" class="xs t-hi" text-anchor="start">The schedule is not.</text>
<text x="518.0" y="204.0" class="xs muted" text-anchor="start">Equal steps along a chord subtend</text>
<text x="518.0" y="217.0" class="xs muted" text-anchor="start">unequal angles at the centre — small</text>
<text x="518.0" y="230.0" class="xs muted" text-anchor="start">at the ends, large in the middle. That</text>
<text x="518.0" y="243.0" class="xs muted" text-anchor="start">is the entire difference.</text>
<rect x="508.0" y="266.0" width="224.0" height="82" rx="4" class="fill-soft grid" stroke-width="1.2"/>
<text x="518.0" y="283.0" class="xs t-hi" text-anchor="start">The midpoint is exact.</text>
<text x="518.0" y="298.0" class="xs muted" text-anchor="start">The chord's midpoint is equidistant</text>
<text x="518.0" y="311.0" class="xs muted" text-anchor="start">from both ends, and so is the arc's,</text>
<text x="518.0" y="324.0" class="xs muted" text-anchor="start">and on a circle there is only one such</text>
<text x="518.0" y="337.0" class="xs muted" text-anchor="start">point on the short side.</text>
<text x="620.0" y="366.0" class="xs mono t-ok" text-anchor="middle">measured departure from the plane: 1.605e−07</text>
</svg>
