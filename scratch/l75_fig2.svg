<svg viewBox="0 0 760 444" role="img" aria-labelledby="f75b-t f75b-d">
  <title id="f75b-t">One road, two rulers</title>
  <desc id="f75b-d">A great circle with two endpoints, the chord between them, and eleven equally spaced values of t marked twice: once by slerp, which spaces them equally, and once by nlerp, which bunches them at the ends.</desc>
  <defs>
    <marker id="e-i-f75b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f75b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f75b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f75b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f75b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-gold-f75b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f8d678"/></marker></defs>
<text x="250.0" y="26" class="sm" text-anchor="middle">the great circle a and b span</text>
<text x="250.0" y="42" class="xs muted" text-anchor="middle">drawn flat: it is a circle whatever it is embedded in</text>
<circle cx="250.0" cy="236.0" r="150.0" fill="none" class="grid" stroke-width="1.1"/>
<line x1="250.0" y1="236.0" x2="163.96353454734307" y2="113.12719335665125" class="grid" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="250.0" y1="236.0" x2="394.88887394336024" y2="197.17714323462187" class="grid" stroke-width="1.0" stroke-dasharray="3 3"/>
