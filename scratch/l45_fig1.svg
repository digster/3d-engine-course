<svg viewBox="0 0 720 450" role="img" aria-labelledby="f45a-t f45a-d">
  <title id="f45a-t">Interleaved and separate vertex layouts, byte by byte</title>
  <desc id="f45a-d">Top: one vertex buffer of 32-byte records, position then normal then uv, with 64-byte cache lines drawn over it — each line holds exactly two whole vertices. Middle: the same data as three separate buffers, one per attribute. Bottom: two measurements. Fetching one vertex costs 1 cache line interleaved and up to 5 separate; sweeping every position costs 613 lines interleaved and 230 separate.</desc>
