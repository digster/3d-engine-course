<svg viewBox="0 0 880 300" role="img" aria-labelledby="l618bf2-t l618bf2-d">
  <title id="l618bf2-t">Threads, groups and the tail</title>
  <desc id="l618bf2-d">Sixteen groups of 64 threads cover 1,000 particles; the last group has 40 threads with work and 24 without. A zoom on group 3 shows how SV_DispatchThreadID is the group index times 64 plus the thread's place in the group. A panel shows the textbook ceiling division wrapping to zero groups at 2^32 - 1.</desc>
  <defs>
    <marker id="e-i-l618bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l618bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l618bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l618bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l618bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
