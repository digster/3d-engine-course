<rect x="384" y="138" width="24" height="26" rx="2" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.18"/>
<text x="396.0" y="155" class="xs mono" text-anchor="middle">62</text>
<rect x="410" y="138" width="24" height="26" rx="2" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.18"/>
<text x="422.0" y="155" class="xs mono" text-anchor="middle">63</text>
<text x="20" y="186" class="xs mono" text-anchor="start">SV_GroupThreadID.x</text>
<text x="158" y="186" class="xs mono" text-anchor="start">= t, 0 .. 63</text>
<text x="252" y="186" class="xs muted" text-anchor="start">the lane's place in its group</text>
<text x="20" y="202" class="xs mono" text-anchor="start">SV_GroupID.x</text>
<text x="158" y="202" class="xs mono" text-anchor="start">= 3</text>
<text x="252" y="202" class="xs muted" text-anchor="start">which group</text>
<text x="20" y="218" class="xs mono" text-anchor="start">SV_DispatchThreadID.x</text>
<text x="158" y="218" class="xs mono" text-anchor="start">= 3 * 64 + t</text>
<text x="252" y="218" class="xs muted" text-anchor="start">192 .. 255: the particle's slot</text>
<rect x="470" y="136" width="390" height="118" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="482" y="154" class="xs muted" text-anchor="start">the textbook ceiling, and its edge</text>
<text x="482" y="174" class="xs mono t-bad" text-anchor="start">(n + 63) / 64  at n = 2^32 - 1   -&gt;   0 groups</text>
<text x="482" y="192" class="xs mono t-ok" text-anchor="start">n / 64 + (n % 64 != 0)            -&gt;   67,108,864</text>
<text x="482" y="214" class="xs" text-anchor="start">No pool reaches 2^32. The helper closes the edge</text>
<text x="482" y="228" class="xs" text-anchor="start">instead of documenting it, and every kernel still</text>
<text x="482" y="242" class="xs" text-anchor="start">checks  if (slot &gt;= capacity) return;</text>
<text x="20" y="286" class="xs muted" text-anchor="start">verify_618b §H: the probe kernel with its bounds check removed writes 24 elements past the end of a 1,000-element array — one per idle thread.</text>
</svg>
