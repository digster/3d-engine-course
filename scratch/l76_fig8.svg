<svg viewBox="0 0 760 366" role="img" aria-labelledby="f76h-t f76h-d">
  <title id="f76h-t">A twist collapses a ring; a bend flattens it</title>
  <desc id="f76h-d">Three rings: undeformed, collapsed uniformly by a twist, and squashed into an ellipse by a bend whose minor axis is the same cosine.</desc>
  <defs>
    <marker id="e-i-f76h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f76h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f76h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f76h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f76h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="24.0" y="84.0" width="214.0" height="196.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<ellipse cx="131.00" cy="188.00" rx="74.00" ry="74.00" fill="none" class="grid" stroke-width="1.1" stroke-dasharray="3 5"/>
<ellipse cx="131.00" cy="188.00" rx="74.00" ry="74.00" fill="none" stroke="#60c4ce" stroke-width="1.8"/>
<text x="131.0" y="58.0" class="sm" text-anchor="middle">at rest</text>
<text x="131.0" y="74.0" class="xs mono" text-anchor="middle">r, r</text>
<rect x="260.0" y="84.0" width="214.0" height="196.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<ellipse cx="367.00" cy="188.00" rx="74.00" ry="74.00" fill="none" class="grid" stroke-width="1.1" stroke-dasharray="3 5"/>
<ellipse cx="367.00" cy="188.00" rx="37.00" ry="37.00" fill="none" stroke="#60c4ce" stroke-width="1.8"/>
<text x="367.0" y="58.0" class="sm" text-anchor="middle">a TWIST of 120°</text>
<text x="367.0" y="74.0" class="xs mono" text-anchor="middle">r cos(θ/2) both ways</text>
<rect x="496.0" y="84.0" width="214.0" height="196.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<ellipse cx="603.00" cy="188.00" rx="74.00" ry="74.00" fill="none" class="grid" stroke-width="1.1" stroke-dasharray="3 5"/>
<ellipse cx="603.00" cy="188.00" rx="37.00" ry="74.00" fill="none" stroke="#60c4ce" stroke-width="1.8"/>
<text x="603.0" y="58.0" class="sm" text-anchor="middle">a BEND of 120°</text>
<text x="603.0" y="74.0" class="xs mono" text-anchor="middle">r cos(θ/2) and r</text>
<text x="380.0" y="310.0" class="xs muted" text-anchor="middle">a twist rotates about the ring's OWN axis, so the whole ring is in the collapsing plane;</text>
<text x="380.0" y="328.0" class="xs muted" text-anchor="middle">a bend rotates about an axis ACROSS it, so the vertices on that axis do not move at all.</text>
<text x="380.0" y="350.0" class="xs mono" text-anchor="middle">measured minor axis at 120°: 0.500000 against a prediction of 0.500000, major axis 1.000000</text>
<text x="380.0" y="32" class="sm" text-anchor="middle">the same cosine, spent two different ways</text>
</svg>
