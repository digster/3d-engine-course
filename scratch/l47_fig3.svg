  <text x="78.0" y="213.0" class="xs muted">shaded: the part of the range where a float stores its precision</text>
  <rect x="24" y="232" width="672" height="166" class="fill-soft ink" stroke-width="0.75" rx="3"/>
  <text x="40" y="252" class="sm">the same measurement, both ways &#8212; smallest resolvable gap</text>
  <text x="200" y="270" class="xs muted" text-anchor="middle">D32_FLOAT ordinary</text>
  <text x="380" y="270" class="xs muted" text-anchor="middle">D32_FLOAT reversed</text>
