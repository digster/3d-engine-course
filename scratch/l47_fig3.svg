<svg viewBox="0 0 720 414" role="img" aria-labelledby="f47c-t f47c-d">
  <title id="f47c-t">Reversed-Z, measured</title>
  <desc id="f47c-d">A float stores its precision near zero, and the ordinary depth mapping puts the far plane there — where 1/d squared has already thrown the resolution away. Reversing the mapping puts the near plane at 1 and the far plane at 0, so the two effects very nearly cancel. Measured: D32_FLOAT improves from 2.2 mm to 0.012 mm at ninety metres, a factor of 180, while D16_UNORM is unchanged because its codes are evenly spaced and reversing them moves nothing.</desc>
  <defs>
    <marker id="e-i-f47c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f47c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f47c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
  <text x="24" y="22" class="sm">reversed-Z: map near to 1 and far to 0, and a float&#8217;s precision lands where it is needed</text>
  <rect x="60.0" y="48.0" width="260.0" height="130.0" class="fill-soft ink" stroke-width="0.75"/>
  <text x="60.0" y="40.0" class="xs t-hi">ordinary</text>
