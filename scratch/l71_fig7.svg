<svg viewBox="0 0 760 396" role="img" aria-labelledby="f71g-t f71g-d">
  <title id="f71g-t">Interpolating Euler angles</title>
  <desc id="f71g-d">On the left, a unit sphere with two paths traced on it by the craft's nose between the same two orientations: an amber curve produced by lerping the three angles, and a dashed blue geodesic. The amber path bulges away from the blue one. On the right, a bar chart of extra turning for the same three angle deltas run at four pitch bands: 209.5 per cent near lock, then 62.5, 22.5 and 26.7 per cent further away.</desc>
