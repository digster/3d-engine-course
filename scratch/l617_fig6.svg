<line x1="470" y1="210" x2="470" y2="232" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f6)"/>
<rect x="410" y="236" width="120" height="26" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="410" y="236" width="120" height="26" rx="3" fill="none" stroke="#f0961e" stroke-width="1.1"/>
<text x="470" y="253" class="xs mono" text-anchor="middle">effect B</text>
<line x1="470" y1="264" x2="470" y2="286" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f6)"/>
<rect x="410" y="290" width="120" height="26" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="410" y="290" width="120" height="26" rx="3" fill="none" stroke="#5ac878" stroke-width="1.1"/>
<text x="470" y="307" class="xs mono" text-anchor="middle">composite</text>
<rect x="600" y="128" width="116" height="26" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.2"/>
<rect x="600" y="128" width="116" height="26" rx="3" fill="none" stroke="#9b7ede" stroke-width="1.1"/>
<text x="658" y="145" class="xs mono" text-anchor="middle">scratch A</text>
<line x1="532" y1="141" x2="596" y2="141" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f6)"/>
<text x="658" y="168" class="xs muted" text-anchor="middle">live [1, 2]</text>
<rect x="600" y="236" width="116" height="26" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.2"/>
<rect x="600" y="236" width="116" height="26" rx="3" fill="none" stroke="#9b7ede" stroke-width="1.1"/>
<text x="658" y="253" class="xs mono" text-anchor="middle">scratch B</text>
<line x1="532" y1="249" x2="596" y2="249" class="ink-soft" stroke-width="1.1" marker-end="url(#e-s-l617f6)"/>
<text x="658" y="276" class="xs muted" text-anchor="middle">live [3, 4]</text>
<text x="420" y="336" class="xs muted" text-anchor="start">A dies before B is born, so BOTH land</text>
<text x="420" y="350" class="xs muted" text-anchor="start">on pool slot 1 and 131,072 bytes come</text>
<text x="420" y="364" class="xs muted" text-anchor="start">back (§7.3).</text>
</svg>
