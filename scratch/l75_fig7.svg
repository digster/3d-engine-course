<svg viewBox="0 0 760 388" role="img" aria-labelledby="f75g-t f75g-d">
  <title id="f75g-t">The metric, and why it was rewritten</title>
  <desc id="f75g-d">The cosine is flat near zero where the sine is linear, so a dot-product metric loses small angles; the path integral on the right shows the consequence.</desc>
