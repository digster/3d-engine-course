<text x="202.0" y="279.0" class="xs muted" text-anchor="middle">Ω, radians, 0 to 0.25</text>
<text x="202.0" y="294.0" class="xs muted" text-anchor="middle">shaded (height exaggerated): everything here rounds to a dot of exactly 1</text>
<line x1="58.0" y1="308.0" x2="78.0" y2="308.0" stroke="#7ebcf8" stroke-width="2.0" fill="none"/>
<text x="84.0" y="312.0" class="xs mono muted" text-anchor="start">|v| = sin Ω   (linear in the angle)</text>
<line x1="58.0" y1="323.0" x2="78.0" y2="323.0" stroke="#eca856" stroke-width="2.0" fill="none"/>
<text x="84.0" y="327.0" class="xs mono muted" text-anchor="start">1 − cos Ω   (quadratic)</text>
<text x="565.0" y="56.0" class="xs muted" text-anchor="middle">slerp's own geodesic, summed 4,096 times</text>
<text x="565.0" y="48.0" class="sm" text-anchor="middle"></text>
<text x="565.0" y="64.0" class="xs muted" text-anchor="middle"></text>
<rect x="398.0" y="78.0" width="334.0" height="132" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<rect x="406.0" y="98.0" width="210.0" height="14.96" rx="2" fill="#8f918a" stroke="#8f918a" stroke-width="1.0" fill-opacity="0.85"/>
<text x="406.0" y="91.0" class="xs muted" text-anchor="start">endpoints, straight</text>
<text x="620.0" y="109.96000000000001" class="xs mono" text-anchor="start">150.0000°</text>
<rect x="406.0" y="142.0" width="210.0" height="14.96" rx="2" fill="#7ebcf8" stroke="#7ebcf8" stroke-width="1.0" fill-opacity="0.85"/>
<text x="406.0" y="135.0" class="xs muted" text-anchor="start">atan2 form (7.5)</text>
<text x="620.0" y="153.96" class="xs mono" text-anchor="start">150.0000°</text>
<rect x="406.0" y="186.0" width="123.68118000000001" height="14.96" rx="2" fill="#eca856" stroke="#eca856" stroke-width="1.0" fill-opacity="0.85"/>
<text x="406.0" y="179.0" class="xs muted" text-anchor="start">acos form (7.4)</text>
<text x="533.68118" y="197.96" class="xs mono" text-anchor="start">88.3437°</text>
<text x="398.0" y="236.0" class="xs t-bad" text-anchor="start">the acos form scores slerp at −41.10% of its own arc</text>
<text x="398.0" y="252.0" class="xs muted" text-anchor="start">Each step is 0.037°, and the acos form's floor is</text>
<text x="398.0" y="265.0" class="xs muted" text-anchor="start">2·√(2·eps) = 0.0560°. Every step is below it, so every</text>
<text x="398.0" y="278.0" class="xs muted" text-anchor="start">step is quantised DOWN, and 4,096 of them accumulate.</text>
<text x="398.0" y="291.0" class="xs muted" text-anchor="start">The error is biased, not noisy, which is why it does</text>
<text x="398.0" y="304.0" class="xs muted" text-anchor="start">not average out.</text>
</svg>
