<svg viewBox="0 0 720 336" role="img" aria-labelledby="l54f6-t l54f6-d">
  <title id="l54f6-t">The measured cost and benefit of the conversion</title>
  <desc id="l54f6-d">Left: the sandbox mesh cache key shrinking from five tests to two. Right: a table of before and after numbers for the mesh view size, scene_object size, cache lines per object, resolution cost, and the golden shot hash.</desc>
  <defs>
    <marker id="e-i-l54f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l54f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l54f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l54f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l54f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Measured, not asserted.</text>
<text x="24" y="48" class="xs t-hi" text-anchor="start">THE CACHE KEY IN sandbox</text>
<rect x="24" y="58" width="372" height="92" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.12"/>
<text x="34" y="74" class="xs mono" text-anchor="start">key == m.vertices.data()</text>
<text x="34" y="90" class="xs mono" text-anchor="start">&amp;&amp; style == style</text>
<text x="34" y="106" class="xs mono" text-anchor="start">&amp;&amp; cpu.vertices.size() &gt;= m.vertices.size()</text>
<text x="34" y="122" class="xs mono" text-anchor="start">&amp;&amp; source_vertices == m.vertices.size()</text>
<text x="34" y="138" class="xs mono" text-anchor="start">&amp;&amp; source_indices == m.indices.size()</text>
<text x="24" y="166" class="xs muted" text-anchor="start">five tests, four of them present only because an address can be reused</text>
<line x1="210" y1="176" x2="210" y2="200" class="hi" stroke-width="1.4" marker-end="url(#e-h-l54f6)"/>
<rect x="24" y="208" width="372" height="30" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="34" y="227" class="xs mono" text-anchor="start">source == handle &amp;&amp; style == style</text>
<text x="24" y="254" class="xs muted" text-anchor="start">two. A handle IS an identity; an address only resembles one.</text>
<line x1="420" y1="40" x2="420" y2="272" class="grid" stroke-width="1.0"/>
<text x="444" y="48" class="xs muted" text-anchor="start">what</text>
<text x="612" y="48" class="xs muted" text-anchor="end">before</text>
<text x="676" y="48" class="xs muted" text-anchor="end">after</text>
<line x1="444" y1="56" x2="696" y2="56" class="grid" stroke-width="1.0"/>
<text x="444" y="78" class="xs" text-anchor="start">mesh view → handle</text>
<text x="612" y="78" class="xs mono muted" text-anchor="end">64 B</text>
<text x="676" y="78" class="xs mono t-hi" text-anchor="end">4 B</text>
<text x="444" y="93" class="xs muted" text-anchor="start">16x smaller</text>
<line x1="444" y1="102" x2="696" y2="102" class="grid" stroke-width="1.0" stroke-dasharray="2 3"/>
<text x="444" y="118" class="xs" text-anchor="start">scene_object</text>
<text x="612" y="118" class="xs mono muted" text-anchor="end">160 B</text>
<text x="676" y="118" class="xs mono t-hi" text-anchor="end">96 B</text>
<text x="444" y="133" class="xs muted" text-anchor="start">40% smaller</text>
<line x1="444" y1="142" x2="696" y2="142" class="grid" stroke-width="1.0" stroke-dasharray="2 3"/>
<text x="444" y="158" class="xs" text-anchor="start">cache lines / object</text>
<text x="612" y="158" class="xs mono muted" text-anchor="end">2.50</text>
<text x="676" y="158" class="xs mono t-hi" text-anchor="end">1.50</text>
<text x="444" y="173" class="xs muted" text-anchor="start">5.6 needs this</text>
<line x1="444" y1="182" x2="696" y2="182" class="grid" stroke-width="1.0" stroke-dasharray="2 3"/>
<text x="444" y="198" class="xs" text-anchor="start">resolve vs dereference</text>
<text x="612" y="198" class="xs mono muted" text-anchor="end">0.85 ns</text>
<text x="676" y="198" class="xs mono t-hi" text-anchor="end">0.98 ns</text>
<text x="444" y="213" class="xs muted" text-anchor="start">+0.13 ns</text>
<line x1="444" y1="222" x2="696" y2="222" class="grid" stroke-width="1.0" stroke-dasharray="2 3"/>
<text x="444" y="238" class="xs" text-anchor="start">golden shot</text>
<text x="612" y="238" class="xs mono muted" text-anchor="end">905BF27E</text>
<text x="676" y="238" class="xs mono t-hi" text-anchor="end">905BF27E</text>
<text x="444" y="253" class="xs muted" text-anchor="start">0 bytes differ</text>
<text x="24" y="292" class="xs" text-anchor="start">The resolution is 0.13 ns dearer than a dereference — well under one cycle, because both extra loads hit L1.</text>
<text x="24" y="310" class="xs" text-anchor="start">At one resolution per OBJECT per frame, a 4,096-object scene pays 0.48 us: 0.003% of a 60 Hz budget.</text>
<text x="24" y="328" class="xs t-hi" text-anchor="start">At one per VERTEX it would be a different conversation, which is why the renderer resolves at the top of the loop.</text>
</svg>
