<svg viewBox="0 0 720 420" role="img" aria-labelledby="l64f4-t l64f4-d">
  <title id="l64f4-t">Fresnel reflectance against angle, exact and approximated</title>
  <desc id="l64f4-d">Exact unpolarised Fresnel reflectance for water, glass and diamond, all rising from their normal-incidence value F0 to exactly 1 at grazing incidence. Schlick's approximation for glass is drawn dashed over the exact curve: it is exact at both ends by construction, worst by 0.0357 in absolute terms near 85 degrees, and worst by 23.2 percent in relative terms around 55 degrees.</desc>
