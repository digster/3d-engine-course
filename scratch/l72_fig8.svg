<svg viewBox="0 0 760 416" role="img" aria-labelledby="f72i-t f72i-d">
  <title id="f72i-t">Excess turning, Euler lerp against slerp</title>
  <desc id="f72i-d">A bar chart of wasted turning for four blends that use identical angle changes at four different pitches. The amber bars, for interpolating three Euler angles, read 209.5 per cent near gimbal lock, then 62.5, 22.5 and 26.7 per cent further away. Beside each, the spherical interpolation's result is drawn as a flat mark on the baseline, labelled zero point zero zero per cent, because it performs exactly the turning the move requires at every pose.</desc>
  <defs>
    <marker id="e-i-f72i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f72i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f72i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f72i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f72i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="128" y="56" width="440" height="236" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<line x1="128" y1="292.0" x2="568" y2="292.0" class="grid" stroke-width="1.0"/>
<text x="118" y="296.0" class="xs muted" text-anchor="end">0%</text>
<line x1="128" y1="240.69565217391306" x2="568" y2="240.69565217391306" class="grid" stroke-width="1.0"/>
<text x="118" y="244.69565217391306" class="xs muted" text-anchor="end">50%</text>
<line x1="128" y1="189.3913043478261" x2="568" y2="189.3913043478261" class="grid" stroke-width="1.0"/>
<text x="118" y="193.3913043478261" class="xs muted" text-anchor="end">100%</text>
<line x1="128" y1="138.08695652173913" x2="568" y2="138.08695652173913" class="grid" stroke-width="1.0"/>
<text x="118" y="142.08695652173913" class="xs muted" text-anchor="end">150%</text>
<line x1="128" y1="86.78260869565219" x2="568" y2="86.78260869565219" class="grid" stroke-width="1.0"/>
<text x="118" y="90.78260869565219" class="xs muted" text-anchor="end">200%</text>
<rect x="150.0" y="77.03478260869565" width="30.0" height="214.96521739130435" rx="2" fill="#f0961e" stroke="#f0961e" stroke-width="1.2"/>
<text x="165.0" y="69.03478260869565" class="xs" text-anchor="middle">209.5%</text>
<line x1="186.0" y1="292.0" x2="216.0" y2="292.0" stroke="#5082e6" stroke-width="4.0" fill="none"/>
<text x="201.0" y="282" class="xs t-ok" text-anchor="middle">0.00%</text>
<text x="183.0" y="312" class="xs muted" text-anchor="middle">87° → 30°</text>
<text x="183.0" y="328" class="xs muted" text-anchor="middle">(near lock)</text>
<rect x="260.0" y="227.8695652173913" width="30.0" height="64.13043478260869" rx="2" fill="#f0961e" stroke="#f0961e" stroke-width="1.2"/>
<text x="275.0" y="219.8695652173913" class="xs" text-anchor="middle">62.5%</text>
<line x1="296.0" y1="292.0" x2="326.0" y2="292.0" stroke="#5082e6" stroke-width="4.0" fill="none"/>
<text x="311.0" y="282" class="xs t-ok" text-anchor="middle">0.00%</text>
<text x="293.0" y="312" class="xs muted" text-anchor="middle">47° → -10°</text>
<rect x="370.0" y="268.9130434782609" width="30.0" height="23.086956521739125" rx="2" fill="#f0961e" stroke="#f0961e" stroke-width="1.2"/>
<text x="385.0" y="260.9130434782609" class="xs" text-anchor="middle">22.5%</text>
<line x1="406.0" y1="292.0" x2="436.0" y2="292.0" stroke="#5082e6" stroke-width="4.0" fill="none"/>
<text x="421.0" y="282" class="xs t-ok" text-anchor="middle">0.00%</text>
<text x="403.0" y="312" class="xs muted" text-anchor="middle">20° → -37°</text>
<rect x="480.0" y="264.60347826086957" width="30.0" height="27.396521739130435" rx="2" fill="#f0961e" stroke="#f0961e" stroke-width="1.2"/>
<text x="495.0" y="256.60347826086957" class="xs" text-anchor="middle">26.7%</text>
<line x1="516.0" y1="292.0" x2="546.0" y2="292.0" stroke="#5082e6" stroke-width="4.0" fill="none"/>
<text x="531.0" y="282" class="xs t-ok" text-anchor="middle">0.00%</text>
<text x="513.0" y="312" class="xs muted" text-anchor="middle">0° → -57°</text>
<text x="348.0" y="352" class="xs muted" text-anchor="middle">the same three angle deltas, run at four distances from gimbal lock</text>
<text x="44" y="166.0" class="xs muted" text-anchor="middle">excess</text>
<text x="44" y="182.0" class="xs muted" text-anchor="middle">turning</text>
<rect x="580" y="62" width="140" height="86" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<rect x="588" y="74" width="16" height="9" rx="2" fill="#f0961e" stroke="#f0961e" stroke-width="1.2"/>
<text x="612" y="82" class="xs" text-anchor="start">Euler lerp</text>
<line x1="588.0" y1="100.0" x2="604.0" y2="100.0" stroke="#5082e6" stroke-width="4.0" fill="none"/>
<text x="612" y="104" class="xs" text-anchor="start">slerp</text>
<text x="588" y="128" class="xs muted" text-anchor="start">2,048 steps each</text>
<text x="380.0" y="370" class="xs muted" text-anchor="middle">the amber column varies by a factor of nine with the POSE, for moves that are identical in the angles</text>
<text x="380.0" y="396" class="xs muted" text-anchor="middle">the blue one cannot vary: a geodesic performs the turning required and there is no other number it could report</text>
</svg>
