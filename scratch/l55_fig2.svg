<svg viewBox="0 0 720 336" role="img" aria-labelledby="l55f2-t l55f2-d">
  <title id="l55f2-t">A name resolving through an ordered list of roots</title>
  <desc id="l55f2-d">The name torus.obj is passed to search_path::resolve, which tries three roots in order; the first, a mod directory, answers, and the result is an absolute path.</desc>
  <defs>
    <marker id="e-i-l55f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l55f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l55f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l55f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l55f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">A NAME is not a PATH, and keeping them different types in your head is what makes the rest possible.</text>
<rect x="24" y="44" width="200" height="30" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.16"/>
<text x="124" y="63" class="sm mono" text-anchor="middle">"torus.obj"</text>
<text x="24" y="90" class="xs muted" text-anchor="start">a NAME: stable, recorded in a scene</text>
<text x="24" y="104" class="xs muted" text-anchor="start">file, and the key the store caches on</text>
<line x1="228" y1="59" x2="292" y2="59" class="hi" stroke-width="1.4" marker-end="url(#e-h-l55f2)"/>
<text x="300" y="50" class="xs mono t-hi" text-anchor="start">search_path::resolve()</text>
<text x="300" y="64" class="xs muted" text-anchor="start">first root that answers wins</text>
<text x="24" y="128" class="xs t-hi" text-anchor="start">ROOTS, searched in order</text>
<rect x="24" y="140" width="250" height="26" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.18"/>
<text x="36" y="157" class="xs mono" text-anchor="start">0  mods/dragon_pack/</text>
<text x="288" y="157" class="xs muted" text-anchor="start">a mod, a localisation, a test fixture</text>
<text x="660" y="157" class="xs t-ok" text-anchor="end">HIT</text>
<rect x="24" y="174" width="250" height="26" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<rect x="24" y="174" width="250" height="26" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="36" y="191" class="xs mono" text-anchor="start">1  &lt;exe&gt;/assets/</text>
<text x="288" y="191" class="xs muted" text-anchor="start">what the build copied beside the binary</text>
<rect x="24" y="208" width="250" height="26" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<rect x="24" y="208" width="250" height="26" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="36" y="225" class="xs mono" text-anchor="start">2  &lt;exe&gt;/dlc_02/</text>
<text x="288" y="225" class="xs muted" text-anchor="start">additional content, searched last</text>
<line x1="24" y1="254" x2="696" y2="254" class="grid" stroke-width="1.0"/>
<rect x="24" y="264" width="480" height="26" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="36" y="281" class="xs mono" text-anchor="start">/Users/…/mods/dragon_pack/torus.obj</text>
<text x="520" y="281" class="xs muted" text-anchor="start">a PATH: where that name</text>
<text x="520" y="295" class="xs muted" text-anchor="start">resolved TODAY, on this machine</text>
<text x="24" y="318" class="xs" text-anchor="start">ORDER IS THE WHOLE FEATURE: put a directory in front and everything in it shadows the shipped asset of the same name —</text>
<text x="24" y="332" class="xs" text-anchor="start">without moving, renaming or deleting anything. Store the name; compute the path.</text>
</svg>
