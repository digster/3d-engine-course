<text x="90.0" y="230" class="xs t-ok" text-anchor="middle">90 codes</text>
<text x="390.0" y="230" class="xs muted" text-anchor="middle">68 codes in the brightest half</text>
<text x="360.0" y="262" class="xs muted" text-anchor="middle">← both rows are the same 256 codes, positioned by how much LIGHT each one emits →</text>
<line x1="24" y1="288" x2="696" y2="288" class="grid" stroke-width="1.2"/>
<text x="24" y="312" class="xs t-hi" text-anchor="start">THE EYE JUDGES RATIOS, NOT DIFFERENCES.</text>
<text x="24" y="330" class="xs muted" text-anchor="start">The step from 0.01 to 0.02 of white is obvious; the step from 0.90 to 0.91 is invisible. Both are 0.01 of light. So codes</text>
<text x="24" y="346" class="xs muted" text-anchor="start">should be spaced so that each STEP is a similar ratio — which is what a power curve does, and it is why the encoding is</text>
<text x="24" y="362" class="xs muted" text-anchor="start">not an accident of old CRT hardware but a compression scheme that outlived the hardware it was named for.</text>
<text x="24" y="386" class="xs t-hi" text-anchor="start">8 bits of LINEAR light would need about 12 to look as smooth. That is what the curve buys.</text>
</svg>
