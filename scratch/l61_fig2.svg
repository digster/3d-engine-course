<svg viewBox="0 0 720 400" role="img" aria-labelledby="l61f2-t l61f2-d">
  <title id="l61f2-t">How 256 codes are distributed across the light range</title>
  <desc id="l61f2-d">Two strips, each showing 256 codes positioned by the light they emit. Spaced evenly in light, only 26 fall in the darkest tenth; spaced by the sRGB curve, 90 do.</desc>
  <defs>
    <marker id="e-i-l61f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l61f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l61f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l61f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l61f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Why the curve exists at all: 256 codes are a BUDGET, and the eye does not spend attention evenly.</text>
<text x="60" y="60" class="xs t-bad" text-anchor="start">spaced evenly in LIGHT</text>
