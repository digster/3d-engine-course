<svg viewBox="0 0 880 330" role="img" aria-labelledby="l618bf8-t l618bf8-d">
  <title id="l618bf8-t">The bounce, stepped</title>
  <desc id="l618bf8-d">Height against time for a particle dropped from one metre, stepped at 1/60 s and at 1/240 s. The coarse step's bounces keep 0.185, 0.172 and 0.103 of the previous height; the fine step's keep 0.197, 0.196 and 0.181, approaching the continuous e squared of 0.2025.</desc>
