  <text x="227.0" y="264.0" class="xs muted" text-anchor="middle">triangle circumradius, pixels (smaller to the right)</text>
  <text x="34.0" y="138.0" class="xs muted" transform="rotate(-90 34.0 138.0)" text-anchor="middle">lane efficiency</text>
