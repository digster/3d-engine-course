  <text x="470.0" y="72.0" class="xs muted">quad vs scanline, real scene</text>
  <text x="470.0" y="92.0" class="xs mono muted">tris</text>
  <text x="618.0" y="92.0" class="xs mono muted" text-anchor="end">slower by</text>
  <text x="470.0" y="107.0" class="xs mono">66</text>
  <text x="618.0" y="107.0" class="xs mono" text-anchor="end">1.04&#215;</text>
  <text x="470.0" y="122.0" class="xs mono">258</text>
  <text x="618.0" y="122.0" class="xs mono" text-anchor="end">1.16&#215;</text>
  <text x="470.0" y="137.0" class="xs mono">1,026</text>
  <text x="618.0" y="137.0" class="xs mono" text-anchor="end">1.22&#215;</text>
  <text x="470.0" y="152.0" class="xs mono">2,306</text>
  <text x="618.0" y="152.0" class="xs mono" text-anchor="end">1.24&#215;</text>
  <text x="470.0" y="167.0" class="xs mono">9,218</text>
  <text x="618.0" y="167.0" class="xs mono" text-anchor="end">1.34&#215;</text>
  <text x="470.0" y="182.0" class="xs mono">36,866</text>
  <text x="618.0" y="182.0" class="xs mono" text-anchor="end">1.38&#215;</text>
  <text x="470.0" y="207.0" class="xs muted">and 1/efficiency</text>
  <text x="470.0" y="221.0" class="xs muted">predicts every row</text>
  <text x="470.0" y="235.0" class="xs muted">to within 0.09&#215;.</text>
