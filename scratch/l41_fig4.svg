  <text x="68.0" y="188.0" class="xs mono muted" text-anchor="end">25%</text>
  <line x1="74.0" y1="138.0" x2="380.0" y2="138.0" class="grid" stroke-width="0.8"/>
  <text x="68.0" y="141.0" class="xs mono muted" text-anchor="end">50%</text>
  <line x1="74.0" y1="91.0" x2="380.0" y2="91.0" class="grid" stroke-width="0.8"/>
  <text x="68.0" y="94.0" class="xs mono muted" text-anchor="end">75%</text>
  <line x1="74.0" y1="44.0" x2="380.0" y2="44.0" class="grid" stroke-width="0.8"/>
  <text x="68.0" y="47.0" class="xs mono muted" text-anchor="end">100%</text>
  <text x="74.0" y="247.0" class="xs mono muted" text-anchor="middle">64</text>
