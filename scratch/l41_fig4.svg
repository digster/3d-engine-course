<svg viewBox="0 0 640 300" role="img" aria-labelledby="f412-t f412-d">
  <title id="f412-t">Lane efficiency against triangle size, for four block widths</title>
  <desc id="f412-d">Four curves of lane efficiency against triangle circumradius, on a log axis running from 64 pixels down to 2. The 2 by 2 curve falls from 96 per cent to 50 per cent; the 16 by 16 curve falls from 61 per cent to 1 per cent. At a circumradius of 8 pixels the two differ by 75.5 against 8.9 per cent. A dashed reference line marks the Module 3 scene at 87.4 per cent, and a table beside the chart gives the measured slowdown of the quad traversal against the scanline one, from 1.04 to 1.38 times.</desc>
