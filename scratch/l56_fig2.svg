<rect x="146" y="174" width="34" height="14" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="207" y="174" width="34" height="14" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="268" y="174" width="34" height="14" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="329" y="174" width="34" height="14" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.16"/>
<text x="440" y="152" class="xs muted" text-anchor="start">Eight bytes each, then a load to</text>
<text x="440" y="166" class="xs muted" text-anchor="start">somewhere else. Free while the</text>
<text x="440" y="180" class="xs muted" text-anchor="start">objects stay in cache; not free</text>
<text x="440" y="194" class="xs muted" text-anchor="start">afterwards.</text>
<text x="24" y="208" class="xs t-hi" text-anchor="start">SoA — three parallel arrays: position, rotation, scale.</text>
<rect x="24" y="214" width="200" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="124.0" y="229" class="xs" text-anchor="middle">position[]</text>
<rect x="228" y="214" width="260" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="358.0" y="229" class="xs" text-anchor="middle">rotation[]</text>
<rect x="492" y="214" width="180" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="582.0" y="229" class="xs" text-anchor="middle">scale[]</text>
<text x="24" y="252" class="xs muted" text-anchor="start">Every byte fetched is a byte wanted. A loop that needs only one array touches only one array.</text>
<text x="24" y="274" class="xs t-hi" text-anchor="start">TREE — nodes linked by pointers, walked depth-first.</text>
<rect x="24" y="280" width="60" height="22" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.2"/>
<text x="54.0" y="295" class="xs" text-anchor="middle">root</text>
<text x="24" y="318" class="xs muted" text-anchor="start"></text>
<rect x="100" y="280" width="60" height="22" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.2"/>
<line x1="86" y1="291" x2="98" y2="291" class="ink-soft" stroke-width="1.0" marker-end="url(#e-s-l56f2)"/>
<rect x="176" y="280" width="60" height="22" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.2"/>
<line x1="162" y1="291" x2="174" y2="291" class="ink-soft" stroke-width="1.0" marker-end="url(#e-s-l56f2)"/>
<rect x="252" y="280" width="60" height="22" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.2"/>
<line x1="238" y1="291" x2="250" y2="291" class="ink-soft" stroke-width="1.0" marker-end="url(#e-s-l56f2)"/>
<rect x="328" y="280" width="60" height="22" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.2"/>
