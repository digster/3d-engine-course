<svg viewBox="0 0 720 330" role="img" aria-labelledby="l56f2-t l56f2-d">
  <title id="l56f2-t">Four scene layouts drawn as memory</title>
  <desc id="l56f2-d">A flat array of 96-byte objects; an array of pointers into a scattered heap; three parallel arrays; and a chain of linked nodes.</desc>
  <defs>
    <marker id="e-i-l56f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l56f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l56f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l56f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l56f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">The same scene, six ways. Shading marks the bytes the full-transform loop actually reads.</text>
<text x="24" y="40" class="xs t-hi" text-anchor="start">FLAT — an array of scene_object. What the engine has.</text>
<rect x="24" y="46" width="46" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="47.0" y="61" class="xs" text-anchor="middle">T</text>
<rect x="70" y="46" width="28" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="98" y="46" width="46" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="121.0" y="61" class="xs" text-anchor="middle">T</text>
<rect x="144" y="46" width="28" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="172" y="46" width="46" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="195.0" y="61" class="xs" text-anchor="middle">T</text>
<rect x="218" y="46" width="28" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="246" y="46" width="46" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="269.0" y="61" class="xs" text-anchor="middle">T</text>
<rect x="292" y="46" width="28" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="320" y="46" width="46" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="343.0" y="61" class="xs" text-anchor="middle">T</text>
<rect x="366" y="46" width="28" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<rect x="394" y="46" width="46" height="22" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="417.0" y="61" class="xs" text-anchor="middle">T</text>
<rect x="440" y="46" width="28" height="22" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.18"/>
<text x="24" y="84" class="xs muted" text-anchor="start">One stride, one direction, hardware prefetch works. 96 B apart; 36 of every 96 are read for nothing.</text>
<text x="24" y="116" class="xs t-hi" text-anchor="start">POINTERS — an array of scene_object*, objects on the heap.</text>
<rect x="24" y="122" width="30" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="39.0" y="137" class="xs" text-anchor="middle">p</text>
<rect x="98" y="122" width="30" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="113.0" y="137" class="xs" text-anchor="middle">p</text>
<rect x="172" y="122" width="30" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="187.0" y="137" class="xs" text-anchor="middle">p</text>
<rect x="246" y="122" width="30" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="261.0" y="137" class="xs" text-anchor="middle">p</text>
<rect x="320" y="122" width="30" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="335.0" y="137" class="xs" text-anchor="middle">p</text>
<rect x="394" y="122" width="30" height="22" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="409.0" y="137" class="xs" text-anchor="middle">p</text>
<text x="24" y="160" class="xs muted" text-anchor="start"></text>
