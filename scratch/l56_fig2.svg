<line x1="390" y1="291" x2="402" y2="291" class="ink-soft" stroke-width="1.0" marker-end="url(#e-s-l56f2)"/>
<text x="24" y="318" class="xs muted" text-anchor="start">The address of the next node is INSIDE the current one, so the CPU cannot start fetching it until this one arrives. Figure 3 is that sentence.</text>
</svg>
