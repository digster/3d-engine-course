<svg viewBox="0 0 720 300" role="img" aria-labelledby="l512f6-t l512f6-d">
  <title id="l512f6-t">The cube spans plus or minus a half; the icosahedron has radius one</title>
  <desc id="l512f6-d">Side by side: cube_mesh spans plus or minus 0.5 so a transform's scale is the box's full size, while icosahedron_mesh has circumradius 1.0 so its scale is a radius. At the same scale the icosahedron is twice the diameter.</desc>
  <defs>
    <marker id="e-i-l512f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l512f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l512f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l512f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l512f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">“Unit” means two different things in one header.</text>
<line x1="42.39999999999999" y1="150" x2="297.6" y2="150" class="grid" stroke-width="1.0"/>
<line x1="170" y1="51.400000000000006" x2="170" y2="248.6" class="grid" stroke-width="1.0"/>
<rect x="141.0" y="121.0" width="58" height="58" rx="3" fill="none" stroke="#f0961e" stroke-width="1.6"/>
<text x="170" y="111.0" class="xs mono" text-anchor="middle">cube_mesh()</text>
<text x="170" y="195.0" class="xs" text-anchor="middle">spans ±0.5</text>
<text x="170" y="209.0" class="xs t-hi" text-anchor="middle">scale = FULL SIZE</text>
<line x1="372.4" y1="150" x2="627.6" y2="150" class="grid" stroke-width="1.0"/>
<line x1="500" y1="51.400000000000006" x2="500" y2="248.6" class="grid" stroke-width="1.0"/>
<polygon points="550.2,179.0 500.0,208.0 449.8,179.0 449.8,121.0 500.0,92.0 550.2,121.0" fill="none" stroke="#5082e6" stroke-width="1.6"/>
<circle cx="500" cy="150" r="58" class="ink-soft" fill="none" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="500" y="82" class="xs mono" text-anchor="middle">icosahedron_mesh()</text>
<text x="500" y="224" class="xs" text-anchor="middle">circumradius 1.0</text>
<text x="500" y="238" class="xs t-hi" text-anchor="middle">scale = RADIUS</text>
<line x1="199.0" y1="97.0" x2="442" y2="68" stroke="#e05c5c" stroke-width="1.3" marker-end="url(#e-b-l512f6)"/>
<text x="335.0" y="62" class="xs t-bad" text-anchor="middle">2× the diameter at the same scale</text>
<line x1="24" y1="240" x2="696" y2="240" class="grid" stroke-width="1.0"/>
<text x="24" y="258" class="xs t-bad" text-anchor="start">THIS FILE GOT IT WRONG THREE TIMES:</text>
<text x="24" y="274" class="xs muted" text-anchor="start">the floor (a quarter of its area), the pillars (half-buried), and the debug boxes (exactly 2× too big,</text>
<text x="24" y="288" class="xs muted" text-anchor="start">which looks like a collision margin). box_at() exists so it only had to be understood once.</text>
</svg>
