<svg viewBox="0 0 720 340" role="img" aria-labelledby="l68f7-t l68f7-d">
  <title id="l68f7-t">Why the comparison comes before the filter</title>
  <desc id="l68f7-d">Two panels comparing a receiver at depth 0.5 against stored occluders at 0.3 and 0.9. Filtering first gives a mean depth of 0.6, which reports the receiver fully lit. Comparing first gives visibilities of 0 and 1, whose mean is 0.5.</desc>
  <defs>
    <marker id="e-i-l68f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l68f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l68f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l68f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l68f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="0" y="0" width="720" height="340" class="bg"/>
<text x="360.0" y="22" class="sm" text-anchor="middle">Averaging depths is not a blurrier answer. It is a wrong one.</text>
<rect x="20" y="40" width="328" height="232" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="184" y="60" class="sm" text-anchor="middle">filter, then compare</text>
<rect x="372" y="40" width="328" height="232" rx="3" fill="none" stroke="#5ac878" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="536" y="60" class="sm" text-anchor="middle">compare, then filter</text>
<line x1="60" y1="86" x2="308" y2="86" class="ink" stroke-width="1.6"/>
<text x="184" y="78" class="xs" text-anchor="middle">the light</text>
<line x1="102" y1="86" x2="102" y2="124" stroke="#f0961e" stroke-width="3"/>
<circle cx="102" cy="124" r="4" fill="#f0961e"/>
<text x="114" y="128.4" class="xs" text-anchor="start">0.3</text>
<line x1="218" y1="86" x2="218" y2="201" stroke="#f0961e" stroke-width="3"/>
<circle cx="218" cy="201" r="4" fill="#f0961e"/>
<text x="230" y="205.2" class="xs" text-anchor="start">0.9</text>
<line x1="72" y1="150.0" x2="296" y2="150.0" class="grid" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="306" y="154.0" class="xs" text-anchor="start">0.5</text>
<line x1="80" y1="162.8" x2="288" y2="162.8" class="ink" stroke-width="2.0"/>
<text x="184" y="232" class="xs" text-anchor="middle">mean depth 0.6 &gt; 0.5  →  FULLY LIT</text>
<text x="184" y="250" class="xs" text-anchor="middle">…with half its taps occluded</text>
<line x1="412" y1="86" x2="660" y2="86" class="ink" stroke-width="1.6"/>
<text x="536" y="78" class="xs" text-anchor="middle">the light</text>
<line x1="454" y1="86" x2="454" y2="124" stroke="#f0961e" stroke-width="3"/>
<circle cx="454" cy="124" r="4" fill="#f0961e"/>
<text x="466" y="128.4" class="xs" text-anchor="start">0.3</text>
<line x1="570" y1="86" x2="570" y2="201" stroke="#f0961e" stroke-width="3"/>
<circle cx="570" cy="201" r="4" fill="#f0961e"/>
<text x="582" y="205.2" class="xs" text-anchor="start">0.9</text>
<line x1="424" y1="150.0" x2="648" y2="150.0" class="grid" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="658" y="154.0" class="xs" text-anchor="start">0.5</text>
<text x="460" y="232" class="xs" text-anchor="middle">0.3 &lt; 0.5 → 0</text>
<text x="604" y="232" class="xs" text-anchor="middle">0.9 &gt; 0.5 → 1</text>
<text x="536" y="250" class="xs" text-anchor="middle">mean visibility 0.5  →  HALF SHADOWED</text>
<line x1="60" y1="288" x2="660" y2="288" class="grid" stroke-width="1.0"/>
<text x="64" y="306" class="xs" text-anchor="start">That is the whole reason SamplerComparisonState exists: the hardware tests each texel</text>
<text x="64" y="324" class="xs" text-anchor="start">before it filters. And a 3x3 kernel reaches 2.1213 texels, not 0.7071 — so the bias must widen with it.</text>
</svg>
