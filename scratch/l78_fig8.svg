<svg viewBox="0 0 900 400" role="img" aria-labelledby="l78f8-t l78f8-d">
  <title id="l78f8-t">Linear-interpolation resampling and the signal-to-noise it achieves</title>
  <desc id="l78f8-d">Left: ten source samples at 44.1 kHz with the 48 kHz output samples landing on the chords between them rather than on the curve. Right: bars showing 62.40 dB for our linear resampler, 85.05 dB for SDL's and 91.67 dB for not resampling, and a table showing ours falling from 89 dB at 200 Hz to 20.43 dB at 10 kHz.</desc>
