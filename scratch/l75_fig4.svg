<text x="388.0" y="188.0" class="xs muted" text-anchor="start">longest journey with nearest</text>
<text x="720.0" y="188.0" class="xs mono t-ok" text-anchor="end">179.9938°</text>
<line x1="384.0" y1="198.0" x2="724.0" y2="198.0" class="grid" stroke-width="1.0"/>
<text x="388.0" y="214.0" class="xs muted" text-anchor="start">CONTROL: longest without it</text>
<text x="720.0" y="214.0" class="xs mono t-bad" text-anchor="end">352.6042°</text>
<text x="376.0" y="254.0" class="xs t-hi" text-anchor="start">nlerp’s version of the same failure is worse:</text>
<text x="376.0" y="269.0" class="xs muted" text-anchor="start">the raw chord passes within 0.00436 of the ORIGIN,</text>
<text x="376.0" y="282.0" class="xs muted" text-anchor="start">where there is no direction left to normalise.</text>
