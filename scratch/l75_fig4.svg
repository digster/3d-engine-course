<svg viewBox="0 0 760 348" role="img" aria-labelledby="f75e-t f75e-d">
  <title id="f75e-t">One missing comparison</title>
  <desc id="f75e-d">Two nearly identical keyframes stored with opposite signs, the 359-degree journey that results, and the measured cost of omitting the shortest-arc comparison.</desc>
  <defs>
    <marker id="e-i-f75e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
