<text x="388.0" y="84.0" class="xs muted" text-anchor="start">separation, angle_between</text>
<text x="720.0" y="84.0" class="xs mono t-ok" text-anchor="end">1.0000°</text>
<line x1="384.0" y1="94.0" x2="724.0" y2="94.0" class="grid" stroke-width="1.0"/>
<text x="388.0" y="110.0" class="xs muted" text-anchor="start">quat_slerp travels</text>
<text x="720.0" y="110.0" class="xs mono t-ok" text-anchor="end">1.0000°</text>
<line x1="384.0" y1="120.0" x2="724.0" y2="120.0" class="grid" stroke-width="1.0"/>
