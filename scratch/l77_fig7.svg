<svg viewBox="0 0 760 372" role="img" aria-labelledby="f77g-t f77g-d">
  <title id="f77g-t">Chain length under the two blends</title>
  <desc id="f77g-d">Chain length plotted against the per-joint difference between two poses. The pose blend holds at exactly five units; the matrix blend falls along the sum of cosines of half the accumulated angle.</desc>
  <defs>
    <marker id="e-i-f77g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f77g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f77g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-f77g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-f77g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-teal-f77g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60c4ce"/></marker></defs>
<text x="380.0" y="30" class="sm" text-anchor="middle">what a matrix blend costs, against what it should cost</text>
<text x="380.0" y="47" class="xs muted" text-anchor="middle">a six-joint chain, five bones of one unit, blended half and half</text>
<rect x="78.0" y="78.0" width="372.0" height="206.0" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
