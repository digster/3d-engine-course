<text x="70.0" y="249.16666666666666" class="xs mono" text-anchor="end">3.0</text>
<text x="70.0" y="217.08333333333331" class="xs mono" text-anchor="end">3.5</text>
<text x="70.0" y="185.0" class="xs mono" text-anchor="end">4.0</text>
<text x="70.0" y="152.91666666666666" class="xs mono" text-anchor="end">4.5</text>
<text x="70.0" y="120.83333333333331" class="xs mono" text-anchor="end">5.0</text>
<text x="104.0" y="300.0" class="xs mono" text-anchor="middle">0°</text>
<text x="175.11111111111111" y="300.0" class="xs mono" text-anchor="middle">10°</text>
<text x="246.22222222222223" y="300.0" class="xs mono" text-anchor="middle">20°</text>
<text x="317.33333333333337" y="300.0" class="xs mono" text-anchor="middle">30°</text>
<text x="424.0" y="300.0" class="xs mono" text-anchor="middle">45°</text>
<text x="264.0" y="318.0" class="xs muted" text-anchor="middle">per-joint difference between the poses</text>
<text x="70.0" y="72.0" class="xs muted" text-anchor="end">chain length</text>
<text x="317.33333333333337" y="104.83333333333331" class="xs" text-anchor="middle">blend the poses</text>
<text x="196.44444444444446" y="225.91666666666666" class="xs" text-anchor="middle">blend the matrices</text>
<text x="494.0" y="84.0" class="xs" text-anchor="start">why that curve</text>
<text x="494.0" y="122.0" class="xs muted" text-anchor="start">Bone k runs from joint k−1 to joint k, so its</text>
<text x="494.0" y="138.0" class="xs muted" text-anchor="start">direction is joint k−1’s own axis. The two poses</text>
<text x="494.0" y="154.0" class="xs muted" text-anchor="start">turn that joint by (k−1)·δ, and a matrix blend</text>
<text x="494.0" y="170.0" class="xs muted" text-anchor="start">averages the two joint POSITIONS — so the bone</text>
<text x="494.0" y="186.0" class="xs muted" text-anchor="start">becomes the average of two unit vectors (k−1)·δ</text>
<text x="494.0" y="202.0" class="xs muted" text-anchor="start">apart, which is cos of half of it.</text>
<text x="494.0" y="218.0" class="xs muted" text-anchor="start"></text>
<text x="494.0" y="234.0" class="xs mono" text-anchor="start">    ∑ cos((k−1)·δ / 2),  k = 1 … 5</text>
<text x="494.0" y="250.0" class="xs muted" text-anchor="start"></text>
<text x="494.0" y="266.0" class="xs mono" text-anchor="start">measured against that: 4.768e-07</text>
<text x="494.0" y="282.0" class="xs mono" text-anchor="start">pose route, worst bone error: 2.980e-07</text>
<text x="380.0" y="350" class="xs muted" text-anchor="middle">the error grows down the chain, so it is worst at hands and feet — which is where props are attached.</text>
</svg>
