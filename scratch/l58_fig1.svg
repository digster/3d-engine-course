  <title id="l58f1-t">One wide struct compared with six components</title>
  <desc id="l58f1-d">Above, a six-field scene_object where a floor and a mover leave fields unused but still pay for them. Below, six component types where each kind of entity simply has a different subset, and an absent component is an absent row.</desc>
