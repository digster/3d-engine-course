<text x="24" y="166" class="xs muted" text-anchor="start">The dashed cells are paid for anyway: they are in the struct, in the array, and in the cache line.</text>
<text x="24" y="180" class="xs muted" text-anchor="start">A “mover” with no geometry is a null handle plus a branch in the renderer.</text>
