<text x="24" y="352" class="xs muted" text-anchor="start">There is no cell to leave blank — an absent component is an absent ROW, in a pool that was never asked about.</text>
<text x="24" y="366" class="xs muted" text-anchor="start">The waypoint is invisible because the render query names `geometry` and it has none. Nobody wrote an `if`.</text>
<text x="24" y="384" class="xs t-hi" text-anchor="start">Same information. The difference is which absences cost something.</text>
