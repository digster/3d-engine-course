<text x="470.0" y="216" class="xs mono" text-anchor="end">d = (4, 0)</text>
<circle cx="380.0" cy="140.0" r="50.0" fill="none" stroke="#5082e6" stroke-width="1.6"/>
<text x="436.0" y="105.0" class="xs" text-anchor="start">obstacle</text>
<circle cx="80.0" cy="200.0" r="50.0" fill="none" stroke="#8f918a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="80.0" y="266.0" class="xs mono" text-anchor="middle">t₀ = 0</text>
<circle cx="290.0" cy="200.0" r="50.0" fill="none" stroke="#8f918a" stroke-width="1.2"/>
<text x="290.01960972" y="266.0" class="xs mono" text-anchor="middle">t₁ = 0.5250</text>
<circle cx="300.0" cy="200.0" r="50.0" fill="none" stroke="#5ac878" stroke-width="1.8"/>
<text x="300.0" y="280.0" class="xs mono" text-anchor="middle">t = 0.55: contact</text>
<line x1="344.7" y1="218.4" x2="317.2" y2="81.2" stroke="#5082e6" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<line x1="377.2" y1="226.0" x2="299.6" y2="109.5" stroke="#5082e6" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<text x="26" y="320.0" class="xs" text-anchor="start">Each dashed line is the plane GJK's direction separates the pair</text>
<text x="26" y="335.0" class="xs" text-anchor="start">by at that iterate. The next ball goes where the mover, sliding</text>
<text x="26" y="350.0" class="xs" text-anchor="start">along d, would first touch that plane — never further. t₂ and t₃</text>
<text x="26" y="365.0" class="xs" text-anchor="start">are within half a millimetre of contact and are drawn as one.</text>
<text x="530" y="30" class="sm" text-anchor="start">f(t) = |(4t − 3, −0.6)| − 1, and Newton's tangents</text>
