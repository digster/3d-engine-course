<svg viewBox="0 0 980 522.5" role="img" aria-labelledby="h3-t h3-d">
  <title id="h3-t">Conservative advancement on two balls, as geometry and as Newton's method</title>
  <desc id="h3-d">Left: a ball moving along +x toward another at (3, 0.6), drawn at the start, at the first Newton iterate and at contact, with the separating plane of each iterate dashed, and a table of the iterates and their errors. Right: the distance f(t) as a convex curve with Newton's tangent steps landing short of the root at t = 0.55, and the same near the root, magnified.</desc>
  <defs>
    <marker id="e-i-h3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-h3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-h3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-h3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-h3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
