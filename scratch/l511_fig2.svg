<svg viewBox="0 0 720 400" role="img" aria-labelledby="l511f2-t l511f2-d">
  <title id="l511f2-t">The include lists of the two debug headers, side by side</title>
  <desc id="l511f2-d">debug_lines.hpp includes only colour, mat4, vec3 and three standard headers. debug_draw.hpp includes debug_lines.hpp plus the depth buffer, framebuffer, mesh, projector and viewport. The dependency runs one way only.</desc>
  <defs>
    <marker id="e-i-l511f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l511f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l511f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l511f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l511f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">Why this is two headers and not one. A header is a contract about what you are forced to compile against.</text>
<rect x="30" y="48" width="300" height="26" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.24"/>
<text x="180" y="66" class="xs mono" text-anchor="middle">gfx/debug_lines.hpp   —   SAYS</text>
<rect x="46" y="84" width="268" height="20" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.09"/>
<text x="180" y="98" class="xs mono" text-anchor="middle">engine/gfx/colour.hpp</text>
<rect x="46" y="110" width="268" height="20" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.09"/>
<text x="180" y="124" class="xs mono" text-anchor="middle">engine/math/mat4.hpp</text>
<rect x="46" y="136" width="268" height="20" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.09"/>
<text x="180" y="150" class="xs mono" text-anchor="middle">engine/math/vec3.hpp</text>
<rect x="46" y="162" width="268" height="20" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.09"/>
<text x="180" y="176" class="xs mono" text-anchor="middle">&lt;span, vector, cstdint&gt;</text>
<text x="180" y="208" class="xs muted" text-anchor="middle">maths, a colour, the standard library</text>
<text x="180" y="226" class="xs t-ok" text-anchor="middle">— and nothing that can draw</text>
<rect x="390" y="48" width="300" height="26" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.24"/>
<text x="540" y="66" class="xs mono" text-anchor="middle">gfx/debug_draw.hpp   —   DOES</text>
<rect x="406" y="84" width="268" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.2"/>
<text x="540" y="98" class="xs mono" text-anchor="middle">debug_lines.hpp</text>
<rect x="406" y="110" width="268" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.09"/>
<text x="540" y="124" class="xs mono" text-anchor="middle">gfx/depth_buffer.hpp</text>
<rect x="406" y="136" width="268" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.09"/>
<text x="540" y="150" class="xs mono" text-anchor="middle">gfx/framebuffer.hpp</text>
<rect x="406" y="162" width="268" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.09"/>
<text x="540" y="176" class="xs mono" text-anchor="middle">gfx/mesh.hpp</text>
<rect x="406" y="188" width="268" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.09"/>
<text x="540" y="202" class="xs mono" text-anchor="middle">gfx/projector.hpp</text>
<rect x="406" y="214" width="268" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.09"/>
<text x="540" y="228" class="xs mono" text-anchor="middle">gfx/viewport.hpp</text>
<text x="540" y="250" class="xs muted" text-anchor="middle">everything the renderer already has</text>
<line x1="330" y1="96" x2="400" y2="96" class="hi" stroke-width="1.4" marker-end="url(#e-h-l511f2)"/>
<text x="365" y="84" class="xs muted" text-anchor="middle">includes</text>
<line x1="30" y1="276" x2="690" y2="276" class="grid" stroke-width="1.2"/>
<text x="30" y="300" class="xs t-hi" text-anchor="start">THE DIRECTION IS THE WHOLE DESIGN, AND IT ONLY GOES ONE WAY.</text>
<text x="30" y="320" class="xs muted" text-anchor="start">Module 8's collision code includes the left-hand file and compiles against four headers. Put ONE renderer type in it —</text>
<text x="30" y="336" class="xs muted" text-anchor="start">a framebuffer, a projector, even `mesh`, which drags in the handle system — and every physics translation unit</text>
<text x="30" y="352" class="xs muted" text-anchor="start">compiles the renderer in order to draw a box.</text>
<text x="30" y="378" class="xs t-hi" text-anchor="start">This is why wire_mesh() takes two spans instead of the `mesh` that owns them. Not fussiness: the only way to</text>
<text x="30" y="394" class="xs t-hi" text-anchor="start">keep the promise above.</text>
</svg>
