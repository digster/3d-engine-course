<svg viewBox="0 0 720 430" role="img" aria-labelledby="l63f1-t l63f1-d">
  <title id="l63f1-t">A surface as a landscape of microfacets</title>
  <desc id="l63f1-d">A cross-section of a rough surface with every facet's normal drawn. Light arrives from l and leaves toward v; only the few facets whose own normal is close to the halfway vector h reflect between them, so the highlight's shape is a histogram of surface slopes.</desc>
  <defs>
    <marker id="e-i-l63f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l63f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l63f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l63f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l63f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">The whole model, in one picture: every microfacet is a perfect mirror, so only the ones facing h send light at you.</text>
