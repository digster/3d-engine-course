<text x="360.0" y="296" class="sm t-hi" text-anchor="middle">4 of 48 facets face h closely enough to count</text>
<text x="360.0" y="314" class="xs muted" text-anchor="middle">— and “how many?” is the only question the model asks</text>
<rect x="24" y="344" width="672" height="66" rx="4" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="368" class="sm t-hi" text-anchor="middle">So the shape of a highlight is a HISTOGRAM of surface slopes, and roughness is that histogram’s width.</text>
<text x="360.0" y="390" class="xs muted" text-anchor="middle">Lesson 3.7 already derived that h is “the normal this surface would need in order to bounce the light into the eye”. That stops being a metaphor here.</text>
