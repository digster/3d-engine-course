<svg viewBox="0 0 900 540" role="img" aria-labelledby="l81f3-t l81f3-d">
  <title id="l81f3-t">Phase space with the exact circular orbit and one step of two integrators</title>
  <desc id="l81f3-d">A point on the exact orbit is stepped by explicit Euler, which lands outside every curve in the picture, and by semi-implicit Euler, which lands on the tilted ellipse it conserves. Both land at the same velocity because both ran the same velocity update. An inset shows the same step applied to a small square, which grows under one rule and is preserved exactly under the other.</desc>
  <defs>
    <marker id="e-i-l81f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l81f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l81f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l81f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l81f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
