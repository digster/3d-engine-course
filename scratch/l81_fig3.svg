<text x="257.7264574857316" y="95.35750026411918" class="xs mono" text-anchor="middle">start</text>
<line x1="390.00" y1="92.00" x2="345.98" y2="98.57" stroke="#eb6060" stroke-width="1.2" marker-end="url(#e-red-l81f3)"/>
<text x="404" y="96" class="xs t-bad" text-anchor="start">explicit Euler lands OUTSIDE both curves.</text>
<line x1="390.00" y1="130.00" x2="323.53" y2="96.57" stroke="#78dca0" stroke-width="1.2" marker-end="url(#e-green-l81f3)"/>
<text x="404" y="134" class="xs t-ok" text-anchor="start">semi-implicit Euler lands ON the dashed</text>
<text x="404" y="150" class="xs t-ok" text-anchor="start">ellipse, and stays on it forever.</text>
<text x="404" y="190" class="sm" text-anchor="start">Both rules ran the SAME velocity line,</text>
<text x="404" y="210" class="sm" text-anchor="start">which is why both dots are at the same</text>
<text x="404" y="230" class="sm" text-anchor="start">height. They differ only in WHICH x the</text>
<text x="404" y="250" class="sm" text-anchor="start">position line was told to move at.</text>
<text x="404" y="278" class="xs muted" text-anchor="start">The pale circle is the exact orbit. The</text>
<text x="404" y="294" class="xs muted" text-anchor="start">dashed green ellipse is the quantity</text>
<text x="404" y="310" class="xs muted" text-anchor="start">figure 6 is about — semi-implicit Euler</text>
<text x="404" y="326" class="xs muted" text-anchor="start">does not conserve energy, it conserves</text>
<text x="404" y="342" class="xs muted" text-anchor="start">that.</text>
<rect x="694" y="82" width="172" height="172" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="694" y="68" class="xs muted" text-anchor="start">the step, applied to an AREA</text>
<path d="M 753.34,194.66 L 806.66,194.66 L 806.66,141.34 L 753.34,141.34 Z" fill="none" stroke="#969eaf" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M 734.68,176.00 L 788.00,213.32 L 825.32,160.00 L 772.00,122.68 Z" fill="none" stroke="#eb6060" stroke-width="2.0"/>
<path d="M 747.74,176.00 L 774.93,213.32 L 812.26,160.00 L 785.07,122.68 Z" fill="none" stroke="#78dca0" stroke-width="2.0"/>
<text x="780" y="276" class="xs muted" text-anchor="middle">grey dashed: what we started with</text>
<text x="780" y="294" class="xs mono t-bad" text-anchor="middle">red: ×(1 + h²ω²) = ×1.49</text>
<text x="780" y="312" class="xs mono t-ok" text-anchor="middle">green: ×1, exactly</text>
<text x="60" y="400" class="xs muted" text-anchor="start">B.1  measured at h = 1/60</text>
<text x="330" y="400" class="xs muted" text-anchor="end">measured</text>
<text x="450" y="400" class="xs muted" text-anchor="end">predicted</text>
<line x1="60" y1="408.0" x2="456" y2="408.0" class="grid" stroke-width="1.0"/>
<text x="60" y="425.0" class="xs" text-anchor="start">explicit Euler</text>
<text x="330" y="425.0" class="xs mono" text-anchor="end">1.010966377</text>
<text x="450" y="425.0" class="xs mono" text-anchor="end">1.010966182</text>
<text x="60" y="442.0" class="xs" text-anchor="start">semi-implicit</text>
<text x="330" y="442.0" class="xs mono" text-anchor="end">1.000000096</text>
<text x="450" y="442.0" class="xs mono" text-anchor="end">1.000000000</text>
<text x="60" y="459.0" class="xs" text-anchor="start">velocity Verlet</text>
<text x="330" y="459.0" class="xs mono" text-anchor="end">1.000000035</text>
<text x="450" y="459.0" class="xs mono" text-anchor="end">1.000000000</text>
<text x="60" y="489.5" class="xs mono muted" text-anchor="start">control, h = 0: all three measure 1.000000119, the meter's own floor.</text>
<text x="500" y="400" class="sm" text-anchor="start">One step is a MATRIX.</text>
<text x="500" y="422" class="sm" text-anchor="start">A matrix has a determinant, and a</text>
<text x="500" y="442" class="sm" text-anchor="start">determinant is the factor it scales</text>
<text x="500" y="462" class="sm" text-anchor="start">area by.</text>
<text x="500" y="492" class="sm t-hi" text-anchor="start">Explicit Euler's is bigger than one at</text>
<text x="500" y="512" class="sm t-hi" text-anchor="start">every step size there is.</text>
</svg>
