<svg viewBox="0 0 900 430" role="img" aria-labelledby="l82f1-t l82f1-d">
  <title id="l82f1-t">Four forces added tip to tail at one scale, against the same four assigned</title>
  <desc id="l82f1-d">Four dashed arrows run tip to tail from a body — gravity down, a thruster right, wind and drag back to the left — and a solid green arrow spans from the body to the final tip. Beside it, the same four forces written with an assignment leave only the thruster.</desc>
  <defs>
    <marker id="e-i-l82f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l82f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l82f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l82f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l82f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-sum-l82f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-one-l82f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f918a"/></marker></defs>
<text x="40" y="30" class="sm t-hi" text-anchor="start">FOUR SYSTEMS, FOUR CALLS, NO COORDINATION</text>
<rect x="60" y="66" width="330" height="290" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="60" y="54" class="xs muted" text-anchor="start">tip to tail, in the order they were called</text>
<text x="390" y="54" class="xs mono muted" text-anchor="end">8 px = 1 N, both axes</text>
<line x1="60" y1="132" x2="390" y2="132" class="grid" stroke-width="0.9"/>
<line x1="210" y1="66" x2="210" y2="356" class="grid" stroke-width="0.9"/>
<circle cx="210" cy="132" r="7" fill="#8f918a" fill-opacity="0.45"/>
<text x="196" y="122" class="xs muted" text-anchor="end">2 kg</text>
<line x1="210.00" y1="132.00" x2="210.00" y2="288.96" stroke="#8f918a" stroke-width="1.7" stroke-dasharray="3 3" marker-end="url(#e-one-l82f1)"/>
<line x1="210.00" y1="288.96" x2="322.00" y2="288.96" stroke="#5082e6" stroke-width="1.7" stroke-dasharray="3 3" marker-end="url(#e-one-l82f1)"/>
<line x1="322.00" y1="288.96" x2="286.00" y2="278.96" stroke="#f0961e" stroke-width="1.7" stroke-dasharray="3 3" marker-end="url(#e-one-l82f1)"/>
<line x1="286.00" y1="278.96" x2="268.00" y2="274.96" stroke="#9b7ede" stroke-width="1.7" stroke-dasharray="3 3" marker-end="url(#e-one-l82f1)"/>
<line x1="210.00" y1="132.00" x2="268.00" y2="274.96" stroke="#5ac878" stroke-width="2.8" marker-end="url(#e-sum-l82f1)"/>
<line x1="430.0" y1="92.0" x2="450.0" y2="92.0" stroke="#8f918a" stroke-width="2.4" fill="none"/>
<text x="458" y="96" class="xs" text-anchor="start">gravity  (0, -19.62, 0) N</text>
<line x1="430.0" y1="109.0" x2="450.0" y2="109.0" stroke="#5082e6" stroke-width="2.4" fill="none"/>
<text x="458" y="113" class="xs" text-anchor="start">thruster  (14, 0, 0) N</text>
<line x1="430.0" y1="126.0" x2="450.0" y2="126.0" stroke="#f0961e" stroke-width="2.4" fill="none"/>
<text x="458" y="130" class="xs" text-anchor="start">wind  (-4.5, 1.25, 3) N</text>
<line x1="430.0" y1="143.0" x2="450.0" y2="143.0" stroke="#9b7ede" stroke-width="2.4" fill="none"/>
<text x="458" y="147" class="xs" text-anchor="start">drag  (-2.25, 0.5, -1.5) N</text>
<line x1="430.0" y1="160.0" x2="450.0" y2="160.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="458" y="164" class="xs" text-anchor="start">sum  (7.250, -17.870, 1.500) N</text>
<text x="430" y="196" class="xs" text-anchor="start">…and ONE divide, at the end, once:</text>
<text x="430" y="216" class="xs mono t-ok" text-anchor="start">a = F · (1/m) = (3.6250, -8.9350, 0.7500) m/s²</text>
<text x="430" y="236" class="xs muted" text-anchor="start">The order of the four calls does not matter:</text>
<text x="430" y="252" class="xs muted" text-anchor="start">vector addition commutes. §3.4 measures the one</text>
<text x="430" y="268" class="xs muted" text-anchor="start">way in which floating point does not.</text>
<text x="430" y="306" class="xs t-hi" text-anchor="start">THE SAME FOUR SYSTEMS, WITH A SETTER</text>
<text x="430" y="326" class="xs mono" text-anchor="start">b.force = thruster;   ← the last writer wins</text>
<text x="430" y="346" class="xs t-bad" text-anchor="start">F = (14.000, 0.000, 0.000) N — gravity, wind and</text>
<text x="430" y="362" class="xs t-bad" text-anchor="start">drag are simply gone, silently.</text>
<text x="430" y="388" class="xs muted" text-anchor="start">Forces add because Newton's second law is linear</text>
<text x="430" y="404" class="xs muted" text-anchor="start">in F. That one fact is why a physics engine has an</text>
<text x="430" y="420" class="xs muted" text-anchor="start">accumulator, and why these four need no interface.</text>
</svg>
