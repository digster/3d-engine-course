<text x="388.0" y="44.0" class="xs" text-anchor="start">a time below zero, two ways to be wrong</text>
<text x="388.0" y="178.5" class="xs muted" text-anchor="start">std::fmod(−0.1, 1.0) is −0.1, not 0.9.</text>
<text x="388.0" y="194.5" class="xs muted" text-anchor="start">Clamped, the pose sticks on the first key — loud,</text>
<text x="388.0" y="210.5" class="xs muted" text-anchor="start">and bounded by the clip’s own range. Unclamped, it</text>
<text x="388.0" y="226.5" class="xs muted" text-anchor="start">extrapolates: 0.8° out at a tenth of a second,</text>
<text x="388.0" y="242.5" class="xs muted" text-anchor="start">100° out at six tenths, and still climbing.</text>
<text x="380.0" y="308" class="xs muted" text-anchor="middle">a duration SHORTER than the keys cuts the cycle: 42.78° of seam and 1,035 keys past the end.</text>
