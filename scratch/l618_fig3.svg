<svg viewBox="0 0 760 400" role="img" aria-labelledby="l618f3-t l618f3-d">
  <title id="l618f3-t">Two roundings: a bounded error and an accumulating one</title>
  <desc id="l618f3-d">A plot of placement error in pixels against glyph index over one line of text. The green series, from snapping each glyph's position, stays inside a shaded half-pixel band. The red series, from rounding each advance, wanders down to nearly five pixels and does not return.</desc>
  <defs>
    <marker id="e-i-l618f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l618f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l618f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l618f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l618f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">Round the position and the error is bounded forever. Round the advance and it is a random walk.</text>
<line x1="70" y1="60" x2="70" y2="280" class="grid" stroke-width="1.1"/>
<line x1="70" y1="91.42857142857143" x2="570" y2="91.42857142857143" class="grid" stroke-width="1.2"/>
<text x="60" y="64.0" class="xs mono" text-anchor="end">+1</text>
<text x="60" y="95.42857142857143" class="xs mono" text-anchor="end">+0</text>
<text x="60" y="126.85714285714286" class="xs mono" text-anchor="end">-1</text>
<text x="60" y="158.28571428571428" class="xs mono" text-anchor="end">-2</text>
<text x="60" y="189.71428571428572" class="xs mono" text-anchor="end">-3</text>
<text x="60" y="221.14285714285714" class="xs mono" text-anchor="end">-4</text>
<text x="60" y="252.57142857142858" class="xs mono" text-anchor="end">-5</text>
<text x="60" y="284.0" class="xs mono" text-anchor="end">-6</text>
<text x="18" y="46" class="xs muted" text-anchor="start">placement error, px</text>
<text x="320.0" y="306" class="xs muted" text-anchor="middle">glyph index along one 45-character line</text>
