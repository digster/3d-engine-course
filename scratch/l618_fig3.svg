<text x="528.4444444444445" y="72.17514285714286" class="xs t-ok" text-anchor="start">snap the POSITION</text>
<text x="528.4444444444445" y="239.31799999999998" class="xs t-bad" text-anchor="start">round the ADVANCE</text>
<line x1="20" y1="316" x2="740" y2="316" class="grid" stroke-width="1.2"/>
<text x="20" y="334" class="xs t-ok" text-anchor="start">Snapping the position: worst error 0.4765 px, and it can never exceed 0.5 — the pen keeps its fraction.</text>
<text x="20" y="352" class="xs t-bad" text-anchor="start">Rounding the advance: worst 5.2601 px, still 4.3216 px out at the end of the line. Each error is added to the next.</text>
<text x="20" y="374" class="xs muted" text-anchor="start">Same rounding, applied to two different quantities, with completely different consequences.</text>
</svg>
