<rect x="838" y="108" width="56" height="30" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.5"/>
<line x1="866.0" y1="176.0" x2="866.0" y2="210.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<line x1="866.0" y1="210.0" x2="962.0" y2="210.0" stroke="#e05c5c" stroke-width="2.0" fill="none"/>
<text x="720" y="264" class="sm" text-anchor="middle">1 island</text>
<text x="30" y="306" class="xs muted" text-anchor="start">An impulse applied to a fixed body changes nothing any other contact can read, so it propagates nothing and joins nothing.</text>
<text x="30" y="324" class="xs muted" text-anchor="start">Let it bridge and one rolling marble keeps every crate in the level awake — which is not a slow simulation, it is no sleeping at all.</text>
<text x="30" y="370" class="xs muted" text-anchor="start">yard of twenty towers</text>
<text x="436" y="370" class="xs muted" text-anchor="end">value</text>
<line x1="30" y1="378.0" x2="442" y2="378.0" class="grid" stroke-width="1.0"/>
<text x="30" y="395.0" class="xs" text-anchor="start">bodies (one floor, 100 crates)</text>
<text x="436" y="395.0" class="xs mono" text-anchor="end">101</text>
<text x="30" y="412.0" class="xs" text-anchor="start">manifolds</text>
<text x="436" y="412.0" class="xs mono" text-anchor="end">100</text>
<text x="30" y="429.0" class="xs" text-anchor="start">islands, fixed bodies not bridges</text>
<text x="436" y="429.0" class="xs mono" text-anchor="end">20</text>
<text x="30" y="446.0" class="xs" text-anchor="start">islands, fixed bodies bridging</text>
<text x="436" y="446.0" class="xs mono" text-anchor="end">1</text>
<text x="30" y="463.0" class="xs" text-anchor="start">union-find and labelling</text>
<text x="436" y="463.0" class="xs mono" text-anchor="end">0.250 µs (2.48 ns/body)</text>
</svg>
