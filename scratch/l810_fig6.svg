<line x1="290.0" y1="176.0" x2="290.0" y2="210.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<rect x="358" y="176" width="56" height="30" rx="3" fill="none" stroke="#9b7ede" stroke-width="1.5"/>
<rect x="358" y="142" width="56" height="30" rx="3" fill="none" stroke="#9b7ede" stroke-width="1.5"/>
<rect x="358" y="108" width="56" height="30" rx="3" fill="none" stroke="#9b7ede" stroke-width="1.5"/>
<line x1="386.0" y1="176.0" x2="386.0" y2="210.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<text x="240" y="264" class="sm" text-anchor="middle">20 islands</text>
<text x="510" y="36" class="sm" text-anchor="start">…and if it is</text>
