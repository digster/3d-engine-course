<rect x="550" y="108" width="56" height="30" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.5"/>
<line x1="578.0" y1="176.0" x2="578.0" y2="210.0" stroke="#8f918a" stroke-width="1.0" fill="none" stroke-dasharray="3 3"/>
<line x1="578.0" y1="210.0" x2="674.0" y2="210.0" stroke="#e05c5c" stroke-width="2.0" fill="none"/>
