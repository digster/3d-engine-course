<svg viewBox="0 0 900 400" role="img" aria-labelledby="l83f5-t l83f5-d">
  <title id="l83f5-t">A dumbbell's inertia tensor, assembled correctly and incorrectly</title>
  <desc id="l83f5-d">Two balls on a bar, with the parallel-axis offsets drawn from the centre. Spun across the bar the dumbbell is thirty-seven times harder to turn than along it. Adding the parts' tensors without shifting them to the common centre gives an answer fifteen times too small, and that wrong answer passes every validity test the engine has.</desc>
  <defs>
    <marker id="e-i-l83f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l83f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l83f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l83f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l83f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-red-l83f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-blue-l83f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5082e6"/></marker></defs>
<defs><marker id="e-green-l83f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<rect x="40" y="72" width="330" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.1"/>
<text x="40" y="56" class="xs muted" text-anchor="start">two 2 kg balls on a 0.5 kg bar</text>
<rect x="160.4" y="110.0" width="10" height="174.0" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<circle cx="165.4" cy="110.0" r="15" fill="none" stroke="#8f918a" stroke-width="1.5"/>
<line x1="165.40" y1="197.00" x2="165.40" y2="110.00" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-l83f5)"/>
<circle cx="165.4" cy="284.0" r="15" fill="none" stroke="#8f918a" stroke-width="1.5"/>
<line x1="165.40" y1="197.00" x2="165.40" y2="284.00" stroke="#5082e6" stroke-width="1.6" marker-end="url(#e-blue-l83f5)"/>
<text x="187.4" y="153.5" class="xs mono" text-anchor="start">d = 1.5 m</text>
<circle cx="165.4" cy="197.0" r="3.4" fill="#8f918a"/>
<line x1="73.4" y1="197.0" x2="257.4" y2="197.0" stroke="#e05c5c" stroke-width="2.0" fill="none" stroke-dasharray="5 4"/>
<text x="50" y="187.0" class="xs" text-anchor="start">x — hard</text>
<line x1="165.4" y1="86.8" x2="165.4" y2="307.2" stroke="#5ac878" stroke-width="2.0" fill="none" stroke-dasharray="5 4"/>
<text x="173.4" y="90" class="xs" text-anchor="start">y — easy</text>
<line x1="40.0" y1="344.0" x2="60.0" y2="344.0" stroke="#e05c5c" stroke-width="2.4" fill="none"/>
<text x="68" y="348" class="xs" text-anchor="start">Ixx 9.631312</text>
<line x1="40.0" y1="361.0" x2="60.0" y2="361.0" stroke="#5ac878" stroke-width="2.4" fill="none"/>
<text x="68" y="365" class="xs" text-anchor="start">Iyy 0.256625   — a ratio of 37.5</text>
<text x="430" y="84" class="xs muted" text-anchor="start">Ixx of the assembly</text>
<text x="752" y="84" class="xs muted" text-anchor="end">value</text>
<text x="884" y="84" class="xs muted" text-anchor="end"></text>
<line x1="430" y1="92.0" x2="890" y2="92.0" class="grid" stroke-width="1.0"/>
<text x="430" y="109.0" class="xs" text-anchor="start">shifted, correct</text>
<text x="752" y="109.0" class="xs mono" text-anchor="end">9.631312</text>
<text x="884" y="109.0" class="xs mono" text-anchor="end">✓</text>
<text x="430" y="126.0" class="xs" text-anchor="start">added without shifting</text>
<text x="752" y="126.0" class="xs mono" text-anchor="end">0.631312</text>
<text x="884" y="126.0" class="xs t-hi" text-anchor="end">15.3× small</text>
<text x="430" y="164.5" class="xs muted" text-anchor="start">The wrong one is the tensor of a body whose parts are</text>
<text x="430" y="180.5" class="xs muted" text-anchor="start">all piled on top of each other at the balance point.</text>
<text x="430" y="196.5" class="xs muted" text-anchor="start">It is always too small, it never reports an error, and</text>
<text x="430" y="212.5" class="xs muted" text-anchor="start">it passes every test inspect_inertia can run:</text>
<text x="430" y="228.5" class="xs muted" text-anchor="start"></text>
<text x="430" y="244.5" class="xs mono" text-anchor="start">    symmetric ✓   positive ✓   triangle ✓   usable ✓</text>
<text x="430" y="260.5" class="xs muted" text-anchor="start"></text>
<text x="430" y="276.5" class="xs t-hi" text-anchor="start">A validity check tells you a tensor COULD exist. It</text>
<text x="430" y="292.5" class="xs muted" text-anchor="start">cannot tell you it is the tensor of the thing you</text>
<text x="430" y="308.5" class="xs muted" text-anchor="start">meant. That distinction is worth holding on to — the</text>
<text x="430" y="324.5" class="xs muted" text-anchor="start">same one returns in 8.7's contact generation.</text>
</svg>
