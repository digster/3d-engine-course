  <text x="371.0" y="146.0" class="xs mono t-inv" text-anchor="middle">82,190,110</text>
  <rect x="450.0" y="114.0" width="142.0" height="56.0" fill="#168328" stroke="var(--dia-bg)" stroke-width="1"/>
  <text x="521.0" y="146.0" class="xs mono t-inv" text-anchor="middle">22,131,40</text>
  <text x="24" y="206.0" class="xs">bottom-left</text>
  <rect x="150.0" y="174.0" width="142.0" height="56.0" fill="#5082e6" stroke="var(--dia-bg)" stroke-width="1"/>
