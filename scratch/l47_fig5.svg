  <rect x="24" y="296" width="672" height="72" class="fill-soft ink" stroke-width="0.75" rx="3"/>
  <text x="40" y="316" class="xs t-ok">the _UNORM column matches the file EXACTLY, corner for corner</text>
  <text x="40" y="332" class="xs muted">so nothing between the decoder and the readback reordered a row or a channel</text>
  <text x="40" y="354" class="xs t-hi">the _SRGB column is darker: the sampler decoded to linear on the way out, free, and BEFORE the filter</text>
</svg>
