  <text x="371.0" y="86.0" class="xs mono t-inv" text-anchor="middle">222,70,60</text>
  <rect x="450.0" y="54.0" width="142.0" height="56.0" fill="#ba100c" stroke="var(--dia-bg)" stroke-width="1"/>
  <text x="521.0" y="86.0" class="xs mono t-inv" text-anchor="middle">186,16,12</text>
  <text x="24" y="146.0" class="xs">top-right</text>
