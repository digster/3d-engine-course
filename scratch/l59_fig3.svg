<text x="116" y="76" class="xs muted" text-anchor="start">A  recurse from roots</text>
<rect x="262" y="66" width="12" height="12" rx="2" fill="#5ac878" stroke="#5ac878" stroke-width="0.8" fill-opacity="0.45"/>
<text x="280" y="76" class="xs muted" text-anchor="start">C  level order</text>
<line x1="24" y1="322" x2="696" y2="322" class="grid" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="24" y="340" class="xs t-hi" text-anchor="start">RECURSION IS DEPTH-DEPENDENT AND LEVEL ORDER IS NOT: 3.3 → 13.6 ns against 3.4 → 4.9.</text>
<text x="24" y="356" class="xs muted" text-anchor="start">READ THE FIRST COLUMN FIRST. At depth 1 there is no hierarchy, both arms do the same work, and the ratio is 1.01× — the control that says the</text>
<text x="24" y="370" class="xs muted" text-anchor="start">harness is measuring the tree rather than itself. Everything after it is the tree.</text>
<text x="24" y="392" class="xs muted" text-anchor="start">And it SATURATES around depth 8: a chain twice as long costs a recursive walk almost nothing more.</text>
</svg>
