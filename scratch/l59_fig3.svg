<svg viewBox="0 0 720 400" role="img" aria-labelledby="l59f3-t l59f3-d">
  <title id="l59f3-t">Resolve cost against tree depth at a fixed entity count</title>
  <desc id="l59f3-d">A bar chart at depths 1 to 32 with 100,000 entities throughout. Recursion rises from 3.3 to 13.6 nanoseconds per entity; level order stays between 3.4 and 5.0.</desc>
