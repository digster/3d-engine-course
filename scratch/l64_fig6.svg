<svg viewBox="0 0 720 420" role="img" aria-labelledby="l64f6-t l64f6-d">
  <title id="l64f6-t">Hemispherical reflectance with and without Fresnel coupling</title>
  <desc id="l64f6-d">Total reflectance R of a white surface against roughness, for an eye at 0 and at 75 degrees. Without coupling the surface reflects more light than arrives at every roughness, worst 1.2353 at grazing. With the two-crossing coupling it never exceeds 1, worst 0.9255 over a full sweep, where the common half-vector form still reaches 1.3395.</desc>
