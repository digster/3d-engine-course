<svg viewBox="0 0 760 324" role="img" aria-labelledby="l618f6-t l618f6-d">
  <title id="l618f6-t">Where the overlay composites: before the tonemap or after it</title>
  <desc id="l618f6-d">The frame as four stages from scene to swapchain, with two dashed insertion points marked. Compositing before the tonemap turns white into sRGB code 232 and makes it move with the exposure; compositing after leaves it at 255.</desc>
  <defs>
    <marker id="e-i-l618f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l618f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l618f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l618f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l618f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">The same white text, composited at two points in one frame.</text>
<rect x="40" y="86" width="138" height="40" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="40" y="86" width="138" height="40" rx="3" fill="none" stroke="#5082e6" stroke-width="1.2"/>
<text x="109.0" y="111" class="xs mono" text-anchor="middle">scene</text>
<line x1="182" y1="106" x2="208" y2="106" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l618f6)"/>
<rect x="212" y="86" width="138" height="40" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="212" y="86" width="138" height="40" rx="3" fill="none" stroke="#f0961e" stroke-width="1.2"/>
<text x="281.0" y="111" class="xs mono" text-anchor="middle">bloom</text>
<line x1="354" y1="106" x2="380" y2="106" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l618f6)"/>
<rect x="384" y="86" width="138" height="40" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="384" y="86" width="138" height="40" rx="3" fill="none" stroke="#9b7ede" stroke-width="1.2"/>
<text x="453.0" y="111" class="xs mono" text-anchor="middle">tonemap</text>
<line x1="526" y1="106" x2="552" y2="106" class="ink-soft" stroke-width="1.2" marker-end="url(#e-s-l618f6)"/>
<rect x="556" y="86" width="138" height="40" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<rect x="556" y="86" width="138" height="40" rx="3" fill="none" stroke="#5ac878" stroke-width="1.2"/>
<text x="625.0" y="111" class="xs mono" text-anchor="middle">swapchain</text>
<text x="178" y="72" class="xs muted" text-anchor="middle">HDR float, scene-referred</text>
<text x="625.0" y="72" class="xs muted" text-anchor="middle">8-bit sRGB, display-referred</text>
<line x1="195.0" y1="82.0" x2="195.0" y2="130.0" stroke="#e05c5c" stroke-width="2.0" fill="none" stroke-dasharray="4 3"/>
<text x="195.0" y="148" class="xs t-hi" text-anchor="middle">BEFORE</text>
<line x1="539.0" y1="82.0" x2="539.0" y2="130.0" stroke="#5ac878" stroke-width="2.0" fill="none" stroke-dasharray="4 3"/>
<text x="539.0" y="148" class="xs t-hi" text-anchor="middle">AFTER</text>
<rect x="30" y="178" width="340" height="96" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.09"/>
<text x="44" y="198" class="xs t-bad" text-anchor="start">composited BEFORE the tonemap</text>
<text x="44" y="218" class="xs mono" text-anchor="start">white at linear 1.0 -&gt; ACES -&gt; 0.8038</text>
<text x="44" y="236" class="xs mono" text-anchor="start">-&gt; sRGB code 232, not 255</text>
<text x="44" y="256" class="xs muted" text-anchor="start">and it blooms, and it moves with the exposure</text>
<rect x="392" y="178" width="340" height="96" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.09"/>
<text x="406" y="198" class="xs t-ok" text-anchor="start">composited AFTER the tonemap</text>
<text x="406" y="218" class="xs mono" text-anchor="start">white is code 255, and stays code 255</text>
<text x="406" y="236" class="xs mono" text-anchor="start">the sRGB target's blender works in linear light</text>
<text x="406" y="256" class="xs muted" text-anchor="start">a UI colour is a CODE, not a quantity of light</text>
<text x="30" y="300" class="xs muted" text-anchor="start">the same white, as the auto-exposure moves:</text>
<text x="300" y="300" class="xs mono" text-anchor="start">x0.25 -&gt; 165</text>
<text x="388" y="300" class="xs mono" text-anchor="start">x0.5 -&gt; 206</text>
<text x="476" y="300" class="xs mono" text-anchor="start">x1 -&gt; 232</text>
<text x="564" y="300" class="xs mono" text-anchor="start">x2 -&gt; 245</text>
<text x="652" y="300" class="xs mono" text-anchor="start">x4 -&gt; 252</text>
</svg>
