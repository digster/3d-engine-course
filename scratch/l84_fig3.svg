<svg viewBox="0 0 900 400" role="img" aria-labelledby="l84f3-t l84f3-d">
  <title id="l84f3-t">Where fifteen candidate axes come from</title>
  <desc id="l84f3-d">Face normals catch gaps a face can see; the nine cross products catch the gap between two edges sliding past each other.</desc>
  <defs>
    <marker id="e-i-l84f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l84f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l84f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l84f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l84f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="0" y="0" width="900" height="400" class="fill-bg" stroke="none"/>
<text x="158" y="44" class="sm" text-anchor="middle">3 + 3 face normals</text>
<text x="158" y="60" class="xs muted" text-anchor="middle">a gap you can see from a face</text>
<rect x="66" y="124" width="74" height="88" rx="3" fill="none" stroke="#5082e6" stroke-width="1.5"/>
<rect x="176" y="138" width="74" height="60" rx="3" fill="none" stroke="#5ac878" stroke-width="1.5"/>
<line x1="140.0" y1="106.0" x2="140.0" y2="230.0" stroke="#8f918a" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
<line x1="176.0" y1="106.0" x2="176.0" y2="230.0" stroke="#8f918a" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
<line x1="140.00" y1="244.00" x2="176.00" y2="244.00" stroke="#5ac878" stroke-width="1.8" marker-end="url(#e-gapa-l84f3)"/>
<text x="158" y="264" class="xs mono" text-anchor="middle">gap</text>
<text x="158" y="280" class="xs muted" text-anchor="middle">found by a face normal</text>
<text x="450" y="44" class="sm" text-anchor="middle">9 edge × edge cross products</text>
<text x="450" y="60" class="xs muted" text-anchor="middle">a gap no face can see</text>
<line x1="340.0" y1="202.0" x2="480.0" y2="142.0" stroke="#5082e6" stroke-width="7.0" fill="none"/>
<line x1="420.0" y1="212.0" x2="562.0" y2="128.0" stroke="#5ac878" stroke-width="7.0" fill="none"/>
<text x="332" y="220" class="xs muted" text-anchor="start">an edge of A</text>
<text x="464" y="128" class="xs muted" text-anchor="start">an edge of B</text>
<line x1="446.00" y1="180.00" x2="470.00" y2="212.00" stroke="#f0961e" stroke-width="1.8" marker-end="url(#e-perp-l84f3)"/>
<text x="496" y="222" class="xs mono t-hi" text-anchor="start">a₀ × b₀</text>
<text x="450" y="264" class="xs muted" text-anchor="middle">perpendicular to one edge from each,</text>
<text x="450" y="278" class="xs muted" text-anchor="middle">which is a direction neither box has a face in</text>
<text x="640" y="44" class="sm" text-anchor="start">the candidate list</text>
<text x="640" y="72" class="xs muted" text-anchor="start">source</text>
<text x="824" y="72" class="xs muted" text-anchor="end">n</text>
<text x="896" y="72" class="xs muted" text-anchor="end">axes</text>
<line x1="640" y1="80.0" x2="902" y2="80.0" class="grid" stroke-width="1.0"/>
<text x="640" y="97.0" class="xs" text-anchor="start">A's face normals</text>
<text x="824" y="97.0" class="xs mono" text-anchor="end">3</text>
<text x="896" y="97.0" class="xs mono" text-anchor="end">a₀ a₁ a₂</text>
<text x="640" y="114.0" class="xs" text-anchor="start">B's face normals</text>
<text x="824" y="114.0" class="xs mono" text-anchor="end">3</text>
<text x="896" y="114.0" class="xs mono" text-anchor="end">b₀ b₁ b₂</text>
<text x="640" y="131.0" class="xs" text-anchor="start">edge × edge</text>
<text x="824" y="131.0" class="xs mono" text-anchor="end">9</text>
<text x="896" y="131.0" class="xs mono" text-anchor="end">aᵢ × bⱼ</text>
<text x="640" y="148.0" class="xs" text-anchor="start">total</text>
<text x="824" y="148.0" class="xs mono" text-anchor="end">15</text>
<text x="896" y="148.0" class="xs mono" text-anchor="end"></text>
<text x="640" y="182.5" class="xs muted" text-anchor="start">A box has six faces and three DISTINCT</text>
<text x="640" y="196.5" class="xs muted" text-anchor="start">normals: opposite faces differ only in</text>
<text x="640" y="210.5" class="xs muted" text-anchor="start">sign, and L and −L cast the same shadow.</text>
<text x="640" y="232.5" class="xs muted" text-anchor="start">Twelve edges, three directions, for the</text>
<text x="640" y="246.5" class="xs muted" text-anchor="start">same reason.</text>
<line x1="30" y1="348" x2="872" y2="348" class="grid" stroke-width="1.0"/>
<text x="30" y="368" class="xs muted" text-anchor="start">The fifteen are the face normals of the Minkowski difference A ⊖ B: its faces come either from a face of one box, or from one edge of each sweeping past the other.</text>
<text x="30" y="386" class="xs muted" text-anchor="start">Measured over 200,000 random pairs: 5,727 were separated ONLY by an edge-edge axis — 4.6% of everything six axes called overlapping, and every one re-proved in double precision.</text>
</svg>
