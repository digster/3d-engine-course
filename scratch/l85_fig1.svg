  <title id="l85f1-t">Two unit cubes whose centres are (2,2,2) apart: the SAT reports a gap of 1 m, GJK reports the true distance of sqrt(3).</title>
  <desc id="l85f1-d">Left, an oblique view of two unit cubes with their nearest corners joined by a segment labelled sqrt(3) = 1.7320508 m, and below them their shadows on the x axis, which are 1 m apart. Right, a table giving the shipped SAT answer, the best of all fifteen axes, GJK's answer and the ratio 1/sqrt(3), followed by the distribution over 200,000 random pairs.</desc>
