<svg viewBox="0 0 720 400" role="img" aria-labelledby="l66f1-t l66f1-d">
  <title id="l66f1-t">OBJ against glTF: a bag of triangles against a scene graph</title>
  <desc id="l66f1-d">On the left an OBJ file: v, vt, vn and f statements, plus a usemtl line highlighted because it names a material the format cannot define. On the right a glTF scene: a scene containing a group node with a translation, containing a node holding a mesh, whose primitive names both a material and a set of accessors.</desc>
  <defs>
    <marker id="e-i-l66f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l66f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l66f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l66f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l66f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<rect x="0" y="0" width="720" height="400" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="26" class="lg" text-anchor="middle">OBJ describes a shape. glTF describes a scene.</text>
<rect x="24" y="46" width="300" height="250" rx="3" fill="none" stroke="#8f918a" stroke-width="1.3"/>
<text x="174.0" y="68" class="sm" text-anchor="middle">torus.obj  —  Lesson 3.5</text>
<line x1="38" y1="78" x2="310" y2="78" class="grid" stroke-width="1.0"/>
<text x="174.0" y="100" class="xs" text-anchor="middle">v  0.5 -0.5 0.5</text>
<text x="174.0" y="122" class="xs" text-anchor="middle">vt 0.25 0.75</text>
<text x="174.0" y="144" class="xs" text-anchor="middle">vn 0.0 1.0 0.0</text>
<text x="174.0" y="166" class="xs" text-anchor="middle">f  1/1/1 2/2/2 3/3/3</text>
<rect x="40" y="176" width="268" height="18" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.18"/>
<text x="174.0" y="188" class="xs" text-anchor="middle">usemtl  Metal</text>
<line x1="38" y1="220" x2="310" y2="220" class="grid" stroke-width="1.0"/>
<text x="174.0" y="240" class="sm" text-anchor="middle">ONE bag of triangles.</text>
<text x="174.0" y="260" class="xs" text-anchor="middle">`usemtl` names a string the format</text>
<text x="174.0" y="276" class="xs" text-anchor="middle">cannot itself define.</text>
<rect x="396" y="46" width="300" height="250" rx="3" fill="none" stroke="#5082e6" stroke-width="1.3"/>
<text x="546.0" y="68" class="sm" text-anchor="middle">shapes.glb  —  this lesson</text>
<line x1="410" y1="78" x2="682" y2="78" class="grid" stroke-width="1.0"/>
<rect x="416" y="88" width="260" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.14"/>
<text x="424" y="100" class="xs" text-anchor="start">scene</text>
<rect x="429" y="110" width="247" height="18" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.14"/>
<text x="437" y="122" class="xs" text-anchor="start">node  "group"   T = (1,0,0)</text>
<rect x="442" y="132" width="234" height="18" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.14"/>
<text x="450" y="144" class="xs" text-anchor="start">node "gold octahedron"</text>
<rect x="455" y="154" width="221" height="18" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.14"/>
<text x="463" y="166" class="xs" text-anchor="start">mesh -&gt; primitive</text>
<rect x="468" y="176" width="208" height="18" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.14"/>
<text x="476" y="188" class="xs" text-anchor="start">material  "gold"</text>
<rect x="468" y="198" width="208" height="18" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.14"/>
<text x="476" y="210" class="xs" text-anchor="start">accessors: POSITION, indices</text>
<line x1="410" y1="220" x2="682" y2="220" class="grid" stroke-width="1.0"/>
<text x="546.0" y="240" class="sm" text-anchor="middle">FOUR draws, four placements,</text>
<text x="546.0" y="260" class="xs" text-anchor="middle">three materials the file DEFINES —</text>
<text x="546.0" y="276" class="xs" text-anchor="middle">base colour, metallic, roughness.</text>
<line x1="336" y1="170" x2="384" y2="170" class="ink-soft" stroke-width="1.4" marker-end="url(#e-s-l66f1)"/>
<text x="360.0" y="158" class="xs" text-anchor="middle">the same</text>
<text x="360.0" y="190" class="xs" text-anchor="middle">job?</text>
<rect x="24" y="312" width="672" height="72" rx="3" class="fill-soft grid" stroke-width="1.2"/>
<text x="360.0" y="336" class="sm" text-anchor="middle">A glTF mesh is a LIST of primitives and each one has its own material.</text>
<text x="360.0" y="358" class="xs" text-anchor="middle">Flatten them into one mesh_data and you get geometry that is correct</text>
<text x="360.0" y="374" class="xs" text-anchor="middle">and unpaintable — a car body and its windscreen must be two draws.</text>
</svg>
