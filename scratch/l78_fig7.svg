<text x="86" y="334" class="xs" text-anchor="start">a STEP at the boundary: 0.100745 in ONE sample</text>
<line x1="56.0" y1="348.0" x2="78.0" y2="348.0" stroke="#5082e6" stroke-width="2.4" fill="none"/>
<text x="86" y="352" class="xs" text-anchor="start">RAMPED across the buffer, which takes 800 — the shipping path</text>
<text x="574" y="74" class="xs muted" text-anchor="start">largest jump between samples</text>
<text x="820" y="74" class="xs muted" text-anchor="end"></text>
<text x="880" y="74" class="xs muted" text-anchor="end"></text>
<line x1="574" y1="82.0" x2="886" y2="82.0" class="grid" stroke-width="1.0"/>
<text x="574" y="99.0" class="xs" text-anchor="start">the signal's own slope</text>
<text x="820" y="99.0" class="xs mono" text-anchor="end">0.013088</text>
<text x="880" y="99.0" class="xs mono" text-anchor="end">1.00x</text>
<text x="574" y="116.0" class="xs" text-anchor="start">gain as a step</text>
<text x="820" y="116.0" class="xs mono" text-anchor="end">0.100745</text>
<text x="880" y="116.0" class="xs mono" text-anchor="end">7.70x</text>
<text x="574" y="133.0" class="xs" text-anchor="start">gain as a ramp</text>
<text x="820" y="133.0" class="xs mono" text-anchor="end">0.013072</text>
<text x="880" y="133.0" class="xs mono" text-anchor="end">1.00x</text>
<text x="574" y="163.5" class="xs muted" text-anchor="start">step minus ramp, over one second:</text>
<text x="574" y="183.5" class="xs mono" text-anchor="start">rms 2.608e-02, of which only 1.2%</text>
<text x="574" y="199.5" class="xs mono" text-anchor="start">sits at the tone's own 200 Hz.</text>
<text x="574" y="221.5" class="xs" text-anchor="start">The other 98.8% is spread across every</text>
<text x="574" y="237.5" class="xs" text-anchor="start">frequency there is. That is what a click</text>
<text x="574" y="253.5" class="xs t-hi" text-anchor="start">IS, and it is why this is audible at all.</text>
<text x="574" y="279.5" class="xs muted" text-anchor="start">CONTROL: constant gain, the two agree to</text>
<text x="574" y="295.5" class="xs mono muted" text-anchor="start">8.941e-09.</text>
</svg>
