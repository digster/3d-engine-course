<svg viewBox="0 0 900 400" role="img" aria-labelledby="l78f7-t l78f7-d">
  <title id="l78f7-t">A waveform across a buffer boundary with the gain stepped and ramped</title>
  <desc id="l78f7-d">The stepped render jumps 0.100745 in one sample at the boundary, 7.7 times the largest step the waveform itself ever takes, while the ramped render is indistinguishable from the waveform's own motion. A table gives the measured jumps and notes that 98.8 percent of the difference between them is broadband.</desc>
