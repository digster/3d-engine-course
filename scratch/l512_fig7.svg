<svg viewBox="0 0 720 350" role="img" aria-labelledby="l512f7-t l512f7-d">
  <title id="l512f7-t">Seven findings and the module that answers each</title>
  <desc id="l512f7-d">A list of seven gaps the checkpoint game found. Two are fixed in this lesson: the incomplete umbrella header and the missing ECS-to-renderer bridge. One is reported and left as an exercise. The remaining four are answered by Modules 6, 7, 8 and 9.</desc>
  <defs>
    <marker id="e-i-l512f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l512f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l512f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l512f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l512f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="22" class="sm" text-anchor="start">Seven findings, and where each one is answered.</text>
<rect x="24" y="52" width="672" height="26" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<text x="36" y="69" class="xs" text-anchor="start">the umbrella listed 40 of 55 public headers</text>
<text x="684" y="69" class="xs mono t-ok" text-anchor="end">FIXED HERE</text>
<rect x="24" y="86" width="672" height="26" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.16"/>
<text x="36" y="103" class="xs" text-anchor="start">the ECS → renderer loop had no home</text>
<text x="684" y="103" class="xs mono t-ok" text-anchor="end">FIXED HERE</text>
<rect x="24" y="120" width="672" height="26" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.07"/>
<text x="36" y="137" class="xs" text-anchor="start">view() has no const overload, so no system can say it only reads</text>
<text x="684" y="137" class="xs mono muted" text-anchor="end">reported, Exercise 4</text>
<rect x="24" y="154" width="672" height="26" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.07"/>
<text x="36" y="171" class="xs" text-anchor="start">no public path from entities to the GPU renderer</text>
<text x="684" y="171" class="xs mono muted" text-anchor="end">Module 9</text>
<rect x="24" y="188" width="672" height="26" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.07"/>
<text x="36" y="205" class="xs" text-anchor="start">no collision — the wall is a clamp, the pillars are scenery</text>
<text x="684" y="205" class="xs mono muted" text-anchor="end">Module 8</text>
<rect x="24" y="222" width="672" height="26" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.07"/>
<text x="36" y="239" class="xs" text-anchor="start">the engine cannot draw a character; the HUD is SDL's</text>
<text x="684" y="239" class="xs mono muted" text-anchor="end">Module 6</text>
<rect x="24" y="256" width="672" height="26" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.07"/>
<text x="36" y="273" class="xs" text-anchor="start">no audio: a pickup is silent</text>
<text x="684" y="273" class="xs mono muted" text-anchor="end">Module 7</text>
<line x1="24" y1="298" x2="696" y2="298" class="grid" stroke-width="1.0"/>
<text x="24" y="316" class="xs muted" text-anchor="start">Two of seven were closed for the price of a header, and both were promises already on record.</text>
<text x="24" y="331" class="xs muted" text-anchor="start">The other five are the whole point of finding them at hour 62 rather than hour 434.</text>
</svg>
