<text x="30" y="256" class="xs" text-anchor="start">inverse binds (the file's):</text>
<text x="30" y="270" class="xs mono" text-anchor="start">A: S(2) T(0, −1, 0)</text>
<text x="30" y="284" class="xs mono" text-anchor="start">B: S(2) T(−0.5, −1, 0)</text>
<text x="250" y="190" class="xs" text-anchor="start">The spec: “the transform of the</text>
<text x="250" y="204" class="xs" text-anchor="start">skinned mesh node MUST be ignored.”</text>
<text x="250" y="228" class="xs mono" text-anchor="start">jointMatrix = global(joint) · IBM</text>
<text x="250" y="242" class="xs mono" text-anchor="start">v′ = Σ w · jointMatrix · v</text>
