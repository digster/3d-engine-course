<svg viewBox="0 0 900 380" role="img" aria-labelledby="l77bf2-t l77bf2-d">
  <title id="l77bf2-t">The spec's example</title>
  <desc id="l77bf2-d">Left: the specification's skin example as a node tree. node_0 translates by (0, 1, 0) and is not a joint but is applied; node_1 scales by one half and is joint A; node_2 translates by one unit and is joint B; node_3 and node_4, which carry the mesh, are ignored. The inverse binds are S(2)T(0,-1,0) and S(2)T(-0.5,-1,0). Right: the triangle in the plane, with v0 at (0, 1) and v1 at (0.5, 1); v1's path when node_1 turns 90 degrees, through (0.35355, 1.35355) at t = 0.5 to (0, 1.5) at t = 1; and in red the two wrong answers, (1, 1) if the mesh node were applied and (0, 0) if node_0 were dropped.</desc>
  <defs>
    <marker id="e-i-l77bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l77bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l77bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l77bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l77bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<defs><marker id="e-r-l77bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker></defs>
<defs><marker id="e-g-l77bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker></defs>
<defs><marker id="e-k-l77bf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker></defs>
<rect x="30" y="40" width="180" height="50" rx="3" fill="none" stroke="#5ac878" stroke-width="1.5"/>
<text x="40" y="57" class="sm mono" text-anchor="start">node_0</text>
<text x="40" y="71" class="xs mono" text-anchor="start">T (0, 1, 0)</text>
<text x="40" y="84" class="xs muted" text-anchor="start">not a joint — APPLIED</text>
<rect x="30" y="108" width="180" height="50" rx="3" fill="none" stroke="#f0961e" stroke-width="1.5"/>
<text x="40" y="125" class="sm mono" text-anchor="start">node_1</text>
<text x="40" y="139" class="xs mono" text-anchor="start">S (0.5, 0.5, 0.5)</text>
<text x="40" y="152" class="xs muted" text-anchor="start">joint A — slot 0</text>
<rect x="30" y="176" width="180" height="50" rx="3" fill="none" stroke="#f0961e" stroke-width="1.5"/>
<text x="40" y="193" class="sm mono" text-anchor="start">node_2</text>
<text x="40" y="207" class="xs mono" text-anchor="start">T (1, 0, 0)</text>
<text x="40" y="220" class="xs muted" text-anchor="start">joint B — slot 1</text>
<rect x="250" y="40" width="180" height="50" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.5"/>
<text x="260" y="57" class="sm mono" text-anchor="start">node_3</text>
<text x="260" y="71" class="xs mono" text-anchor="start">T (1, 0, 0)</text>
<text x="260" y="84" class="xs muted" text-anchor="start">IGNORED</text>
<rect x="250" y="108" width="180" height="50" rx="3" fill="none" stroke="#e05c5c" stroke-width="1.5"/>
<text x="260" y="125" class="sm mono" text-anchor="start">node_4</text>
<text x="260" y="139" class="xs mono" text-anchor="start">R 180° about y</text>
<text x="260" y="152" class="xs muted" text-anchor="start">mesh + skin: IGNORED</text>
<line x1="120.00" y1="90.00" x2="120.00" y2="106.00" stroke="var(--dia-ink)" stroke-width="1.2" marker-end="url(#e-k-l77bf2)"/>
