<svg viewBox="0 0 660 320" role="img" aria-labelledby="g5-t g5-d">
  <title id="g5-t">The cost of per-pixel shading relative to Gouraud, against pixels per triangle</title>
  <desc id="g5-d">A graph with pixels covered per triangle on a logarithmic horizontal axis from about 2 to about 400, and the ratio of per-pixel cost to Gouraud cost on the vertical axis. A dashed horizontal line marks break-even at 1.0. The measured curve starts below that line at 0.91 times for 2.8 pixels per triangle, crosses it, and climbs to 1.41, 1.84, 2.12 and 2.15 times as the resolution rises to 4K. Per-pixel shading is cheaper than Gouraud when triangles are smaller than about three pixels.</desc>
  <defs>
    <marker id="d-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok-bd)"/></marker>
    <marker id="d-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--verify-bd)"/></marker>
    <marker id="d-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
  </defs>
<g class="grid" stroke="var(--dia-grid)"><line x1="96.0" y1="220.4" x2="596.0" y2="220.4" stroke-width="1"/><line x1="96.0" y1="180.8" x2="596.0" y2="180.8" stroke-width="1"/><line x1="96.0" y1="141.2" x2="596.0" y2="141.2" stroke-width="1"/><line x1="96.0" y1="101.7" x2="596.0" y2="101.7" stroke-width="1"/><line x1="239.3" y1="260.0" x2="239.3" y2="70.0" stroke-width="1"/><line x1="443.3" y1="260.0" x2="443.3" y2="70.0" stroke-width="1"/></g><line x1="96.0" y1="260.0" x2="606.0" y2="260.0" stroke="var(--dia-ink)" stroke-width="1.6"/><line x1="96.0" y1="260.0" x2="96.0" y2="70.0" stroke="var(--dia-ink)" stroke-width="1.6"/><text x="86.0" y="224.4" class="xs muted" text-anchor="end">0.5×</text><text x="86.0" y="184.8" class="xs muted" text-anchor="end">1.0×</text><text x="86.0" y="145.2" class="xs muted" text-anchor="end">1.5×</text><text x="86.0" y="105.7" class="xs muted" text-anchor="end">2.0×</text><text x="239.3" y="278.0" class="xs muted" text-anchor="middle">10</text><text x="443.3" y="278.0" class="xs muted" text-anchor="middle">100</text><text x="346.0" y="298.0" class="sm muted" text-anchor="middle">pixels covered per triangle (log scale)</text><text x="38.0" y="165.0" class="sm muted" text-anchor="middle" transform="rotate(-90 38.0 165.0)">per-pixel / Gouraud</text><line x1="96.0" y1="180.8" x2="596.0" y2="180.8" stroke="var(--dia-ink-soft)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="596.0" y="172.8" class="xs muted" text-anchor="end">break even — same cost</text><polyline points="126.6,187.6 247.8,148.2 370.8,114.3 493.6,92.4 565.4,90.0" fill="none" stroke="var(--note-bd)" stroke-width="2.6"/><circle cx="126.6" cy="187.6" r="4.2" fill="var(--note-bd)"/><text x="126.6" y="211.6" class="xs muted" text-anchor="middle">320×180</text><text x="126.6" y="224.6" class="xs t-hi" text-anchor="middle">0.91&#215;</text><circle cx="247.8" cy="148.2" r="4.2" fill="var(--note-bd)"/><text x="247.8" y="132.2" class="xs muted" text-anchor="middle">640×360</text><text x="247.8" y="145.2" class="xs t-hi" text-anchor="middle">1.41&#215;</text><circle cx="370.8" cy="114.3" r="4.2" fill="var(--note-bd)"/><text x="370.8" y="98.3" class="xs muted" text-anchor="middle">1280×720</text><text x="370.8" y="111.3" class="xs t-hi" text-anchor="middle">1.84&#215;</text><circle cx="493.6" cy="92.4" r="4.2" fill="var(--note-bd)"/><text x="493.6" y="76.4" class="xs muted" text-anchor="middle">2560×1440</text><text x="493.6" y="89.4" class="xs t-hi" text-anchor="middle">2.12&#215;</text><circle cx="565.4" cy="90.0" r="4.2" fill="var(--note-bd)"/><text x="565.4" y="74.0" class="xs muted" text-anchor="middle">3840×2160</text><text x="565.4" y="87.0" class="xs t-hi" text-anchor="middle">2.15&#215;</text><text x="16" y="30" class="sm" font-weight="700">“Per-pixel is expensive” has a precondition.</text><text x="16" y="50" class="xs muted">one mesh, resolution swept</text>
</svg>
