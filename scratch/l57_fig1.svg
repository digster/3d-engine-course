<svg viewBox="0 0 720 420" role="img" aria-labelledby="l57f1-t l57f1-d">
  <title id="l57f1-t">Archetype storage compared with sparse-set storage</title>
  <desc id="l57f1-d">Top: an archetype chunk drawn as four parallel columns whose rows line up, so one shared index reaches every component. Bottom: a sparse set drawn as a dense transform array, an entity id array, a sparse redirect table with one slot per entity in the world, and three dense component arrays reached through two dependent loads.</desc>
  <defs>
    <marker id="e-i-l57f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-l57f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-l57f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
    <marker id="e-b-l57f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e05c5c"/></marker>
    <marker id="e-g-l57f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ac878"/></marker>
  </defs>
<text x="20" y="20" class="sm" text-anchor="start">The same four components on the same entities, stored two ways. A query reads left to right.</text>
<text x="24" y="46" class="xs t-hi" text-anchor="start">ARCHETYPE — entities with the SAME COMPONENT SET share a chunk.</text>
<rect x="60" y="58" width="140" height="20" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="130" y="72" class="xs mono" text-anchor="middle">transform[]</text>
<rect x="60" y="82" width="140" height="13" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="60" y="97" width="140" height="13" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="60" y="112" width="140" height="13" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="60" y="127" width="140" height="13" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="212" y="58" width="140" height="20" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.22"/>
<text x="282" y="72" class="xs mono" text-anchor="middle">velocity[]</text>
<rect x="212" y="82" width="140" height="13" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="212" y="97" width="140" height="13" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="212" y="112" width="140" height="13" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="212" y="127" width="140" height="13" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="364" y="58" width="140" height="20" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.22"/>
<text x="434" y="72" class="xs mono" text-anchor="middle">bounds[]</text>
<rect x="364" y="82" width="140" height="13" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="364" y="97" width="140" height="13" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="364" y="112" width="140" height="13" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="364" y="127" width="140" height="13" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="516" y="58" width="140" height="20" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.22"/>
<text x="586" y="72" class="xs mono" text-anchor="middle">material[]</text>
<rect x="516" y="82" width="140" height="13" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="516" y="97" width="140" height="13" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="516" y="112" width="140" height="13" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="516" y="127" width="140" height="13" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.1"/>
<text x="52" y="92" class="xs mono muted" text-anchor="end">row 0</text>
<line x1="56" y1="88" x2="664" y2="88" class="grid" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="52" y="107" class="xs mono muted" text-anchor="end">row 1</text>
<line x1="56" y1="103" x2="664" y2="103" class="grid" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="52" y="122" class="xs mono muted" text-anchor="end">row 2</text>
<line x1="56" y1="118" x2="664" y2="118" class="grid" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="52" y="137" class="xs mono muted" text-anchor="end">row 3</text>
<line x1="56" y1="133" x2="664" y2="133" class="grid" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="24" y="158" class="xs muted" text-anchor="start">Row i is one entity, in every column. The index is SHARED — no lookup, no test, nothing to</text>
<text x="24" y="172" class="xs muted" text-anchor="start">check. Any entity that does not have all four is not in this chunk at all.</text>
<line x1="24" y1="186" x2="696" y2="186" class="grid" stroke-width="1.2"/>
<text x="24" y="208" class="xs t-hi" text-anchor="start">SPARSE SET — one dense array per component TYPE, keyed by entity through a redirect.</text>
<rect x="60" y="220" width="150" height="18" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.22"/>
<text x="135" y="233" class="xs mono" text-anchor="middle">transform: dense</text>
<rect x="60" y="242" width="150" height="13" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.1"/>
<text x="52" y="252" class="xs mono muted" text-anchor="end">i=0</text>
<rect x="60" y="257" width="150" height="13" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.1"/>
<text x="52" y="267" class="xs mono muted" text-anchor="end">i=1</text>
<rect x="60" y="272" width="150" height="13" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.1"/>
<text x="52" y="282" class="xs mono muted" text-anchor="end">i=2</text>
<rect x="60" y="287" width="150" height="13" rx="3" fill="#f0961e" stroke="#f0961e" stroke-width="1.2" fill-opacity="0.1"/>
<text x="52" y="297" class="xs mono muted" text-anchor="end">i=3</text>
<text x="135" y="320" class="xs muted" text-anchor="middle">walked in order</text>
<rect x="222" y="220" width="62" height="18" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.22"/>
<text x="253" y="233" class="xs mono" text-anchor="middle">entity</text>
<rect x="222" y="242" width="62" height="13" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.12"/>
<text x="253" y="252" class="xs mono" text-anchor="middle">e=17</text>
<rect x="222" y="257" width="62" height="13" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.12"/>
<text x="253" y="267" class="xs mono" text-anchor="middle">e=4</text>
<rect x="222" y="272" width="62" height="13" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.12"/>
<text x="253" y="282" class="xs mono" text-anchor="middle">e=91</text>
<rect x="222" y="287" width="62" height="13" rx="3" fill="#8f918a" stroke="#8f918a" stroke-width="1.2" fill-opacity="0.12"/>
<text x="253" y="297" class="xs mono" text-anchor="middle">e=30</text>
<rect x="330" y="220" width="110" height="18" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.2"/>
<text x="385" y="233" class="xs mono" text-anchor="middle">sparse[e]</text>
<rect x="330" y="242" width="110" height="58" rx="3" fill="#e05c5c" stroke="#e05c5c" stroke-width="1.2" fill-opacity="0.1"/>
<text x="385" y="262" class="xs muted" text-anchor="middle">one slot per</text>
<text x="385" y="276" class="xs muted" text-anchor="middle">ENTITY IN THE</text>
<text x="385" y="290" class="xs muted" text-anchor="middle">WORLD</text>
<text x="385" y="320" class="xs muted" text-anchor="middle">4 B each, present or not</text>
<rect x="470" y="220" width="70" height="18" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.22"/>
<text x="505" y="233" class="xs mono" text-anchor="middle">velocity[]</text>
<rect x="470" y="242" width="70" height="13" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="470" y="257" width="70" height="13" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="470" y="272" width="70" height="13" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="470" y="287" width="70" height="13" rx="3" fill="#5082e6" stroke="#5082e6" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="548" y="220" width="70" height="18" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.22"/>
<text x="583" y="233" class="xs mono" text-anchor="middle">bounds[]</text>
<rect x="548" y="242" width="70" height="13" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="548" y="257" width="70" height="13" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="548" y="272" width="70" height="13" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="548" y="287" width="70" height="13" rx="3" fill="#5ac878" stroke="#5ac878" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="626" y="220" width="70" height="18" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.22"/>
<text x="661" y="233" class="xs mono" text-anchor="middle">material[]</text>
<rect x="626" y="242" width="70" height="13" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="626" y="257" width="70" height="13" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="626" y="272" width="70" height="13" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.1"/>
<rect x="626" y="287" width="70" height="13" rx="3" fill="#9b7ede" stroke="#9b7ede" stroke-width="1.2" fill-opacity="0.1"/>
<line x1="286" y1="249" x2="328" y2="254" class="hi" stroke-width="1.3" marker-end="url(#e-h-l57f1)"/>
<line x1="442" y1="262" x2="468" y2="276" class="hi" stroke-width="1.3" marker-end="url(#e-h-l57f1)"/>
<text x="300" y="240" class="xs t-hi" text-anchor="start">load 1</text>
<text x="452" y="306" class="xs t-hi" text-anchor="start">load 2</text>
<line x1="24" y1="344" x2="696" y2="344" class="grid" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="24" y="364" class="xs t-hi" text-anchor="start">THE WHOLE DIFFERENCE IS THE MIDDLE COLUMN.</text>
<text x="292" y="364" class="xs" text-anchor="start">Both designs walk dense arrays. The sparse set spends two dependent</text>
<text x="24" y="380" class="xs" text-anchor="start">loads per EXTRA component to find where in its array the entity's data sits; the archetype already knows, because it put</text>
<text x="24" y="396" class="xs" text-anchor="start">the entity in a chunk where that is true by construction. Everything else in this lesson is the price of that.</text>
</svg>
