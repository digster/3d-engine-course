<svg viewBox="0 0 720 340" role="img" aria-labelledby="f45d-t f45d-d">
  <title id="f45d-t">What the index buffer buys on our torus</title>
  <desc id="f45d-d">Left: a vertex where six triangles meet is stored once and named six times. Middle: the indexed form is 39,200 bytes of vertices plus 13,824 of indices, 53,024 in total, against 221,184 for the expanded form — 4.17 times smaller, and the saving exceeds the cost of the index buffer. Bottom: the indexed draw invokes the vertex shader somewhere between 1,225 and 6,912 times depending on the post-transform cache; the expanded draw invokes it 6,912 times with no possibility of doing better.</desc>
  <defs>
    <marker id="e-i-f45d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink)"/></marker>
    <marker id="e-s-f45d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-ink-soft)"/></marker>
    <marker id="e-h-f45d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dia-hi)"/></marker>
  </defs>
  <text x="24" y="22" class="sm">assets/torus.obj &#8212; 2,304 triangles over 1,225 vertices, so the average vertex is named <tspan class="t-hi">5.6 times</tspan></text>
  <path d="M108.0,100.0 L146.0,100.0 L127.0,132.9 z" class="ink-soft" fill="#5082e6" fill-opacity="0.13" stroke-width="0.75"/>
  <path d="M108.0,100.0 L127.0,132.9 L89.0,132.9 z" class="ink-soft" fill="#5082e6" fill-opacity="0.13" stroke-width="0.75"/>
  <path d="M108.0,100.0 L89.0,132.9 L70.0,100.0 z" class="ink-soft" fill="#5082e6" fill-opacity="0.13" stroke-width="0.75"/>
  <path d="M108.0,100.0 L70.0,100.0 L89.0,67.1 z" class="ink-soft" fill="#5082e6" fill-opacity="0.13" stroke-width="0.75"/>
  <path d="M108.0,100.0 L89.0,67.1 L127.0,67.1 z" class="ink-soft" fill="#5082e6" fill-opacity="0.13" stroke-width="0.75"/>
  <path d="M108.0,100.0 L127.0,67.1 L146.0,100.0 z" class="ink-soft" fill="#5082e6" fill-opacity="0.13" stroke-width="0.75"/>
  <circle cx="146.0" cy="100.0" r="2.6" class="ink-soft" fill="var(--dia-bg)" stroke-width="0.75"/>
  <circle cx="127.0" cy="132.9" r="2.6" class="ink-soft" fill="var(--dia-bg)" stroke-width="0.75"/>
  <circle cx="89.0" cy="132.9" r="2.6" class="ink-soft" fill="var(--dia-bg)" stroke-width="0.75"/>
  <circle cx="70.0" cy="100.0" r="2.6" class="ink-soft" fill="var(--dia-bg)" stroke-width="0.75"/>
  <circle cx="89.0" cy="67.1" r="2.6" class="ink-soft" fill="var(--dia-bg)" stroke-width="0.75"/>
  <circle cx="127.0" cy="67.1" r="2.6" class="ink-soft" fill="var(--dia-bg)" stroke-width="0.75"/>
  <circle cx="108.0" cy="100.0" r="4.6" fill="#f0961e" class="ink" stroke-width="0.9"/>
  <text x="108.0" y="158.0" class="xs t-hi" text-anchor="middle">1 vertex &#183; 6 indices</text>
  <text x="108.0" y="172.0" class="xs muted" text-anchor="middle">six triangles meet here</text>
  <text x="214.0" y="52" class="xs muted">bytes on the device</text>
  <text x="214.0" y="81" class="xs">indexed</text>
  <rect x="276.0" y="66" width="53.2" height="22" fill="#5082e6" fill-opacity="0.8" stroke="none"/>
  <rect x="329.2" y="66" width="18.8" height="22" fill="#f0961e" fill-opacity="0.8" stroke="none"/>
  <text x="355.9" y="81" class="xs mono">53,024</text>
  <text x="214.0" y="121" class="xs">expanded</text>
  <rect x="276.0" y="106" width="300.0" height="22" fill="#eb786e" fill-opacity="0.8" stroke="none"/>
  <text x="426.0" y="121" class="xs mono t-inv" text-anchor="middle">vertices, every share duplicated</text>
  <text x="584.0" y="121" class="xs mono">221,184</text>
  <text x="276.0" y="152" class="xs t-hi">4.17&#215; smaller &#8212; the saving exceeds the index buffer itself</text>
  <rect x="24" y="186" width="672" height="98" class="fill-soft ink" stroke-width="0.75" rx="3"/>
  <text x="40" y="204" class="sm">vertex-shader invocations for one un-instanced draw</text>
  <text x="40" y="232" class="xs">indexed</text>
  <line x1="190.0" y1="228" x2="620.0" y2="228" class="ink-soft" stroke-width="0.75"/>
  <rect x="266.2" y="221" width="353.8" height="14" fill="#5082e6" fill-opacity="0.30" stroke="none"/>
  <line x1="266.2" y1="217" x2="266.2" y2="239" class="hi" stroke-width="1.2"/>
  <text x="266.2" y="214" class="xs mono t-ok" text-anchor="middle">1,225</text>
  <line x1="620.0" y1="217" x2="620.0" y2="239" class="hi" stroke-width="1.2"/>
  <text x="620.0" y="214" class="xs mono t-bad" text-anchor="middle">6,912</text>
  <text x="40" y="262" class="xs">expanded</text>
  <line x1="190.0" y1="258" x2="620.0" y2="258" class="ink-soft" stroke-width="0.75" stroke-dasharray="2 3"/>
  <line x1="620.0" y1="248" x2="620.0" y2="268" class="hi" stroke-width="1.2"/>
  <text x="614.0" y="254" class="xs mono t-bad" text-anchor="end">6,912 exactly</text>
  <text x="196.0" y="276" class="xs muted">a RANGE, because the post-transform cache decides where in it you land</text>
  <text x="24" y="328" class="xs muted">the file holds 1,152 positions; the loader produces <tspan class="t-hi">1,225</tspan> vertices &#8212; the uv seam splits every vertex where u wraps from 1 back to 0 (Lesson 3.5 &#167;3)</text>
</svg>
