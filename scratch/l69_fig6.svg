<text x="333.0" y="173.0" class="xs" text-anchor="middle">blend band</text>
<text x="360.0" y="214" class="xs" text-anchor="middle">different texel grids and different biases, so the two answers disagree along one line — and a line is exactly what the eye finds</text>
<text x="360.0" y="238" class="xs" text-anchor="middle">blend_fraction fades across a band: both answers are defensible, so anything between them is too</text>
