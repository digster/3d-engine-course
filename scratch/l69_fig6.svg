  <title id="f69f-t">The seam between two cascades</title>
  <desc id="f69f-d">Two adjacent bands representing cascades 1 and 2, with a fine texel grid on the near side and a coarse one on the far side. A highlighted line marks the split distance, and an amber band either side of it marks where the two are blended together.</desc>
